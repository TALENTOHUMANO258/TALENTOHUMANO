<!-- Diagnóstico: si algo falla, se muestra en pantalla en vez de quedar en blanco -->
<script>
  function __showFatal(title, detail){
    var r = document.getElementById("root");
    if(!r) return;
    r.innerHTML =
      '<div style="max-width:720px;margin:40px auto;font-family:Inter,Arial,sans-serif;'+
      'background:#FBEAE8;border:1.5px solid #B8483F;border-radius:10px;padding:20px;color:#8A342C">'+
      '<h2 style="margin:0 0 8px;font-family:serif">⚠️ '+title+'</h2>'+
      '<pre style="white-space:pre-wrap;font-size:13px;margin:0">'+String(detail||"").replace(/</g,"&lt;")+'</pre>'+
      '<p style="margin:12px 0 0;font-size:12.5px;color:#5B6B7A">Revisa esta información o compártela para diagnosticar. '+
      'Verifica también tu conexión y que SUPABASE_URL/anon key sean correctas.</p></div>';
  }
  window.addEventListener("error", function(e){
    __showFatal("Error al cargar la aplicación", (e && e.message) ? e.message : e);
  });
  window.addEventListener("unhandledrejection", function(e){
    var r = e && e.reason; __showFatal("Error de conexión o de datos", (r && r.message) ? r.message : r);
  });
  // Si tras 6s no se montó nada (p. ej. un CDN bloqueado), avisar.
  setTimeout(function(){
    var r = document.getElementById("root");
    if(r && r.childElementCount === 0 && r.textContent.trim() === ""){
      __showFatal("La aplicación no terminó de cargar",
        "No se cargaron las librerías (React/Babel/Supabase) desde Internet, o hubo un error de compilación. "+
        "Verifica tu conexión. Si estás sin Internet, la app no puede funcionar porque usa Supabase en la nube.");
    }
  }, 6000);
</script>

/* ------------------------- Helpers de fecha ------------------------- */
const todayISO = () => new Date().toISOString().slice(0,10);
const fmt = (iso) => { if(!iso) return "—"; const [y,m,d]=iso.slice(0,10).split("-"); return `${d}/${m}/${y}`; };
const fmtDateTime = (ts) => { if(!ts) return "—"; const d=new Date(ts); return d.toLocaleString("es-CO",{dateStyle:"short",timeStyle:"short"}); };
const daysBetween = (a,b) => { if(!a||!b) return 0; const s=new Date(a+"T00:00:00"),e=new Date(b+"T00:00:00");
  const n=Math.round((e-s)/86400000)+1; return n>0?n:0; };
const diffDays = (a,b) => { const s=new Date(a+"T00:00:00"),e=new Date(b+"T00:00:00"); return Math.round((e-s)/86400000); };
const monthsBetween = (start,end) => { if(!start) return 0; const s=new Date(start+"T00:00:00");
  const e=end?new Date(end+"T00:00:00"):new Date(); let m=(e.getFullYear()-s.getFullYear())*12+(e.getMonth()-s.getMonth());
  if(e.getDate()<s.getDate()) m-=1; return Math.max(0,m); };
const vacacionesCausadas = (ingreso,retiro) => Math.round(monthsBetween(ingreso,retiro)*1.25*10)/10;
const proximoAniversario = (ingreso) => { if(!ingreso) return null; const ing=new Date(ingreso+"T00:00:00");
  const t=new Date(todayISO()+"T00:00:00"); let n=new Date(t.getFullYear(),ing.getMonth(),ing.getDate());
  if(n<t) n.setFullYear(n.getFullYear()+1); return n.toISOString().slice(0,10); };
const money = (v) => (v===null||v===undefined||v==="")?"—":new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(v);

/* ------------------------- Permisos (UI) ------------------------- */
const canWrite = (role, area) => {

  if(area==="employees"||area==="contracts"||area==="social_security"||area==="vacations"||area==="documents")

/* ------------------------- Mensaje de error amigable ------------------------- */
function friendlyError(e){
  const msg = (e && (e.message||e.error_description||e.msg)) || "";
  if(/Invalid login/i.test(msg)) return "Correo o contraseña incorrectos.";
  if(/Email not confirmed/i.test(msg)) return "Debes confirmar tu correo antes de ingresar.";
  if(/row-level security|violates row-level/i.test(msg)) return "No tienes permisos para realizar esta acción.";
  if(/duplicate key|unique/i.test(msg)) return "Ya existe un registro con ese valor único (ej. cédula o número de contrato).";
  if(/Failed to fetch|NetworkError|network/i.test(msg)) return "No fue posible conectar. Verifica tu conexión a Internet.";
  if(/JWT expired|token/i.test(msg)) return "Tu sesión expiró. Vuelve a iniciar sesión.";
  return msg || "Ocurrió un error inesperado. Inténtalo nuevamente.";
}

function Badge({status}){
  const map = {

/* =====================================================================
   Hook de carga de datos con manejo de error
   ===================================================================== */
function useAsync(fn, deps){
  const [state,setState] = useState({loading:true, error:null, data:null});
  const toast = useToast();
  const run = useCallback(async ()=>{
    setState(s=>({...s, loading:true, error:null}));
    try{
      const data = await fn();
      setState({loading:false, error:null, data});
    }catch(e){
      setState({loading:false, error:friendlyError(e), data:null});
      if(toast) toast(friendlyError(e), "err");
    }
  }, deps); // eslint-disable-line
  useEffect(()=>{ run(); }, [run]);
  return {...state, reload:run};
}

        const { data, error } = await sb.auth.signInWithPassword({ email:email.trim(), password:pass });
        if(error) throw error;
        // auditoría de inicio de sesión (no bloqueante)
        if(data && data.user) sb.from("audit_logs").insert({ profile_id:data.user.id, action:"LOGIN", description:"Inicio de sesión" }).then(()=>{}).catch(()=>{});
        // el listener global cambia de pantalla
      }else{
        const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href });
        if(error) throw error;
        setMsg("Te enviamos un correo para restablecer la contraseña (si el correo existe).");
      }
    }catch(e2){ setErr(friendlyError(e2)); }
    finally{ setBusy(false); }
  };

  return (
    <div className="auth">
      <form className="box" onSubmit={submit}>
        <img src={LOGO_SRC} alt="logo"/>
        <h1>Centro Especializado de Urología</h1>
        <p className="sub">Gestión y Control de Talento Humano</p>

        <div className="field">
          <Field label="Correo electrónico">
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required autoComplete="username" placeholder="usuario@dominio.com"/>
          </Field>
        </div>
        {mode==="login" && (
          <div className="field">
            <Field label="Contraseña">
              <input type="password" value={pass} onChange={e=>setPass(e.target.value)} required autoComplete="current-password" placeholder="••••••••"/>
            </Field>
          </div>
        )}

        {err && <div className="toast err" style={{marginBottom:12}}>{err}</div>}
        {msg && <div className="toast ok" style={{marginBottom:12}}>{msg}</div>}

        <button className="btn primary" style={{width:"100%"}} disabled={busy}>
          {busy && <span className="spinner"/>}
          {mode==="login" ? "Ingresar" : "Enviar enlace de recuperación"}
        </button>

        <p style={{textAlign:"center",marginTop:14,fontSize:12.5}}>
          {mode==="login"
            ? <button type="button" className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>{setMode("reset");setErr(null);}}>¿Olvidaste tu contraseña?</button>
            : <button type="button" className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>{setMode("login");setErr(null);setMsg(null);}}>Volver a iniciar sesión</button>}
        </p>
      </form>
    </div>
  );
}

/* =====================================================================
   BÚSQUEDA GLOBAL
   ===================================================================== */
function GlobalSearch({onOpenEmployee}){
  const [q,setQ] = useState("");
  const [res,setRes] = useState([]);
  const [open,setOpen] = useState(false);
  const tmr = useRef(null);

  useEffect(()=>{
    if(tmr.current) clearTimeout(tmr.current);
    if(!q.trim()){ setRes([]); return; }
    tmr.current = setTimeout(async ()=>{
      const term = q.trim().replace(/[,()*%]/g," ");
      if(!term){ setRes([]); return; }
      const { data, error } = await sb.from("employees")
        .select("id,first_name,last_name,document_number,position_title,city,status")
        .or(`first_name.ilike.%${term}%,last_name.ilike.%${term}%,document_number.ilike.%${term}%,position_title.ilike.%${term}%,city.ilike.%${term}%`)
        .limit(8);
      if(!error){ setRes(data||[]); setOpen(true); }
    }, 300);
  }, [q]);

  return (
    <div className="search" onBlur={()=>setTimeout(()=>setOpen(false),150)}>
      <input placeholder="Buscar empleado por nombre, cédula, cargo o ciudad…" value={q}
        onChange={e=>setQ(e.target.value)} onFocus={()=>res.length&&setOpen(true)}/>
      {open && res.length>0 && (
        <div className="card" style={{position:"absolute",top:"110%",left:0,right:0,zIndex:30,padding:6,maxHeight:340,overflow:"auto"}}>
          {res.map(e=>(
            <div key={e.id} style={{padding:"8px 10px",borderRadius:6,cursor:"pointer"}}
              onMouseDown={()=>{ onOpenEmployee(e.id); setOpen(false); setQ(""); }}
              onMouseOver={ev=>ev.currentTarget.style.background="#F3F7FA"}
              onMouseOut={ev=>ev.currentTarget.style.background="transparent"}>
              <b>{e.first_name} {e.last_name}</b>
              <span className="muted" style={{fontSize:12}}> · {e.document_number} · {e.position_title||"—"} · {EMP_STATUS[e.status]}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

   DASHBOARD
   ===================================================================== */
function Dashboard({profile, onOpenEmployee}){
  const s = useAsync(async ()=>{
    const [stats, contratos, empleados, vacaciones] = await Promise.all([
      sb.from("v_dashboard_stats").select("*").single(),
      sb.from("contracts").select("id,employee_id,contract_number,end_date,status,employees(first_name,last_name)")
        .eq("status","vigente").not("end_date","is",null).order("end_date",{ascending:true}).limit(200),
      sb.from("employees").select("id,first_name,last_name,hire_date,termination_date,status").eq("status","activo"),
      sb.from("vacations").select("employee_id,days,status"),
    ]);
    if(stats.error) throw stats.error;
    return { stats:stats.data, contratos:contratos.data||[], empleados:empleados.data||[], vacaciones:vacaciones.data||[] };
  }, []);

  if(s.loading) return <div><h2 className="section-title">Resumen</h2><SkeletonRows cols={4} rows={2}/></div>;
  if(s.error) return <div className="card"><b>⚠️ {s.error}</b><div style={{marginTop:10}}><button className="btn ghost sm" onClick={s.reload}>Reintentar</button></div></div>;

  const st = s.stats;
  // Alertas contractuales
  const alertContratos = s.contratos.map(c=>{
    const r = diffDays(todayISO(), c.end_date);
    return {...c, restantes:r};
  }).filter(c=>c.restantes<=90).sort((a,b)=>a.restantes-b.restantes);

  // Alertas de vacaciones (saldo próximo a vencer)
  const tomadasPorEmp = {};
  s.vacaciones.forEach(v=>{ tomadasPorEmp[v.employee_id]=(tomadasPorEmp[v.employee_id]||0)+ (v.status!=="rechazada"?v.days:0); });
  const alertVac = s.empleados.map(e=>{
    const causadas = vacacionesCausadas(e.hire_date, e.termination_date);
    const saldo = Math.round((causadas-(tomadasPorEmp[e.id]||0))*10)/10;
    const aniv = proximoAniversario(e.hire_date);
    const restantes = aniv? diffDays(todayISO(), aniv):999;
    return {e, saldo, aniv, restantes};
  }).filter(x=>x.saldo>0 && x.restantes<=30 && x.restantes>=0).sort((a,b)=>a.restantes-b.restantes);

  const bandFor = (r)=> r<0?"a-red": r<=7?"a-red": r<=30?"a-amber":"a-sky";
  const textFor = (r)=> r<0?`Vencido hace ${-r} día(s)`: r===0?"Vence hoy": r===1?"Vence mañana":`Vence en ${r} día(s)`;

  const Stat = ({l,n,color})=>(<div className="card stat"><div className="l">{l}</div><div className="n" style={{color}}>{n}</div></div>);

  return (
    <div>
      <h2 className="section-title">Resumen</h2>
      <div className="grid stats" style={{marginBottom:20}}>
        <Stat l="Empleados activos" n={st.empleados_activos} color="var(--green)"/>
        <Stat l="Retirados" n={st.empleados_retirados} color="var(--red)"/>
        <Stat l="Contratos vigentes" n={st.contratos_vigentes} color="var(--navy)"/>
        <Stat l="Contratos por vencer (30d)" n={st.contratos_por_vencer} color="var(--amber)"/>
        <Stat l="Contratos vencidos" n={st.contratos_vencidos} color="var(--red)"/>
        <Stat l="Vacaciones vigentes" n={st.vacaciones_vigentes} color="var(--sky)"/>
        <Stat l="Incapacidades del mes" n={st.incapacidades_mes} color="var(--navy)"/>
        <Stat l="Novedades pendientes" n={st.novedades_pendientes} color="var(--amber)"/>
      </div>

      <h2 className="section-title">Centro de alertas</h2>
      {(alertContratos.length===0 && alertVac.length===0)
        ? <Empty text="Sin alertas contractuales ni de vacaciones por ahora."/>
        : <div className="grid" style={{gap:8}}>
            {alertContratos.map(c=>(
              <div key={"c"+c.id} className={"alert "+bandFor(c.restantes)} onClick={()=>onOpenEmployee(c.employee_id)} style={{cursor:"pointer"}}>
                <div>
                  <div className="t">Contrato {c.contract_number} · {c.employees? c.employees.first_name+" "+c.employees.last_name : ""}</div>
                  <div className="s">{textFor(c.restantes)} · vence el {fmt(c.end_date)}</div>
                </div>
                <span className="badge b-sky"><span className="dot"/>Contrato</span>
              </div>
            ))}
            {alertVac.map(v=>(
              <div key={"v"+v.e.id} className="alert a-sky" onClick={()=>onOpenEmployee(v.e.id)} style={{cursor:"pointer"}}>
                <div>
                  <div className="t">Vacaciones por vencer · {v.e.first_name} {v.e.last_name}</div>
                  <div className="s">{v.saldo} días pendientes · plazo el {fmt(v.aniv)} (en {v.restantes} días)</div>
                </div>
                <span className="badge b-amber"><span className="dot"/>Vacaciones</span>
              </div>
            ))}
          </div>}
    </div>
  );
}

const emptyEmp = ()=>({
  first_name:"", last_name:"", document_type:"CC", document_number:"", birth_date:"", gender:"",

});

function Empleados({profile, departments, onOpenEmployee}){
  const write = canWrite(profile.role, "employees");
  const [q,setQ] = useState("");
  const [dep,setDep] = useState("");
  const [showForm,setShowForm] = useState(false);
  const [form,setForm] = useState(emptyEmp());
  const [busy,setBusy] = useState(false);
  const toast = useToast();
  const tmr = useRef(null);
  const [term,setTerm] = useState("");

  useEffect(()=>{ if(tmr.current)clearTimeout(tmr.current); tmr.current=setTimeout(()=>setTerm(q.trim().replace(/[,()*%]/g," ")),300); },[q]);

  const data = useAsync(async ()=>{
    let query = sb.from("employees")
      .select("id,first_name,last_name,document_number,position_title,city,department_id,status,hire_date")
      .order("first_name",{ascending:true}).limit(300);
    if(term) query = query.or(`first_name.ilike.%${term}%,last_name.ilike.%${term}%,document_number.ilike.%${term}%`);
    if(dep) query = query.eq("department_id", dep);
    const { data, error } = await query;
    if(error) throw error;
    return data;
  }, [term, dep]);

  const guardar = async ()=>{
    if(!form.first_name.trim()||!form.last_name.trim()||!form.document_number.trim()){ toast("Nombre, apellido y cédula son obligatorios.","err"); return; }
    setBusy(true);
    try{
      const payload = {...form};
      ["department_id","birth_date","termination_date","salary"].forEach(k=>{ if(payload[k]==="") payload[k]=null; });
      payload.status = payload.termination_date ? "retirado" : "activo";
      payload.created_by = profile.id;
      const { error } = await sb.from("employees").insert(payload);
      if(error) throw error;
      toast("Empleado registrado correctamente.","ok");
      setShowForm(false); setForm(emptyEmp()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); }
    finally{ setBusy(false); }
  };

  const depName = (id)=> (departments.find(d=>d.id===id)||{}).name || "—";

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,gap:10,flexWrap:"wrap"}}>
        <h2 className="section-title" style={{margin:0}}>Empleados</h2>
        {write && <button className="btn primary" onClick={()=>{setForm(emptyEmp());setShowForm(true);}}>+ Nuevo empleado</button>}
      </div>

      <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>

        <select style={{flex:1,minWidth:160}} value={dep} onChange={e=>setDep(e.target.value)}>
          <option value="">Todas las áreas</option>
          {departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
      </div>

      {data.loading ? <SkeletonRows cols={5} rows={5}/> :
       data.error ? <div className="card"><b>⚠️ {data.error}</b></div> :
       data.data.length===0 ? <Empty text="No hay empleados que coincidan con la búsqueda."/> :
       <div className="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Cédula</th><th>Cargo</th><th>Área</th><th>Ciudad</th><th>Estado</th></tr></thead>
          <tbody>
            {data.data.map(e=>(
              <tr key={e.id} onClick={()=>onOpenEmployee(e.id)}>
                <td><b>{e.first_name} {e.last_name}</b></td>
                <td>{e.document_number}</td>
                <td>{e.position_title||"—"}</td>
                <td>{depName(e.department_id)}</td>
                <td>{e.city||"—"}</td>
                <td><Badge status={e.status}/></td>
              </tr>
            ))}
          </tbody>
        </table>
       </div>}

      {showForm && (
        <Modal title="Nuevo empleado" onClose={()=>setShowForm(false)} wide>
          <div className="grid form-grid">
            <Field label="Nombres"><input value={form.first_name} onChange={e=>setForm({...form,first_name:e.target.value})}/></Field>
            <Field label="Apellidos"><input value={form.last_name} onChange={e=>setForm({...form,last_name:e.target.value})}/></Field>
            <Field label="Tipo doc."><select value={form.document_type} onChange={e=>setForm({...form,document_type:e.target.value})}>{["CC","CE","TI","PA","PEP"].map(t=><option key={t}>{t}</option>)}</select></Field>
            <Field label="Número de documento"><input value={form.document_number} onChange={e=>setForm({...form,document_number:e.target.value})}/></Field>
            <Field label="Fecha de nacimiento"><input type="date" value={form.birth_date} onChange={e=>setForm({...form,birth_date:e.target.value})}/></Field>
            <Field label="Género"><select value={form.gender} onChange={e=>setForm({...form,gender:e.target.value})}><option value="">—</option><option>Femenino</option><option>Masculino</option><option>Otro</option></select></Field>
            <Field label="Correo"><input type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})}/></Field>
            <Field label="Teléfono"><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})}/></Field>
            <Field label="Dirección"><input value={form.address} onChange={e=>setForm({...form,address:e.target.value})}/></Field>
            <Field label="Ciudad"><input value={form.city} onChange={e=>setForm({...form,city:e.target.value})}/></Field>
            <Field label="Área"><select value={form.department_id} onChange={e=>setForm({...form,department_id:e.target.value})}><option value="">—</option>{departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></Field>
            <Field label="Cargo"><input value={form.position_title} onChange={e=>setForm({...form,position_title:e.target.value})}/></Field>
            <Field label="Fecha de ingreso"><input type="date" value={form.hire_date} onChange={e=>setForm({...form,hire_date:e.target.value})}/></Field>
            <Field label="Fecha de retiro (opcional)"><input type="date" value={form.termination_date} onChange={e=>setForm({...form,termination_date:e.target.value})}/></Field>
            <Field label="Salario base"><input type="number" value={form.salary} onChange={e=>setForm({...form,salary:e.target.value})}/></Field>
            <Field label="Banco"><input value={form.bank_name} onChange={e=>setForm({...form,bank_name:e.target.value})}/></Field>
            <Field label="Cuenta bancaria"><input value={form.bank_account} onChange={e=>setForm({...form,bank_account:e.target.value})}/></Field>
            <Field label="Contacto de emergencia"><input value={form.emergency_contact} onChange={e=>setForm({...form,emergency_contact:e.target.value})}/></Field>
            <Field label="Tel. emergencia"><input value={form.emergency_phone} onChange={e=>setForm({...form,emergency_phone:e.target.value})}/></Field>
          </div>
          <Field label="Notas"><textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/></Field>
          <div className="rowbtns" style={{marginTop:14}}>
            <button className="btn primary" disabled={busy} onClick={guardar}>{busy&&<span className="spinner"/>}Registrar empleado</button>
            <button className="btn ghost" onClick={()=>setShowForm(false)}>Cancelar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

      const p = {...cf, employee_id:employeeId, created_by:profile.id};

      toast("Otrosí registrado.","ok"); setAddFor(null); setAf(emptyA()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }

                    <div className="kv" style={{marginTop:6}}>
                      <span>Inicio: <b>{fmt(c.start_date)}</b></span>
                      <span>Fin: <b>{fmt(c.end_date)}</b></span>
                      <span>Cargo: <b>{c.position_title||"—"}</b></span>
                      <span>Jornada: <b>{SCHEDULES[c.schedule]||"—"}</b></span>
                      <span>Jefe: <b>{c.immediate_boss||"—"}</b></span>
                      {showSalary && <span>Salario: <b>{money(c.salary)}</b></span>}
                      <span>Firma: <b>{fmt(c.signature_date)}</b></span>
                      <span>Renovación: <b>{fmt(c.renewal_date)}</b></span>
                    </div>
                    {c.observations && <p className="muted" style={{margin:"8px 0 0",fontSize:12.5}}>{c.observations}</p>}
                    {c.termination_reason && <p className="muted" style={{margin:"4px 0 0",fontSize:12.5}}>Motivo terminación: <b>{c.termination_reason}</b></p>}
                  </div>
                  <Badge status={c.status}/>
                </div>

                <div style={{marginTop:12,borderTop:"1px solid var(--border)",paddingTop:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <b style={{fontSize:13}}>Otrosí / adendas ({adds.length})</b>
                    {write && <button className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>{setAf(emptyA());setAddFor(c.id);}}>+ Añadir otrosí</button>}
                  </div>
                  {adds.length===0 ? <p className="muted" style={{fontSize:12.5,margin:"6px 0 0"}}>Sin adendas.</p> :
                    <div style={{marginTop:8,display:"grid",gap:6}}>
                      {adds.map(a=>(
                        <div key={a.id} style={{fontSize:12.5,padding:"8px 10px",background:"#F7FAFC",borderRadius:6}}>
                          <b>Otrosí {a.addendum_number}</b> · {ADDENDUM_TYPES[a.type]} · {fmt(a.date)}
                          {a.description && <span> — {a.description}</span>}
                          {a.change_detail && <div className="muted">Cambio: {a.change_detail}{a.application_date?` (aplica ${fmt(a.application_date)})`:""}</div>}
                        </div>
                      ))}
                    </div>}
                </div>
              </div>
            );
          })}
        </div>}

      {showC && (
        <Modal title="Nuevo contrato" onClose={()=>setShowC(false)} wide>
          <div className="grid form-grid">
            <Field label="Número de contrato"><input value={cf.contract_number} onChange={e=>setCf({...cf,contract_number:e.target.value})}/></Field>
            <Field label="Tipo"><select value={cf.type} onChange={e=>setCf({...cf,type:e.target.value})}>{opts(CONTRACT_TYPES)}</select></Field>
            <Field label="Fecha inicio"><input type="date" value={cf.start_date} onChange={e=>setCf({...cf,start_date:e.target.value})}/></Field>
            <Field label="Fecha terminación"><input type="date" value={cf.end_date} onChange={e=>setCf({...cf,end_date:e.target.value})}/></Field>
            <Field label="Salario"><input type="number" value={cf.salary} onChange={e=>setCf({...cf,salary:e.target.value})}/></Field>
            <Field label="Cargo"><input value={cf.position_title} onChange={e=>setCf({...cf,position_title:e.target.value})}/></Field>
            <Field label="Área"><select value={cf.department_id} onChange={e=>setCf({...cf,department_id:e.target.value})}><option value="">—</option>{departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></Field>
            <Field label="Jefe inmediato"><input value={cf.immediate_boss} onChange={e=>setCf({...cf,immediate_boss:e.target.value})}/></Field>
            <Field label="Jornada"><select value={cf.schedule} onChange={e=>setCf({...cf,schedule:e.target.value})}>{opts(SCHEDULES)}</select></Field>

/* ---------- Seguridad social + Novedades ---------- */
function TabSeguridad({employeeId, profile, ssEntities}){
  const write = canWrite(profile.role,"social_security");
  const [showF,setShowF] = useState(false);
  const [showN,setShowN] = useState(false);
  const toast = useToast();

  const data = useAsync(async ()=>{
    const [aff, nov] = await Promise.all([
      sb.from("employee_social_security").select("*").eq("employee_id",employeeId),
      sb.from("social_security_novelties").select("*").eq("employee_id",employeeId).order("date",{ascending:false}),
    ]);
    if(aff.error) throw aff.error;
    return { aff:aff.data||[], nov:nov.data||[] };
  }, [employeeId]);

  const emptyF = ()=>({ kind:"eps", entity_id:"", affiliation_number:"", affiliation_date:"", status:"activa", withdrawal_date:"", risk_class:"", risk_level:"", observations:"" });
  const [f,setF] = useState(emptyF());
  const [busy,setBusy] = useState(false);
  const saveAff = async ()=>{
    setBusy(true);
    try{
      const ent = ssEntities.find(x=>x.id===f.entity_id);
      const p = {...f, employee_id:employeeId, entity_name: ent?ent.name:null, created_by:profile.id};
      ["entity_id","affiliation_date","withdrawal_date"].forEach(k=>{ if(p[k]==="") p[k]=null; });
      // upsert por (employee_id, kind)
      const { error } = await sb.from("employee_social_security").upsert(p, { onConflict:"employee_id,kind" });
      if(error) throw error;
      toast("Afiliación guardada.","ok"); setShowF(false); setF(emptyF()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };

  const emptyN = ()=>({ type:"ingreso", date:todayISO(), application_date:"", description:"", status:"pendiente" });
  const [n,setN] = useState(emptyN());
  const saveNov = async ()=>{
    setBusy(true);
    try{
      const p = {...n, employee_id:employeeId, created_by:profile.id};
      if(p.application_date==="") p.application_date=null;
      const { error } = await sb.from("social_security_novelties").insert(p);
      if(error) throw error;
      toast("Novedad registrada.","ok"); setShowN(false); setN(emptyN()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <div className="card"><b>⚠️ {data.error}</b></div>;

  const byKind = (k)=> data.aff.find(a=>a.kind===k);
  const entName = (a)=> a ? (a.entity_name || (ssEntities.find(x=>x.id===a.entity_id)||{}).name || "—") : "—";

  return (
    <div>
      {write && <div style={{marginBottom:12,display:"flex",gap:10,flexWrap:"wrap"}}>
        <button className="btn primary sm" onClick={()=>{setF(emptyF());setShowF(true);}}>+ Afiliación</button>
        <button className="btn ghost sm" onClick={()=>{setN(emptyN());setShowN(true);}}>+ Novedad</button>
      </div>}

      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,marginBottom:16}}>
        {Object.keys(SS_KINDS).map(k=>{
          const a = byKind(k);
          return (
            <div key={k} className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <b>{SS_KINDS[k]}</b>{a && <Badge status={a.status}/>}
              </div>
              {a ? <div className="kv" style={{marginTop:8,flexDirection:"column",gap:4}}>
                    <span>Entidad: <b>{entName(a)}</b></span>
                    <span>N° afiliación: <b>{a.affiliation_number||"—"}</b></span>
                    <span>Afiliación: <b>{fmt(a.affiliation_date)}</b></span>
                    {k==="arl" && <span>Riesgo: <b>{a.risk_class||"—"} / {a.risk_level||"—"}</b></span>}
                    {a.withdrawal_date && <span>Retiro: <b>{fmt(a.withdrawal_date)}</b></span>}
                  </div>
                : <p className="muted" style={{fontSize:12.5,margin:"8px 0 0"}}>Sin información.</p>}
            </div>
          );
        })}
      </div>

      <h3 className="section-title" style={{fontSize:14}}>Novedades de seguridad social</h3>
      {data.nov.length===0 ? <Empty text="No hay novedades registradas."/> :
        <div className="table-wrap"><table>
          <thead><tr><th>Tipo</th><th>Fecha</th><th>Aplicación</th><th>Descripción</th><th>Estado</th></tr></thead>
          <tbody>{data.nov.map(x=>(
            <tr key={x.id} style={{cursor:"default"}}>
              <td>{NOVELTY_TYPES[x.type]}</td><td>{fmt(x.date)}</td><td>{fmt(x.application_date)}</td>
              <td style={{whiteSpace:"normal"}}>{x.description||"—"}</td><td><Badge status={x.status}/></td>
            </tr>
          ))}</tbody>
        </table></div>}

      {showF && (
        <Modal title="Afiliación de seguridad social" onClose={()=>setShowF(false)}>
          <div className="grid form-grid">
            <Field label="Tipo"><select value={f.kind} onChange={e=>setF({...f,kind:e.target.value,entity_id:""})}>{opts(SS_KINDS)}</select></Field>
            <Field label="Entidad"><select value={f.entity_id} onChange={e=>setF({...f,entity_id:e.target.value})}><option value="">—</option>{ssEntities.filter(x=>x.kind===f.kind).map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select></Field>
            <Field label="N° de afiliación"><input value={f.affiliation_number} onChange={e=>setF({...f,affiliation_number:e.target.value})}/></Field>
            <Field label="Fecha de afiliación"><input type="date" value={f.affiliation_date} onChange={e=>setF({...f,affiliation_date:e.target.value})}/></Field>
            <Field label="Estado"><select value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{opts(SS_STATUS)}</select></Field>
            <Field label="Fecha de retiro"><input type="date" value={f.withdrawal_date} onChange={e=>setF({...f,withdrawal_date:e.target.value})}/></Field>
            {f.kind==="arl" && <Field label="Clase de riesgo"><input value={f.risk_class} onChange={e=>setF({...f,risk_class:e.target.value})} placeholder="I - V"/></Field>}
            {f.kind==="arl" && <Field label="Nivel de riesgo"><input value={f.risk_level} onChange={e=>setF({...f,risk_level:e.target.value})}/></Field>}
          </div>
          <Field label="Observaciones"><textarea value={f.observations} onChange={e=>setF({...f,observations:e.target.value})}/></Field>
          <p className="muted" style={{fontSize:12,margin:"8px 0"}}>Nota: guardar reemplaza la afiliación vigente de ese tipo (una activa por tipo).</p>
          <div className="rowbtns" style={{marginTop:8}}>
            <button className="btn primary" disabled={busy} onClick={saveAff}>{busy&&<span className="spinner"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setShowF(false)}>Cancelar</button>
          </div>
        </Modal>
      )}

      {showN && (
        <Modal title="Nueva novedad" onClose={()=>setShowN(false)}>
          <div className="grid form-grid">
            <Field label="Tipo"><select value={n.type} onChange={e=>setN({...n,type:e.target.value})}>{opts(NOVELTY_TYPES)}</select></Field>
            <Field label="Fecha"><input type="date" value={n.date} onChange={e=>setN({...n,date:e.target.value})}/></Field>
            <Field label="Fecha de aplicación"><input type="date" value={n.application_date} onChange={e=>setN({...n,application_date:e.target.value})}/></Field>
            <Field label="Estado"><select value={n.status} onChange={e=>setN({...n,status:e.target.value})}>{opts(NOVELTY_STATUS)}</select></Field>
          </div>
          <Field label="Descripción"><textarea value={n.description} onChange={e=>setN({...n,description:e.target.value})}/></Field>
          <div className="rowbtns" style={{marginTop:8}}>
            <button className="btn primary" disabled={busy} onClick={saveNov}>{busy&&<span className="spinner"/>}Guardar novedad</button>
            <button className="btn ghost" onClick={()=>setShowN(false)}>Cancelar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Vacaciones (por empleado) ---------- */
function TabVacaciones({emp, profile}){
  const write = canWrite(profile.role,"vacations");
  const [show,setShow] = useState(false);
  const toast = useToast();
  const data = useAsync(async ()=>{
    const { data, error } = await sb.from("vacations").select("*").eq("employee_id",emp.id).order("start_date",{ascending:false});
    if(error) throw error; return data;
  }, [emp.id]);

  const empty = ()=>({ start_date:todayISO(), end_date:todayISO(), status:"aprobada", observations:"" });
  const [f,setF] = useState(empty());
  const [busy,setBusy] = useState(false);
  const dias = daysBetween(f.start_date, f.end_date);

  const save = async ()=>{
    if(dias<=0){ toast("Rango de fechas inválido.","err"); return; }
    setBusy(true);
    try{
      const p = { employee_id:emp.id, start_date:f.start_date, end_date:f.end_date, days:dias, status:f.status,
        observations:f.observations||null, created_by:profile.id, approved_by: f.status==="aprobada"?profile.id:null };
      const { error } = await sb.from("vacations").insert(p);
      if(error) throw error;
      toast("Vacaciones registradas.","ok"); setShow(false); setF(empty()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const del = async (id)=>{
    if(!confirm("¿Eliminar este periodo de vacaciones?")) return;
    const { error } = await sb.from("vacations").delete().eq("id",id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Registro eliminado.","ok"); data.reload();
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <div className="card"><b>⚠️ {data.error}</b></div>;

  const tomadas = data.data.filter(v=>v.status!=="rechazada").reduce((s,v)=>s+v.days,0);
  const causadas = vacacionesCausadas(emp.hire_date, emp.termination_date);
  const saldo = Math.round((causadas-tomadas)*10)/10;

  return (
    <div>
      <div className="card" style={{marginBottom:12,display:"flex",gap:24,flexWrap:"wrap"}}>
        <Info label="Días causados" value={causadas}/>
        <Info label="Días tomados" value={tomadas}/>
        <Info label="Saldo pendiente" value={saldo}/>
      </div>
      {write && <div style={{marginBottom:12}}><button className="btn primary sm" onClick={()=>{setF(empty());setShow(true);}}>+ Registrar vacaciones</button></div>}
      {data.data.length===0 ? <Empty text="Sin periodos de vacaciones."/> :
        <div className="table-wrap"><table>
          <thead><tr><th>Inicio</th><th>Fin</th><th>Días</th><th>Estado</th><th></th></tr></thead>
          <tbody>{data.data.map(v=>(
            <tr key={v.id} style={{cursor:"default"}}>
              <td>{fmt(v.start_date)}</td><td>{fmt(v.end_date)}</td><td>{v.days}</td><td><Badge status={v.status}/></td>
              <td>{write && <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>del(v.id)}>Eliminar</button>}</td>
            </tr>
          ))}</tbody>
        </table></div>}

      {show && (
        <Modal title="Registrar vacaciones" onClose={()=>setShow(false)}>
          <div className="grid form-grid">
            <Field label="Inicio"><input type="date" value={f.start_date} onChange={e=>setF({...f,start_date:e.target.value})}/></Field>
            <Field label="Fin"><input type="date" value={f.end_date} onChange={e=>setF({...f,end_date:e.target.value})}/></Field>
            <Field label="Estado"><select value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{opts(VAC_STATUS)}</select></Field>
          </div>
          <p className="muted" style={{margin:"10px 0"}}>Días: <b style={{color:"var(--navy)"}}>{dias}</b></p>
          <Field label="Observaciones"><textarea value={f.observations} onChange={e=>setF({...f,observations:e.target.value})}/></Field>
          <div className="rowbtns" style={{marginTop:8}}>
            <button className="btn primary" disabled={busy} onClick={save}>{busy&&<span className="spinner"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setShow(false)}>Cancelar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

          <thead><tr><th>Tipo</th><th>Inicio</th><th>Fin</th><th>Días</th><th>Entidad</th><th></th></tr></thead>
          <tbody>{data.data.map(d=>(
            <tr key={d.id} style={{cursor:"default"}}>
              <td>{DIS_TYPES[d.type]}</td><td>{fmt(d.start_date)}</td><td>{fmt(d.end_date)}</td><td>{d.days}</td><td>{d.entity||"—"}</td>
              <td>{write && <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>del(d.id)}>Eliminar</button>}</td>
            </tr>
          ))}</tbody>
        </table></div>}

      {show && (
        <Modal title="Registrar incapacidad" onClose={()=>setShow(false)}>
          <div className="grid form-grid">
            <Field label="Tipo"><select value={f.type} onChange={e=>setF({...f,type:e.target.value})}>{opts(DIS_TYPES)}</select></Field>
            <Field label="Inicio"><input type="date" value={f.start_date} onChange={e=>setF({...f,start_date:e.target.value})}/></Field>
            <Field label="Fin"><input type="date" value={f.end_date} onChange={e=>setF({...f,end_date:e.target.value})}/></Field>
            <Field label="Entidad (EPS/ARL)"><input value={f.entity} onChange={e=>setF({...f,entity:e.target.value})}/></Field>
          </div>
          <p className="muted" style={{margin:"10px 0"}}>Días: <b style={{color:"var(--navy)"}}>{dias}</b></p>
          <Field label="Diagnóstico / observaciones"><textarea value={f.diagnosis} onChange={e=>setF({...f,diagnosis:e.target.value})}/></Field>
          <div className="rowbtns" style={{marginTop:8}}>
            <button className="btn primary" disabled={busy} onClick={save}>{busy&&<span className="spinner"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setShow(false)}>Cancelar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Documentos ---------- */
function TabDocumentos({employeeId, profile, docTypes}){
  const write = canWrite(profile.role,"documents");
  const toast = useToast();
  const fileRef = useRef(null);
  const [uploading,setUploading] = useState(false);
  const [docType,setDocType] = useState("");

  const data = useAsync(async ()=>{
    const { data, error } = await sb.from("documents").select("*").eq("employee_id",employeeId).order("created_at",{ascending:false});
    if(error) throw error; return data;
  }, [employeeId]);

  const upload = async (file)=>{
    if(!file) return;
    setUploading(true);
    try{
      const path = `${employeeId}/${Date.now()}_${file.name.replace(/[^\w.\-]/g,"_")}`;
      const up = await sb.storage.from("documentos").upload(path, file, { upsert:false });
      if(up.error) throw up.error;
      const { error } = await sb.from("documents").insert({
        employee_id:employeeId, document_type_id: docType||null, name:file.name, storage_path:path,
        mime_type:file.type, size_bytes:file.size, uploaded_by:profile.id
      });
      if(error) throw error;
      toast("Documento cargado.","ok"); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); }
    finally{ setUploading(false); if(fileRef.current) fileRef.current.value=""; }
  };

  const download = async (doc)=>{
    try{
      const { data:signed, error } = await sb.storage.from("documentos").createSignedUrl(doc.storage_path, 120);
      if(error) throw error;
      // registrar auditoría de descarga
      await sb.from("audit_logs").insert({ profile_id:profile.id, action:"DOWNLOAD", table_name:"documents", record_id:doc.id, description:"Descarga: "+doc.name }).then(()=>{}).catch(()=>{});
      window.open(signed.signedUrl, "_blank");
    }catch(e){ toast(friendlyError(e),"err"); }
  };

  if(data.loading) return <SkeletonRows cols={3} rows={3}/>;
  if(data.error) return <div className="card"><b>⚠️ {data.error}</b></div>;

  return (
    <div>
      {write && (
        <div className="card" style={{marginBottom:12,display:"flex",gap:10,alignItems:"flex-end",flexWrap:"wrap"}}>
          <Field label="Tipo de documento"><select value={docType} onChange={e=>setDocType(e.target.value)}><option value="">— (opcional)</option>{docTypes.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></Field>
          <div>
            <input ref={fileRef} type="file" style={{display:"none"}} onChange={e=>upload(e.target.files[0])}/>
            <button className="btn primary" disabled={uploading} onClick={()=>fileRef.current&&fileRef.current.click()}>{uploading&&<span className="spinner"/>}Subir documento</button>
          </div>
        </div>
      )}
      {data.data.length===0 ? <Empty text="Sin documentos cargados."/> :
        <div className="table-wrap"><table>
          <thead><tr><th>Nombre</th><th>Tipo MIME</th><th>Tamaño</th><th>Cargado</th><th></th></tr></thead>
          <tbody>{data.data.map(d=>(
            <tr key={d.id} style={{cursor:"default"}}>
              <td>{d.name}</td><td>{d.mime_type||"—"}</td><td>{d.size_bytes?Math.round(d.size_bytes/1024)+" KB":"—"}</td><td>{fmtDateTime(d.created_at)}</td>
              <td><button className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>download(d)}>Descargar</button></td>
            </tr>
          ))}</tbody>
        </table></div>}
    </div>
  );
}

/* =====================================================================
   USUARIOS (solo administrador)
   ===================================================================== */
function Usuarios({profile, departments}){
  const toast = useToast();
  const data = useAsync(async ()=>{
    const { data, error } = await sb.from("profiles").select("*,employees(first_name,last_name)").order("created_at",{ascending:false});
    if(error) throw error; return data;
  }, []);
  const [emps,setEmps] = useState([]);
  useEffect(()=>{ sb.from("employees").select("id,first_name,last_name").order("first_name").then(r=>setEmps(r.data||[])); },[]);

  const patch = async (id, changes)=>{
    const { error } = await sb.from("profiles").update(changes).eq("id",id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Usuario actualizado.","ok"); data.reload();
  };

  if(data.loading) return <SkeletonRows cols={5} rows={5}/>;
  if(data.error) return <div className="card"><b>⚠️ {data.error}</b></div>;

  return (
    <div>
      <h2 className="section-title">Usuarios y roles</h2>
      <p className="muted" style={{fontSize:12.5,marginBottom:12}}>Los usuarios se crean en Supabase → Authentication. Aquí asignas su rol, área y el empleado vinculado.</p>
      <div className="table-wrap"><table>
        <thead><tr><th>Usuario</th><th>Correo</th><th>Rol</th><th>Área</th><th>Empleado vinculado</th><th>Activo</th></tr></thead>
        <tbody>{data.data.map(u=>(
          <tr key={u.id} style={{cursor:"default"}}>
            <td>{u.full_name||"—"}</td>
            <td>{u.email||"—"}</td>
            <td>
              <select value={u.role} disabled={u.id===profile.id} onChange={e=>patch(u.id,{role:e.target.value})}>{opts(ROLE_LABELS)}</select>
            </td>
            <td><select value={u.department_id||""} onChange={e=>patch(u.id,{department_id:e.target.value||null})}><option value="">—</option>{departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></td>
            <td><select value={u.employee_id||""} onChange={e=>patch(u.id,{employee_id:e.target.value||null})}><option value="">—</option>{emps.map(x=><option key={x.id} value={x.id}>{x.first_name} {x.last_name}</option>)}</select></td>
            <td><input type="checkbox" style={{width:"auto"}} checked={u.active} onChange={e=>patch(u.id,{active:e.target.checked})}/></td>
          </tr>
        ))}</tbody>
      </table></div>
    </div>
  );
}

/* =====================================================================
   APP PRINCIPAL (post-login)
   ===================================================================== */
function Workspace({session, profile, onSignOut}){
  const [view,setView] = useState("dashboard"); // dashboard | empleados | auditoria | usuarios
  const [empId,setEmpId] = useState(null);
  const [departments,setDepartments] = useState([]);
  const [ssEntities,setSsEntities] = useState([]);
  const [docTypes,setDocTypes] = useState([]);
  const [menuOpen,setMenuOpen] = useState(false);

  useEffect(()=>{
    (async ()=>{
      const [d,s,t] = await Promise.all([
        sb.from("departments").select("id,name").order("name"),
        sb.from("social_security_entities").select("id,kind,name").eq("active",true).order("name"),
        sb.from("document_types").select("id,name").order("name"),
      ]);
      setDepartments(d.data||[]); setSsEntities(s.data||[]); setDocTypes(t.data||[]);
    })();
  }, []);

  const openEmployee = (id)=>{ setEmpId(id); setView("empleados"); setMenuOpen(false); };
  const go = (v)=>{ setView(v); setEmpId(null); setMenuOpen(false); };

  const NAV = [
    {id:"dashboard", label:"Resumen", ico:"▣", show:true},
    {id:"empleados", label:"Empleados", ico:"👥", show:true},
    {id:"auditoria", label:"Auditoría", ico:"📋", show:profile.role==="administrador"},
    {id:"usuarios",  label:"Usuarios y roles", ico:"⚙", show:profile.role==="administrador"},
  ].filter(n=>n.show);

  return (
    <div className="shell">
      {menuOpen && <div className="backdrop" onClick={()=>setMenuOpen(false)}/>}
      <aside className={"sidebar"+(menuOpen?" open":"")}>
        <div className="brand">
          <img src={LOGO_SRC} alt="logo"/>
          <div><b>Centro Especializado<br/>de Urología</b><span>Talento Humano</span></div>
        </div>
        <nav className="nav">
          {NAV.map(n=>(
            <button key={n.id} className={view===n.id?"active":""} onClick={()=>go(n.id)}>
              <span className="ico">{n.ico}</span>{n.label}
            </button>
          ))}
        </nav>
        <div className="foot">
          <div className="u">{profile.full_name||session.user.email}</div>
          <div>{ROLE_LABELS[profile.role]}</div>
          <button onClick={onSignOut}>Cerrar sesión</button>
        </div>
      </aside>

      <div className="main">
        <div className="topbar">
          <button className="hamburger" onClick={()=>setMenuOpen(true)}>☰</button>
          <GlobalSearch onOpenEmployee={openEmployee}/>
          <span className="role-chip">{ROLE_LABELS[profile.role]}</span>
        </div>
        <div className="content">
          {view==="dashboard" && <Dashboard profile={profile} onOpenEmployee={openEmployee}/>}
          {view==="empleados" && !empId && <Empleados profile={profile} departments={departments} onOpenEmployee={openEmployee}/>}
          {view==="empleados" && empId &&
            <EmployeeProfile employeeId={empId} profile={profile} departments={departments}
              ssEntities={ssEntities} docTypes={docTypes} onBack={()=>setEmpId(null)}/>}
          {view==="auditoria" && <Auditoria/>}
          {view==="usuarios" && <Usuarios profile={profile} departments={departments}/>}
        </div>
      </div>
    </div>
  );
}

/* =====================================================================
   RAÍZ: maneja sesión, perfil y toasts
   ===================================================================== */
function Root(){
  const [ready,setReady] = useState(false);
  const [session,setSession] = useState(null);
  const [profile,setProfile] = useState(null);
  const [profileError,setProfileError] = useState(null);
  const [toasts,setToasts] = useState([]);

  const pushToast = useCallback((msg, kind="info")=>{
    const id = Math.random().toString(36).slice(2);
    setToasts(t=>[...t,{id,msg,kind}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 4200);
  }, []);

  const loadProfile = useCallback(async (uid)=>{
    setProfileError(null);
    const { data, error } = await sb.from("profiles").select("*").eq("id",uid).single();
    if(error){ setProfileError(friendlyError(error)); setProfile(null); return; }
    setProfile(data);
  }, []);

  useEffect(()=>{
    let mounted = true;
    sb.auth.getSession().then(async ({data})=>{
      if(!mounted) return;
      setSession(data.session);
      if(data.session){ await loadProfile(data.session.user.id); }
      setReady(true);
    });
    const { data:sub } = sb.auth.onAuthStateChange(async (event, sess)=>{
      setSession(sess);
      if(sess){ await loadProfile(sess.user.id); }
      else { setProfile(null); }
    });
    return ()=>{ mounted=false; sub.subscription.unsubscribe(); };
  }, [loadProfile]);

  const signOut = async ()=>{
    try{ await sb.from("audit_logs").insert({ profile_id:session.user.id, action:"LOGOUT", description:"Cierre de sesión" }); }catch(e){}
    await sb.auth.signOut();
  };

  if(!ready) return <div style={{padding:40,color:"var(--muted)"}}><span className="spinner dark"/> Cargando…</div>;

  let body;
  if(!session){ body = <Auth/>; }
  else if(profileError){
    body = <div className="auth"><div className="box"><h1>⚠️ Perfil no disponible</h1>
      <p className="sub">{profileError}</p>
      <button className="btn ghost" style={{width:"100%"}} onClick={signOut}>Cerrar sesión</button></div></div>;
  }
  else if(!profile){ body = <div style={{padding:40,color:"var(--muted)"}}><span className="spinner dark"/> Cargando tu perfil…</div>; }
  else if(profile.active===false){
    body = <div className="auth"><div className="box"><h1>Cuenta inactiva</h1>
      <p className="sub">Tu usuario está desactivado. Contacta al administrador.</p>
      <button className="btn ghost" style={{width:"100%"}} onClick={signOut}>Cerrar sesión</button></div></div>;
  }
  else { body = <Workspace session={session} profile={profile} onSignOut={signOut}/>; }

  return (
    <ToastCtx.Provider value={pushToast}>
      {body}
      <Toasts items={toasts}/>
    </ToastCtx.Provider>
  );
}

/* Error boundary: evita la pantalla en blanco si un componente falla al dibujar */
class ErrorBoundary extends React.Component{
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err,info){ console.error("Render error:", err, info); }
  render(){
    if(this.state.err){
      return (
        <div style={{maxWidth:720,margin:"40px auto",fontFamily:"Inter,Arial,sans-serif",
          background:"#FBEAE8",border:"1.5px solid #B8483F",borderRadius:10,padding:20,color:"#8A342C"}}>
          <h2 style={{margin:"0 0 8px",fontFamily:"serif"}}>⚠️ Ocurrió un error en la interfaz</h2>
          <pre style={{whiteSpace:"pre-wrap",fontSize:13,margin:0}}>{String(this.state.err && this.state.err.message || this.state.err)}</pre>
          <p style={{marginTop:12,fontSize:12.5,color:"#5B6B7A"}}>Recarga la página. Si persiste, comparte este mensaje.</p>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><Root/></ErrorBoundary>);
</script>
