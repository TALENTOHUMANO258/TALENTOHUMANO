          {e.medical_category==="especialista" && <Info label="Especialidad" value={e.specialty}/>}
        </React.Fragment>}
        {e.staff_group==="aprendiz" && "sena_productiva_start" in e && <React.Fragment>
          <Info label="Etapa SENA actual" value={sena ? cap(sena.etapa)+" · termina el "+fmt(sena.fin) : "Sin fechas (edita la ficha)"}/>
          {e.sena_lectiva_start && <Info label="Inicio etapa lectiva" value={fmt(e.sena_lectiva_start)}/>}
          <Info label="Inicio etapa productiva" value={e.sena_productiva_start ? fmt(e.sena_productiva_start) : "Aún en lectiva"}/>
          <Info label="Duración por etapa" value={(e.sena_months||6)+" meses"}/>
        </React.Fragment>}
        <Info label="Cargo" value={e.position_title}/>
        <Info label="Grupo" value={STAFF_LABELS[e.staff_group||"empleado"]}/>
        {e.staff_group!=="medico" && <React.Fragment>
          <Info label="Clasificación" value={EMPLOYEE_TYPES[e.employee_type]}/>
          <Info label="Semana laboral" value={cap(workWeekLabel(e.employee_type))}/>
          <Info label="Área" value={depName(e.department_id)}/>
        </React.Fragment>}
        <Info label="Fecha de ingreso" value={fmt(e.hire_date)}/>
        <Info label="Fecha de retiro" value={fmt(e.termination_date)}/>
        <Info label="Estado" value={EMP_STATUS[e.status]}/>
        {showSalary && <Info label="Salario base" value={money(e.salary)}/>}
      </div>
      {!showSalary && (
        <p className="muted" style={{marginTop:16,fontSize:12.5,display:"flex",gap:7,alignItems:"center"}}>
          <Icon name="lock"/> Tu rol no tiene permitido ver información salarial.
        </p>
      )}
    </div>
  );
}

/* ---------- Contratos + Otrosí ---------- */
function TabContratos({employeeId, profile, departments}){
  const { reloadCatalogs } = useCatalogs();
  const write = can(profile,"contracts","write");
  const showSalary = can(profile,"salary","read");
  const [showC,setShowC] = useState(false);
  const [addFor,setAddFor] = useState(null); // contract id para nuevo otrosí
  const toast = useToast();

  const data = useAsync(async ()=>{
    const { data:contracts, error } = await sb.from("contracts").select("*").eq("employee_id",employeeId).order("start_date",{ascending:false});
    if(error) throw error;
    const ids = (contracts||[]).map(c=>c.id);
    let adds = [];
    if(ids.length){ const r = await sb.from("contract_addendums").select("*").in("contract_id",ids).order("date",{ascending:false}); adds = r.data||[]; }
    return { contracts:contracts||[], adds };
  }, [employeeId]);

  /* Sin «jefe inmediato» ni «fecha de firma»: no se usaban y ensuciaban la
     ficha. Las columnas siguen en la base por compatibilidad. */
  const emptyC = ()=>({ id:null, contract_number:"", type:"termino_indefinido", start_date:todayISO(), end_date:"", salary:"",
    position_title:"", area_name:"", schedule:"tiempo_completo", status:"vigente",
    observations:"", renewal_date:"", termination_reason:"" });
  const contractToForm = (c)=>({ id:c.id, contract_number:c.contract_number||"", type:c.type||"termino_indefinido",
    start_date:c.start_date||"", end_date:c.end_date||"", salary:c.salary!=null?c.salary:"",
    position_title:c.position_title||"", area_name:((departments||[]).find(d=>d.id===c.department_id)||{}).name||"",
    schedule:c.schedule||"tiempo_completo", status:c.status||"vigente", observations:c.observations||"",
    renewal_date:c.renewal_date||"", termination_reason:c.termination_reason||"" });
  const [cf,setCf] = useState(emptyC());
  const [busy,setBusy] = useState(false);
  const canDel = can(profile,"contracts","delete");

  const saveContract = async ()=>{
    if(!cf.contract_number.trim()){ toast("El número de contrato es obligatorio.","err"); return; }
    if(cf.end_date && cf.start_date && cf.end_date < cf.start_date){ toast("La terminación no puede ser anterior al inicio.","err"); return; }
    setBusy(true);
    try{
      const area = await resolveDepartmentId(cf.area_name, departments);
      const p = {...cf, employee_id:employeeId, department_id:area.id};
      delete p.area_name; delete p.id;
      ["end_date","salary","renewal_date"].forEach(k=>{ if(p[k]==="") p[k]=null; });
      const { error } = cf.id
        ? await sb.from("contracts").update(p).eq("id",cf.id)
        : await sb.from("contracts").insert({...p, created_by:profile.id});
      if(error) throw error;
      if(area.creada){ toast(`Se creó el área «${cf.area_name.trim()}».`,"info"); reloadCatalogs(); }
      toast(cf.id ? "Contrato actualizado." : "Contrato registrado.","ok"); setShowC(false); setCf(emptyC()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const delContract = async (c)=>{
    if(!confirm("¿Eliminar el contrato "+c.contract_number+"? También se borran sus otrosí.")) return;
    const { error } = await sb.from("contracts").delete().eq("id",c.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Contrato eliminado.","ok"); data.reload();
  };

  const emptyA = ()=>({ id:null, addendum_number:"", type:"prorroga", date:todayISO(), description:"", change_detail:"", application_date:"" });
  const addToForm = (a)=>({ id:a.id, addendum_number:a.addendum_number||"", type:a.type||"prorroga", date:a.date||todayISO(),
    description:a.description||"", change_detail:a.change_detail||"", application_date:a.application_date||"" });
  const [af,setAf] = useState(emptyA());
  const saveAddendum = async ()=>{
    if(!af.addendum_number.trim()){ toast("El número de otrosí es obligatorio.","err"); return; }
    setBusy(true);
    try{
      const p = {...af, contract_id:addFor};
      delete p.id;
      if(p.application_date==="") p.application_date=null;
      const { error } = af.id
        ? await sb.from("contract_addendums").update(p).eq("id",af.id)
        : await sb.from("contract_addendums").insert({...p, created_by:profile.id});
      if(error) throw error;
      toast(af.id ? "Otrosí actualizado." : "Otrosí registrado.","ok"); setAddFor(null); setAf(emptyA()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const delAddendum = async (a)=>{
    if(!confirm("¿Eliminar el otrosí "+a.addendum_number+"?")) return;
    const { error } = await sb.from("contract_addendums").delete().eq("id",a.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Otrosí eliminado.","ok"); data.reload();
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const { contracts, adds:allAdds } = data.data;

  return (
    <div>
      {write
        ? <div style={{marginBottom:14}}><button className="btn accent sm" onClick={()=>{setCf(emptyC());setShowC(true);}}><Icon name="plus"/>Nuevo contrato</button></div>
        : <Notice icon="lock">{whyNot(profile,"contracts","write")} Esta pestaña queda en modo consulta.</Notice>}
      {contracts.length===0 ? <Empty text="Este empleado no tiene contratos registrados."/> :
        <div className="grid" style={{gap:14}}>
          {contracts.map(c=>{
            const adds = allAdds.filter(a=>a.contract_id===c.id);
            return (
              <div key={c.id} className="card">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                  <div>
                    <b>Contrato {c.contract_number}</b> · {CONTRACT_TYPES[c.type]}
                    <div className="kv" style={{marginTop:6}}>
                      <span>Inicio: <b>{fmt(c.start_date)}</b></span>
                      <span>Fin: <b>{fmt(c.end_date)}</b></span>
                      <span>Cargo: <b>{c.position_title||"—"}</b></span>
                      <span>Jornada: <b>{SCHEDULES[c.schedule]||"—"}</b></span>
                      {showSalary && <span>Salario: <b>{money(c.salary)}</b></span>}
                      <span>Renovación: <b>{fmt(c.renewal_date)}</b></span>
                    </div>
                    {c.observations && <p className="muted" style={{margin:"8px 0 0",fontSize:12.5}}>{c.observations}</p>}
                    {c.termination_reason && <p className="muted" style={{margin:"4px 0 0",fontSize:12.5}}>Motivo terminación: <b>{c.termination_reason}</b></p>}
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:10}}>
                    <Badge status={c.status}/>
                    {write && (
                      <div className="rowbtns">
                        <button className="btn ghost sm" onClick={()=>{setCf(contractToForm(c));setShowC(true);}}><Icon name="edit"/>Editar</button>
                        {canDel && <button className="btn ghost sm" style={{color:"var(--red)"}} onClick={()=>delContract(c)}><Icon name="trash"/>Eliminar</button>}
                      </div>
                    )}
                  </div>
                </div>

                <div style={{marginTop:14,borderTop:"1px solid var(--border)",paddingTop:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                    <b style={{fontSize:13,color:"var(--navy)"}}>Otrosí / adendas ({adds.length})</b>
                    {write && <button className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>{setAf(emptyA());setAddFor(c.id);}}>+ Añadir otrosí</button>}
                  </div>
                  {adds.length===0 ? <p className="muted" style={{fontSize:12.5,margin:"8px 0 0"}}>Sin adendas.</p> :
                    <div style={{marginTop:10,display:"grid",gap:7}}>
                      {adds.map(a=>(
                        <div key={a.id} style={{fontSize:12.5,padding:"10px 12px",background:"rgba(255,255,255,.5)",
                          border:"1px solid var(--border)",borderRadius:11}}>
                          <b>Otrosí {a.addendum_number}</b> · {ADDENDUM_TYPES[a.type]} · {fmt(a.date)}
                          {a.description && <span> — {a.description}</span>}
                          {a.change_detail && <div className="muted">Cambio: {a.change_detail}{a.application_date?` (aplica ${fmt(a.application_date)})`:""}</div>}
                          {write && (
                            <div style={{display:"flex",gap:14,marginTop:6}}>
                              <button className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>{setAf(addToForm(a));setAddFor(c.id);}}>Editar</button>
                              {canDel && <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>delAddendum(a)}>Eliminar</button>}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>}
                </div>
              </div>
            );
          })}
        </div>}

      {showC && (
        <Modal title={cf.id ? "Editar contrato "+cf.contract_number : "Nuevo contrato"} onClose={()=>setShowC(false)} wide footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={saveContract}>{busy?<span className="spinner"/>:<Icon name="check"/>}{cf.id?"Guardar cambios":"Guardar contrato"}</button>
            <button className="btn ghost" onClick={()=>setShowC(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Número de contrato"><input value={cf.contract_number} onChange={e=>setCf({...cf,contract_number:e.target.value})}/></Field>
            <Field label="Tipo"><select value={cf.type} onChange={e=>setCf({...cf,type:e.target.value})}>{opts(CONTRACT_TYPES)}</select></Field>
            <Field label="Fecha inicio"><input type="date" value={cf.start_date} onChange={e=>setCf({...cf,start_date:e.target.value})}/></Field>
            <Field label="Fecha terminación"><input type="date" value={cf.end_date} onChange={e=>setCf({...cf,end_date:e.target.value})}/></Field>
            <Field label="Salario"><input type="number" value={cf.salary} onChange={e=>setCf({...cf,salary:e.target.value})}/></Field>
            <Field label="Cargo"><input value={cf.position_title} onChange={e=>setCf({...cf,position_title:e.target.value})}/></Field>
            <Field label="Área"><AreaInput value={cf.area_name} onChange={(v)=>setCf({...cf,area_name:v})}/></Field>
            <Field label="Jornada"><select value={cf.schedule} onChange={e=>setCf({...cf,schedule:e.target.value})}>{opts(SCHEDULES)}</select></Field>
            <Field label="Estado"><select value={cf.status} onChange={e=>setCf({...cf,status:e.target.value})}>{opts(CONTRACT_STATUS)}</select></Field>
            <Field label="Fecha de renovación"><input type="date" value={cf.renewal_date} onChange={e=>setCf({...cf,renewal_date:e.target.value})}/></Field>
          </div>
          <Field label="Motivo de terminación (si aplica)"><input value={cf.termination_reason} onChange={e=>setCf({...cf,termination_reason:e.target.value})}/></Field>
          <Field label="Observaciones"><textarea value={cf.observations} onChange={e=>setCf({...cf,observations:e.target.value})}/></Field>
        </Modal>
      )}

      {addFor && (
        <Modal title={af.id ? "Editar otrosí" : "Nuevo otrosí"} onClose={()=>setAddFor(null)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={saveAddendum}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar otrosí</button>
            <button className="btn ghost" onClick={()=>setAddFor(null)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Número de otrosí"><input value={af.addendum_number} onChange={e=>setAf({...af,addendum_number:e.target.value})}/></Field>
            <Field label="Tipo"><select value={af.type} onChange={e=>setAf({...af,type:e.target.value})}>{opts(ADDENDUM_TYPES)}</select></Field>
            <Field label="Fecha"><input type="date" value={af.date} onChange={e=>setAf({...af,date:e.target.value})}/></Field>
            <Field label="Fecha de aplicación"><input type="date" value={af.application_date} onChange={e=>setAf({...af,application_date:e.target.value})}/></Field>
          </div>
          <Field label="Descripción"><textarea value={af.description} onChange={e=>setAf({...af,description:e.target.value})}/></Field>
          <Field label="Cambio realizado"><textarea value={af.change_detail} onChange={e=>setAf({...af,change_detail:e.target.value})}/></Field>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Seguridad social + Novedades ---------- */
function TabSeguridad({employeeId, profile, ssEntities}){
  const write = can(profile,"social_security");
  const [showF,setShowF] = useState(false);
  const [showN,setShowN] = useState(false);
  const toast = useToast();

  const data = useAsync(async ()=>{
    const [aff, nov] = await Promise.all([
      sb.from("employee_social_security").select("*").eq("employee_id",employeeId),
      sb.from("social_security_novelties").select("*").eq("employee_id",employeeId).order("date",{ascending:false}),
    ]);
    if(aff.error) throw aff.error;
    return { aff:aff.data||[], nov:nov.data||[] };
  }, [employeeId]);

  /* La entidad se ESCRIBE. Antes era un <select> limitado al catálogo
     `social_security_entities`, así que no se podía registrar una EPS o una
     caja que no estuviera precargada. Ahora es texto libre con sugerencias
     filtradas por el TIPO seleccionado; si lo escrito coincide con una
     entidad del catálogo se conserva además el vínculo (entity_id). */
  const emptyF = ()=>({ id:null, kind:"eps", entity_name:"", affiliation_number:"", affiliation_date:"",
    status:"activa", withdrawal_date:"", risk_class:"", risk_level:"", observations:"" });
  const affToForm = (a)=>({ id:a.id, kind:a.kind,
    entity_name: a.entity_name || ((ssEntities.find(x=>x.id===a.entity_id)||{}).name || ""),
    affiliation_number:a.affiliation_number||"", affiliation_date:a.affiliation_date||"",
    status:a.status||"activa", withdrawal_date:a.withdrawal_date||"",
    risk_class:a.risk_class||"", risk_level:a.risk_level||"", observations:a.observations||"" });
  const [f,setF] = useState(emptyF());
  const [busy,setBusy] = useState(false);

  const saveAff = async ()=>{
    const nombre = (f.entity_name||"").trim();
    if(!nombre){ toast("Escribe el nombre de la entidad.","err"); return; }
    setBusy(true);
    try{
      const norm = (s)=> String(s||"").trim().toLowerCase();
      const ent = ssEntities.find(x=>x.kind===f.kind && norm(x.name)===norm(nombre));
      const p = {...f, employee_id:employeeId, entity_name:nombre,
                 entity_id: ent ? ent.id : null, created_by:profile.id};
      if(!p.id) delete p.id;
      ["affiliation_date","withdrawal_date","risk_class","risk_level","observations","affiliation_number"]
        .forEach(k=>{ if(p[k]==="") p[k]=null; });
      // upsert por (employee_id, kind): una afiliación vigente por tipo
      const { error } = await sb.from("employee_social_security").upsert(p, { onConflict:"employee_id,kind" });
      if(error) throw error;
      toast("Afiliación guardada.","ok"); setShowF(false); setF(emptyF()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const delAff = async (a)=>{
    if(!confirm("¿Eliminar la afiliación de "+SS_KINDS[a.kind]+"?")) return;
    const { error } = await sb.from("employee_social_security").delete().eq("id",a.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Afiliación eliminada.","ok"); data.reload();
  };

  const emptyN = ()=>({ id:null, type:"ingreso", date:todayISO(), application_date:"", description:"", status:"pendiente" });
  const novToForm = (x)=>({ id:x.id, type:x.type, date:x.date||todayISO(), application_date:x.application_date||"",
    description:x.description||"", status:x.status||"pendiente" });
  const [n,setN] = useState(emptyN());
  const saveNov = async ()=>{
    setBusy(true);
    try{
      const p = {...n, employee_id:employeeId};
      delete p.id;
      if(p.application_date==="") p.application_date=null;
      const { error } = n.id
        ? await sb.from("social_security_novelties").update(p).eq("id",n.id)
        : await sb.from("social_security_novelties").insert({...p, created_by:profile.id});
      if(error) throw error;
      toast(n.id ? "Novedad actualizada." : "Novedad registrada.","ok"); setShowN(false); setN(emptyN()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const delNov = async (x)=>{
    if(!confirm("¿Eliminar la novedad «"+(NOVELTY_TYPES[x.type]||x.type)+"» del "+fmt(x.date)+"?")) return;
    const { error } = await sb.from("social_security_novelties").delete().eq("id",x.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Novedad eliminada.","ok"); data.reload();
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const { aff, nov } = data.data;

  const byKind = (k)=> aff.find(a=>a.kind===k);
  const entName = (a)=> a ? (a.entity_name || (ssEntities.find(x=>x.id===a.entity_id)||{}).name || "—") : "—";

  return (
    <div>
      {write
        ? <div style={{marginBottom:14,display:"flex",gap:10,flexWrap:"wrap"}}>
            <button className="btn accent sm" onClick={()=>{setF(emptyF());setShowF(true);}}><Icon name="plus"/>Afiliación</button>
            <button className="btn ghost sm" onClick={()=>{setN(emptyN());setShowN(true);}}><Icon name="plus"/>Novedad</button>
          </div>
        : <Notice icon="lock">{whyNot(profile,"social_security","write")} Esta pestaña queda en modo consulta.</Notice>}

      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:12,marginBottom:16}}>
        {Object.keys(SS_KINDS).map(k=>{
          const a = byKind(k);
          return (
            <div key={k} className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                <b>{SS_KINDS[k]}</b>{a && <Badge status={a.status}/>}
              </div>
              {a ? <div className="kv" style={{marginTop:8,flexDirection:"column",gap:4}}>
                    <span>Entidad: <b>{entName(a)}</b></span>
                    <span>N° afiliación: <b>{a.affiliation_number||"—"}</b></span>
                    <span>Afiliación: <b>{fmt(a.affiliation_date)}</b></span>
                    {k==="arl" && <span>Riesgo: <b>{a.risk_class||"—"} / {a.risk_level||"—"}</b></span>}
                    {a.withdrawal_date && <span>Retiro: <b>{fmt(a.withdrawal_date)}</b></span>}
                  </div>
                : <p className="muted" style={{fontSize:12.5,margin:"8px 0 0"}}>Sin información.</p>}
              {write && (
                <div className="rowbtns" style={{marginTop:12}}>
                  <button className="btn ghost sm" onClick={()=>{ setF(a ? affToForm(a) : {...emptyF(), kind:k}); setShowF(true); }}>
                    <Icon name={a?"edit":"plus"}/>{a?"Editar":"Registrar"}
                  </button>
                  {a && can(profile,"social_security","delete") &&
                    <button className="btn ghost sm" style={{color:"var(--red)"}} onClick={()=>delAff(a)}><Icon name="trash"/>Quitar</button>}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <h3 className="section-title" style={{fontSize:14}}>Novedades de seguridad social</h3>
      {nov.length===0 ? <Empty text="No hay novedades registradas."/> :
        <div className="table-wrap"><table>
          <thead><tr><th>Tipo</th><th>Fecha</th><th>Aplicación</th><th>Descripción</th><th>Estado</th><th></th></tr></thead>
          <tbody>{nov.map(x=>(
            <tr key={x.id} style={{cursor:"default"}}>
              <td>{NOVELTY_TYPES[x.type]}</td><td>{fmt(x.date)}</td><td>{fmt(x.application_date)}</td>
              <td style={{whiteSpace:"normal"}}>{x.description||"—"}</td><td><Badge status={x.status}/></td>
              <td>{write && <span style={{display:"inline-flex",gap:14}}>
                <button className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>{setN(novToForm(x));setShowN(true);}}>Editar</button>
                {can(profile,"social_security","delete") && <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>delNov(x)}>Eliminar</button>}
              </span>}</td>
            </tr>
          ))}</tbody>
        </table></div>}

      {showF && (
        <Modal title={(f.id?"Editar":"Registrar")+" afiliación · "+SS_KINDS[f.kind]} onClose={()=>setShowF(false)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={saveAff}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setShowF(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            {/* Cambiar el tipo limpia la entidad: las sugerencias dependen de él. */}
            <Field label="Tipo"><select value={f.kind} onChange={e=>setF({...f,kind:e.target.value,entity_name:"",id:null})}>{opts(SS_KINDS)}</select></Field>
            <Field label={"Entidad ("+SS_KINDS[f.kind]+")"}>
              <input list="th-ss-entidades" value={f.entity_name}
                onChange={e=>setF({...f,entity_name:e.target.value})}
                placeholder={"Escribe la "+SS_KINDS[f.kind]}/>
            </Field>
            <Field label="N° de afiliación"><input value={f.affiliation_number} onChange={e=>setF({...f,affiliation_number:e.target.value})}/></Field>
            <Field label="Fecha de afiliación"><input type="date" value={f.affiliation_date} onChange={e=>setF({...f,affiliation_date:e.target.value})}/></Field>
            <Field label="Estado"><select value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{opts(SS_STATUS)}</select></Field>
            <Field label="Fecha de retiro"><input type="date" value={f.withdrawal_date} onChange={e=>setF({...f,withdrawal_date:e.target.value})}/></Field>
            {f.kind==="arl" && <Field label="Clase de riesgo"><input value={f.risk_class} onChange={e=>setF({...f,risk_class:e.target.value})} placeholder="I - V"/></Field>}
            {f.kind==="arl" && <Field label="Nivel de riesgo"><input value={f.risk_level} onChange={e=>setF({...f,risk_level:e.target.value})}/></Field>}
          </div>
          {/* Sugerencias del catálogo, filtradas por el tipo seleccionado.
              Es una lista abierta: puedes escribir una entidad que no esté. */}
          <datalist id="th-ss-entidades">
            {ssEntities.filter(x=>x.kind===f.kind).map(x=><option key={x.id} value={x.name}/>)}
          </datalist>
          <Field label="Observaciones"><textarea value={f.observations} onChange={e=>setF({...f,observations:e.target.value})}/></Field>
          <p className="muted" style={{fontSize:12,margin:"8px 0 0"}}>
            Todos los campos son editables. Guardar reemplaza la afiliación vigente de ese tipo (una por tipo).
            La entidad se puede escribir aunque no esté en el catálogo.
          </p>
        </Modal>
      )}

      {showN && (
        <Modal title={n.id ? "Editar novedad" : "Nueva novedad"} onClose={()=>setShowN(false)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={saveNov}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar novedad</button>
            <button className="btn ghost" onClick={()=>setShowN(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Tipo"><select value={n.type} onChange={e=>setN({...n,type:e.target.value})}>{opts(NOVELTY_TYPES)}</select></Field>
            <Field label="Fecha"><input type="date" value={n.date} onChange={e=>setN({...n,date:e.target.value})}/></Field>
            <Field label="Fecha de aplicación"><input type="date" value={n.application_date} onChange={e=>setN({...n,application_date:e.target.value})}/></Field>
            <Field label="Estado"><select value={n.status} onChange={e=>setN({...n,status:e.target.value})}>{opts(NOVELTY_STATUS)}</select></Field>
          </div>
          <Field label="Descripción"><textarea value={n.description} onChange={e=>setN({...n,description:e.target.value})}/></Field>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Vacaciones (por empleado) ----------
   Organizadas por PERIODO ANUAL, contado desde la fecha de ingreso: quien
   entró en 2023 ve 2023-2024, 2024-2025 y 2025-2026, cada uno con su estado
   (en curso, pendiente, próximo a vencer, vencido o disfrutado) y con las
   fechas exactas en que tomó las vacaciones de ese periodo.
   Los días son SIEMPRE hábiles según la clasificación del empleado. */
/* Formulario de vacaciones compartido por el expediente y el módulo global.
   Crea (sin id) o edita (con id). Se escriben los DÍAS HÁBILES y la fecha
   de inicio; la fecha de fin y la de reintegro se calculan solas saltando
   fines de semana (según la clasificación) y festivos. La fecha de fin se
   puede corregir a mano y entonces se recalculan los días.
   Si las vacaciones se pagaron en dinero no hay disfrute: se registra la
   fecha de pago y los días pagados, que igual descuentan del saldo. */
const vacToForm = (v, tipo)=>({
  id:v.id, employee_id:v.employee_id, period_start:v.period_start||"",
  start_date:v.start_date, end_date:v.end_date, dias:String(v.days||""),
  return_date: v.return_date || (v.paid_in_money ? "" : nextWorkday(v.end_date, tipo)),
  paid_in_money: !!v.paid_in_money, status:v.status||"aprobada", observations:v.observations||"",
});
const newVacForm = (employee_id="", period_start="")=>{
  const hoy = todayISO();
  return { id:null, employee_id, period_start, start_date:hoy, end_date:hoy, dias:"",
           return_date:"", paid_in_money:false, status:"aprobada", observations:"" };
};

function VacacionModal({initial, emp, emps, cols, profile, saldoDe, onClose, onSaved}){
  const toast = useToast();
  const [f,setF] = useState(initial);
  const [busy,setBusy] = useState(false);
  const isEdit = !!initial.id;
  const selEmp = emp || (emps||[]).find(e=>e.id===f.employee_id) || null;
  const tipo = selEmp ? selEmp.employee_type : null;
  const periods = useMemo(()=> selEmp ? vacationPeriods(selEmp.hire_date, selEmp.termination_date) : [], [selEmp]);

  /* Mantiene coherentes días ↔ fin ↔ reintegro según el campo que cambió. */
  const recalc = (next, from, t=tipo)=>{
    if(next.paid_in_money) return {...next, end_date:next.start_date, return_date:""};
    const n = parseInt(next.dias,10);
    if((from==="dias"||from==="start") && next.start_date && n>0) next.end_date = addBusinessDays(next.start_date, n, t);
    if(from==="end") next.dias = String(businessDays(next.start_date, next.end_date, t) || "");
    if(from!=="return" && next.end_date >= next.start_date) next.return_date = nextWorkday(next.end_date, t);
    return next;
  };
  const upd = (k, from)=>(e)=>setF(recalc({...f, [k]:e.target.value}, from));

  const nDias = parseInt(f.dias,10) || 0;
  const dias = f.paid_in_money ? nDias : businessDays(f.start_date, f.end_date, tipo);
  const corridos = daysBetween(f.start_date, f.end_date);
  const festivos = f.paid_in_money ? [] : holidaysBetween(f.start_date, f.end_date);

  const save = async ()=>{
    if(!selEmp){ toast("Selecciona un colaborador.","err"); return; }
    if(!f.start_date){ toast("Indica la fecha "+(f.paid_in_money?"de pago.":"de inicio."),"err"); return; }
    if(!f.paid_in_money && corridos<=0){ toast("Rango de fechas inválido.","err"); return; }
    if(dias<=0){ toast(f.paid_in_money ? "Indica cuántos días se pagaron." :
                 "El rango no contiene días hábiles ("+workWeekLabel(tipo)+", sin festivos).","err"); return; }
    if(!f.paid_in_money && f.return_date && f.return_date <= f.end_date){ toast("El reintegro debe ser posterior al último día de vacaciones.","err"); return; }
    setBusy(true);
    try{
      let observaciones = f.observations || null;
      const p = { employee_id:selEmp.id, start_date:f.start_date, end_date:f.paid_in_money?f.start_date:f.end_date,
        days:dias, status:f.status, approved_by: f.status==="aprobada"?profile.id:null };
      if(cols.withPeriod){
        const per = periods.find(x=>x.start===f.period_start) ||
                    periods.find(x=>f.start_date>=x.start && f.start_date<=x.end);
        if(per){ p.period_start = per.start; p.period_end = per.end; }
        p.business_days = true;
      }
      if(cols.withV11){
        p.paid_in_money = !!f.paid_in_money;
        p.return_date   = f.paid_in_money ? null : (f.return_date || null);
      }else if(f.paid_in_money && !/pagad/i.test(observaciones||"")){
        // Sin la columna nueva, el pago queda al menos anotado.
        observaciones = "PAGADAS EN DINERO. " + (observaciones||"");
      }
      p.observations = observaciones;
      const { error } = isEdit
        ? await sb.from("vacations").update(p).eq("id",f.id)
        : await sb.from("vacations").insert({...p, created_by:profile.id});
      if(error) throw error;
      if(!cols.withV11 && (f.paid_in_money || f.return_date))
        toast("La casilla de pago y el reintegro no se guardaron: ejecuta migracion_v11.sql en Supabase.","info");
      toast((isEdit?"Vacaciones actualizadas: ":"Vacaciones registradas: ")+dias+" día(s) "+(f.paid_in_money?"pagado(s) en dinero.":"hábil(es)."),"ok");
      onSaved(); onClose();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };

  return (
    <Modal title={isEdit?"Editar vacaciones":"Registrar vacaciones"} onClose={onClose} footer={<React.Fragment>
        <button className="btn accent" disabled={busy} onClick={save}>{busy?<span className="spinner"/>:<Icon name="check"/>}{isEdit?"Guardar cambios":"Guardar"}</button>
        <button className="btn ghost" onClick={onClose}>Cancelar</button>
      </React.Fragment>}>
      <div className="grid form-grid">
        {!emp && (
          <Field label="Colaborador">
            <select value={f.employee_id} disabled={isEdit} onChange={e=>{
              const nuevo = (emps||[]).find(x=>x.id===e.target.value);
              setF(recalc({...f, employee_id:e.target.value, period_start:""}, "dias", nuevo ? nuevo.employee_type : null));
            }}>
              <option value="">Selecciona…</option>
              {(emps||[]).filter(e=>e.status==="activo" || e.id===f.employee_id).map(e=><option key={e.id} value={e.id}>{e.first_name} {e.last_name}</option>)}
            </select>
          </Field>
        )}
        {periods.length>0 && (
          <Field label="Periodo al que corresponde">
            <select value={f.period_start} onChange={e=>setF({...f,period_start:e.target.value})}>
              <option value="">Según la fecha de inicio</option>
              {periods.map(p=><option key={p.start} value={p.start}>{p.label}{p.cumplido?"":" (en curso)"}</option>)}
            </select>
          </Field>
        )}
        <FieldBox label="Forma">
          <label className={"check"+(f.paid_in_money?" on":"")}>
            <input type="checkbox" checked={f.paid_in_money}
              onChange={e=>setF(recalc({...f, paid_in_money:e.target.checked}, "dias"))}/>
            Pagadas en dinero
          </label>
        </FieldBox>
        <Field label={f.paid_in_money ? "Fecha de pago" : "Inicio"}>
          <input type="date" value={f.start_date} onChange={upd("start_date","start")}/>
        </Field>
        <Field label={f.paid_in_money ? "Días pagados" : "Días hábiles"}>
          <input type="number" min="1" step="1" value={f.dias} placeholder="Ej. 15" onChange={upd("dias","dias")}/>
        </Field>
        {!f.paid_in_money && <Field label="Último día de vacaciones"><input type="date" value={f.end_date} onChange={upd("end_date","end")}/></Field>}
        {!f.paid_in_money && <Field label="Fecha de reintegro"><input type="date" value={f.return_date} onChange={upd("return_date","return")}/></Field>}
        <Field label="Estado"><select value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{opts(VAC_STATUS)}</select></Field>
      </div>

      {f.paid_in_money ? (
        <p className="muted" style={{margin:"12px 0"}}>
          Se descuentan <b style={{color:"var(--navy)"}}>{dias}</b> día(s) del saldo como vacaciones compensadas en dinero.
          {selEmp && saldoDe && <span> Saldo actual: <b style={{color:"var(--navy)"}}>{saldoDe(selEmp.id)}</b>.</span>}
        </p>
      ) : (
        <div className="muted" style={{margin:"12px 0",fontSize:13,lineHeight:1.6}}>
          Se descuentan <b style={{color:"var(--navy)"}}>{dias}</b> día(s) hábil(es) · {corridos} de calendario ·
          cuenta de {workWeekLabel(tipo)}, sin festivos.
          {f.return_date && <span> Se reintegra el <b style={{color:"var(--navy)"}}>{fmt(f.return_date)}</b>.</span>}
          {selEmp && saldoDe && <span> Saldo actual: <b style={{color:"var(--navy)"}}>{saldoDe(selEmp.id)}</b>.</span>}
          {festivos.length>0 && (
            <div style={{marginTop:6}}>
              Festivos en el rango (no se cuentan):{" "}
              {festivos.map((h,i)=><span key={h.iso}>{i>0?", ":""}<b>{fmt(h.iso)}</b> {h.name}</span>)}
            </div>
          )}
        </div>
      )}
      <Field label="Observaciones"><textarea value={f.observations} onChange={e=>setF({...f,observations:e.target.value})}/></Field>
    </Modal>
  );
}

function TabVacaciones({emp, profile}){
  const write = can(profile,"vacations");
  const [edit,setEdit] = useState(null);   // formulario abierto (nuevo o existente)
  const toast = useToast();

  const data = useAsync(async ()=>{
    const withPeriod = await hasVacPeriod();
    const withV11    = await hasVacV11();
    const cols = "id,employee_id,start_date,end_date,days,status,observations"
      + (withPeriod ? ",period_start,period_end,business_days" : "")
      + (withV11 ? ",paid_in_money,return_date" : "");
    const { data, error } = await sb.from("vacations").select(cols)
      .eq("employee_id",emp.id).order("start_date",{ascending:false});
    if(error) throw error;
    return { rows:data||[], withPeriod, withV11 };
  }, [emp.id]);

  const periods = useMemo(()=>vacationPeriods(emp.hire_date, emp.termination_date),
                          [emp.hire_date, emp.termination_date]);

  const del = async (id)=>{
    if(!confirm("¿Eliminar este registro de vacaciones?")) return;
    const { error } = await sb.from("vacations").delete().eq("id",id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Registro eliminado.","ok"); data.reload();
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const { rows, withPeriod, withV11 } = data.data;

  /* Reparto de cada disfrute en su periodo. Los rechazados SÍ se listan (para
     dejar constancia) pero no consumen saldo. */
  const porPeriodo = {}; const sueltos = [];
  rows.forEach(v=>{
    const p = periodOf(v, periods);
    if(p) (porPeriodo[p.start] = porPeriodo[p.start] || []).push(v);
    else sueltos.push(v);
  });
  const r1 = (n)=> Math.round(n*10)/10;
  const vale = (v)=> v.status!=="rechazada";
  const cuenta  = (lista)=> lista.filter(vale).reduce((s,v)=>s+v.days,0);
  const pagados = (lista)=> lista.filter(v=>vale(v) && v.paid_in_money).reduce((s,v)=>s+v.days,0);
  const totalCausados = r1(periods.reduce((s,p)=>s+p.causados,0));
  const totalTomados  = cuenta(rows);
  const totalPagados  = pagados(rows);
  const saldo = r1(totalCausados-totalTomados);
  const totalVencidos = r1(periods.filter(p=>p.cumplido)
    .reduce((s,p)=>s+Math.max(0, p.causados-cuenta(porPeriodo[p.start]||[])),0));
  const saldoDe = ()=> saldo;

  const filaDisfrute = (v)=>(
    <tr key={v.id} style={{cursor:"default"}}>
      <td>{fmt(v.start_date)}</td>
      <td>{v.paid_in_money ? "—" : fmt(v.end_date)}</td>
      <td><b>{v.days}</b></td>
      <td>{v.paid_in_money ? "—" : fmt(v.return_date || nextWorkday(v.end_date, emp.employee_type))}</td>
      <td>{v.paid_in_money
            ? <span className="badge b-green"><span className="dot"/>Pagadas en dinero</span>
            : <span className="badge b-sky"><span className="dot"/>Disfrute</span>}</td>
      <td><Badge status={v.status}/></td>
      <td style={{whiteSpace:"normal",minWidth:140}}>{v.observations||"—"}</td>
      <td>{write && <span style={{display:"inline-flex",gap:14}}>
        <button className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>setEdit(vacToForm(v, emp.employee_type))}>Editar</button>
        <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>del(v.id)}>Eliminar</button>
      </span>}</td>
    </tr>
  );
  const CAB = <thead><tr><th>Desde / pago</th><th>Hasta</th><th>Días</th><th>Reintegro</th><th>Forma</th><th>Estado</th><th>Observaciones</th><th></th></tr></thead>;

  return (
    <div>
      <div className="card" style={{marginBottom:12,display:"flex",gap:24,flexWrap:"wrap"}}>
        <Info label="Días causados" value={totalCausados}/>
        <Info label="Días tomados" value={totalTomados}/>
        <Info label="Pagados en dinero" value={totalPagados}/>
        <Info label="Saldo pendiente" value={saldo}/>
        <Info label="Vencidos" value={totalVencidos}/>
        <Info label="Se cuentan" value={cap(workWeekLabel(emp.employee_type))+", sin festivos"}/>
      </div>
      {write && !withV11 && (
        <Notice kind="amber" icon="alert">
          Para guardar el <b>pago en dinero</b> y la <b>fecha de reintegro</b> ejecuta <code>migracion_v11.sql</code> en Supabase.
        </Notice>
      )}

      {!emp.employee_type && (
        <Notice kind="amber" icon="alert">
          Este registro no tiene clasificación, así que los días se cuentan de {WORK_WEEK_LABEL.administrativo}.
          Clasifícalo como <b>Asistencial</b> si trabaja de {WORK_WEEK_LABEL.asistencial}.
        </Notice>
      )}
      {!withPeriod && (
        <Notice kind="amber" icon="alert">
          Falta ejecutar <code>migracion_v10.sql</code>: los periodos se deducen de la fecha de inicio de
          cada registro en vez de quedar guardados.
        </Notice>
      )}

      {write && <div style={{marginBottom:14}}>
        <button className="btn accent sm" disabled={periods.length===0}
          onClick={()=>{
            // Por defecto, el periodo más antiguo que aún tiene saldo.
            const conSaldo = [...periods].reverse().find(p=>p.causados-cuenta(porPeriodo[p.start]||[])>0.01);
            setEdit(newVacForm(emp.id, (conSaldo||periods[0]).start));
          }}>
          <Icon name="plus"/>Registrar vacaciones
        </button>
      </div>}

      {periods.length===0
        ? <Empty text="Aún no se ha cumplido el primer periodo desde la fecha de ingreso."/>
        : <div className="grid" style={{gap:14}}>
            {periods.map(p=>{
              const lista = porPeriodo[p.start]||[];
              const tomados = cuenta(lista);
              const st = periodStatus(p, tomados, pagados(lista));
              const restantes = diffDays(todayISO(), p.deadline);
              return (
                <div key={p.start} className="card">
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                    <div>
                      <b style={{fontSize:14.5,color:"var(--navy)"}}>Periodo {p.label}</b>
                      <div className="kv" style={{marginTop:6}}>
                        <span>Del <b>{fmt(p.start)}</b> al <b>{fmt(p.end)}</b></span>
                        <span>Causados: <b>{p.causados}</b></span>
                        <span>Tomados: <b>{tomados}</b></span>
                        <span>Saldo: <b>{r1(p.causados-tomados)}</b></span>
                        {pagados(lista)>0 && <span>Pagados en dinero: <b>{pagados(lista)}</b></span>}
                        {st.key==="vencido" && <span>Plazo legal para concederlas: <b>{fmt(p.deadline)}</b>{restantes>=0?` (en ${restantes} días)`:` (hace ${-restantes} días)`}</span>}
                      </div>
                    </div>
                    <span className={"badge "+st.cls}><span className="dot"/>{st.label}</span>
                  </div>
                  <div style={{marginTop:12,borderTop:"1px solid var(--border)",paddingTop:12}}>
                    {lista.length===0
                      ? <p className="muted" style={{fontSize:12.5,margin:0}}>Sin disfrutes registrados en este periodo.</p>
                      : <div className="table-wrap"><table>{CAB}<tbody>{lista.map(filaDisfrute)}</tbody></table></div>}
                  </div>
                </div>
              );
            })}

            {sueltos.length>0 && (
              <div className="card">
                <b style={{fontSize:14.5,color:"var(--navy)"}}>Fuera de periodo</b>
                <p className="muted" style={{fontSize:12.5,margin:"6px 0 10px"}}>
                  Registros cuya fecha no cae dentro de ningún periodo (por ejemplo, anteriores al ingreso).
                  Edítalos o vuelve a registrarlos para imputarlos.
                </p>
                <div className="table-wrap"><table>{CAB}<tbody>{sueltos.map(filaDisfrute)}</tbody></table></div>
              </div>
            )}
          </div>}

      {edit && (
        <VacacionModal initial={edit} emp={emp} cols={{withPeriod, withV11}} profile={profile}
          saldoDe={saldoDe} onClose={()=>setEdit(null)} onSaved={data.reload}/>
      )}
    </div>
  );
}

/* ---------- Incapacidades (por empleado) ---------- */
function TabIncapacidades({employeeId, profile}){
  const write = can(profile,"disabilities");
  const [show,setShow] = useState(false);
  const toast = useToast();
  const data = useAsync(async ()=>{
    const { data, error } = await sb.from("disabilities").select("*").eq("employee_id",employeeId).order("start_date",{ascending:false});
    if(error) throw error; return data;
  }, [employeeId]);

  const empty = ()=>({ type:"enfermedad_general", start_date:todayISO(), end_date:todayISO(), diagnosis:"", entity:"" });
  const [f,setF] = useState(empty());
  const [busy,setBusy] = useState(false);
  const dias = daysBetween(f.start_date,f.end_date);

  const save = async ()=>{
    if(dias<=0){ toast("Rango de fechas inválido.","err"); return; }
    setBusy(true);
    try{
      const p = { employee_id:employeeId, type:f.type, start_date:f.start_date, end_date:f.end_date, days:dias,
        diagnosis:f.diagnosis||null, entity:f.entity||null, created_by:profile.id };
      const { error } = await sb.from("disabilities").insert(p);
      if(error) throw error;
      toast("Incapacidad registrada.","ok"); setShow(false); setF(empty()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const del = async (id)=>{
    if(!confirm("¿Eliminar esta incapacidad?")) return;
    const { error } = await sb.from("disabilities").delete().eq("id",id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Registro eliminado.","ok"); data.reload();
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const totalDias = data.data.reduce((s,d)=>s+d.days,0);

  return (
    <div>
      <div className="card" style={{marginBottom:12,display:"flex",gap:24,flexWrap:"wrap"}}>
        <Info label="Total incapacidades" value={data.data.length}/>
        <Info label="Días acumulados" value={totalDias}/>
      </div>
      {write && <div style={{marginBottom:12}}><button className="btn accent sm" onClick={()=>{setF(empty());setShow(true);}}><Icon name="plus"/>Registrar incapacidad</button></div>}
      {data.data.length===0 ? <Empty text="Sin incapacidades registradas."/> :
        <div className="table-wrap"><table>
          <thead><tr><th>Tipo</th><th>Inicio</th><th>Fin</th><th>Días</th><th>Entidad</th><th></th></tr></thead>
          <tbody>{data.data.map(d=>(
            <tr key={d.id} style={{cursor:"default"}}>
              <td>{DIS_TYPES[d.type]}</td><td>{fmt(d.start_date)}</td><td>{fmt(d.end_date)}</td><td>{d.days}</td><td>{d.entity||"—"}</td>
              <td>{write && <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>del(d.id)}>Eliminar</button>}</td>
            </tr>
          ))}</tbody>
        </table></div>}

      {show && (
        <Modal title="Registrar incapacidad" onClose={()=>setShow(false)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={save}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setShow(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Tipo"><select value={f.type} onChange={e=>setF({...f,type:e.target.value})}>{opts(DIS_TYPES)}</select></Field>
            <Field label="Inicio"><input type="date" value={f.start_date} onChange={e=>setF({...f,start_date:e.target.value})}/></Field>
            <Field label="Fin"><input type="date" value={f.end_date} onChange={e=>setF({...f,end_date:e.target.value})}/></Field>
            <Field label="Entidad (EPS/ARL)"><input value={f.entity} onChange={e=>setF({...f,entity:e.target.value})}/></Field>
          </div>
          <p className="muted" style={{margin:"10px 0"}}>Días: <b style={{color:"var(--navy)"}}>{dias}</b></p>
          <Field label="Diagnóstico / observaciones"><textarea value={f.diagnosis} onChange={e=>setF({...f,diagnosis:e.target.value})}/></Field>
        </Modal>
      )}
    </div>
  );
}

/* Aviso común para las tablas que crea migracion_v11.sql. */
function NeedsV11({what}){
  return (
    <Notice kind="amber" icon="alert">
      {what} necesita las tablas nuevas: ejecuta <code>migracion_v11.sql</code> en Supabase → SQL Editor y vuelve a abrir esta pestaña.
    </Notice>
  );

/* ---------- Historial de cargos ----------
   Una fila por cargo ocupado (desde / hasta), en línea de tiempo del más
   reciente al más antiguo. Al registrar un cargo nuevo SIN fecha de fin
   (el actual), el cargo abierto anterior se cierra el día antes y la ficha
   del colaborador pasa a mostrar el cargo nuevo. */
const POS_REASONS = ["Ingreso","Ascenso","Traslado","Cambio de cargo","Encargo","Reubicación"];

function TabCargos({emp, profile, departments, onChanged}){
  const { reloadCatalogs } = useCatalogs();
  const write = can(profile,"employees","write");
  const showSalary = can(profile,"salary","read");
  const toast = useToast();
  const [f,setF] = useState(null);       // formulario abierto
  const [busy,setBusy] = useState(false);

  const data = useAsync(async ()=>{
    const { data, error } = await sb.from("position_history").select("*")
      .eq("employee_id",emp.id).order("start_date",{ascending:false});
    if(error){ if(isMissingTable(error)) return { missing:true, rows:[] }; throw error; }
    return { missing:false, rows:data||[] };
  }, [emp.id]);

  const depName = (id)=>((departments||[]).find(d=>d.id===id)||{}).name||"";
  const blank = (prev)=>({ id:null, position_title:"", area_name:prev?depName(prev.department_id):depName(emp.department_id),
    start_date:todayISO(), end_date:"", salary:"", reason:"Ascenso", observations:"", syncFicha:true });
  const toForm = (r)=>({ id:r.id, position_title:r.position_title||"", area_name:depName(r.department_id),
    start_date:r.start_date||"", end_date:r.end_date||"", salary:r.salary!=null?r.salary:"",
    reason:r.reason||"", observations:r.observations||"", syncFicha:!r.end_date });

  const save = async ()=>{
    if(!f.position_title.trim()){ toast("Escribe el cargo.","err"); return; }
    if(!f.start_date){ toast("Indica desde cuándo ocupa el cargo.","err"); return; }
    if(f.end_date && f.end_date < f.start_date){ toast("La fecha final no puede ser anterior a la inicial.","err"); return; }
    setBusy(true);
    try{
      const area = await resolveDepartmentId(f.area_name, departments);
      const p = { employee_id:emp.id, position_title:f.position_title.trim(), department_id:area.id,
        start_date:f.start_date, end_date:f.end_date||null, salary:f.salary===""?null:f.salary,
        reason:f.reason||null, observations:f.observations||null };
      const { error } = f.id
        ? await sb.from("position_history").update(p).eq("id",f.id)
        : await sb.from("position_history").insert({...p, created_by:profile.id});
      if(error) throw error;

      if(!f.end_date){
        // Cierra el cargo que seguía abierto antes de este.
        const abiertos = data.data.rows.filter(r=>r.id!==f.id && !r.end_date && r.start_date < f.start_date);
        for(const r of abiertos){
          const { error:e2 } = await sb.from("position_history").update({ end_date:addDaysISO(f.start_date,-1) }).eq("id",r.id);
          if(!e2) toast(`«${r.position_title}» quedó cerrado el ${fmt(addDaysISO(f.start_date,-1))}.`,"info");
        }
        // La ficha muestra siempre el cargo vigente.
        if(f.syncFicha){
          const fp = { position_title:p.position_title };
          if(area.id) fp.department_id = area.id;
          if(p.salary!==null) fp.salary = p.salary;
          const { error:e3 } = await sb.from("employees").update(fp).eq("id",emp.id);
          if(e3) toast("El historial se guardó, pero la ficha no se actualizó: "+friendlyError(e3),"info");
          else onChanged && onChanged();
        }
      }
      if(area.creada){ toast(`Se creó el área «${f.area_name.trim()}».`,"info"); reloadCatalogs(); }
      toast(f.id ? "Cargo actualizado." : "Cargo registrado en el historial.","ok");
      setF(null); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const del = async (r)=>{
    if(!confirm("¿Eliminar «"+r.position_title+"» del historial?")) return;
    const { error } = await sb.from("position_history").delete().eq("id",r.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Registro eliminado.","ok"); data.reload();
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  if(data.data.missing) return <NeedsV11 what="El historial de cargos"/>;
  const rows = data.data.rows;
  const ascensos = rows.filter(r=>/ascenso/i.test(r.reason||"")).length;

  return (
    <div>
      <div className="card" style={{marginBottom:12,display:"flex",gap:24,flexWrap:"wrap",alignItems:"center"}}>
        <Info label="Cargo actual" value={emp.position_title}/>
        <Info label="Cargos ocupados" value={rows.length}/>
        <Info label="Ascensos" value={ascensos}/>
        <Info label="Antigüedad" value={emp.hire_date ? durLabel(emp.hire_date, emp.termination_date) : "—"}/>
        {write && (
          <div style={{marginLeft:"auto"}}>
            <button className="btn accent sm" onClick={()=>setF(blank(rows[0]))}><Icon name="plus"/>Registrar cargo / ascenso</button>
          </div>
        )}
      </div>

      {rows.length===0 ? (
        <div className="empty">
          <div style={{opacity:.45,marginBottom:8,display:"flex",justifyContent:"center"}}><Icon name="trend" size={26}/></div>
          Aún no hay cargos en el historial.
          {write && emp.position_title && (
            <div style={{marginTop:12}}>
              <button className="btn ghost sm" onClick={()=>setF({...blank(), position_title:emp.position_title,
                start_date:emp.hire_date||todayISO(), reason:"Ingreso", salary:emp.salary!=null?emp.salary:""})}>
                <Icon name="plus"/>Empezar con el cargo actual ({emp.position_title})
              </button>
            </div>
          )}
        </div>
      ) : (
        <div className="tl">
          {rows.map(r=>{
            const actual = !r.end_date;
            return (
              <div key={r.id} className={"tl-item"+(actual?" now":"")}>
                <div className="card" style={{padding:"14px 18px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                    <div style={{minWidth:0}}>
                      <b style={{fontSize:14.5,color:"var(--navy)"}}>{r.position_title}</b>
                      {depName(r.department_id) && <span className="muted" style={{fontSize:12.5}}> · {depName(r.department_id)}</span>}
                      <div className="kv" style={{marginTop:6}}>
                        <span>Desde <b>{fmt(r.start_date)}</b> hasta <b>{actual ? "la fecha" : fmt(r.end_date)}</b></span>
                        <span>Tiempo en el cargo: <b>{durLabel(r.start_date, r.end_date)}</b></span>
                        {showSalary && r.salary!=null && <span>Salario: <b>{money(r.salary)}</b></span>}
                      </div>
                      {r.observations && <p className="muted" style={{margin:"8px 0 0",fontSize:12.5}}>{r.observations}</p>}
                    </div>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
                        {r.reason && <span className={"badge "+(/ascenso/i.test(r.reason)?"b-green":"b-sky")}><span className="dot"/>{r.reason}</span>}
                        {actual && <span className="badge b-green"><span className="dot"/>Actual</span>}
                      </div>
                      {write && (
                        <div style={{display:"flex",gap:14}}>
                          <button className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>setF(toForm(r))}>Editar</button>
                          <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>del(r)}>Eliminar</button>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {f && (
        <Modal title={f.id ? "Editar cargo" : "Registrar cargo / ascenso"} onClose={()=>setF(null)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={save}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setF(null)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Cargo"><input value={f.position_title} onChange={e=>setF({...f,position_title:e.target.value})} placeholder="Ej. Auxiliar de enfermería"/></Field>
            <Field label="Área"><AreaInput value={f.area_name} onChange={(v)=>setF({...f,area_name:v})}/></Field>
            <Field label="Motivo">
              <input list="th-pos-reasons" value={f.reason} onChange={e=>setF({...f,reason:e.target.value})}/>
            </Field>
            <Field label="Desde"><input type="date" value={f.start_date} onChange={e=>setF({...f,start_date:e.target.value})}/></Field>
            <Field label="Hasta (vacío = cargo actual)"><input type="date" value={f.end_date} onChange={e=>setF({...f,end_date:e.target.value})}/></Field>
            {showSalary && <Field label="Salario en el cargo"><input type="number" value={f.salary} onChange={e=>setF({...f,salary:e.target.value})}/></Field>}
          </div>
          <datalist id="th-pos-reasons">{POS_REASONS.map(r=><option key={r} value={r}/>)}</datalist>
          {!f.end_date && (
            <label className={"check"+(f.syncFicha?" on":"")} style={{marginTop:12}}>
              <input type="checkbox" checked={f.syncFicha} onChange={e=>setF({...f,syncFicha:e.target.checked})}/>
              Actualizar el cargo{showSalary?", el área y el salario":" y el área"} de la ficha con este cargo
            </label>
          )}
          <div style={{marginTop:12}}>
            <Field label="Observaciones"><textarea value={f.observations} onChange={e=>setF({...f,observations:e.target.value})}/></Field>
          </div>
          {!f.id && !f.end_date && (
            <p className="muted" style={{fontSize:12,marginTop:10}}>
              Si hay un cargo anterior sin fecha final, se cierra automáticamente el día anterior a «Desde».
            </p>
          )}
        </Modal>
      )}
    </div>
  );
}

/* ---------- Dotación ----------
   Tres entregas por año (abril, agosto, diciembre). Cada una se marca como
   entregada con su fecha y lo que se entregó. El derecho depende del
   salario (hasta 2 SMMLV) y de la antigüedad (3 meses). */
function TabDotacion({emp, profile}){
  const write = can(profile,"employees","write");
  const toast = useToast();
  const anioActual = Number(todayISO().slice(0,4));
  const [anio,setAnio] = useState(anioActual);
  const [f,setF] = useState(null);
  const [busy,setBusy] = useState(false);

  const data = useAsync(async ()=>{
    const { data, error } = await sb.from("dotaciones").select("*")
      .eq("employee_id",emp.id).order("year",{ascending:false});
    if(error){ if(isMissingTable(error)) return { missing:true, rows:[] }; throw error; }
    return { missing:false, rows:data||[] };
  }, [emp.id]);

  const save = async ()=>{
    if(!f.delivered_date){ toast("Indica la fecha de entrega.","err"); return; }
    setBusy(true);
    try{
      const p = { employee_id:emp.id, year:f.year, delivery_no:f.delivery_no, delivered_date:f.delivered_date,
        items:f.items||null, observations:f.observations||null };
      const { error } = f.id
        ? await sb.from("dotaciones").update(p).eq("id",f.id)
        : await sb.from("dotaciones").upsert({...p, created_by:profile.id}, { onConflict:"employee_id,year,delivery_no" });
      if(error) throw error;
      toast("Entrega de dotación guardada.","ok"); setF(null); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const del = async (r)=>{
    if(!confirm("¿Quitar el registro de esta entrega?")) return;
    const { error } = await sb.from("dotaciones").delete().eq("id",r.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Registro eliminado.","ok"); data.reload();
  };

  if(data.loading) return <SkeletonRows cols={3} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  if(data.data.missing) return <NeedsV11 what="El control de dotación"/>;
  const rows = data.data.rows;
  const hoy = todayISO();
  const desde = emp.hire_date ? Number(emp.hire_date.slice(0,4)) : anioActual;
  const anios = []; for(let y=anioActual; y>=Math.min(desde,anioActual); y--) anios.push(y);
  const reg = (no)=> rows.find(r=>r.year===anio && r.delivery_no===no);
  const salarioTxt = emp.salary!=null && emp.salary!=="" ? money(emp.salary) : "sin registrar";

  return (
    <div>
      <div className="card" style={{marginBottom:12,display:"flex",gap:24,flexWrap:"wrap",alignItems:"center"}}>
        <Info label="Salario base" value={can(profile,"salary","read") ? salarioTxt : "Reservado"}/>
        <Info label="Tope para dotación" value={money(DOTACION_TOPE)+" (2 SMMLV)"}/>
        <Info label={"Entregadas en "+anio} value={DOTACION_ENTREGAS.filter(x=>reg(x.no) && reg(x.no).delivered_date).length+" de 3"}/>
        <label className="f" style={{marginLeft:"auto",flexDirection:"row",alignItems:"center",gap:10}}>
          <span style={{whiteSpace:"nowrap"}}>Año</span>
          <select style={{minWidth:110}} value={anio} onChange={e=>setAnio(Number(e.target.value))}>
            {anios.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
        </label>
      </div>

      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:12}}>
        {DOTACION_ENTREGAS.map(ent=>{
          const fecha = dotacionFecha(anio, ent);
          const r = reg(ent.no);
          const ap = dotacionAplica(emp, fecha);
          const entregada = r && r.delivered_date;
          const st = entregada ? { cls:"b-green", label:"Entregada" }
                   : !ap.ok   ? { cls:"b-sky",   label:"No aplica" }
                   : fecha < hoy ? { cls:"b-red", label:"Pendiente" }
                   : { cls:"b-amber", label:"Próxima" };
          return (
            <div key={ent.no} className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                <b style={{color:"var(--navy)"}}>{ent.label} {anio}</b>
                <span className={"badge "+st.cls}><span className="dot"/>{st.label}</span>
              </div>
              <div className="kv" style={{marginTop:8,flexDirection:"column",gap:4}}>
                <span>Fecha de entrega: <b>{fmt(fecha)}</b></span>
                {entregada
                  ? <React.Fragment>
                      <span>Entregada el: <b>{fmt(r.delivered_date)}</b></span>
                      {r.items && <span>Elementos: <b>{r.items}</b></span>}
                      {r.observations && <span>{r.observations}</span>}
                    </React.Fragment>
                  : <span>{ap.motivo}</span>}
              </div>
              {write && (
                <div className="rowbtns" style={{marginTop:12}}>
                  <button className="btn ghost sm" onClick={()=>setF(r
                    ? { id:r.id, year:anio, delivery_no:ent.no, label:ent.label, delivered_date:r.delivered_date||todayISO(), items:r.items||"", observations:r.observations||"" }
                    : { id:null, year:anio, delivery_no:ent.no, label:ent.label, delivered_date:todayISO(), items:"", observations:"" })}>
                    <Icon name={entregada?"edit":"check"}/>{entregada ? "Editar" : "Marcar entregada"}
                  </button>
                  {r && <button className="btn ghost sm" style={{color:"var(--red)"}} onClick={()=>del(r)}><Icon name="trash"/>Quitar</button>}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <p className="muted" style={{fontSize:12.5,marginTop:14}}>
        Tienen derecho quienes devengan hasta 2 salarios mínimos ({money(DOTACION_TOPE)}) y llevan al menos 3 meses
        en la empresa en la fecha de cada entrega. Se puede registrar una entrega aunque figure como «No aplica».
      </p>

      {f && (
        <Modal title={"Dotación de "+f.label.toLowerCase()+" "+f.year} onClose={()=>setF(null)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={save}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setF(null)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Fecha de entrega"><input type="date" value={f.delivered_date} onChange={e=>setF({...f,delivered_date:e.target.value})}/></Field>
            <Field label="Elementos entregados"><input value={f.items} onChange={e=>setF({...f,items:e.target.value})} placeholder="Ej. 2 uniformes, 1 par de zapatos"/></Field>
          </div>
          <div style={{marginTop:12}}>
            <Field label="Observaciones"><textarea value={f.observations} onChange={e=>setF({...f,observations:e.target.value})}/></Field>
          </div>
        </Modal>
      )}
    </div>
  );
}
