/* =====================================================================
   PIEZAS GRÁFICAS DEL RESUMEN
   ===================================================================== */
/* Escala del eje Y redondeada a un paso limpio (1/2/5 × 10ⁿ). */
function niceScale(max){
  const bruto = Math.max(1,max)/4, exp = Math.pow(10,Math.floor(Math.log10(bruto)||0));
  const n = bruto/exp, paso = (n<=1?1:n<=2?2:n<=5?5:10)*exp;
  const techo = Math.max(paso, Math.ceil(Math.max(1,max)/paso)*paso);
  const ticks = []; for(let v=0; v<=techo+0.001; v+=paso) ticks.push(Math.round(v*100)/100);
  return { techo, ticks };
}

/* Anillo de proporción de las tarjetas KPI. `light` = sobre fondo de color. */
function Ring({pct, light, title}){
  const gid = "g"+React.useId().replace(/:/g,"");
  const r = 20, c = 2*Math.PI*r, p = Math.max(0, Math.min(1, pct||0));
  return (
    <svg width="56" height="56" viewBox="0 0 56 56" role="img" aria-label={title} style={{flexShrink:0}}>
      <title>{title}</title>
      <defs><linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stopColor="#3B7BF6"/><stop offset="1" stopColor="#17B994"/>
      </linearGradient></defs>
      <circle cx="28" cy="28" r={r} fill="none" strokeWidth="6" stroke={light?"rgba(255,255,255,.28)":"#E9EDF3"}/>
      {p>0 && <circle cx="28" cy="28" r={r} fill="none" strokeWidth="6" strokeLinecap="round"
        stroke={light?"#fff":`url(#${gid})`} strokeDasharray={`${c*p} ${c}`} transform="rotate(-90 28 28)"/>}
      <text x="28" y="32" textAnchor="middle" fontSize="11" fontWeight="700" fill={light?"#fff":"var(--ink)"}>{Math.round(p*100)}%</text>
    </svg>
  );
}

/* Línea con área degradada: una sola serie a lo largo de los meses. */
function LineArea({labels, values, unidad}){
  const gid = "g"+React.useId().replace(/:/g,"");
  const [hover,setHover] = useState(null);
  const { techo, ticks } = niceScale(Math.max(...values));
  const W=560, H=230, ML=36, MR=14, MT=14, MB=30, plotW=W-ML-MR, plotH=H-MT-MB;
  const x = (i)=> ML + (labels.length===1 ? plotW/2 : i*plotW/(labels.length-1));
  const y = (v)=> MT + plotH - (v/techo)*plotH;
  const linea = values.map((v,i)=>`${i?"L":"M"}${x(i)},${y(v)}`).join(" ");
  const area = `${linea} L${x(values.length-1)},${MT+plotH} L${x(0)},${MT+plotH} Z`;
  const banda = plotW/Math.max(1,labels.length-1);
  return (
    <div style={{position:"relative"}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block",overflow:"visible"}} role="img" aria-label="Gráfico de línea">
        <defs>
          <linearGradient id={gid+"a"} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stopColor="#17B994" stopOpacity=".32"/><stop offset="1" stopColor="#17B994" stopOpacity="0"/>
          </linearGradient>
          <linearGradient id={gid+"l"} x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stopColor="#1D4ED8"/><stop offset="1" stopColor="#17B994"/>
          </linearGradient>
        </defs>
        {ticks.map(t=>(
          <g key={t}>
            <line x1={ML} x2={W-MR} y1={y(t)} y2={y(t)} stroke="#EEF1F5" strokeWidth="1"/>
            <text x={ML-8} y={y(t)+4} textAnchor="end" fontSize="10.5" fill="var(--muted)">{t}</text>
          </g>
        ))}
        <path d={area} fill={`url(#${gid}a)`}/>
        <path d={linea} fill="none" stroke={`url(#${gid}l)`} strokeWidth="2.6" strokeLinejoin="round" strokeLinecap="round"/>
        {values.map((v,i)=>(
          <g key={i}>
            <text x={x(i)} y={H-8} textAnchor="middle" fontSize="10.5" fill="var(--muted)">{labels[i]}</text>
            <circle cx={x(i)} cy={y(v)} r={hover===i?5.5:3.6} fill="#fff" stroke={i===values.length-1?"#17B994":"#1D4ED8"} strokeWidth="2.2"/>
            <rect x={x(i)-banda/2} y={MT} width={banda} height={plotH} fill="transparent"
              onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}/>
          </g>
        ))}
      </svg>
      {hover!==null && (
        <div className="viz-tip" style={{left:`${Math.min(86,Math.max(14,(x(hover)/W)*100))}%`}}>
          <b>{labels[hover]}</b> · {values[hover]} {unidad}
        </div>
      )}
    </div>
  );
}

/* Columnas de una serie; la del mes en curso va resaltada. */
function Columns({labels, values, unidad, current}){
  const gid = "g"+React.useId().replace(/:/g,"");
  const [hover,setHover] = useState(null);
  const { techo, ticks } = niceScale(Math.max(...values));
  const W=560, H=230, ML=36, MR=10, MT=14, MB=30, plotW=W-ML-MR, plotH=H-MT-MB;
  const banda = plotW/labels.length, ancho = Math.min(26, banda*.6);
  const y = (v)=> MT + plotH - (v/techo)*plotH;
  return (
    <div style={{position:"relative"}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block",overflow:"visible"}} role="img" aria-label="Gráfico de columnas">
        <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#2F6BF2"/><stop offset="1" stopColor="#19C3A0"/>
        </linearGradient></defs>
        {ticks.map(t=>(
          <g key={t}>
            <line x1={ML} x2={W-MR} y1={y(t)} y2={y(t)} stroke="#EEF1F5" strokeWidth="1"/>
            <text x={ML-8} y={y(t)+4} textAnchor="end" fontSize="10.5" fill="var(--muted)">{t}</text>
          </g>
        ))}
        {values.map((v,i)=>{
          const cx = ML + i*banda + banda/2, alto = v ? Math.max(3,(v/techo)*plotH) : 0;
          return (
            <g key={i}>
              <text x={cx} y={H-8} textAnchor="middle" fontSize="10.5" fill="var(--muted)">{labels[i]}</text>
              {v>0 && <rect x={cx-ancho/2} y={MT+plotH-alto} width={ancho} height={alto} rx="5"
                fill={i===current ? "#0B5563" : `url(#${gid})`} opacity={hover!==null && hover!==i ? .55 : 1}/>}
              <rect x={cx-banda/2} y={MT} width={banda} height={plotH} fill="transparent"
                onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}/>
            </g>
          );
        })}
      </svg>
      {hover!==null && (
        <div className="viz-tip" style={{left:`${Math.min(86,Math.max(14,((ML+hover*banda+banda/2)/W)*100))}%`}}>
          <b>{labels[hover]}</b> · {values[hover]} {unidad}
        </div>
      )}
    </div>
  );
}

function Dashboard({profile, onOpenEmployee}){
  const [kpi,setKpi] = useState(null);   // KPI abierto en la ventana emergente

  const s = useAsync(async ()=>{
    const withType  = await hasEmployeeType();
    const withGroup = await hasStaffGroup();
    const withSena  = await hasSena();
    const empCols = "id,first_name,last_name,document_number,position_title,status,hire_date,termination_date,salary"
      + (withType ? ",employee_type" : "") + (withGroup ? ",staff_group" : "")
      + (withSena ? ","+SENA_COLS.join(",") : "");
    const mesActual = todayISO().slice(0,7);
    const [empleados, contratos, vacaciones, incapacidades, dotaciones, cursos, eventos] = await Promise.all([
      sb.from("employees").select(empCols).order("first_name").limit(1000),
      sb.from("contracts").select("id,employee_id,contract_number,type,start_date,end_date,status,employees(first_name,last_name)")
        .order("end_date",{ascending:true}).limit(1000),
      sb.from("vacations").select("id,employee_id,start_date,end_date,days,status,employees(first_name,last_name)")
        .order("start_date",{ascending:false}).limit(1000),
      // Las que terminan este mes o después: incluye las iniciadas en el mes
      // (KPI) y las que siguen en curso hoy (alertas).
      sb.from("disabilities").select("id,employee_id,type,start_date,end_date,days,entity,employees(first_name,last_name)")
        .gte("end_date", mesActual+"-01").order("start_date",{ascending:false}).limit(500),
      sb.from("dotaciones").select("employee_id,year,delivery_no,delivered_date").eq("year", Number(todayISO().slice(0,4))),
      // Cursos de médicos que vencen en los próximos días (o ya vencieron).
      sb.from("medical_courses").select("id,employee_id,name,expires_date").limit(5000),
      // Un fallo del calendario no debe tumbar el resumen: se omite esa sección.
      fetchEventos(addDaysISO(todayISO(), 366), addDaysISO(todayISO(), -31)).catch(()=>({ missing:true, rows:[] })),
    ]);
    for(const r of [empleados,contratos,vacaciones,incapacidades]) if(r.error) throw r.error;
    // Sin migracion_v11.sql la tabla de dotaciones no existe: se omite esa alerta.
    if(dotaciones.error && !isMissingTable(dotaciones.error)) throw dotaciones.error;
    return { empleados:empleados.data||[], contratos:contratos.data||[],
             vacaciones:vacaciones.data||[], incapacidades:incapacidades.data||[],
             dotaciones: dotaciones.error ? null : (dotaciones.data||[]),
             // Sin migracion_v13.sql la tabla de cursos no existe: se omite esa alerta.
             cursos: cursos.error ? null : (cursos.data||[]),
             eventos, withSena };
  }, []);

  if(s.loading) return <div><h2 className="section-title">Resumen</h2><SkeletonRows cols={4} rows={2}/></div>;
  if(s.error) return (
    <div className="card">
      <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
        <span style={{color:"var(--red)",flexShrink:0}}><Icon name="alert" size={20}/></span>
        <b>{s.error}</b>
      </div>
      <div style={{marginTop:14}}><button className="btn ghost sm" onClick={s.reload}><Icon name="refresh"/>Reintentar</button></div>
    </div>
  );

  const { empleados, contratos, vacaciones, incapacidades, dotaciones, cursos, eventos, withSena } = s.data;
  const hoy = todayISO();
  const nombre = (e)=> e ? `${e.first_name} ${e.last_name}` : "—";
  const nombreRel = (r)=> r.employees ? `${r.employees.first_name} ${r.employees.last_name}` : "—";
  const grupoDe = (e)=> STAFF_LABELS[e.staff_group||"empleado"] || "Empleados";
  const activos   = empleados.filter(e=>e.status==="activo");
  // Los médicos van por prestación de servicios: sin vacaciones, dotación ni periodo de prueba.
  const activosLaborales = activos.filter(e=>e.staff_group!=="medico");
  const vigentes  = contratos.filter(c=>c.status==="vigente");
  const mesActual = hoy.slice(0,7);
  const incapsMes = incapacidades.filter(d=>d.start_date.slice(0,7)===mesActual);

  /* Alertas contractuales */
  const alertContratos = vigentes.filter(c=>c.end_date).map(c=>({...c, restantes:diffDays(hoy,c.end_date)}))
    .filter(c=>c.restantes<=90).sort((a,b)=>a.restantes-b.restantes);

  /* Alertas de vacaciones VENCIDAS: días de periodos ya cumplidos que no se
     han disfrutado ni pagado. Lo tomado se imputa primero a los periodos más
     antiguos, que es como se conceden. */
  const tomadasPorEmp = {};
  vacaciones.forEach(v=>{ if(v.status!=="rechazada") tomadasPorEmp[v.employee_id]=(tomadasPorEmp[v.employee_id]||0)+v.days; });
  const alertVac = activosLaborales.map(e=>{
    const periodos = vacationPeriods(e.hire_date, e.termination_date);
    const cumplidos = periodos.filter(p=>p.cumplido);
    const causadosCumplidos = cumplidos.reduce((s,p)=>s+p.causados,0);
    const vencidos = Math.round(Math.max(0, causadosCumplidos-(tomadasPorEmp[e.id]||0))*10)/10;
    const nPeriodos = Math.ceil(vencidos/DIAS_POR_PERIODO);
    return {e, vencidos, nPeriodos};
  }).filter(x=>x.vencidos>0).sort((a,b)=>b.vencidos-a.vencidos);

  /* Periodo de prueba: personal activo que está en prueba hoy o la cumplió
     en los últimos 7 días. Solo cuenta el PRIMER contrato de cada persona:
     una prórroga o renovación no abre un nuevo periodo de prueba. Quien no
     tiene contratos registrados se calcula con la fecha de ingreso (máximo
     legal de dos meses), salvo aprendices. */
  const primerContrato = {};
  contratos.forEach(c=>{
    const p = primerContrato[c.employee_id];
    if(!p || c.start_date<p.start_date) primerContrato[c.employee_id]=c;
  });
  const alertPrueba = activosLaborales.map(e=>{
    const c = primerContrato[e.id];
    const fin = c ? periodoPruebaFin(c.type, c.start_date, c.end_date)
             : (e.staff_group==="aprendiz" ? null : periodoPruebaFin("termino_indefinido", e.hire_date, null));
    if(!fin) return null;
    const inicio = c ? c.start_date : e.hire_date;
    const restantes = diffDays(hoy, fin);
    if(inicio>hoy || restantes<-7) return null;
    return { e, inicio, fin, restantes, contrato:c };
  }).filter(Boolean).sort((a,b)=>a.restantes-b.restantes);

  /* Aprendices SENA: la etapa actual termina en los próximos 30 días o ya
     terminó (sigue visible hasta que se registre la productiva o el retiro). */
  const alertSena = activos.filter(e=>e.staff_group==="aprendiz").map(e=>{
    const s = senaEtapa(e);
    if(!s) return null;
    const restantes = diffDays(hoy, s.fin);
    return restantes<=30 ? { e, ...s, restantes } : null;
  }).filter(Boolean).sort((a,b)=>a.restantes-b.restantes);

  /* Cursos de médicos activos: vencidos o que vencen en los próximos
     DIAS_AVISO_CURSO días. Solo cuenta el registro más reciente de cada curso. */
  const medicoPorId = {};
  activos.forEach(e=>{ if(e.staff_group==="medico") medicoPorId[e.id]=e; });
  const alertCursos = (cursos ? cursosActuales(cursos) : [])
    .filter(c=>medicoPorId[c.employee_id])
    .map(c=>({ c, e:medicoPorId[c.employee_id], est:estadoCurso(c.expires_date, hoy) }))
    .filter(x=>x.est.key==="vencido" || x.est.key==="porvencer")
    .sort((a,b)=>a.est.restantes-b.est.restantes);

  /* Recordatorios del calendario que ya están dentro de su aviso. */
  const alertEventos = eventos.missing ? [] : avisosPendientes(eventos.rows, hoy);

  /* Incapacidades en curso hoy */
  const alertIncap = incapacidades.filter(d=>d.start_date<=hoy && d.end_date>=hoy)
    .sort((a,b)=>a.end_date<b.end_date?-1:1);

  /* Dotación: entregas del año ya cumplidas o en los próximos 30 días que
     le corresponden a alguien y no se han registrado. */
  const alertDot = [];
  if(dotaciones){
    const anio = Number(hoy.slice(0,4));
    const entregada = {};
    dotaciones.forEach(d=>{ if(d.delivered_date) entregada[d.employee_id+"-"+d.delivery_no]=true; });
    DOTACION_ENTREGAS.forEach(ent=>{
      const fecha = dotacionFecha(anio, ent);
      const r = diffDays(hoy, fecha);
      if(r > 30) return;
      activosLaborales.forEach(e=>{
        if(entregada[e.id+"-"+ent.no] || !dotacionAplica(e, fecha).ok) return;
        alertDot.push({ key:e.id+"-"+ent.no, e, ent, fecha, restantes:r });
      });
    });
    alertDot.sort((a,b)=>a.restantes-b.restantes);
  }

  const proximas = vacaciones.filter(v=>v.end_date>=hoy).sort((a,b)=>a.start_date<b.start_date?-1:1).slice(0,8);

  const bandFor = (r)=> r<0?"a-red": r<=7?"a-red": r<=30?"a-amber":"a-sky";
  const textFor = (r)=> r<0?`Vencido hace ${-r} día(s)`: r===0?"Vence hoy": r===1?"Vence mañana":`Vence en ${r} día(s)`;

  /* ---- Definición de cada KPI: la cifra y la lista salen del MISMO
     conjunto de registros, así que el número y la ventana nunca se
     contradicen. ---- */
  const filaPersona = (e)=>({
    key:e.id, employeeId:e.id, group:e.staff_group,
    cells:[<b>{nombre(e)}</b>, e.document_number, e.position_title||"—", grupoDe(e),
           EMPLOYEE_TYPES[e.employee_type]||"—", fmt(e.hire_date),
           e.termination_date?fmt(e.termination_date):<Badge status={e.status}/>],
  });
  const headPersona = ["Nombre","Cédula","Cargo","Grupo","Clasificación","Ingreso","Estado"];
  const filaContrato = (c)=>({
    key:c.id, employeeId:c.employee_id,
    cells:[<b>{nombreRel(c)}</b>, c.contract_number, CONTRACT_TYPES[c.type]||c.type,
           fmt(c.start_date), fmt(c.end_date),
           c.end_date ? textFor(diffDays(hoy,c.end_date)) : "Sin fecha de fin"],
  });
  const headContrato = ["Empleado","Contrato","Tipo","Inicio","Fin","Situación"];

  const KPIS = [
    { id:"activos", label:"Empleados activos", color:"var(--green)", tone:"green", ico:"users",
      hint:"Todo el personal con estado activo (empleados, médicos y aprendices).",
      headers:headPersona, rows:activos.map(filaPersona) },
    { id:"retirados", label:"Retirados", color:"var(--red)", tone:"red", ico:"logout",
      hint:"Personal con fecha de retiro registrada.",
      headers:headPersona, rows:empleados.filter(e=>e.status==="retirado").map(filaPersona) },
    { id:"cvigentes", label:"Contratos vigentes", color:"var(--navy)", tone:"navy", ico:"contract",
      headers:headContrato, rows:vigentes.map(filaContrato) },
    { id:"cvencer", label:"Contratos por vencer (30d)", color:"var(--amber)", tone:"amber", ico:"clock",
      hint:"Contratos vigentes cuya fecha de terminación cae en los próximos 30 días.",
      headers:headContrato,
      rows:vigentes.filter(c=>c.end_date && diffDays(hoy,c.end_date)>=0 && diffDays(hoy,c.end_date)<=30).map(filaContrato) },
    { id:"cvencidos", label:"Contratos vencidos", color:"var(--red)", tone:"red", ico:"alert",
      hint:"Contratos que siguen marcados como vigentes pero su fecha de terminación ya pasó.",
      headers:headContrato,
      rows:vigentes.filter(c=>c.end_date && diffDays(hoy,c.end_date)<0).map(filaContrato) },
    { id:"vacaciones", label:"Vacaciones vigentes", color:"var(--sky)", tone:"sky", ico:"beach",
      hint:"Periodos de vacaciones en curso o programados (fecha de fin de hoy en adelante).",
      headers:["Empleado","Inicio","Fin","Días hábiles","Estado"],
      rows:vacaciones.filter(v=>v.end_date>=hoy).map(v=>({
        key:v.id, employeeId:v.employee_id,
        cells:[<b>{nombreRel(v)}</b>, fmt(v.start_date), fmt(v.end_date), v.days, <Badge status={v.status}/>],
      })) },
    { id:"incapacidades", label:"Incapacidades del mes", color:"var(--navy)", tone:"teal", ico:"health",
      hint:"Incapacidades y licencias que iniciaron en el mes en curso.",
      headers:["Empleado","Tipo","Inicio","Fin","Días","Entidad"],
      rows:incapsMes.map(d=>({
        key:d.id, employeeId:d.employee_id,
        cells:[<b>{nombreRel(d)}</b>, DIS_TYPES[d.type]||d.type, fmt(d.start_date), fmt(d.end_date), d.days, d.entity||"—"],
      })) },
  ];

  /* Dato secundario y anillo de cada tarjeta principal. El anillo siempre
     mide una proporción sobre el personal o los contratos, nunca una cifra
     suelta, para que el porcentaje tenga lectura. */
  const personasHoy = (filas)=> new Set(filas.map(r=>r.employee_id)).size;
  const vacHoy = vacaciones.filter(v=>v.status!=="rechazada" && v.start_date<=hoy && v.end_date>=hoy);
  const pctDe = (n,total)=> total ? n/total : 0;
  const EXTRA = {
    activos:      { tone:"blue",  subLabel:"Total registrados", subValue:empleados.length,
                    pct:pctDe(activos.length, empleados.length), ring:"Activos sobre el total registrado" },
    cvigentes:    { tone:"white", subLabel:"Por vencer en 30 días", subValue:KPIS.find(k=>k.id==="cvencer").rows.length,
                    pct:pctDe(vigentes.length, contratos.length), ring:"Contratos vigentes sobre el total" },
    vacaciones:   { tone:"teal",  subLabel:"De vacaciones hoy", subValue:personasHoy(vacHoy),
                    pct:pctDe(personasHoy(vacHoy), activos.length), ring:"Personal activo de vacaciones hoy" },
    incapacidades:{ tone:"mint",  subLabel:"Días acumulados en el mes", subValue:incapsMes.reduce((s,d)=>s+(d.days||0),0),
                    pct:pctDe(personasHoy(alertIncap), activos.length), ring:"Personal activo incapacitado hoy" },
  };
  const HERO = KPIS.filter(k=>EXTRA[k.id]);
  const MINI = KPIS.filter(k=>!EXTRA[k.id]);

  return (
    <div>

/* Campos SENA del formulario. `sena_ingreso` solo vive en el formulario:
   dice en qué etapa se vinculó y decide qué fechas se piden. */
const SENA_BLANK = { sena_ingreso:"productiva", sena_lectiva_start:"", sena_productiva_start:"", sena_months:"6" };
const senaToForm = (e)=>({
  sena_ingreso: e.sena_lectiva_start ? "lectiva" : "productiva",
  sena_lectiva_start: e.sena_lectiva_start||"", sena_productiva_start: e.sena_productiva_start||"",
  sena_months: String(e.sena_months||6),
});
/* Lo que se guarda en `employees`. Fuera de aprendices no se envía nada,
   así una base sin migracion_v12.sql no muestra avisos innecesarios. */
const senaPayload = (f, group)=>{
  if(group!=="aprendiz") return {};
  const n = parseInt(f.sena_months,10);
  return {
    sena_lectiva_start:    f.sena_ingreso==="lectiva" ? (f.sena_lectiva_start||null) : null,
    sena_productiva_start: f.sena_productiva_start||null,
    sena_months:           n>0 && n<=36 ? n : 6,
  };
};

function SenaFields({form, setForm}){
  const set = (k)=>(e)=>setForm({...form,[k]:e.target.value});
  const lectiva = form.sena_ingreso==="lectiva";
  const vista = senaEtapa(senaPayload(form,"aprendiz"));
  return (
    <div className="card" style={{gridColumn:"1 / -1",padding:"14px 16px",background:"var(--sky-soft)"}}>
      <div style={{fontWeight:800,fontSize:13,color:"var(--navy)",marginBottom:10}}>Aprendiz SENA · etapas</div>
      <div className="grid form-grid">
        <FieldBox label="¿En qué etapa lo vinculamos?">
          <div className="seg">
            <button type="button" className={lectiva?"on":""}
              onClick={()=>setForm({...form,sena_ingreso:"lectiva",sena_lectiva_start:form.sena_lectiva_start||form.hire_date||todayISO()})}>Lectiva</button>
            <button type="button" className={!lectiva?"on":""}
              onClick={()=>setForm({...form,sena_ingreso:"productiva",sena_productiva_start:form.sena_productiva_start||form.hire_date||todayISO()})}>Productiva</button>
          </div>
        </FieldBox>
        {lectiva && <Field label="Inicio etapa lectiva"><input type="date" value={form.sena_lectiva_start} onChange={set("sena_lectiva_start")}/></Field>}
        <Field label={lectiva ? "Inicio etapa productiva (cuando pase)" : "Inicio etapa productiva"}>
          <input type="date" value={form.sena_productiva_start} onChange={set("sena_productiva_start")}/>
        </Field>
        <Field label="Duración de cada etapa (meses)"><input type="number" min="1" max="36" value={form.sena_months} onChange={set("sena_months")}/></Field>
      </div>
      <p className="muted" style={{fontSize:12,margin:"10px 0 0"}}>
        {vista
          ? <span>Etapa <b>{vista.etapa}</b> del {fmt(vista.inicio)} al <b>{fmt(vista.fin)}</b>. Te avisaremos en el Resumen 30 días antes.</span>
          : "Indica la fecha de inicio de la etapa para activar el aviso."}
        {lectiva && !form.sena_productiva_start && " Cuando pase a productiva, vuelve aquí y pon esa fecha: los meses empiezan a contar desde ella."}
      </p>
    </div>
  );

/* =====================================================================
   EXPORTACIÓN A EXCEL
   ExcelJS se descarga solo la primera vez que alguien exporta, para no
   cargar la página con una librería que casi nunca se usa.
   ===================================================================== */
let __excelJs = null;
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(!__excelJs) __excelJs = new Promise((ok, fail)=>{
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";
    s.onload  = ()=> window.ExcelJS ? ok(window.ExcelJS) : fail(new Error("ExcelJS no se cargó."));
    s.onerror = ()=>{ __excelJs = null; fail(new Error("No se pudo descargar el generador de Excel. Revisa la conexión.")); };
    document.head.appendChild(s);
  });
  return __excelJs;
}

/* Fecha AAAA-MM-DD → Date a medianoche UTC: Excel no tiene zona horaria y
   ExcelJS escribe en UTC, así el día nunca se corre. */
const excelDate = (iso)=> iso ? new Date(Date.UTC(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10))) : null;

async function exportarPersonalExcel({ rows, titulo, depName, filtros, esMedico }){
  const ExcelJS = await loadExcelJS();
  const C = { navy:"FF0B2545", navy3:"FF1E4C7A", sky:"FF2E9FD6", teal:"FF1A9E97", zebra:"FFEFF6FC",
              linea:"FFD3E0EC", tinta:"FF1B2B40", gris:"FF5B6B82", blanco:"FFFFFFFF" };
  const fill = (argb)=>({ type:"pattern", pattern:"solid", fgColor:{ argb } });
  const borde = (argb)=>({ top:{style:"thin",color:{argb}}, left:{style:"thin",color:{argb}},
                           bottom:{style:"thin",color:{argb}}, right:{style:"thin",color:{argb}} });

  const wb = new ExcelJS.Workbook();
  wb.creator = "Talento Humano · Centro Especializado de Urología";
  wb.created = new Date();
  const ws = wb.addWorksheet(titulo.slice(0,31), {
    views:[{ state:"frozen", ySplit:5, showGridLines:false }],
    pageSetup:{ paperSize:9, orientation:"landscape", fitToPage:true, fitToWidth:1, fitToHeight:0,
                margins:{ left:.4, right:.4, top:.6, bottom:.6, header:.3, footer:.3 }, printTitlesRow:"5:5" },
    headerFooter:{ oddFooter:"&L&8Talento Humano · "+titulo+"&R&8Página &P de &N" },
  });

  const COLS = [
    { h:"N.º",              w:6,  al:"center" },
    { h:"Nombre completo",  w:34, al:"left"   },
    { h:"Cédula",           w:16, al:"center" },
    { h:"Cargo",            w:30, al:"left"   },
    { h: esMedico ? "Tipo de médico" : "Área", w:esMedico ? 30 : 24, al:"left" },
    { h:"Ciudad",           w:18, al:"left"   },
    { h:"Fecha de ingreso", w:17, al:"center" },
  ];
  ws.columns = COLS.map(c=>({ width:c.w }));
  const ultimaCol = String.fromCharCode(64+COLS.length);   // "G"

  /* Encabezado institucional: tres franjas de color. */
  const franja = (n, texto, color, font, alto)=>{
    ws.mergeCells(`A${n}:${ultimaCol}${n}`);
    const c = ws.getCell(`A${n}`);
    c.value = texto; c.fill = fill(color); c.font = font;
    c.alignment = { vertical:"middle", horizontal:"left", indent:1 };
    ws.getRow(n).height = alto;
  };
  const ahora = new Date();
  franja(1, "CENTRO ESPECIALIZADO DE UROLOGÍA", C.navy, { name:"Calibri", size:16, bold:true, color:{argb:C.blanco} }, 32);
  franja(2, "Talento Humano  ·  Listado de "+titulo.toLowerCase(), C.sky, { name:"Calibri", size:12, bold:true, color:{argb:C.blanco} }, 22);
  franja(3, `Generado el ${ahora.toLocaleDateString("es-CO")} a las ${ahora.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}`
            + `  ·  ${rows.length} registro(s)` + (filtros ? "  ·  Filtros: "+filtros : ""),
         "FFF4F8FC", { name:"Calibri", size:10, italic:true, color:{argb:C.gris} }, 20);
  ws.getRow(4).height = 6;

  /* Fila de títulos de columna. */
  const head = ws.getRow(5);
  COLS.forEach((c,i)=>{
    const cell = head.getCell(i+1);
    cell.value = c.h;
    cell.fill = fill(C.navy3);
    cell.font = { name:"Calibri", size:11, bold:true, color:{argb:C.blanco} };
    cell.alignment = { vertical:"middle", horizontal:"center", wrapText:true };
    cell.border = { ...borde(C.navy3), bottom:{ style:"medium", color:{argb:C.teal} } };
  });
  head.height = 26;

  /* Datos con filas alternas. */
  rows.forEach((e,i)=>{
    const doc = String(e.document_number||"").trim();
    const r = ws.addRow([
      i+1,
      `${e.first_name||""} ${e.last_name||""}`.trim(),
      /^\d{1,15}$/.test(doc) ? Number(doc) : doc,
      e.position_title || "—",
      esMedico ? (MED_CATEGORIES[e.medical_category] ? MED_CATEGORIES[e.medical_category]+(e.specialty?" · "+e.specialty:"") : "—")
               : depName(e.department_id),
      e.city || "—",
      excelDate(e.hire_date) || "—",
    ]);
    r.height = 20;
    r.eachCell({ includeEmpty:true }, (cell, col)=>{
      const c = COLS[col-1];
      cell.font = { name:"Calibri", size:10.5, color:{argb:C.tinta}, bold: col===2 };
      cell.alignment = { vertical:"middle", horizontal:c.al, indent: c.al==="left" ? 1 : 0 };
      cell.border = borde(C.linea);
      if(i%2===1) cell.fill = fill(C.zebra);
    });
    r.getCell(1).font = { name:"Calibri", size:10, color:{argb:C.gris} };
    r.getCell(3).numFmt = "0";
    r.getCell(7).numFmt = "dd/mm/yyyy";
  });

  /* Total al pie. */
  const fin = ws.addRow([]);
  ws.mergeCells(`A${fin.number}:${ultimaCol}${fin.number}`);
  const tot = ws.getCell(`A${fin.number}`);
  tot.value = `Total de registros: ${rows.length}`;
  tot.font = { name:"Calibri", size:11, bold:true, color:{argb:C.navy} };
  tot.fill = fill("FFE3EEF8");
  tot.alignment = { vertical:"middle", horizontal:"right", indent:1 };
  tot.border = { top:{ style:"medium", color:{argb:C.navy3} } };
  fin.height = 22;

  ws.autoFilter = { from:{ row:5, column:1 }, to:{ row:5, column:COLS.length } };

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${titulo.replace(/\s+/g,"_")}_${todayISO()}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* =====================================================================
   MÉDICOS · general o especialista, y sus cursos con vigencia
   ===================================================================== */
const MED_CATEGORIES = { general:"Médico general", especialista:"Especialista" };
/* Sugerencias para el campo «Curso». Se suman los nombres que ya se han
   usado con otros médicos de la misma clasificación, así la lista crece
   con los cursos que tú vayas creando. */
const CURSOS_SUGERIDOS = {
  general: ["Soporte Vital Básico (BLS)","Soporte Vital Avanzado (ACLS)","Atención integral a víctimas de violencia sexual",
            "Seguridad del paciente","Bioseguridad y control de infecciones","Manejo integral de residuos hospitalarios"],
  especialista: ["Soporte Vital Avanzado (ACLS)","Seguridad del paciente","Protección radiológica",
                 "Bioseguridad y control de infecciones","Manejo del dolor"],
};
const VIGENCIAS = [["12","1 año"],["24","2 años"],["36","3 años"],["60","5 años"],["6","6 meses"],["0","No vence"],["otra","Otra fecha"]];
const DIAS_AVISO_CURSO = 30;
/* Estado de un curso según su fecha de vencimiento. */
function estadoCurso(expires, hoy){
  if(!expires) return { key:"sin", label:"No vence", badge:"b-sky", restantes:null };
  const r = diffDays(hoy, expires);
  if(r<0)                 return { key:"vencido",   label:"Vencido",    badge:"b-red",   restantes:r };
  if(r<=DIAS_AVISO_CURSO) return { key:"porvencer", label:"Por vencer", badge:"b-amber", restantes:r };
  return                         { key:"vigente",   label:"Vigente",    badge:"b-green", restantes:r };
}
/* Curso vigente de cada nombre: si se renovó, solo cuenta el registro con
   el vencimiento más lejano (o el que no vence). */
function cursosActuales(cursos){
  const m = {};
  cursos.forEach(c=>{
    const k = c.employee_id+"|"+c.name.trim().toLowerCase();
    const p = m[k];
    if(!p || (p.expires_date && (!c.expires_date || c.expires_date>p.expires_date))) m[k]=c;
  });
  return Object.values(m);
}

/* Formulario reutilizable de personal: crea (sin id) o edita (con id).
   Sirve igual para Empleados, Médicos y Aprendices: el grupo se elige en el
   propio formulario, así que también permite mover una ficha de pantalla. */
function EmployeeFormModal({initial, profile, onClose, onSaved}){
  const { departments, reloadCatalogs } = useCatalogs();
  const [form,setForm] = useState(initial);
  const [busy,setBusy] = useState(false);
  const toast = useToast();
  const isEdit = !!initial.id;
  const cfg = STAFF_GROUPS[form.staff_group] || STAFF_GROUPS.empleado;
  const esMed = form.staff_group==="medico";   // médicos: sin área ni clasificación
  const set = (k)=>(e)=>setForm({...form,[k]:e.target.value});

  const save = async ()=>{
    if(!form.first_name.trim()||!form.last_name.trim()||!form.document_number.trim()){ toast("Nombre, apellido y cédula son obligatorios.","err"); return; }
    setBusy(true);
    try{
      // El área se escribe: se reutiliza la existente o se crea.
      const area = await resolveDepartmentId(form.area_name, departments);
      const payload = {...form};
      delete payload.area_name; delete payload.id;
      ["sena_ingreso", ...SENA_COLS, ...MED_COLS].forEach(k=>{ delete payload[k]; });
      Object.assign(payload, senaPayload(form, form.staff_group), medPayload(form, form.staff_group));
      payload.department_id = area.id;
      ["birth_date","termination_date","salary","employee_type","id_card_date"].forEach(k=>{ if(payload[k]==="") payload[k]=null; });
      if(!payload.id_card_delivered) payload.id_card_date = null;
      payload.status = payload.termination_date ? "retirado" : "activo";
      if(!isEdit) payload.created_by = profile.id;
      const { dropped } = await saveEmployee(payload, isEdit ? initial.id : null);
      toast(isEdit ? `Ficha de ${cfg.singular} actualizada.` : `Registro de ${cfg.singular} creado correctamente.`, "ok");
      dropped.forEach(c=>{ if(MIGRATION_HINT[c]) toast(MIGRATION_HINT[c],"info"); });
      if(area.creada){ toast(`Se creó el área «${form.area_name.trim()}».`,"info"); reloadCatalogs(); }
      onSaved && onSaved(); onClose();
    }catch(e){ toast(friendlyError(e),"err"); }
    finally{ setBusy(false); }
  };

  return (
    <Modal title={isEdit?`Editar ${cfg.singular}`:`Nuevo ${cfg.singular}`} onClose={onClose} wide footer={<React.Fragment>
        <button className="btn accent" disabled={busy} onClick={save}>{busy?<span className="spinner"/>:<Icon name="check"/>}{isEdit?"Guardar cambios":"Registrar"}</button>
        <button className="btn ghost" onClick={onClose}>Cancelar</button>
      </React.Fragment>}>
      <div className="grid form-grid">
        <Field label="Nombres"><input value={form.first_name} onChange={set("first_name")}/></Field>
        <Field label="Apellidos"><input value={form.last_name} onChange={set("last_name")}/></Field>
        <Field label="Tipo doc."><select value={form.document_type} onChange={set("document_type")}>{["CC","CE","TI","PA","PEP"].map(t=><option key={t}>{t}</option>)}</select></Field>
        <Field label="Número de documento"><input value={form.document_number} onChange={set("document_number")}/></Field>
        <Field label="Fecha de nacimiento"><input type="date" value={form.birth_date} onChange={set("birth_date")}/></Field>
        <Field label="Género"><select value={form.gender} onChange={set("gender")}><option value="">—</option><option>Femenino</option><option>Masculino</option><option>Otro</option></select></Field>
        <Field label="Correo"><input type="email" value={form.email} onChange={set("email")}/></Field>
        <Field label="Teléfono"><input value={form.phone} onChange={set("phone")}/></Field>
        <Field label="Dirección"><input value={form.address} onChange={set("address")}/></Field>
        <Field label="Ciudad"><input value={form.city} onChange={set("city")}/></Field>
        {!esMed && <Field label="Área"><AreaInput value={form.area_name} onChange={(v)=>setForm({...form,area_name:v})}/></Field>}
        <Field label="Cargo"><input value={form.position_title} onChange={set("position_title")}/></Field>
        <Field label="Grupo"><select value={form.staff_group} onChange={set("staff_group")}>{opts(STAFF_LABELS)}</select></Field>
        {esMed && <MedicoFields form={form} setForm={setForm}/>}
        {!esMed && <FieldBox label="Clasificación">
          <SegClasificacion value={form.employee_type} onChange={(v)=>setForm({...form,employee_type:v})}/>
        </FieldBox>}
        <Field label="Fecha de ingreso"><input type="date" value={form.hire_date} onChange={set("hire_date")}/></Field>
        <Field label="Fecha de retiro (opcional)"><input type="date" value={form.termination_date} onChange={set("termination_date")}/></Field>
        <Field label="Salario base"><input type="number" value={form.salary} onChange={set("salary")}/></Field>
        <Field label="Banco"><input value={form.bank_name} onChange={set("bank_name")}/></Field>
        <Field label="Cuenta bancaria"><input value={form.bank_account} onChange={set("bank_account")}/></Field>
        <Field label="Contacto de emergencia"><input value={form.emergency_contact} onChange={set("emergency_contact")}/></Field>
        <Field label="Tel. emergencia"><input value={form.emergency_phone} onChange={set("emergency_phone")}/></Field>
        <FieldBox label="Carné">
          <label className={"check"+(form.id_card_delivered?" on":"")}>
            <input type="checkbox" checked={!!form.id_card_delivered}
              onChange={e=>setForm({...form,id_card_delivered:e.target.checked,
                id_card_date: e.target.checked ? (form.id_card_date||todayISO()) : ""})}/>
            {form.id_card_delivered ? "Carné entregado" : "Carné no entregado"}
          </label>
        </FieldBox>
        {form.id_card_delivered && <Field label="Fecha de entrega del carné"><input type="date" value={form.id_card_date} onChange={set("id_card_date")}/></Field>}
        {form.staff_group==="aprendiz" && <SenaFields form={form} setForm={setForm}/>}
      </div>
      <Field label="Notas"><textarea value={form.notes} onChange={set("notes")}/></Field>
      {!esMed && <p className="muted" style={{fontSize:12,marginTop:10}}>
        La clasificación decide cómo se cuentan las vacaciones: administrativo de {WORK_WEEK_LABEL.administrativo},
        asistencial de {WORK_WEEK_LABEL.asistencial}.
      </p>}
    </Modal>
  );
}

/* =====================================================================
   PERSONAL (lista) · una sola pantalla para los tres grupos
   `group` es 'empleado' | 'medico' | 'aprendiz'. Cambia el rótulo y el
   filtro; el resto —búsqueda, alta rápida, ficha completa— es idéntico.
   ===================================================================== */
function Staff({group, profile, onOpenEmployee}){
  const cfg = STAFF_GROUPS[group] || STAFF_GROUPS.empleado;
  const { departments, reloadCatalogs } = useCatalogs();
  const write = can(profile, "employees", "write");
  const toast = useToast();
  const [q,setQ] = useState("");
  const [dep,setDep] = useState("");
  const [ciudad,setCiudad] = useState("");   // clave normalizada (ver cityKey)
  const [showForm,setShowForm] = useState(false);
  const tmr = useRef(null);
  const [term,setTerm] = useState("");

  const esAprendiz = group==="aprendiz";
  const esMedico = group==="medico";
  const [tipoMed,setTipoMed] = useState("");   // filtro de médicos: general | especialista
  const [exportando,setExportando] = useState(false);
  const blank = { nombre:"", document_number:"", cargo:"", ciudad:"", area_name:"", employee_type:"",
    hire_date:todayISO(), termination_date:"", end_date:"",
    // Los médicos siempre se vinculan por prestación de servicios.
    contract_type: esAprendiz ? "aprendizaje" : esMedico ? "prestacion_servicios" : "termino_fijo",
    ...SENA_BLANK, sena_productiva_start: esAprendiz ? todayISO() : "",
    medical_category:"", specialty:"" };
  const [form,setForm] = useState(blank);
  const [busy,setBusy] = useState(false);

  useEffect(()=>{ if(tmr.current)clearTimeout(tmr.current); tmr.current=setTimeout(()=>setTerm(q.trim().replace(/[,()*%]/g," ")),300); },[q]);

  const data = useAsync(async ()=>{
    // Las columnas nuevas solo se piden si la base ya las tiene: pedirlas sin
    // migrar haría fallar toda la consulta con 42703.
    const withType  = await hasEmployeeType();
    const withGroup = await hasStaffGroup();
    const withMed   = group==="medico" && await hasMedCat();
    const cols = "id,first_name,last_name,document_number,position_title,city,department_id,status,hire_date,termination_date"
      + (withType ? ",employee_type" : "") + (withGroup ? ",staff_group" : "")
      + (withMed ? ","+MED_COLS.join(",") : "");
    let query = sb.from("employees").select(cols).order("first_name",{ascending:true}).limit(500);
    if(withGroup) query = query.eq("staff_group", group);
    if(term) query = query.or(`first_name.ilike.%${term}%,last_name.ilike.%${term}%,document_number.ilike.%${term}%`);
    if(dep) query = query.eq("department_id", dep);
    const { data, error } = await query;
    if(error) throw error;
    return { rows:data||[], withGroup };
  }, [term, dep, group]);

  const depName = (id)=> (departments.find(d=>d.id===id)||{}).name || "—";
  /* La ciudad se filtra en el navegador: es texto libre y así las opciones
     salen de lo que ya trae la búsqueda (nombre/área). */
  const rowsAll = data.data ? data.data.rows : [];
  const ciudades = cityOptions(rowsAll, ciudad);
  const rows = rowsAll.filter(e=> (!ciudad || cityKey(e.city)===ciudad)
                               && (!tipoMed || e.medical_category===tipoMed));
  const hayFiltros = q || dep || ciudad || tipoMed;

  /* Exporta exactamente la lista que se ve (con los filtros aplicados). */
  const exportar = async ()=>{
    if(!rows.length){ toast("No hay registros para exportar.","info"); return; }
    setExportando(true);
    try{
      const filtros = [
        q && `Búsqueda: «${q}»`, dep && `Área: ${depName(dep)}`,
        ciudad && `Ciudad: ${(ciudades.find(c=>c.key===ciudad)||{}).label||ciudad}`,
        tipoMed && `Tipo: ${MED_CATEGORIES[tipoMed]}`,
      ].filter(Boolean).join(" · ");
      await exportarPersonalExcel({ rows, titulo:cfg.label, depName, filtros, esMedico });
      toast("Archivo de Excel generado.","ok");
    }catch(e){ toast("No se pudo generar el Excel: "+friendlyError(e),"err"); }
    finally{ setExportando(false); }
  };

  const registrarIngreso = async ()=>{
    if(!form.nombre.trim()||!form.document_number.trim()){ toast("Nombre y cédula son obligatorios.","err"); return; }
    setBusy(true);
    try{
      const p = form.nombre.trim().split(/\s+/); const mid = Math.ceil(p.length/2);
      const first_name = p.slice(0,mid).join(" ");
      const last_name  = p.slice(mid).join(" ") || first_name;
      const area = await resolveDepartmentId(form.area_name, departments);
      const empPayload = {
        first_name, last_name, document_number:form.document_number.trim(),
        position_title:form.cargo||null, city:form.ciudad||null,
        department_id:area.id,
        employee_type:form.employee_type||null,
        staff_group:group,
        hire_date:form.hire_date, termination_date:form.termination_date||null,
        status: form.termination_date ? "retirado" : "activo", created_by:profile.id,
        ...senaPayload(form, group), ...medPayload(form, group)
      };
      const { data:emp, dropped } = await saveEmployee(empPayload, null);
      dropped.forEach(c=>{ if(MIGRATION_HINT[c]) toast(MIGRATION_HINT[c],"info"); });
      if(area.creada){ toast(`Se creó el área «${form.area_name.trim()}».`,"info"); reloadCatalogs(); }
      // Contrato inicial (el tipo/fecha fin viven en la tabla contracts)
      if(form.contract_type && emp){
        const cPayload = {
          employee_id:emp.id, contract_number:"CT-"+form.document_number.trim()+"-1",
          type:form.contract_type, start_date:form.hire_date,
          end_date: form.contract_type==="termino_fijo" || esMedico ? (form.end_date||null) : null,
          position_title:form.cargo||null, department_id:area.id, status:"vigente", created_by:profile.id
        };
        const { error:cErr } = await sb.from("contracts").insert(cPayload);
        if(cErr) toast("Registro creado. El contrato inicial no se guardó: "+friendlyError(cErr),"info");
      }
      toast("Ingreso registrado correctamente.","ok");
      setForm(blank); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); }
    finally{ setBusy(false); }
  };

  return (
    <div>
      <div className="page-head">
        <h2 className="section-title" style={{margin:0}}>{cfg.label}</h2>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn excel" onClick={exportar} disabled={exportando||data.loading}
            title="Descarga la lista visible (con los filtros aplicados) en Excel">
            {exportando ? <span className="spinner dark"/> : <Icon name="download"/>}Exportar a Excel
          </button>
          {write && <button className="btn ghost" onClick={()=>setShowForm(true)}><Icon name="plus"/>Ficha completa (área, salario, banco…)</button>}
        </div>
      </div>

      {!write && (
        <Notice icon="lock">
          Modo consulta: {whyNot(profile,"employees","write").toLowerCase()} Puedes buscar y abrir expedientes,
          pero no crear ni modificar registros.
        </Notice>
      )}

      {!data.loading && !data.error && !data.data.withGroup && (
        <Notice kind="amber" icon="alert">
          Falta la columna <code>staff_group</code>: por eso Empleados, Médicos y Aprendices muestran
          la misma lista. Ejecuta <code>migracion_v10.sql</code> en Supabase para separarlas.
        </Notice>
      )}

      {write && (
        <div className="card" style={{marginBottom:22}}>
          <h3 className="section-title" style={{marginBottom:14,fontSize:14}}>Nuevo ingreso · {cfg.label}</h3>
          <div className="grid form-grid">
            <Field label="Nombre completo"><input value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} placeholder="Nombres y apellidos"/></Field>
            <Field label="Cédula"><input value={form.document_number} onChange={e=>setForm({...form,document_number:e.target.value})} placeholder="Número de cédula"/></Field>
            <Field label="Cargo"><input value={form.cargo} onChange={e=>setForm({...form,cargo:e.target.value})} placeholder="Cargo o puesto"/></Field>
            {/* Médicos: sin área, sin clasificación y contrato fijo de prestación de servicios. */}
            {!esMedico && <Field label="Área"><AreaInput value={form.area_name} onChange={(v)=>setForm({...form,area_name:v})}/></Field>}
            <Field label="Ciudad"><input value={form.ciudad} onChange={e=>setForm({...form,ciudad:e.target.value})} placeholder="Ciudad donde labora"/></Field>
            {!esMedico && <FieldBox label="Clasificación">
              <SegClasificacion value={form.employee_type} onChange={(v)=>setForm({...form,employee_type:v})}/>
            </FieldBox>}
            <Field label="Fecha de ingreso"><input type="date" value={form.hire_date} onChange={e=>setForm({...form,hire_date:e.target.value})}/></Field>
            <Field label="Fecha de retiro (opcional)"><input type="date" value={form.termination_date} onChange={e=>setForm({...form,termination_date:e.target.value})}/></Field>
            {esMedico
              ? <Field label="Tipo de contrato"><input value={CONTRACT_TYPES.prestacion_servicios} readOnly disabled/></Field>
              : <Field label="Tipo de contrato"><select value={form.contract_type} onChange={e=>setForm({...form,contract_type:e.target.value})}>{opts(CONTRACT_TYPES)}</select></Field>}
            {(form.contract_type==="termino_fijo" || esMedico) &&
              <Field label={esMedico ? "Fecha fin del contrato (opcional)" : "Fecha fin del contrato"}><input type="date" value={form.end_date} onChange={e=>setForm({...form,end_date:e.target.value})}/></Field>}
            {esAprendiz && <SenaFields form={form} setForm={setForm}/>}
            {esMedico && <MedicoFields form={form} setForm={setForm}/>}
          </div>
          <div style={{marginTop:16}}>
            <button className="btn accent" disabled={busy} onClick={registrarIngreso}>
              {busy ? <span className="spinner"/> : <Icon name="check"/>}Registrar ingreso
            </button>
          </div>
          <p className="muted" style={{fontSize:12,marginTop:10}}>El nombre se separa en nombres y apellidos automáticamente; puedes ajustarlo luego en el expediente. Se crea también un contrato inicial.</p>
        </div>
      )}

      <div className="card filters">
        <Field label="Buscar"><input placeholder="Nombre o cédula…" value={q} onChange={e=>setQ(e.target.value)}/></Field>
        {!esMedico && <Field label="Área">
          <select value={dep} onChange={e=>setDep(e.target.value)}>
            <option value="">Todas las áreas</option>
            {departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        </Field>}
        <Field label="Ciudad">
          <select value={ciudad} onChange={e=>setCiudad(e.target.value)}>
            <option value="">Todas las ciudades</option>
            {ciudades.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}
          </select>
        </Field>
        {esMedico && (
          <Field label="Tipo de médico">
            <select value={tipoMed} onChange={e=>setTipoMed(e.target.value)}>
              <option value="">Todos</option>
              {Object.entries(MED_CATEGORIES).map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
          </Field>
        )}
        {hayFiltros && <button className="btn ghost" onClick={()=>{ setQ(""); setDep(""); setCiudad(""); setTipoMed(""); }}><Icon name="refresh"/>Limpiar</button>}
      </div>
      {!data.loading && !data.error && (
        <div className="chips"><span className="chip"><b>{rows.length}</b> {rows.length===1?"registro":"registros"}</span></div>
      )}

      {data.loading ? <SkeletonRows cols={7} rows={5}/> :
       data.error ? <ErrorCard error={data.error} onRetry={data.reload}/> :
       rows.length===0 ? <Empty text={`No hay registros de ${cfg.label.toLowerCase()} que coincidan con los filtros.`}/> :
       <div className="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Cédula</th><th>Cargo</th>{esMedico ? <th>Tipo de médico</th> : <React.Fragment><th>Clasificación</th><th>Área</th></React.Fragment>}<th>Ciudad</th><th>Ingreso</th><th>Estado</th></tr></thead>
          <tbody>
            {rows.map(e=>(
              <tr key={e.id} onClick={()=>onOpenEmployee(e.id)}>
                <td><b>{e.first_name} {e.last_name}</b></td>
                <td>{e.document_number}</td>
                <td>{e.position_title||"—"}</td>
                {esMedico && <td>{e.medical_category
                  ? <span className={"badge "+(e.medical_category==="especialista"?"b-amber":"b-sky")}><span className="dot"/>
                      {MED_CATEGORIES[e.medical_category]}{e.specialty ? " · "+e.specialty : ""}</span>
                  : "—"}</td>}
                {!esMedico && <td>{EMPLOYEE_TYPES[e.employee_type] ? <TipoBadge value={e.employee_type}/> : "—"}</td>}
                {!esMedico && <td>{depName(e.department_id)}</td>}
                <td>{e.city||"—"}</td>
                <td>{fmt(e.hire_date)}</td>
                <td><Badge status={e.status}/></td>
              </tr>
            ))}
          </tbody>
        </table>
       </div>}

      {showForm && (
        <EmployeeFormModal initial={emptyEmp(group)} profile={profile}
          onClose={()=>setShowForm(false)} onSaved={()=>data.reload()}/>
      )}
    </div>
  );
}

/* Retiro con FECHA EDITABLE: antes se forzaba la fecha de hoy y no había
   forma de corregirla desde el expediente. */
function RetiroModal({emp, onClose, onSaved}){
  const toast = useToast();
  const [fecha,setFecha] = useState(emp.termination_date || todayISO());
  const [busy,setBusy] = useState(false);
  const guardar = async ()=>{
    if(!fecha){ toast("Indica la fecha de retiro.","err"); return; }
    if(emp.hire_date && fecha < emp.hire_date){ toast("El retiro no puede ser anterior a la fecha de ingreso.","err"); return; }
    setBusy(true);
    try{
      const { error } = await sb.from("employees").update({ termination_date:fecha, status:"retirado" }).eq("id",emp.id);
      if(error) throw error;
      toast("Fecha de retiro guardada.","ok"); onSaved(); onClose();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  return (
    <Modal title={emp.termination_date?"Editar fecha de retiro":"Marcar retiro"} onClose={onClose} footer={<React.Fragment>
        <button className="btn accent" disabled={busy} onClick={guardar}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
        <button className="btn ghost" onClick={onClose}>Cancelar</button>
      </React.Fragment>}>
      <p className="muted" style={{margin:"0 0 14px",fontSize:13}}>
        {emp.first_name} {emp.last_name} · ingreso {fmt(emp.hire_date)}
      </p>
      <Field label="Fecha de retiro"><input type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/></Field>
      <p className="muted" style={{fontSize:12,marginTop:10}}>
        La ficha queda con estado «Retirado». Para revertirlo usa «Reactivar», que borra la fecha.
      </p>
    </Modal>
  );
}

function EmployeeProfile({employeeId, profile, departments, ssEntities, onBack, group}){
  const [tab,setTab] = useState("personal");
  const [showEdit,setShowEdit] = useState(false);
  const [showRetiro,setShowRetiro] = useState(false);
  const [clasificando,setClasificando] = useState(false);
  const toast = useToast();
  const write = can(profile,"employees","write");
  // employees_delete en RLS exige is_admin(): antes el botón se mostraba a
  // talento_humano y el servidor siempre lo rechazaba.
  const canDelete = can(profile,"employees","delete");
  const showSalary = can(profile,"salary","read");   // jefe_area no ve salarios

  const emp = useAsync(async ()=>{
    const { data, error } = await sb.from("employees").select("*").eq("id",employeeId).single();
    if(error) throw error; return data;
  }, [employeeId]);

  if(emp.loading) return <div><button className="btn ghost sm" onClick={onBack}><Icon name="back"/>Volver</button><div style={{marginTop:16}}><SkeletonRows cols={3} rows={3}/></div></div>;
  if(emp.error) return (
    <div>
      <button className="btn ghost sm" onClick={onBack} style={{marginBottom:14}}><Icon name="back"/>Volver</button>
      <ErrorCard error={emp.error} onRetry={emp.reload}/>
    </div>
  );
  const e = emp.data;
  const depName = (id)=>(departments.find(d=>d.id===id)||{}).name||"—";

  const reactivar = async ()=>{
    const { error } = await sb.from("employees").update({termination_date:null, status:"activo"}).eq("id",e.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Empleado reactivado.","ok"); emp.reload();
  };
  const eliminar = async ()=>{
    if(!confirm("¿Eliminar definitivamente a "+e.first_name+" "+e.last_name+"? También se borran sus contratos, vacaciones, incapacidades y documentos.")) return;
    const { error } = await sb.from("employees").delete().eq("id",e.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Empleado eliminado.","ok"); onBack();
  };
  /* Clasificar sin abrir la ficha completa: un toque desde el encabezado.
     Se intenta guardar SIEMPRE; solo si el servidor dice que la columna no
     existe se avisa de la migración (antes bastaba un error de red para que
     la clasificación se descartara en silencio). */
  const clasificar = async (v)=>{
    if(clasificando) return;
    setClasificando(true);
    try{
      const { dropped } = await saveEmployee({ employee_type: v || null }, e.id);
      if(dropped.includes("employee_type")){ toast(MIGRATION_HINT.employee_type,"err"); return; }
      toast(v ? "Clasificado como "+EMPLOYEE_TYPES[v]+"." : "Clasificación retirada.","ok");
      emp.reload();
    }catch(err){ toast(friendlyError(err),"err"); }
    finally{ setClasificando(false); }
  };

  // Los médicos no llevan seguridad social en el sistema (contratan por
  // prestación de servicios y cotizan como independientes).
  const cfg = STAFF_GROUPS[e.staff_group || group || "empleado"] || STAFF_GROUPS.empleado;
  // Los médicos (prestación de servicios) solo llevan datos, cursos y contratos.
  const esMed = e.staff_group==="medico";
  const TABS = esMed ? [
    {id:"personal",label:"Personal"},
    {id:"laboral",label:"Laboral"},
    {id:"cursos",label:"Cursos"},
    {id:"contratos",label:"Contratos"},
  ] : [
    {id:"personal",label:"Personal"},
    {id:"laboral",label:"Laboral"},
    {id:"cargos",label:"Historial de cargos"},
    {id:"contratos",label:"Contratos"},
    ...(cfg.ss ? [{id:"seguridad",label:"Seguridad social"}] : []),
    {id:"vacaciones",label:"Vacaciones"},
    {id:"incapacidades",label:"Incapacidades"},
    {id:"dotacion",label:"Dotación"},
    {id:"documentos",label:"Documentos"},
  ];
  const onEdit = write ? ()=>setShowEdit(true) : null;

  return (
    <div>
      <button className="btn ghost sm" onClick={onBack}><Icon name="back"/>Volver a {cfg.label.toLowerCase()}</button>
      <div className="card" style={{margin:"14px 0 18px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:14,flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:14,alignItems:"flex-start",minWidth:0}}>
          <div className="avatar" style={{width:48,height:48,borderRadius:16,fontSize:16}}>
            {[e.first_name,e.last_name].filter(Boolean).map(s=>s[0]).join("").toUpperCase() || "?"}
          </div>
          <div style={{minWidth:0}}>
          <h2 style={{fontSize:20}}>{e.first_name} {e.last_name}</h2>
          <div className="kv" style={{marginTop:8}}>
            <span>{e.document_type} <b>{e.document_number}</b></span>
            <span>Cargo: <b>{e.position_title||"—"}</b></span>
            {!esMed && <span>Área: <b>{depName(e.department_id)}</b></span>}
            <span>Ingreso: <b>{fmt(e.hire_date)}</b></span>
            {e.staff_group==="medico" && e.medical_category &&
              <span>Tipo: <b>{MED_CATEGORIES[e.medical_category]}{e.specialty ? " · "+e.specialty : ""}</b></span>}
            {e.termination_date && <span>Retiro: <b>{fmt(e.termination_date)}</b></span>}
            {"id_card_delivered" in e && <span>Carné: <b style={{color:e.id_card_delivered?"var(--green)":"var(--red)"}}>
              {e.id_card_delivered ? "Entregado"+(e.id_card_date?" el "+fmt(e.id_card_date):"") : "No entregado"}</b></span>}
          </div>
          {write && !esMed && (
            <div style={{marginTop:14,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
              <span className="muted" style={{fontSize:11.5,fontWeight:700,letterSpacing:".02em"}}>Clasificación:</span>
              <div style={{width:"auto",minWidth:250,maxWidth:320,flex:"0 1 auto"}}>
                <SegClasificacion value={e.employee_type||""} onChange={clasificar} disabled={clasificando}/>
              </div>
            </div>
          )}
          {write && (
            <div className="rowbtns" style={{marginTop:14}}>
              <button className="btn ghost sm" onClick={()=>setShowEdit(true)}><Icon name="edit"/>Editar</button>
              <button className="btn ghost sm" onClick={()=>setShowRetiro(true)}>
                <Icon name={e.termination_date?"calendar":"logout"}/>{e.termination_date?"Editar fecha de retiro":"Marcar retiro"}
              </button>
              {e.status!=="activo" && <button className="btn ghost sm" onClick={reactivar}><Icon name="refresh"/>Reactivar</button>}
              {canDelete
                ? <button className="btn danger sm" onClick={eliminar}><Icon name="trash"/>Eliminar</button>
                : <button className="btn danger sm" disabled title={whyNot(profile,"employees","delete")+" Solo un administrador puede eliminar."}>
                    <Icon name="lock"/>Eliminar
                  </button>}
            </div>
          )}
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <TipoBadge value={esMed ? "asistencial" : e.employee_type}/>
          <Badge status={e.status}/>
        </div>
      </div>

      <div className="tabs">
        {TABS.map(t=><button key={t.id} className={tab===t.id?"active":""} onClick={()=>setTab(t.id)}>{t.label}</button>)}
      </div>

      {tab==="personal" && <TabPersonal e={e} showSalary={showSalary} onEdit={onEdit}/>}
      {tab==="laboral" && <TabLaboral e={e} depName={depName} showSalary={showSalary} onEdit={onEdit}/>}
      {tab==="cursos" && <TabCursos emp={e} profile={profile}/>}
      {tab==="cargos" && <TabCargos emp={e} profile={profile} departments={departments} onChanged={emp.reload}/>}
      {tab==="dotacion" && <TabDotacion emp={e} profile={profile}/>}
      {tab==="contratos" && <TabContratos employeeId={e.id} profile={profile} departments={departments}/>}
      {tab==="seguridad" && <TabSeguridad employeeId={e.id} profile={profile} ssEntities={ssEntities}/>}
      {tab==="vacaciones" && <TabVacaciones emp={e} profile={profile}/>}
      {tab==="incapacidades" && <TabIncapacidades employeeId={e.id} profile={profile}/>}
      {tab==="documentos" && <TabDocumentos employeeId={e.id} profile={profile}/>}

      {showEdit && (
        <EmployeeFormModal initial={empToForm(e, departments)} profile={profile}
          onClose={()=>setShowEdit(false)} onSaved={()=>emp.reload()}/>
      )}
      {showRetiro && (
        <RetiroModal emp={e} onClose={()=>setShowRetiro(false)} onSaved={()=>emp.reload()}/>
      )}
    </div>
  );
}

/* Crear / editar / renovar un curso. La vigencia calcula el vencimiento
   desde la fecha de realización; «Otra fecha» deja escribirlo a mano. */
function CursoModal({initial, emp, sugerencias, profile, onClose, onSaved}){
  const toast = useToast();
  const isEdit = !!initial.id;
  const [f,setF] = useState({
    name:initial.name||"", institution:initial.institution||"", issued_date:initial.issued_date||todayISO(),
    vigencia: isEdit ? (initial.expires_date ? "otra" : "0") : "12",
    expires_date:initial.expires_date||"", observations:initial.observations||"",
  });
  const [busy,setBusy] = useState(false);
  const set = (k)=>(e)=>setF({...f,[k]:e.target.value});
  const meses = Number(f.vigencia);
  const vence = f.vigencia==="otra" ? f.expires_date
              : meses>0 && f.issued_date ? addMonthsISO(f.issued_date, meses) : "";
  const est = estadoCurso(vence||null, todayISO());

  const guardar = async ()=>{
    if(!f.name.trim()){ toast("Escribe el nombre del curso.","err"); return; }
    if(f.vigencia==="otra" && !f.expires_date){ toast("Indica la fecha de vencimiento.","err"); return; }
    if(vence && f.issued_date && vence<f.issued_date){ toast("El vencimiento no puede ser anterior a la fecha de realización.","err"); return; }
    setBusy(true);
    try{
      const p = { employee_id:emp.id, name:f.name.trim(), institution:f.institution.trim()||null,
        issued_date:f.issued_date||null, expires_date:vence||null, observations:f.observations.trim()||null };
      const r = isEdit ? await sb.from("medical_courses").update(p).eq("id",initial.id)
                       : await sb.from("medical_courses").insert({...p, created_by:profile.id});
      if(r.error) throw r.error;
      toast(isEdit ? "Curso actualizado." : "Curso registrado.","ok"); onSaved(); onClose();
    }catch(e){ toast(isMissingTable(e) ? "Falta la tabla de cursos: ejecuta migracion_v13.sql en Supabase." : friendlyError(e),"err"); }
    finally{ setBusy(false); }
  };

  return (
    <Modal title={isEdit ? "Editar curso" : initial.name ? "Renovar curso" : "Agregar curso"} onClose={onClose} footer={<React.Fragment>
        <button className="btn accent" disabled={busy} onClick={guardar}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
        <button className="btn ghost" onClick={onClose}>Cancelar</button>
      </React.Fragment>}>
      <datalist id="th-cursos">{sugerencias.map(s=><option key={s} value={s}/>)}</datalist>
      <div className="grid" style={{gap:12}}>
        <Field label="Curso"><input autoFocus list="th-cursos" value={f.name} onChange={set("name")}
          placeholder="Escribe el curso o elige uno de la lista"/></Field>
        <Field label="Institución (opcional)"><input value={f.institution} onChange={set("institution")} placeholder="Quién lo certifica"/></Field>
        <div className="grid form-grid">
          <Field label="Fecha de realización"><input type="date" value={f.issued_date} onChange={set("issued_date")}/></Field>
          <Field label="Vigencia">
            <select value={f.vigencia} onChange={e=>setF({...f, vigencia:e.target.value, expires_date: e.target.value==="otra" ? (f.expires_date||vence) : f.expires_date})}>
              {VIGENCIAS.map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
          </Field>
          {f.vigencia==="otra" && <Field label="Fecha de vencimiento"><input type="date" value={f.expires_date} onChange={set("expires_date")}/></Field>}
        </div>
        <p className="muted" style={{fontSize:12.5,margin:0}}>
          {vence ? <span>Vence el <b>{fmt(vence)}</b> · <span className={"badge "+est.badge}><span className="dot"/>{est.label}</span>.
                     {" "}Te avisaremos en el Resumen {DIAS_AVISO_CURSO} días antes.</span>
                 : "Este curso no vence: no generará alertas."}
        </p>
        <Field label="Observaciones (opcional)"><textarea value={f.observations} onChange={set("observations")}/></Field>
      </div>
    </Modal>
  );
}

function TabCursos({emp, profile}){
  const toast = useToast();
  const write = can(profile,"employees","write");
  const [editando,setEditando] = useState(null);
  const hoy = todayISO();

  const data = useAsync(async ()=>{
    const [mios, nombres] = await Promise.all([
      sb.from("medical_courses").select("*").eq("employee_id", emp.id).order("expires_date",{ascending:true,nullsFirst:false}),
      sb.from("medical_courses").select("name").limit(2000),
    ]);
    if(mios.error){ if(isMissingTable(mios.error)) return { missing:true, rows:[], nombres:[] }; throw mios.error; }
    return { missing:false, rows:mios.data||[], nombres:(nombres.data||[]).map(r=>r.name) };
  }, [emp.id]);

  if(data.loading) return <SkeletonRows cols={5} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  if(data.data.missing) return (
    <Notice kind="amber" icon="alert">Para registrar cursos de médicos ejecuta <code>migracion_v13.sql</code> en Supabase.</Notice>
  );

  const rows = data.data.rows;
  const actuales = new Set(cursosActuales(rows).map(c=>c.id));
  const sugerencias = Array.from(new Set([
    ...(CURSOS_SUGERIDOS[emp.medical_category] || [...CURSOS_SUGERIDOS.general, ...CURSOS_SUGERIDOS.especialista]),
    ...data.data.nombres,
  ].map(s=>s.trim()).filter(Boolean))).sort((a,b)=>a.localeCompare(b,"es"));
  const cuenta = (k)=> rows.filter(c=>actuales.has(c.id) && estadoCurso(c.expires_date,hoy).key===k).length;

  const eliminar = async (c)=>{
    if(!confirm("¿Eliminar el curso «"+c.name+"»?")) return;
    const { error } = await sb.from("medical_courses").delete().eq("id", c.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Curso eliminado.","ok"); data.reload();
  };

  return (
    <div className="card">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:12}}>
        <div>
          <h3 className="section-title" style={{fontSize:14,margin:0}}>Cursos y certificaciones</h3>
          <div className="muted" style={{fontSize:12.5,marginTop:4}}>
            {emp.medical_category ? MED_CATEGORIES[emp.medical_category]+(emp.specialty?" · "+emp.specialty:"")
                                  : "Sin clasificar: edita la ficha para indicar si es médico general o especialista."}
          </div>
        </div>
        {write && <button className="btn accent sm" onClick={()=>setEditando({})}><Icon name="plus"/>Agregar curso</button>}
      </div>
      <div className="chips" style={{marginBottom:12}}>
        <span className="chip">Vigentes <b>{cuenta("vigente")+cuenta("sin")}</b></span>
        <span className="chip" style={{color:"#8A5A12"}}>Por vencer <b>{cuenta("porvencer")}</b></span>
        <span className="chip" style={{color:"#9B342C"}}>Vencidos <b>{cuenta("vencido")}</b></span>
      </div>
      {rows.length===0 ? <Empty text="Aún no hay cursos registrados para este médico."/> :
        <div className="table-wrap">
          <table>
            <thead><tr><th>Curso</th><th>Institución</th><th>Realizado</th><th>Vence</th><th>Estado</th>{write && <th></th>}</tr></thead>
            <tbody>
              {rows.map(c=>{
                const est = estadoCurso(c.expires_date, hoy);
                const reemplazado = !actuales.has(c.id);
                return (
                  <tr key={c.id} style={reemplazado?{opacity:.5}:null}>
                    <td><b>{c.name}</b>{c.observations && <div className="muted" style={{fontSize:11.5}}>{c.observations}</div>}</td>
                    <td>{c.institution||"—"}</td>
                    <td>{fmt(c.issued_date)}</td>
                    <td>{c.expires_date ? fmt(c.expires_date) : "No vence"}</td>
                    <td>{reemplazado ? <span className="badge b-sky"><span className="dot"/>Renovado</span> : <span>
                      <span className={"badge "+est.badge}><span className="dot"/>{est.label}</span>
                      {est.restantes!=null && <div className="muted" style={{fontSize:11.5,marginTop:3}}>
                        {est.restantes<0 ? `hace ${-est.restantes} día(s)` : est.restantes===0 ? "vence hoy" : `faltan ${est.restantes} día(s)`}</div>}
                    </span>}</td>
                    {write && <td style={{whiteSpace:"nowrap"}}>
                      {!reemplazado && c.expires_date && <button className="btn ghost sm" title="Registrar la renovación"
                        onClick={()=>setEditando({ name:c.name, institution:c.institution })}><Icon name="refresh"/>Renovar</button>}{" "}
                      <button className="btn ghost sm" onClick={()=>setEditando(c)} title="Editar"><Icon name="edit"/></button>{" "}
                      <button className="btn ghost sm" onClick={()=>eliminar(c)} title="Eliminar"><Icon name="trash"/></button>
                    </td>}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>}
      {editando && <CursoModal initial={editando} emp={emp} sugerencias={sugerencias} profile={profile}
        onClose={()=>setEditando(null)} onSaved={data.reload}/>}
    </div>
  );
}
