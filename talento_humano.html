});

/* Formulario reutilizable de personal: crea (sin id) o edita (con id).
   Sirve igual para Empleados, Médicos y Aprendices: el grupo se elige en el
   propio formulario, así que también permite mover una ficha de pantalla. */
function EmployeeFormModal({initial, profile, onClose, onSaved}){
  const { departments, reloadCatalogs } = useCatalogs();
  const [form,setForm] = useState(initial);
  const [busy,setBusy] = useState(false);
  const toast = useToast();
  const isEdit = !!initial.id;
  const cfg = STAFF_GROUPS[form.staff_group] || STAFF_GROUPS.empleado;
  const set = (k)=>(e)=>setForm({...form,[k]:e.target.value});

  const save = async ()=>{
    if(!form.first_name.trim()||!form.last_name.trim()||!form.document_number.trim()){ toast("Nombre, apellido y cédula son obligatorios.","err"); return; }
    setBusy(true);
    try{
      // El área se escribe: se reutiliza la existente o se crea.
      const area = await resolveDepartmentId(form.area_name, departments);
      const payload = {...form};
      delete payload.area_name; delete payload.id;
      payload.department_id = area.id;
      ["birth_date","termination_date","salary","employee_type"].forEach(k=>{ if(payload[k]==="") payload[k]=null; });
      payload.status = payload.termination_date ? "retirado" : "activo";
      if(!isEdit) payload.created_by = profile.id;
      const { dropped } = await saveEmployee(payload, isEdit ? initial.id : null);
      toast(isEdit ? `Ficha de ${cfg.singular} actualizada.` : `Registro de ${cfg.singular} creado correctamente.`, "ok");
      dropped.forEach(c=>{ if(MIGRATION_HINT[c]) toast(MIGRATION_HINT[c],"info"); });
      if(area.creada){ toast(`Se creó el área «${form.area_name.trim()}».`,"info"); reloadCatalogs(); }
      onSaved && onSaved(); onClose();
    }catch(e){ toast(friendlyError(e),"err"); }
    finally{ setBusy(false); }
  };

  return (
    <Modal title={isEdit?`Editar ${cfg.singular}`:`Nuevo ${cfg.singular}`} onClose={onClose} wide footer={<React.Fragment>
        <button className="btn accent" disabled={busy} onClick={save}>{busy?<span className="spinner"/>:<Icon name="check"/>}{isEdit?"Guardar cambios":"Registrar"}</button>
        <button className="btn ghost" onClick={onClose}>Cancelar</button>
      </React.Fragment>}>
      <div className="grid form-grid">
        <Field label="Nombres"><input value={form.first_name} onChange={set("first_name")}/></Field>
        <Field label="Apellidos"><input value={form.last_name} onChange={set("last_name")}/></Field>
        <Field label="Tipo doc."><select value={form.document_type} onChange={set("document_type")}>{["CC","CE","TI","PA","PEP"].map(t=><option key={t}>{t}</option>)}</select></Field>
        <Field label="Número de documento"><input value={form.document_number} onChange={set("document_number")}/></Field>
        <Field label="Fecha de nacimiento"><input type="date" value={form.birth_date} onChange={set("birth_date")}/></Field>
        <Field label="Género"><select value={form.gender} onChange={set("gender")}><option value="">—</option><option>Femenino</option><option>Masculino</option><option>Otro</option></select></Field>
        <Field label="Correo"><input type="email" value={form.email} onChange={set("email")}/></Field>
        <Field label="Teléfono"><input value={form.phone} onChange={set("phone")}/></Field>
        <Field label="Dirección"><input value={form.address} onChange={set("address")}/></Field>
        <Field label="Ciudad"><input value={form.city} onChange={set("city")}/></Field>
        <Field label="Área"><AreaInput value={form.area_name} onChange={(v)=>setForm({...form,area_name:v})}/></Field>
        <Field label="Cargo"><input value={form.position_title} onChange={set("position_title")}/></Field>
        <Field label="Grupo"><select value={form.staff_group} onChange={set("staff_group")}>{opts(STAFF_LABELS)}</select></Field>
        <FieldBox label="Clasificación">
          <SegClasificacion value={form.employee_type} onChange={(v)=>setForm({...form,employee_type:v})}/>
        </FieldBox>
        <Field label="Fecha de ingreso"><input type="date" value={form.hire_date} onChange={set("hire_date")}/></Field>
        <Field label="Fecha de retiro (opcional)"><input type="date" value={form.termination_date} onChange={set("termination_date")}/></Field>
        <Field label="Salario base"><input type="number" value={form.salary} onChange={set("salary")}/></Field>
        <Field label="Banco"><input value={form.bank_name} onChange={set("bank_name")}/></Field>
        <Field label="Cuenta bancaria"><input value={form.bank_account} onChange={set("bank_account")}/></Field>
        <Field label="Contacto de emergencia"><input value={form.emergency_contact} onChange={set("emergency_contact")}/></Field>
        <Field label="Tel. emergencia"><input value={form.emergency_phone} onChange={set("emergency_phone")}/></Field>
      </div>
      <Field label="Notas"><textarea value={form.notes} onChange={set("notes")}/></Field>
      <p className="muted" style={{fontSize:12,marginTop:10}}>
        La clasificación decide cómo se cuentan las vacaciones: administrativo de {WORK_WEEK_LABEL.administrativo},
        asistencial de {WORK_WEEK_LABEL.asistencial}.
      </p>
    </Modal>
  );
}

/* =====================================================================
   PERSONAL (lista) · una sola pantalla para los tres grupos
   `group` es 'empleado' | 'medico' | 'aprendiz'. Cambia el rótulo y el
   filtro; el resto —búsqueda, alta rápida, ficha completa— es idéntico.
   ===================================================================== */
function Staff({group, profile, onOpenEmployee}){
  const cfg = STAFF_GROUPS[group] || STAFF_GROUPS.empleado;
  const { departments, reloadCatalogs } = useCatalogs();
  const write = can(profile, "employees", "write");
  const toast = useToast();
  const [q,setQ] = useState("");
  const [dep,setDep] = useState("");
  const [showForm,setShowForm] = useState(false);
  const tmr = useRef(null);
  const [term,setTerm] = useState("");

  const blank = { nombre:"", document_number:"", cargo:"", ciudad:"", area_name:"", employee_type:"",
    hire_date:todayISO(), termination_date:"", contract_type:"termino_fijo", end_date:"" };
  const [form,setForm] = useState(blank);
  const [busy,setBusy] = useState(false);

  useEffect(()=>{ if(tmr.current)clearTimeout(tmr.current); tmr.current=setTimeout(()=>setTerm(q.trim().replace(/[,()*%]/g," ")),300); },[q]);

  const data = useAsync(async ()=>{
    // Las columnas nuevas solo se piden si la base ya las tiene: pedirlas sin
    // migrar haría fallar toda la consulta con 42703.
    const withType  = await hasEmployeeType();
    const withGroup = await hasStaffGroup();
    const cols = "id,first_name,last_name,document_number,position_title,city,department_id,status,hire_date,termination_date"
      + (withType ? ",employee_type" : "") + (withGroup ? ",staff_group" : "");
    let query = sb.from("employees").select(cols).order("first_name",{ascending:true}).limit(500);
    if(withGroup) query = query.eq("staff_group", group);
    if(term) query = query.or(`first_name.ilike.%${term}%,last_name.ilike.%${term}%,document_number.ilike.%${term}%`);
    if(dep) query = query.eq("department_id", dep);
    const { data, error } = await query;
    if(error) throw error;
    return { rows:data||[], withGroup };
  }, [term, dep, group]);

  const depName = (id)=> (departments.find(d=>d.id===id)||{}).name || "—";

  const registrarIngreso = async ()=>{
    if(!form.nombre.trim()||!form.document_number.trim()){ toast("Nombre y cédula son obligatorios.","err"); return; }
    setBusy(true);
    try{
      const p = form.nombre.trim().split(/\s+/); const mid = Math.ceil(p.length/2);
      const first_name = p.slice(0,mid).join(" ");
      const last_name  = p.slice(mid).join(" ") || first_name;
      const area = await resolveDepartmentId(form.area_name, departments);
      const empPayload = {
        first_name, last_name, document_number:form.document_number.trim(),
        position_title:form.cargo||null, city:form.ciudad||null,
        department_id:area.id,
        employee_type:form.employee_type||null,
        staff_group:group,
        hire_date:form.hire_date, termination_date:form.termination_date||null,
        status: form.termination_date ? "retirado" : "activo", created_by:profile.id
      };
      const { data:emp, dropped } = await saveEmployee(empPayload, null);
      dropped.forEach(c=>{ if(MIGRATION_HINT[c]) toast(MIGRATION_HINT[c],"info"); });
      if(area.creada){ toast(`Se creó el área «${form.area_name.trim()}».`,"info"); reloadCatalogs(); }
      // Contrato inicial (el tipo/fecha fin viven en la tabla contracts)
      if(form.contract_type && emp){
        const cPayload = {
          employee_id:emp.id, contract_number:"CT-"+form.document_number.trim()+"-1",
          type:form.contract_type, start_date:form.hire_date,
          end_date: form.contract_type==="termino_fijo" ? (form.end_date||null) : null,
          position_title:form.cargo||null, department_id:area.id, status:"vigente", created_by:profile.id
        };
        const { error:cErr } = await sb.from("contracts").insert(cPayload);
        if(cErr) toast("Registro creado. El contrato inicial no se guardó: "+friendlyError(cErr),"info");
      }
      toast("Ingreso registrado correctamente.","ok");
      setForm(blank); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); }
    finally{ setBusy(false); }
  };

  return (
    <div>
      <div className="page-head">
        <h2 className="section-title" style={{margin:0}}>{cfg.label}</h2>
        {write && <button className="btn ghost" onClick={()=>setShowForm(true)}><Icon name="plus"/>Ficha completa (área, salario, banco…)</button>}
      </div>

      {!write && (
        <Notice icon="lock">
          Modo consulta: {whyNot(profile,"employees","write").toLowerCase()} Puedes buscar y abrir expedientes,
          pero no crear ni modificar registros.
        </Notice>
      )}

      {!data.loading && !data.error && !data.data.withGroup && (
        <Notice kind="amber" icon="alert">
          Falta la columna <code>staff_group</code>: por eso Empleados, Médicos y Aprendices muestran
          la misma lista. Ejecuta <code>migracion_v10.sql</code> en Supabase para separarlas.
        </Notice>
      )}

      {write && (
        <div className="card" style={{marginBottom:22}}>
          <h3 className="section-title" style={{marginBottom:14,fontSize:14}}>Nuevo ingreso · {cfg.label}</h3>
          <div className="grid form-grid">
            <Field label="Nombre completo"><input value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} placeholder="Nombres y apellidos"/></Field>
            <Field label="Cédula"><input value={form.document_number} onChange={e=>setForm({...form,document_number:e.target.value})} placeholder="Número de cédula"/></Field>
            <Field label="Cargo"><input value={form.cargo} onChange={e=>setForm({...form,cargo:e.target.value})} placeholder="Cargo o puesto"/></Field>
            <Field label="Área"><AreaInput value={form.area_name} onChange={(v)=>setForm({...form,area_name:v})}/></Field>
            <Field label="Ciudad"><input value={form.ciudad} onChange={e=>setForm({...form,ciudad:e.target.value})} placeholder="Ciudad donde labora"/></Field>
            <FieldBox label="Clasificación">
              <SegClasificacion value={form.employee_type} onChange={(v)=>setForm({...form,employee_type:v})}/>
            </FieldBox>
            <Field label="Fecha de ingreso"><input type="date" value={form.hire_date} onChange={e=>setForm({...form,hire_date:e.target.value})}/></Field>
            <Field label="Fecha de retiro (opcional)"><input type="date" value={form.termination_date} onChange={e=>setForm({...form,termination_date:e.target.value})}/></Field>
            <Field label="Tipo de contrato"><select value={form.contract_type} onChange={e=>setForm({...form,contract_type:e.target.value})}>{opts(CONTRACT_TYPES)}</select></Field>
            {form.contract_type==="termino_fijo" && <Field label="Fecha fin del contrato"><input type="date" value={form.end_date} onChange={e=>setForm({...form,end_date:e.target.value})}/></Field>}
          </div>
          <div style={{marginTop:16}}>
            <button className="btn accent" disabled={busy} onClick={registrarIngreso}>
              {busy ? <span className="spinner"/> : <Icon name="check"/>}Registrar ingreso
            </button>
          </div>
          <p className="muted" style={{fontSize:12,marginTop:10}}>El nombre se separa en nombres y apellidos automáticamente; puedes ajustarlo luego en el expediente. Se crea también un contrato inicial.</p>
        </div>
      )}

      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
        <input style={{flex:2,minWidth:200}} placeholder="Buscar por nombre o cédula…" value={q} onChange={e=>setQ(e.target.value)}/>
        <select style={{flex:1,minWidth:160}} value={dep} onChange={e=>setDep(e.target.value)}>
          <option value="">Todas las áreas</option>
          {departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
      </div>

      {data.loading ? <SkeletonRows cols={7} rows={5}/> :
       data.error ? <ErrorCard error={data.error} onRetry={data.reload}/> :
       data.data.rows.length===0 ? <Empty text={`No hay registros de ${cfg.label.toLowerCase()} que coincidan con la búsqueda.`}/> :
       <div className="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Cédula</th><th>Cargo</th><th>Clasificación</th><th>Área</th><th>Ciudad</th><th>Ingreso</th><th>Estado</th></tr></thead>
          <tbody>
            {data.data.rows.map(e=>(
              <tr key={e.id} onClick={()=>onOpenEmployee(e.id)}>
                <td><b>{e.first_name} {e.last_name}</b></td>
                <td>{e.document_number}</td>
                <td>{e.position_title||"—"}</td>
                <td>{EMPLOYEE_TYPES[e.employee_type] ? <TipoBadge value={e.employee_type}/> : "—"}</td>
                <td>{depName(e.department_id)}</td>
                <td>{e.city||"—"}</td>
                <td>{fmt(e.hire_date)}</td>
                <td><Badge status={e.status}/></td>
              </tr>
            ))}
          </tbody>
        </table>
       </div>}

      {showForm && (
        <EmployeeFormModal initial={emptyEmp(group)} profile={profile}
          onClose={()=>setShowForm(false)} onSaved={()=>data.reload()}/>
      )}
    </div>
  );
}

/* =====================================================================
   EXPEDIENTE DEL EMPLEADO (con pestañas)
   ===================================================================== */
/* Retiro con FECHA EDITABLE: antes se forzaba la fecha de hoy y no había
   forma de corregirla desde el expediente. */
function RetiroModal({emp, onClose, onSaved}){
  const toast = useToast();
  const [fecha,setFecha] = useState(emp.termination_date || todayISO());
  const [busy,setBusy] = useState(false);
  const guardar = async ()=>{
    if(!fecha){ toast("Indica la fecha de retiro.","err"); return; }
    if(emp.hire_date && fecha < emp.hire_date){ toast("El retiro no puede ser anterior a la fecha de ingreso.","err"); return; }
    setBusy(true);
    try{
      const { error } = await sb.from("employees").update({ termination_date:fecha, status:"retirado" }).eq("id",emp.id);
      if(error) throw error;
      toast("Fecha de retiro guardada.","ok"); onSaved(); onClose();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  return (
    <Modal title={emp.termination_date?"Editar fecha de retiro":"Marcar retiro"} onClose={onClose} footer={<React.Fragment>
        <button className="btn accent" disabled={busy} onClick={guardar}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
        <button className="btn ghost" onClick={onClose}>Cancelar</button>
      </React.Fragment>}>
      <p className="muted" style={{margin:"0 0 14px",fontSize:13}}>
        {emp.first_name} {emp.last_name} · ingreso {fmt(emp.hire_date)}
      </p>
      <Field label="Fecha de retiro"><input type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/></Field>
      <p className="muted" style={{fontSize:12,marginTop:10}}>
        La ficha queda con estado «Retirado». Para revertirlo usa «Reactivar», que borra la fecha.
      </p>
    </Modal>
  );
}

function EmployeeProfile({employeeId, profile, departments, ssEntities, onBack, group}){
  const [tab,setTab] = useState("personal");
  const [showEdit,setShowEdit] = useState(false);
  const [showRetiro,setShowRetiro] = useState(false);
  const [clasificando,setClasificando] = useState(false);
  const toast = useToast();
  const write = can(profile,"employees","write");
  // employees_delete en RLS exige is_admin(): antes el botón se mostraba a
  // talento_humano y el servidor siempre lo rechazaba.
  const canDelete = can(profile,"employees","delete");
  const showSalary = can(profile,"salary","read");   // jefe_area no ve salarios

  const emp = useAsync(async ()=>{
    const { data, error } = await sb.from("employees").select("*").eq("id",employeeId).single();
    if(error) throw error; return data;
  }, [employeeId]);

  if(emp.loading) return <div><button className="btn ghost sm" onClick={onBack}><Icon name="back"/>Volver</button><div style={{marginTop:16}}><SkeletonRows cols={3} rows={3}/></div></div>;
  if(emp.error) return (
    <div>
      <button className="btn ghost sm" onClick={onBack} style={{marginBottom:14}}><Icon name="back"/>Volver</button>
      <ErrorCard error={emp.error} onRetry={emp.reload}/>
    </div>
  );
  const e = emp.data;
  const depName = (id)=>(departments.find(d=>d.id===id)||{}).name||"—";

  const reactivar = async ()=>{
    const { error } = await sb.from("employees").update({termination_date:null, status:"activo"}).eq("id",e.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Empleado reactivado.","ok"); emp.reload();
  };
  const eliminar = async ()=>{
    if(!confirm("¿Eliminar definitivamente a "+e.first_name+" "+e.last_name+"? También se borran sus contratos, vacaciones, incapacidades y documentos.")) return;
    const { error } = await sb.from("employees").delete().eq("id",e.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Empleado eliminado.","ok"); onBack();
  };
  /* Clasificar sin abrir la ficha completa: un toque desde el encabezado.
     Se intenta guardar SIEMPRE; solo si el servidor dice que la columna no
     existe se avisa de la migración (antes bastaba un error de red para que
     la clasificación se descartara en silencio). */
  const clasificar = async (v)=>{
    if(clasificando) return;
    setClasificando(true);
    try{
      const { dropped } = await saveEmployee({ employee_type: v || null }, e.id);
      if(dropped.includes("employee_type")){ toast(MIGRATION_HINT.employee_type,"err"); return; }
      toast(v ? "Clasificado como "+EMPLOYEE_TYPES[v]+"." : "Clasificación retirada.","ok");
      emp.reload();
    }catch(err){ toast(friendlyError(err),"err"); }
    finally{ setClasificando(false); }
  };

  // Los médicos no llevan seguridad social en el sistema (contratan por
  // prestación de servicios y cotizan como independientes).
  const cfg = STAFF_GROUPS[e.staff_group || group || "empleado"] || STAFF_GROUPS.empleado;
  const TABS = [
    {id:"personal",label:"Personal"},
    {id:"laboral",label:"Laboral"},
    {id:"contratos",label:"Contratos"},
    ...(cfg.ss ? [{id:"seguridad",label:"Seguridad social"}] : []),
    {id:"vacaciones",label:"Vacaciones"},
    {id:"incapacidades",label:"Incapacidades"},
    {id:"documentos",label:"Documentos"},
  ];

  return (
    <div>
      <button className="btn ghost sm" onClick={onBack}><Icon name="back"/>Volver a {cfg.label.toLowerCase()}</button>
      <div className="card" style={{margin:"14px 0 18px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:14,flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:14,alignItems:"flex-start",minWidth:0}}>
          <div className="avatar" style={{width:48,height:48,borderRadius:16,fontSize:16}}>
            {[e.first_name,e.last_name].filter(Boolean).map(s=>s[0]).join("").toUpperCase() || "?"}
          </div>
          <div style={{minWidth:0}}>
          <h2 style={{fontSize:20}}>{e.first_name} {e.last_name}</h2>
          <div className="kv" style={{marginTop:8}}>
            <span>{e.document_type} <b>{e.document_number}</b></span>
            <span>Cargo: <b>{e.position_title||"—"}</b></span>
            <span>Área: <b>{depName(e.department_id)}</b></span>
            <span>Ingreso: <b>{fmt(e.hire_date)}</b></span>
            {e.termination_date && <span>Retiro: <b>{fmt(e.termination_date)}</b></span>}
          </div>
          {write && (
            <div style={{marginTop:14,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
              <span className="muted" style={{fontSize:11.5,fontWeight:700,letterSpacing:".02em"}}>Clasificación:</span>
              <div style={{width:"auto",minWidth:250,maxWidth:320,flex:"0 1 auto"}}>
                <SegClasificacion value={e.employee_type||""} onChange={clasificar} disabled={clasificando}/>
              </div>
            </div>
          )}
          {write && (
            <div className="rowbtns" style={{marginTop:14}}>
              <button className="btn ghost sm" onClick={()=>setShowEdit(true)}><Icon name="edit"/>Editar</button>
              <button className="btn ghost sm" onClick={()=>setShowRetiro(true)}>
                <Icon name={e.termination_date?"calendar":"logout"}/>{e.termination_date?"Editar fecha de retiro":"Marcar retiro"}
              </button>
              {e.status!=="activo" && <button className="btn ghost sm" onClick={reactivar}><Icon name="refresh"/>Reactivar</button>}
              {canDelete
                ? <button className="btn danger sm" onClick={eliminar}><Icon name="trash"/>Eliminar</button>
                : <button className="btn danger sm" disabled title={whyNot(profile,"employees","delete")+" Solo un administrador puede eliminar."}>
                    <Icon name="lock"/>Eliminar
                  </button>}
            </div>
          )}
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <TipoBadge value={e.employee_type}/>
          <Badge status={e.status}/>
        </div>
      </div>

      <div className="tabs">
        {TABS.map(t=><button key={t.id} className={tab===t.id?"active":""} onClick={()=>setTab(t.id)}>{t.label}</button>)}
      </div>

      {tab==="personal" && <TabPersonal e={e} showSalary={showSalary}/>}
      {tab==="laboral" && <TabLaboral e={e} depName={depName} showSalary={showSalary}/>}
      {tab==="contratos" && <TabContratos employeeId={e.id} profile={profile} departments={departments}/>}
      {tab==="seguridad" && <TabSeguridad employeeId={e.id} profile={profile} ssEntities={ssEntities}/>}
      {tab==="vacaciones" && <TabVacaciones emp={e} profile={profile}/>}
      {tab==="incapacidades" && <TabIncapacidades employeeId={e.id} profile={profile}/>}
      {tab==="documentos" && <TabDocumentos employeeId={e.id} profile={profile}/>}

      {showEdit && (
        <EmployeeFormModal initial={empToForm(e, departments)} profile={profile}
          onClose={()=>setShowEdit(false)} onSaved={()=>emp.reload()}/>
      )}
      {showRetiro && (
        <RetiroModal emp={e} onClose={()=>setShowRetiro(false)} onSaved={()=>emp.reload()}/>
      )}
    </div>
  );
}

/* ---------- Contratos + Otrosí ---------- */
function TabContratos({employeeId, profile, departments}){
  const { reloadCatalogs } = useCatalogs();
  const write = can(profile,"contracts","write");
  const showSalary = can(profile,"salary","read");
  const [showC,setShowC] = useState(false);
  const [addFor,setAddFor] = useState(null); // contract id para nuevo otrosí
  const toast = useToast();

  const data = useAsync(async ()=>{
    const { data:contracts, error } = await sb.from("contracts").select("*").eq("employee_id",employeeId).order("start_date",{ascending:false});
    if(error) throw error;
    const ids = (contracts||[]).map(c=>c.id);
    let adds = [];
    if(ids.length){ const r = await sb.from("contract_addendums").select("*").in("contract_id",ids).order("date",{ascending:false}); adds = r.data||[]; }
    return { contracts:contracts||[], adds };
  }, [employeeId]);

  /* Sin «jefe inmediato» ni «fecha de firma»: no se usaban y ensuciaban la
     ficha. Las columnas siguen en la base por compatibilidad. */
  const emptyC = ()=>({ contract_number:"", type:"termino_indefinido", start_date:todayISO(), end_date:"", salary:"",
    position_title:"", area_name:"", schedule:"tiempo_completo", status:"vigente",
    observations:"", renewal_date:"", termination_reason:"" });
  const [cf,setCf] = useState(emptyC());
  const [busy,setBusy] = useState(false);

  const saveContract = async ()=>{
    if(!cf.contract_number.trim()){ toast("El número de contrato es obligatorio.","err"); return; }
    setBusy(true);
    try{
      const area = await resolveDepartmentId(cf.area_name, departments);
      const p = {...cf, employee_id:employeeId, created_by:profile.id, department_id:area.id};
      delete p.area_name;
      ["end_date","salary","renewal_date"].forEach(k=>{ if(p[k]==="") p[k]=null; });
      const { error } = await sb.from("contracts").insert(p);
      if(error) throw error;
      if(area.creada){ toast(`Se creó el área «${cf.area_name.trim()}».`,"info"); reloadCatalogs(); }
      toast("Contrato registrado.","ok"); setShowC(false); setCf(emptyC()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };

  const emptyA = ()=>({ addendum_number:"", type:"prorroga", date:todayISO(), description:"", change_detail:"", application_date:"" });
  const [af,setAf] = useState(emptyA());
  const saveAddendum = async ()=>{
    if(!af.addendum_number.trim()){ toast("El número de otrosí es obligatorio.","err"); return; }
    setBusy(true);
    try{
      const p = {...af, contract_id:addFor, created_by:profile.id};
      if(p.application_date==="") p.application_date=null;
      const { error } = await sb.from("contract_addendums").insert(p);
      if(error) throw error;
      toast("Otrosí registrado.","ok"); setAddFor(null); setAf(emptyA()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const { contracts, adds:allAdds } = data.data;

  return (
    <div>
      {write
        ? <div style={{marginBottom:14}}><button className="btn accent sm" onClick={()=>{setCf(emptyC());setShowC(true);}}><Icon name="plus"/>Nuevo contrato</button></div>
        : <Notice icon="lock">{whyNot(profile,"contracts","write")} Esta pestaña queda en modo consulta.</Notice>}
      {contracts.length===0 ? <Empty text="Este empleado no tiene contratos registrados."/> :
        <div className="grid" style={{gap:14}}>
          {contracts.map(c=>{
            const adds = allAdds.filter(a=>a.contract_id===c.id);
            return (
              <div key={c.id} className="card">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                  <div>
                    <b>Contrato {c.contract_number}</b> · {CONTRACT_TYPES[c.type]}
                    <div className="kv" style={{marginTop:6}}>
                      <span>Inicio: <b>{fmt(c.start_date)}</b></span>
                      <span>Fin: <b>{fmt(c.end_date)}</b></span>
                      <span>Cargo: <b>{c.position_title||"—"}</b></span>
                      <span>Jornada: <b>{SCHEDULES[c.schedule]||"—"}</b></span>
                      {showSalary && <span>Salario: <b>{money(c.salary)}</b></span>}
                      <span>Renovación: <b>{fmt(c.renewal_date)}</b></span>
                    </div>
                    {c.observations && <p className="muted" style={{margin:"8px 0 0",fontSize:12.5}}>{c.observations}</p>}
                    {c.termination_reason && <p className="muted" style={{margin:"4px 0 0",fontSize:12.5}}>Motivo terminación: <b>{c.termination_reason}</b></p>}
                  </div>
                  <Badge status={c.status}/>
                </div>

                <div style={{marginTop:14,borderTop:"1px solid var(--border)",paddingTop:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                    <b style={{fontSize:13,color:"var(--navy)"}}>Otrosí / adendas ({adds.length})</b>
                    {write && <button className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>{setAf(emptyA());setAddFor(c.id);}}>+ Añadir otrosí</button>}
                  </div>
                  {adds.length===0 ? <p className="muted" style={{fontSize:12.5,margin:"8px 0 0"}}>Sin adendas.</p> :
                    <div style={{marginTop:10,display:"grid",gap:7}}>
                      {adds.map(a=>(
                        <div key={a.id} style={{fontSize:12.5,padding:"10px 12px",background:"rgba(255,255,255,.5)",
                          border:"1px solid var(--border)",borderRadius:11}}>
                          <b>Otrosí {a.addendum_number}</b> · {ADDENDUM_TYPES[a.type]} · {fmt(a.date)}
                          {a.description && <span> — {a.description}</span>}
                          {a.change_detail && <div className="muted">Cambio: {a.change_detail}{a.application_date?` (aplica ${fmt(a.application_date)})`:""}</div>}
                        </div>
                      ))}
                    </div>}
                </div>
              </div>
            );
          })}
        </div>}

      {showC && (
        <Modal title="Nuevo contrato" onClose={()=>setShowC(false)} wide footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={saveContract}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar contrato</button>
            <button className="btn ghost" onClick={()=>setShowC(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Número de contrato"><input value={cf.contract_number} onChange={e=>setCf({...cf,contract_number:e.target.value})}/></Field>
            <Field label="Tipo"><select value={cf.type} onChange={e=>setCf({...cf,type:e.target.value})}>{opts(CONTRACT_TYPES)}</select></Field>
            <Field label="Fecha inicio"><input type="date" value={cf.start_date} onChange={e=>setCf({...cf,start_date:e.target.value})}/></Field>
            <Field label="Fecha terminación"><input type="date" value={cf.end_date} onChange={e=>setCf({...cf,end_date:e.target.value})}/></Field>
            <Field label="Salario"><input type="number" value={cf.salary} onChange={e=>setCf({...cf,salary:e.target.value})}/></Field>
            <Field label="Cargo"><input value={cf.position_title} onChange={e=>setCf({...cf,position_title:e.target.value})}/></Field>
            <Field label="Área"><AreaInput value={cf.area_name} onChange={(v)=>setCf({...cf,area_name:v})}/></Field>
            <Field label="Jornada"><select value={cf.schedule} onChange={e=>setCf({...cf,schedule:e.target.value})}>{opts(SCHEDULES)}</select></Field>
            <Field label="Estado"><select value={cf.status} onChange={e=>setCf({...cf,status:e.target.value})}>{opts(CONTRACT_STATUS)}</select></Field>
            <Field label="Fecha de renovación"><input type="date" value={cf.renewal_date} onChange={e=>setCf({...cf,renewal_date:e.target.value})}/></Field>
          </div>
          <Field label="Motivo de terminación (si aplica)"><input value={cf.termination_reason} onChange={e=>setCf({...cf,termination_reason:e.target.value})}/></Field>
          <Field label="Observaciones"><textarea value={cf.observations} onChange={e=>setCf({...cf,observations:e.target.value})}/></Field>
        </Modal>
      )}

      {addFor && (
        <Modal title="Nuevo otrosí" onClose={()=>setAddFor(null)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={saveAddendum}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar otrosí</button>
            <button className="btn ghost" onClick={()=>setAddFor(null)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Número de otrosí"><input value={af.addendum_number} onChange={e=>setAf({...af,addendum_number:e.target.value})}/></Field>
            <Field label="Tipo"><select value={af.type} onChange={e=>setAf({...af,type:e.target.value})}>{opts(ADDENDUM_TYPES)}</select></Field>
            <Field label="Fecha"><input type="date" value={af.date} onChange={e=>setAf({...af,date:e.target.value})}/></Field>
            <Field label="Fecha de aplicación"><input type="date" value={af.application_date} onChange={e=>setAf({...af,application_date:e.target.value})}/></Field>
          </div>
          <Field label="Descripción"><textarea value={af.description} onChange={e=>setAf({...af,description:e.target.value})}/></Field>
          <Field label="Cambio realizado"><textarea value={af.change_detail} onChange={e=>setAf({...af,change_detail:e.target.value})}/></Field>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Seguridad social + Novedades ---------- */
function TabSeguridad({employeeId, profile, ssEntities}){
  const write = can(profile,"social_security");
  const [showF,setShowF] = useState(false);
  const [showN,setShowN] = useState(false);
  const toast = useToast();

  const data = useAsync(async ()=>{
    const [aff, nov] = await Promise.all([
      sb.from("employee_social_security").select("*").eq("employee_id",employeeId),
      sb.from("social_security_novelties").select("*").eq("employee_id",employeeId).order("date",{ascending:false}),
    ]);
    if(aff.error) throw aff.error;
    return { aff:aff.data||[], nov:nov.data||[] };
  }, [employeeId]);

  /* La entidad se ESCRIBE. Antes era un <select> limitado al catálogo
     `social_security_entities`, así que no se podía registrar una EPS o una
     caja que no estuviera precargada. Ahora es texto libre con sugerencias
     filtradas por el TIPO seleccionado; si lo escrito coincide con una
     entidad del catálogo se conserva además el vínculo (entity_id). */
  const emptyF = ()=>({ id:null, kind:"eps", entity_name:"", affiliation_number:"", affiliation_date:"",
    status:"activa", withdrawal_date:"", risk_class:"", risk_level:"", observations:"" });
  const affToForm = (a)=>({ id:a.id, kind:a.kind,
    entity_name: a.entity_name || ((ssEntities.find(x=>x.id===a.entity_id)||{}).name || ""),
    affiliation_number:a.affiliation_number||"", affiliation_date:a.affiliation_date||"",
    status:a.status||"activa", withdrawal_date:a.withdrawal_date||"",
    risk_class:a.risk_class||"", risk_level:a.risk_level||"", observations:a.observations||"" });
  const [f,setF] = useState(emptyF());
  const [busy,setBusy] = useState(false);

  const saveAff = async ()=>{
    const nombre = (f.entity_name||"").trim();
    if(!nombre){ toast("Escribe el nombre de la entidad.","err"); return; }
    setBusy(true);
    try{
      const norm = (s)=> String(s||"").trim().toLowerCase();
      const ent = ssEntities.find(x=>x.kind===f.kind && norm(x.name)===norm(nombre));
      const p = {...f, employee_id:employeeId, entity_name:nombre,
                 entity_id: ent ? ent.id : null, created_by:profile.id};
      if(!p.id) delete p.id;
      ["affiliation_date","withdrawal_date","risk_class","risk_level","observations","affiliation_number"]
        .forEach(k=>{ if(p[k]==="") p[k]=null; });
      // upsert por (employee_id, kind): una afiliación vigente por tipo
      const { error } = await sb.from("employee_social_security").upsert(p, { onConflict:"employee_id,kind" });
      if(error) throw error;
      toast("Afiliación guardada.","ok"); setShowF(false); setF(emptyF()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const delAff = async (a)=>{
    if(!confirm("¿Eliminar la afiliación de "+SS_KINDS[a.kind]+"?")) return;
    const { error } = await sb.from("employee_social_security").delete().eq("id",a.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Afiliación eliminada.","ok"); data.reload();
  };

  const emptyN = ()=>({ type:"ingreso", date:todayISO(), application_date:"", description:"", status:"pendiente" });
  const [n,setN] = useState(emptyN());
  const saveNov = async ()=>{
    setBusy(true);
    try{
      const p = {...n, employee_id:employeeId, created_by:profile.id};
      if(p.application_date==="") p.application_date=null;
      const { error } = await sb.from("social_security_novelties").insert(p);
      if(error) throw error;
      toast("Novedad registrada.","ok"); setShowN(false); setN(emptyN()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const { aff, nov } = data.data;

  const byKind = (k)=> aff.find(a=>a.kind===k);
  const entName = (a)=> a ? (a.entity_name || (ssEntities.find(x=>x.id===a.entity_id)||{}).name || "—") : "—";

  return (
    <div>
      {write
        ? <div style={{marginBottom:14,display:"flex",gap:10,flexWrap:"wrap"}}>
            <button className="btn accent sm" onClick={()=>{setF(emptyF());setShowF(true);}}><Icon name="plus"/>Afiliación</button>
            <button className="btn ghost sm" onClick={()=>{setN(emptyN());setShowN(true);}}><Icon name="plus"/>Novedad</button>
          </div>
        : <Notice icon="lock">{whyNot(profile,"social_security","write")} Esta pestaña queda en modo consulta.</Notice>}

      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:12,marginBottom:16}}>
        {Object.keys(SS_KINDS).map(k=>{
          const a = byKind(k);
          return (
            <div key={k} className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                <b>{SS_KINDS[k]}</b>{a && <Badge status={a.status}/>}
              </div>
              {a ? <div className="kv" style={{marginTop:8,flexDirection:"column",gap:4}}>
                    <span>Entidad: <b>{entName(a)}</b></span>
                    <span>N° afiliación: <b>{a.affiliation_number||"—"}</b></span>
                    <span>Afiliación: <b>{fmt(a.affiliation_date)}</b></span>
                    {k==="arl" && <span>Riesgo: <b>{a.risk_class||"—"} / {a.risk_level||"—"}</b></span>}
                    {a.withdrawal_date && <span>Retiro: <b>{fmt(a.withdrawal_date)}</b></span>}
                  </div>
                : <p className="muted" style={{fontSize:12.5,margin:"8px 0 0"}}>Sin información.</p>}
              {write && (
                <div className="rowbtns" style={{marginTop:12}}>
                  <button className="btn ghost sm" onClick={()=>{ setF(a ? affToForm(a) : {...emptyF(), kind:k}); setShowF(true); }}>
                    <Icon name={a?"edit":"plus"}/>{a?"Editar":"Registrar"}
                  </button>
                  {a && can(profile,"social_security","delete") &&
                    <button className="btn ghost sm" style={{color:"var(--red)"}} onClick={()=>delAff(a)}><Icon name="trash"/>Quitar</button>}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <h3 className="section-title" style={{fontSize:14}}>Novedades de seguridad social</h3>
      {nov.length===0 ? <Empty text="No hay novedades registradas."/> :
        <div className="table-wrap"><table>
          <thead><tr><th>Tipo</th><th>Fecha</th><th>Aplicación</th><th>Descripción</th><th>Estado</th></tr></thead>
          <tbody>{nov.map(x=>(
            <tr key={x.id} style={{cursor:"default"}}>
              <td>{NOVELTY_TYPES[x.type]}</td><td>{fmt(x.date)}</td><td>{fmt(x.application_date)}</td>
              <td style={{whiteSpace:"normal"}}>{x.description||"—"}</td><td><Badge status={x.status}/></td>
            </tr>
          ))}</tbody>
        </table></div>}

      {showF && (
        <Modal title={(f.id?"Editar":"Registrar")+" afiliación · "+SS_KINDS[f.kind]} onClose={()=>setShowF(false)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={saveAff}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setShowF(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            {/* Cambiar el tipo limpia la entidad: las sugerencias dependen de él. */}
            <Field label="Tipo"><select value={f.kind} onChange={e=>setF({...f,kind:e.target.value,entity_name:"",id:null})}>{opts(SS_KINDS)}</select></Field>
            <Field label={"Entidad ("+SS_KINDS[f.kind]+")"}>
              <input list="th-ss-entidades" value={f.entity_name}
                onChange={e=>setF({...f,entity_name:e.target.value})}
                placeholder={"Escribe la "+SS_KINDS[f.kind]}/>
            </Field>
            <Field label="N° de afiliación"><input value={f.affiliation_number} onChange={e=>setF({...f,affiliation_number:e.target.value})}/></Field>
            <Field label="Fecha de afiliación"><input type="date" value={f.affiliation_date} onChange={e=>setF({...f,affiliation_date:e.target.value})}/></Field>
            <Field label="Estado"><select value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{opts(SS_STATUS)}</select></Field>
            <Field label="Fecha de retiro"><input type="date" value={f.withdrawal_date} onChange={e=>setF({...f,withdrawal_date:e.target.value})}/></Field>
            {f.kind==="arl" && <Field label="Clase de riesgo"><input value={f.risk_class} onChange={e=>setF({...f,risk_class:e.target.value})} placeholder="I - V"/></Field>}
            {f.kind==="arl" && <Field label="Nivel de riesgo"><input value={f.risk_level} onChange={e=>setF({...f,risk_level:e.target.value})}/></Field>}
          </div>
          {/* Sugerencias del catálogo, filtradas por el tipo seleccionado.
              Es una lista abierta: puedes escribir una entidad que no esté. */}
          <datalist id="th-ss-entidades">
            {ssEntities.filter(x=>x.kind===f.kind).map(x=><option key={x.id} value={x.name}/>)}
          </datalist>
          <Field label="Observaciones"><textarea value={f.observations} onChange={e=>setF({...f,observations:e.target.value})}/></Field>
          <p className="muted" style={{fontSize:12,margin:"8px 0 0"}}>
            Todos los campos son editables. Guardar reemplaza la afiliación vigente de ese tipo (una por tipo).
            La entidad se puede escribir aunque no esté en el catálogo.
          </p>
        </Modal>
      )}

      {showN && (
        <Modal title="Nueva novedad" onClose={()=>setShowN(false)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={saveNov}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar novedad</button>
            <button className="btn ghost" onClick={()=>setShowN(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Tipo"><select value={n.type} onChange={e=>setN({...n,type:e.target.value})}>{opts(NOVELTY_TYPES)}</select></Field>
            <Field label="Fecha"><input type="date" value={n.date} onChange={e=>setN({...n,date:e.target.value})}/></Field>
            <Field label="Fecha de aplicación"><input type="date" value={n.application_date} onChange={e=>setN({...n,application_date:e.target.value})}/></Field>
            <Field label="Estado"><select value={n.status} onChange={e=>setN({...n,status:e.target.value})}>{opts(NOVELTY_STATUS)}</select></Field>
          </div>
          <Field label="Descripción"><textarea value={n.description} onChange={e=>setN({...n,description:e.target.value})}/></Field>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Vacaciones (por empleado) ----------
   Organizadas por PERIODO ANUAL, contado desde la fecha de ingreso: quien
   entró en 2023 ve 2023-2024, 2024-2025 y 2025-2026, cada uno con su estado
   (en curso, pendiente, próximo a vencer, vencido o disfrutado) y con las
   fechas exactas en que tomó las vacaciones de ese periodo.
   Los días son SIEMPRE hábiles según la clasificación del empleado. */
function TabVacaciones({emp, profile}){
  const write = can(profile,"vacations");
  const [show,setShow] = useState(false);
  const toast = useToast();

  const data = useAsync(async ()=>{
    const withPeriod = await hasVacPeriod();
    const cols = "id,start_date,end_date,days,status,observations"
      + (withPeriod ? ",period_start,period_end,business_days" : "");
    const { data, error } = await sb.from("vacations").select(cols)
      .eq("employee_id",emp.id).order("start_date",{ascending:false});
    if(error) throw error;
    return { rows:data||[], withPeriod };
  }, [emp.id]);

  const periods = useMemo(()=>vacationPeriods(emp.hire_date, emp.termination_date),
                          [emp.hire_date, emp.termination_date]);

  const empty = ()=>({ period_start: periods.length?periods[0].start:"",
    start_date:todayISO(), end_date:todayISO(), status:"aprobada", observations:"" });
  const [f,setF] = useState(empty());
  const [busy,setBusy] = useState(false);
  const dias = businessDays(f.start_date, f.end_date, emp.employee_type);
  const corridos = daysBetween(f.start_date, f.end_date);

  const save = async ()=>{
    if(corridos<=0){ toast("Rango de fechas inválido.","err"); return; }
    if(dias<=0){ toast("El rango no contiene días hábiles ("+workWeekLabel(emp.employee_type)+").","err"); return; }
    setBusy(true);
    try{
      const p = { employee_id:emp.id, start_date:f.start_date, end_date:f.end_date, days:dias, status:f.status,
        observations:f.observations||null, created_by:profile.id, approved_by: f.status==="aprobada"?profile.id:null };
      if(data.data.withPeriod){
        const per = periods.find(x=>x.start===f.period_start);
        if(per){ p.period_start = per.start; p.period_end = per.end; }
        p.business_days = true;
      }
      const { error } = await sb.from("vacations").insert(p);
      if(error) throw error;
      if(!data.data.withPeriod) toast("Guardado, pero sin periodo: falta ejecutar migracion_v10.sql en Supabase.","info");
      toast("Vacaciones registradas: "+dias+" día(s) hábil(es).","ok");
      setShow(false); setF(empty()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const del = async (id)=>{
    if(!confirm("¿Eliminar este registro de vacaciones?")) return;
    const { error } = await sb.from("vacations").delete().eq("id",id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Registro eliminado.","ok"); data.reload();
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const { rows, withPeriod } = data.data;

  /* Reparto de cada disfrute en su periodo. Los rechazados SÍ se listan (para
     dejar constancia) pero no consumen saldo. */
  const porPeriodo = {}; const sueltos = [];
  rows.forEach(v=>{
    const p = periodOf(v, periods);
    if(p) (porPeriodo[p.start] = porPeriodo[p.start] || []).push(v);
    else sueltos.push(v);
  });
  const r1 = (n)=> Math.round(n*10)/10;
  const cuenta = (lista)=> lista.filter(v=>v.status!=="rechazada").reduce((s,v)=>s+v.days,0);
  const totalCausados = r1(periods.reduce((s,p)=>s+p.causados,0));
  const totalTomados  = cuenta(rows);
  const saldo = r1(totalCausados-totalTomados);

  const filaDisfrute = (v)=>(
    <tr key={v.id} style={{cursor:"default"}}>
      <td>{fmt(v.start_date)}</td><td>{fmt(v.end_date)}</td>
      <td><b>{v.days}</b></td>
      <td><Badge status={v.status}/></td>
      <td style={{whiteSpace:"normal"}}>{v.observations||"—"}</td>
      <td>{write && <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>del(v.id)}>Eliminar</button>}</td>
    </tr>
  );
  const CAB = <thead><tr><th>Desde</th><th>Hasta</th><th>Días hábiles</th><th>Estado</th><th>Observaciones</th><th></th></tr></thead>;

  return (
    <div>
      <div className="card" style={{marginBottom:12,display:"flex",gap:24,flexWrap:"wrap"}}>
        <Info label="Días causados" value={totalCausados}/>
        <Info label="Días tomados" value={totalTomados}/>
        <Info label="Saldo pendiente" value={saldo}/>
        <Info label="Se cuentan" value={cap(workWeekLabel(emp.employee_type))}/>
      </div>

      {!emp.employee_type && (
        <Notice kind="amber" icon="alert">
          Este registro no tiene clasificación, así que los días se cuentan de {WORK_WEEK_LABEL.administrativo}.
          Clasifícalo como <b>Asistencial</b> si trabaja de {WORK_WEEK_LABEL.asistencial}.
        </Notice>
      )}
      {!withPeriod && (
        <Notice kind="amber" icon="alert">
          Falta ejecutar <code>migracion_v10.sql</code>: los periodos se deducen de la fecha de inicio de
          cada registro en vez de quedar guardados.
        </Notice>
      )}

      {write && <div style={{marginBottom:14}}>
        <button className="btn accent sm" disabled={periods.length===0} onClick={()=>{setF(empty());setShow(true);}}>
          <Icon name="plus"/>Registrar vacaciones
        </button>
      </div>}

      {periods.length===0
        ? <Empty text="Aún no se ha cumplido el primer periodo desde la fecha de ingreso."/>
        : <div className="grid" style={{gap:14}}>
            {periods.map(p=>{
              const lista = porPeriodo[p.start]||[];
              const tomados = cuenta(lista);
              const st = periodStatus(p, tomados);
              const restantes = diffDays(todayISO(), p.deadline);
              return (
                <div key={p.start} className="card">
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                    <div>
                      <b style={{fontSize:14.5,color:"var(--navy)"}}>Periodo {p.label}</b>
                      <div className="kv" style={{marginTop:6}}>
                        <span>Del <b>{fmt(p.start)}</b> al <b>{fmt(p.end)}</b></span>
                        <span>Causados: <b>{p.causados}</b></span>
                        <span>Tomados: <b>{tomados}</b></span>
                        <span>Saldo: <b>{r1(p.causados-tomados)}</b></span>
                        {p.cumplido && <span>Plazo: <b>{fmt(p.deadline)}</b>{restantes>=0?` (en ${restantes} días)`:` (hace ${-restantes} días)`}</span>}
                      </div>
                    </div>
                    <span className={"badge "+st.cls}><span className="dot"/>{st.label}</span>
                  </div>
                  <div style={{marginTop:12,borderTop:"1px solid var(--border)",paddingTop:12}}>
                    {lista.length===0
                      ? <p className="muted" style={{fontSize:12.5,margin:0}}>Sin disfrutes registrados en este periodo.</p>
                      : <div className="table-wrap"><table>{CAB}<tbody>{lista.map(filaDisfrute)}</tbody></table></div>}
                  </div>
                </div>
              );
            })}

            {sueltos.length>0 && (
              <div className="card">
                <b style={{fontSize:14.5,color:"var(--navy)"}}>Fuera de periodo</b>
                <p className="muted" style={{fontSize:12.5,margin:"6px 0 10px"}}>
                  Registros cuya fecha no cae dentro de ningún periodo (por ejemplo, anteriores al ingreso).
                  Edítalos o vuelve a registrarlos para imputarlos.
                </p>
                <div className="table-wrap"><table>{CAB}<tbody>{sueltos.map(filaDisfrute)}</tbody></table></div>
              </div>
            )}
          </div>}

      {show && (
        <Modal title="Registrar vacaciones" onClose={()=>setShow(false)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={save}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setShow(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Periodo que se disfruta">
              <select value={f.period_start} onChange={e=>setF({...f,period_start:e.target.value})}>
                {periods.map(p=>{
                  const tomados = cuenta(porPeriodo[p.start]||[]);
                  return <option key={p.start} value={p.start}>
                    {p.label} · saldo {r1(p.causados-tomados)} de {p.causados}
                  </option>;
                })}
              </select>
            </Field>
            <Field label="Inicio"><input type="date" value={f.start_date} onChange={e=>setF({...f,start_date:e.target.value})}/></Field>
            <Field label="Fin"><input type="date" value={f.end_date} onChange={e=>setF({...f,end_date:e.target.value})}/></Field>
            <Field label="Estado"><select value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{opts(VAC_STATUS)}</select></Field>
          </div>
          <p className="muted" style={{margin:"10px 0"}}>
            Días hábiles que se descuentan: <b style={{color:"var(--navy)"}}>{dias}</b>
            <span style={{opacity:.8}}> · {corridos} día(s) de calendario · se cuenta de {workWeekLabel(emp.employee_type)}</span>
          </p>
          <Field label="Observaciones"><textarea value={f.observations} onChange={e=>setF({...f,observations:e.target.value})}/></Field>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Incapacidades (por empleado) ---------- */
function TabIncapacidades({employeeId, profile}){
  const write = can(profile,"disabilities");
  const [show,setShow] = useState(false);
  const toast = useToast();
  const data = useAsync(async ()=>{
    const { data, error } = await sb.from("disabilities").select("*").eq("employee_id",employeeId).order("start_date",{ascending:false});
    if(error) throw error; return data;
  }, [employeeId]);

  const empty = ()=>({ type:"enfermedad_general", start_date:todayISO(), end_date:todayISO(), diagnosis:"", entity:"" });
  const [f,setF] = useState(empty());
  const [busy,setBusy] = useState(false);
  const dias = daysBetween(f.start_date,f.end_date);

  const save = async ()=>{
    if(dias<=0){ toast("Rango de fechas inválido.","err"); return; }
    setBusy(true);
    try{
      const p = { employee_id:employeeId, type:f.type, start_date:f.start_date, end_date:f.end_date, days:dias,
        diagnosis:f.diagnosis||null, entity:f.entity||null, created_by:profile.id };
      const { error } = await sb.from("disabilities").insert(p);
      if(error) throw error;
      toast("Incapacidad registrada.","ok"); setShow(false); setF(empty()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const del = async (id)=>{
    if(!confirm("¿Eliminar esta incapacidad?")) return;
    const { error } = await sb.from("disabilities").delete().eq("id",id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Registro eliminado.","ok"); data.reload();
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const totalDias = data.data.reduce((s,d)=>s+d.days,0);

  return (
    <div>
      <div className="card" style={{marginBottom:12,display:"flex",gap:24,flexWrap:"wrap"}}>
        <Info label="Total incapacidades" value={data.data.length}/>
        <Info label="Días acumulados" value={totalDias}/>
      </div>
      {write && <div style={{marginBottom:12}}><button className="btn accent sm" onClick={()=>{setF(empty());setShow(true);}}><Icon name="plus"/>Registrar incapacidad</button></div>}
      {data.data.length===0 ? <Empty text="Sin incapacidades registradas."/> :
        <div className="table-wrap"><table>
          <thead><tr><th>Tipo</th><th>Inicio</th><th>Fin</th><th>Días</th><th>Entidad</th><th></th></tr></thead>
          <tbody>{data.data.map(d=>(
            <tr key={d.id} style={{cursor:"default"}}>
              <td>{DIS_TYPES[d.type]}</td><td>{fmt(d.start_date)}</td><td>{fmt(d.end_date)}</td><td>{d.days}</td><td>{d.entity||"—"}</td>
              <td>{write && <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>del(d.id)}>Eliminar</button>}</td>
            </tr>
          ))}</tbody>
        </table></div>}

      {show && (
        <Modal title="Registrar incapacidad" onClose={()=>setShow(false)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={save}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setShow(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Tipo"><select value={f.type} onChange={e=>setF({...f,type:e.target.value})}>{opts(DIS_TYPES)}</select></Field>
            <Field label="Inicio"><input type="date" value={f.start_date} onChange={e=>setF({...f,start_date:e.target.value})}/></Field>
            <Field label="Fin"><input type="date" value={f.end_date} onChange={e=>setF({...f,end_date:e.target.value})}/></Field>
            <Field label="Entidad (EPS/ARL)"><input value={f.entity} onChange={e=>setF({...f,entity:e.target.value})}/></Field>
          </div>
          <p className="muted" style={{margin:"10px 0"}}>Días: <b style={{color:"var(--navy)"}}>{dias}</b></p>
          <Field label="Diagnóstico / observaciones"><textarea value={f.diagnosis} onChange={e=>setF({...f,diagnosis:e.target.value})}/></Field>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Documentos ----------
   El cargador de archivos se retiró a propósito. Por ahora esta pestaña solo
   ofrece dos accesos —Hoja de vida y Contrato— todavía sin destino: cuando se
   defina a dónde apuntan, basta con cambiar `onOpen` en DOC_LINKS. */
const DOC_LINKS = [
  { id:"hoja_vida", label:"Hoja de vida", hint:"Documento con la trayectoria del empleado.", icon:"file",     tone:"ico-sky"  },
  { id:"contrato",  label:"Contrato",     hint:"Contrato laboral vigente y sus anexos.",     icon:"contract", tone:"ico-navy" },
];

function TabDocumentos({employeeId, profile}){
  const toast = useToast();
  const abrir = (link)=> toast(link.label+": el destino aún no está configurado.","info");

  return (
    <div>
      <div className="doc-links">
        {DOC_LINKS.map(link=>(
          <button key={link.id} type="button" className="doc-link" onClick={()=>abrir(link)}>
            <span className={"ico "+link.tone}><Icon name={link.icon}/></span>
            <span style={{minWidth:0}}>
              <span className="t" style={{display:"block"}}>{link.label}</span>
              <span className="s" style={{display:"block"}}>{link.hint}</span>
            </span>
          </button>

      </p>

/* El panel de auditoría se retiró de la interfaz (ni la pestaña del
   expediente ni el módulo global). El registro en la base de datos SIGUE
   funcionando: el trigger `fn_audit` guarda cada alta, cambio y borrado en
   `audit_logs`, y las políticas RLS de esa tabla no cambian. Para volver a
   mostrarlo basta con reponer el componente y su entrada de menú. */

/* =====================================================================
   VACACIONES (módulo global)
   ===================================================================== */
function VacacionesGlobal({profile}){
  const write = can(profile,"vacations");
  const toast = useToast();
  const [show,setShow] = useState(false);
  const data = useAsync(async ()=>{
    const withType   = await hasEmployeeType();
    const withPeriod = await hasVacPeriod();
    const empCols = "id,first_name,last_name,hire_date,termination_date,status" + (withType?",employee_type":"");
    const vacCols = "id,employee_id,start_date,end_date,days,status,observations,employees(first_name,last_name)"
      + (withPeriod?",period_start,period_end":"");
    const [emps, vacs] = await Promise.all([
      sb.from("employees").select(empCols).order("first_name"),
      sb.from("vacations").select(vacCols).order("start_date",{ascending:false}).limit(500),
    ]);
    if(emps.error) throw emps.error; if(vacs.error) throw vacs.error;
    return { emps:emps.data||[], vacs:vacs.data||[], withPeriod };
  }, []);
  const empty = ()=>({ employee_id:"", period_start:"", start_date:todayISO(), end_date:todayISO(), status:"aprobada", observations:"" });
  const [f,setF] = useState(empty());
  const [busy,setBusy] = useState(false);
  // El empleado seleccionado decide cómo se cuentan los días (L-V o L-S).
  const selEmp = (data.data ? data.data.emps : []).find(e=>e.id===f.employee_id) || null;
  const selPeriods = selEmp ? vacationPeriods(selEmp.hire_date, selEmp.termination_date) : [];
  const dias = businessDays(f.start_date, f.end_date, selEmp ? selEmp.employee_type : null);
  const corridos = daysBetween(f.start_date,f.end_date);
  const save = async ()=>{
    if(!f.employee_id){ toast("Selecciona un empleado.","err"); return; }
    if(corridos<=0){ toast("Rango de fechas inválido.","err"); return; }
    if(dias<=0){ toast("El rango no contiene días hábiles.","err"); return; }
    setBusy(true);
    try{
      const p = { employee_id:f.employee_id, start_date:f.start_date, end_date:f.end_date, days:dias, status:f.status,
        observations:f.observations||null, created_by:profile.id, approved_by: f.status==="aprobada"?profile.id:null };
      if(data.data.withPeriod){
        const per = selPeriods.find(x=>x.start===f.period_start) ||
                    selPeriods.find(x=>f.start_date>=x.start && f.start_date<=x.end);
        if(per){ p.period_start = per.start; p.period_end = per.end; }
        p.business_days = true;
      }
      const { error } = await sb.from("vacations").insert(p);
      if(error) throw error;
      toast("Vacaciones registradas: "+dias+" día(s) hábil(es).","ok"); setShow(false); setF(empty()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const del = async (id)=>{ if(!confirm("¿Eliminar este periodo de vacaciones?")) return;
    const { error } = await sb.from("vacations").delete().eq("id",id);
    if(error){ toast(friendlyError(error),"err"); return; } toast("Registro eliminado.","ok"); data.reload(); };

  if(data.loading) return <div><h2 className="section-title">Vacaciones</h2><SkeletonRows cols={6} rows={5}/></div>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const { emps, vacs } = data.data;
  const empById = {}; emps.forEach(e=>{ empById[e.id]=e; });
  /* El saldo se mide contra los periodos anuales cumplidos, no contra un
     prorrateo suelto: es lo mismo que muestra el expediente. */
  /* Los periodos se calculan una vez por empleado y se reutilizan: la tabla
     puede traer cientos de filas del mismo empleado. */
  const periodCache = {};
  const periodsOf = (e)=> periodCache[e.id] || (periodCache[e.id] = vacationPeriods(e.hire_date, e.termination_date));
  const tomadasPorEmp = {};
  vacs.forEach(v=>{ if(v.status!=="rechazada") tomadasPorEmp[v.employee_id]=(tomadasPorEmp[v.employee_id]||0)+v.days; });
  const saldoDe = (id)=>{ const e=empById[id]; if(!e) return "—";
    const causados = periodsOf(e).reduce((s,p)=>s+p.causados,0);
    return Math.round((causados-(tomadasPorEmp[id]||0))*10)/10; };
  /* Etiqueta del periodo de cada registro, para no perder de vista a qué año
     corresponde el disfrute. */
  const periodoDe = (v)=>{
    const e = empById[v.employee_id]; if(!e) return "—";
    const p = periodOf(v, periodsOf(e));
    return p ? p.label : "—";
  };

  return (
    <div>
      <div className="page-head">
        <h2 className="section-title" style={{margin:0}}>Vacaciones</h2>
        {write && <button className="btn accent" onClick={()=>{setF(empty());setShow(true);}}><Icon name="plus"/>Registrar vacaciones</button>}
      </div>
      {!write && <Notice icon="lock">{whyNot(profile,"vacations","write")} La consulta de periodos y saldos sigue disponible.</Notice>}
      <Notice icon="info">
        Los días se cuentan <b>hábiles</b>: el personal administrativo de {WORK_WEEK_LABEL.administrativo} y
        el asistencial de {WORK_WEEK_LABEL.asistencial}. El detalle por periodo anual está en la pestaña
        «Vacaciones» de cada expediente.
      </Notice>
      {vacs.length===0 ? <Empty text="No hay periodos de vacaciones registrados."/> :
       <div className="table-wrap"><table>
        <thead><tr><th>Empleado</th><th>Periodo</th><th>Inicio</th><th>Fin</th><th>Días hábiles</th><th>Saldo</th><th>Estado</th><th></th></tr></thead>
        <tbody>{vacs.map(v=>(
          <tr key={v.id} style={{cursor:"default"}}>
            <td><b>{v.employees? v.employees.first_name+" "+v.employees.last_name : "—"}</b></td>
            <td>{periodoDe(v)}</td>
            <td>{fmt(v.start_date)}</td><td>{fmt(v.end_date)}</td><td>{v.days}</td>
            <td>{saldoDe(v.employee_id)}</td><td><Badge status={v.status}/></td>
            <td>{write && <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>del(v.id)}>Eliminar</button>}</td>
          </tr>
        ))}</tbody>
       </table></div>}

      {show && (
        <Modal title="Registrar vacaciones" onClose={()=>setShow(false)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={save}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setShow(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Empleado"><select value={f.employee_id} onChange={e=>setF({...f,employee_id:e.target.value,period_start:""})}><option value="">Selecciona…</option>{emps.filter(e=>e.status==="activo").map(e=><option key={e.id} value={e.id}>{e.first_name} {e.last_name}</option>)}</select></Field>
            {selPeriods.length>0 && (
              <Field label="Periodo que se disfruta">
                <select value={f.period_start} onChange={e=>setF({...f,period_start:e.target.value})}>
                  <option value="">Según la fecha de inicio</option>
                  {selPeriods.map(p=><option key={p.start} value={p.start}>{p.label}</option>)}
                </select>
              </Field>
            )}
            <Field label="Inicio"><input type="date" value={f.start_date} onChange={e=>setF({...f,start_date:e.target.value})}/></Field>
            <Field label="Fin"><input type="date" value={f.end_date} onChange={e=>setF({...f,end_date:e.target.value})}/></Field>
            <Field label="Estado"><select value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{opts(VAC_STATUS)}</select></Field>
          </div>
          {f.employee_id && (
            <p className="muted" style={{margin:"10px 0"}}>
              Saldo actual: <b style={{color:"var(--navy)"}}>{saldoDe(f.employee_id)}</b> días ·
              Se descontarán <b style={{color:"var(--navy)"}}>{dias}</b> día(s) hábil(es) de {corridos} de calendario ·
              cuenta de {workWeekLabel(selEmp ? selEmp.employee_type : null)}
            </p>
          )}
          <Field label="Observaciones"><textarea value={f.observations} onChange={e=>setF({...f,observations:e.target.value})}/></Field>
        </Modal>
      )}
    </div>
  );
}
