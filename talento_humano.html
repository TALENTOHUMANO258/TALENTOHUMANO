/* El panel de auditoría se retiró de la interfaz (ni la pestaña del
   expediente ni el módulo global). El registro en la base de datos SIGUE
   funcionando: el trigger `fn_audit` guarda cada alta, cambio y borrado en
   `audit_logs`, y las políticas RLS de esa tabla no cambian. Para volver a
   mostrarlo basta con reponer el componente y su entrada de menú. */

/* =====================================================================
   VACACIONES (módulo global)
   ===================================================================== */
function VacacionesGlobal({profile}){
  const write = can(profile,"vacations");
  const toast = useToast();
  const { departments } = useCatalogs();
  const [edit,setEdit] = useState(null);   // formulario abierto (nuevo o existente)
  const [mes,setMes] = useState(todayISO().slice(0,7));   // "AAAA-MM" o "" = todos
  const [area,setArea] = useState("");
  const [ciudad,setCiudad] = useState("");
  const [q,setQ] = useState("");
  const data = useAsync(async ()=>{
    const withType   = await hasEmployeeType();
    const withPeriod = await hasVacPeriod();
    const withV11    = await hasVacV11();
    const empCols = "id,first_name,last_name,hire_date,termination_date,status,department_id,city" + (withType?",employee_type":"");
    const vacCols = "id,employee_id,start_date,end_date,days,status,observations,employees(first_name,last_name)"
      + (withPeriod?",period_start,period_end":"") + (withV11?",paid_in_money,return_date":"");
    const [emps, vacs] = await Promise.all([
      sb.from("employees").select(empCols).order("first_name"),
      sb.from("vacations").select(vacCols).order("start_date",{ascending:false}).limit(3000),
    ]);
    if(emps.error) throw emps.error; if(vacs.error) throw vacs.error;
    return { emps:emps.data||[], vacs:vacs.data||[], withPeriod, withV11 };
  }, []);
  const del = async (id)=>{ if(!confirm("¿Eliminar este periodo de vacaciones?")) return;
    const { error } = await sb.from("vacations").delete().eq("id",id);
    if(error){ toast(friendlyError(error),"err"); return; } toast("Registro eliminado.","ok"); data.reload(); };

  if(data.loading) return <div><h2 className="section-title">Vacaciones</h2><SkeletonRows cols={6} rows={5}/></div>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const { emps, vacs, withPeriod, withV11 } = data.data;
  const empById = {}; emps.forEach(e=>{ empById[e.id]=e; });
  /* El saldo se mide contra los periodos anuales cumplidos, no contra un
     prorrateo suelto: es lo mismo que muestra el expediente. */
  /* Los periodos se calculan una vez por empleado y se reutilizan: la tabla
     puede traer cientos de filas del mismo empleado. */
  const periodCache = {};
  const periodsOf = (e)=> periodCache[e.id] || (periodCache[e.id] = vacationPeriods(e.hire_date, e.termination_date));
  const tomadasPorEmp = {};
  vacs.forEach(v=>{ if(v.status!=="rechazada") tomadasPorEmp[v.employee_id]=(tomadasPorEmp[v.employee_id]||0)+v.days; });
  const saldoDe = (id)=>{ const e=empById[id]; if(!e) return "—";
    const causados = periodsOf(e).reduce((s,p)=>s+p.causados,0);
    return Math.round((causados-(tomadasPorEmp[id]||0))*10)/10; };
  /* Etiqueta del periodo de cada registro, para no perder de vista a qué año
     corresponde el disfrute. */
  const periodoDe = (v)=>{
    const e = empById[v.employee_id]; if(!e) return "—";
    const p = periodOf(v, periodsOf(e));
    return p ? p.label : "—";
  };

  /* Filtros. El mes toma todo registro que se cruce con él (unas vacaciones
     del 28 de marzo al 8 de abril salen en marzo y en abril); el pago en
     dinero cuenta en el mes de su fecha de pago. */
  const depName = (id)=> (departments.find(d=>d.id===id)||{}).name || "";
  const ciudades = cityOptions(emps, ciudad);
  const mesIni = mes ? mes+"-01" : null;
  const mesFin = mes ? isoOf(new Date(Number(mes.slice(0,4)), Number(mes.slice(5,7)), 0)) : null;
  const term = cityKey(q);
  const filtradas = vacs.filter(v=>{
    const e = empById[v.employee_id] || {};
    if(mes){
      const fin = v.paid_in_money ? v.start_date : (v.end_date || v.start_date);
      if(v.start_date > mesFin || fin < mesIni) return false;
    }
    if(area && e.department_id!==area) return false;
    if(ciudad && cityKey(e.city)!==ciudad) return false;
    if(term && !cityKey(`${e.first_name||""} ${e.last_name||""}`).includes(term)) return false;
    return true;
  });
  const diasFiltro = Math.round(filtradas.filter(v=>v.status!=="rechazada").reduce((s,v)=>s+(v.days||0),0)*10)/10;
  const personasFiltro = new Set(filtradas.map(v=>v.employee_id)).size;
  const nombreMes = mes ? `${MESES[Number(mes.slice(5,7))-1]} ${mes.slice(0,4)}` : "todos los meses";
  const hayFiltros = mes || area || ciudad || q;

  return (
    <div>
      <div className="page-head">
        <h2 className="section-title" style={{margin:0}}>Vacaciones</h2>
        {write && <button className="btn accent" onClick={()=>setEdit(newVacForm())}><Icon name="plus"/>Registrar vacaciones</button>}
      </div>
      {!write && <Notice icon="lock">{whyNot(profile,"vacations","write")} La consulta de periodos y saldos sigue disponible.</Notice>}
      <Notice icon="info">
        Los días se cuentan <b>hábiles</b> y <b>sin festivos</b>: el personal administrativo de {WORK_WEEK_LABEL.administrativo} y
        el asistencial de {WORK_WEEK_LABEL.asistencial}. El detalle por periodo anual está en la pestaña
        «Vacaciones» de cada expediente.
      </Notice>
      {write && !withV11 && (
        <Notice kind="amber" icon="alert">
          Para guardar el <b>pago en dinero</b> y la <b>fecha de reintegro</b> ejecuta <code>migracion_v11.sql</code> en Supabase.
        </Notice>
      )}
      <div className="card filters">
        <Field label="Mes">
          <input type="month" value={mes} onChange={e=>setMes(e.target.value)}/>
        </Field>
        <Field label="Área">
          <select value={area} onChange={e=>setArea(e.target.value)}>
            <option value="">Todas las áreas</option>
            {departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        </Field>
        <Field label="Ciudad">
          <select value={ciudad} onChange={e=>setCiudad(e.target.value)}>
            <option value="">Todas las ciudades</option>
            {ciudades.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}
          </select>
        </Field>
        <Field label="Empleado"><input placeholder="Buscar por nombre…" value={q} onChange={e=>setQ(e.target.value)}/></Field>
        {mes && <button className="btn ghost" onClick={()=>setMes("")} title="Quitar el filtro de mes">Todos los meses</button>}
        {hayFiltros && <button className="btn ghost" onClick={()=>{ setMes(""); setArea(""); setCiudad(""); setQ(""); }}><Icon name="refresh"/>Limpiar</button>}
      </div>
      {vacs.length>0 && (
        <div className="chips">
          <span className="chip">Periodo: <b>{nombreMes}</b></span>
          <span className="chip"><b>{filtradas.length}</b> {filtradas.length===1?"registro":"registros"}</span>
          <span className="chip"><b>{personasFiltro}</b> {personasFiltro===1?"persona":"personas"}</span>
          <span className="chip"><b>{diasFiltro}</b> días hábiles</span>
        </div>
      )}

      {vacs.length===0 ? <Empty text="No hay periodos de vacaciones registrados."/> :
       filtradas.length===0 ? <Empty text={`Nadie tuvo vacaciones en ${nombreMes} con los filtros elegidos.`}/> :
       <div className="table-wrap"><table>
        <thead><tr><th>Empleado</th><th>Periodo</th><th>Inicio / pago</th><th>Fin</th><th>Días</th><th>Reintegro</th><th>Forma</th><th>Saldo</th><th>Estado</th><th></th></tr></thead>
        <tbody>{filtradas.map(v=>{
          const emp = empById[v.employee_id] || {};
          const tipo = emp.employee_type || null;
          const lugar = [depName(emp.department_id), (emp.city||"").trim()].filter(Boolean).join(" · ");
          return (
          <tr key={v.id} style={{cursor:"default"}}>
            <td><b>{v.employees? v.employees.first_name+" "+v.employees.last_name : "—"}</b>
              {lugar && <div className="muted" style={{fontSize:11.5,marginTop:2}}>{lugar}</div>}</td>
            <td>{periodoDe(v)}</td>
            <td>{fmt(v.start_date)}</td>
            <td>{v.paid_in_money ? "—" : fmt(v.end_date)}</td>
            <td>{v.days}</td>
            <td>{v.paid_in_money ? "—" : fmt(v.return_date || nextWorkday(v.end_date, tipo))}</td>
            <td>{v.paid_in_money
                  ? <span className="badge b-green"><span className="dot"/>Dinero</span>
                  : <span className="badge b-sky"><span className="dot"/>Disfrute</span>}</td>
            <td>{saldoDe(v.employee_id)}</td><td><Badge status={v.status}/></td>
            <td>{write && <span style={{display:"inline-flex",gap:14}}>
              <button className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>setEdit(vacToForm(v, tipo))}>Editar</button>
              <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>del(v.id)}>Eliminar</button>
            </span>}</td>
          </tr>
        );})}</tbody>
       </table></div>}

      {edit && (
        <VacacionModal initial={edit} emps={emps} cols={{withPeriod, withV11}} profile={profile}
          saldoDe={saldoDe} onClose={()=>setEdit(null)} onSaved={data.reload}/>
      )}
    </div>
  );
}

/* =====================================================================
   INCAPACIDADES (módulo global)
   ===================================================================== */
function IncapacidadesGlobal({profile}){
  const write = can(profile,"disabilities");
  const toast = useToast();
  const [show,setShow] = useState(false);
  const data = useAsync(async ()=>{
    const [emps, dis] = await Promise.all([
      sb.from("employees").select("id,first_name,last_name,status").order("first_name"),
      sb.from("disabilities").select("*,employees(first_name,last_name)").order("start_date",{ascending:false}).limit(500),
    ]);
    if(emps.error) throw emps.error; if(dis.error) throw dis.error;
    return { emps:emps.data||[], dis:dis.data||[] };
  }, []);
  const empty = ()=>({ employee_id:"", type:"enfermedad_general", start_date:todayISO(), end_date:todayISO(), diagnosis:"", entity:"" });
  const [f,setF] = useState(empty());
  const [busy,setBusy] = useState(false);
  const dias = daysBetween(f.start_date,f.end_date);
  const save = async ()=>{
    if(!f.employee_id){ toast("Selecciona un empleado.","err"); return; }
    if(dias<=0){ toast("Rango de fechas inválido.","err"); return; }
    setBusy(true);
    try{
      const p = { employee_id:f.employee_id, type:f.type, start_date:f.start_date, end_date:f.end_date, days:dias, diagnosis:f.diagnosis||null, entity:f.entity||null, created_by:profile.id };
      const { error } = await sb.from("disabilities").insert(p);
      if(error) throw error;
      toast("Incapacidad registrada.","ok"); setShow(false); setF(empty()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const del = async (id)=>{ if(!confirm("¿Eliminar esta incapacidad?")) return;
    const { error } = await sb.from("disabilities").delete().eq("id",id);
    if(error){ toast(friendlyError(error),"err"); return; } toast("Registro eliminado.","ok"); data.reload(); };

  if(data.loading) return <div><h2 className="section-title">Incapacidades</h2><SkeletonRows cols={6} rows={5}/></div>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const { emps, dis } = data.data;
  const totalDias = dis.reduce((s,d)=>s+d.days,0);
  const esteMes = dis.filter(d=>d.start_date.slice(0,7)===todayISO().slice(0,7)).length;

  return (
    <div>
      <div className="page-head">
        <h2 className="section-title" style={{margin:0}}>Incapacidades</h2>
        {write && <button className="btn accent" onClick={()=>{setF(empty());setShow(true);}}><Icon name="plus"/>Registrar incapacidad</button>}
      </div>
      {!write && <Notice icon="lock">{whyNot(profile,"disabilities","write")} La consulta del histórico sigue disponible.</Notice>}
      <div className="card" style={{marginBottom:16,display:"flex",gap:28,flexWrap:"wrap"}}>
        <Info label="Total" value={dis.length}/>
        <Info label="Días acumulados" value={totalDias}/>
        <Info label="Este mes" value={esteMes}/>
      </div>
      {dis.length===0 ? <Empty text="No hay incapacidades registradas."/> :
       <div className="table-wrap"><table>
        <thead><tr><th>Empleado</th><th>Tipo</th><th>Inicio</th><th>Fin</th><th>Días</th><th>Entidad</th><th></th></tr></thead>
        <tbody>{dis.map(d=>(
          <tr key={d.id} style={{cursor:"default"}}>
            <td><b>{d.employees? d.employees.first_name+" "+d.employees.last_name : "—"}</b></td>
            <td>{DIS_TYPES[d.type]}</td><td>{fmt(d.start_date)}</td><td>{fmt(d.end_date)}</td><td>{d.days}</td><td>{d.entity||"—"}</td>
            <td>{write && <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>del(d.id)}>Eliminar</button>}</td>
          </tr>
        ))}</tbody>
       </table></div>}

      {show && (
        <Modal title="Registrar incapacidad" onClose={()=>setShow(false)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={save}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setShow(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Empleado"><select value={f.employee_id} onChange={e=>setF({...f,employee_id:e.target.value})}><option value="">Selecciona…</option>{emps.filter(e=>e.status==="activo").map(e=><option key={e.id} value={e.id}>{e.first_name} {e.last_name}</option>)}</select></Field>
            <Field label="Tipo"><select value={f.type} onChange={e=>setF({...f,type:e.target.value})}>{opts(DIS_TYPES)}</select></Field>
            <Field label="Inicio"><input type="date" value={f.start_date} onChange={e=>setF({...f,start_date:e.target.value})}/></Field>
            <Field label="Fin"><input type="date" value={f.end_date} onChange={e=>setF({...f,end_date:e.target.value})}/></Field>
            <Field label="Entidad (EPS/ARL)"><input value={f.entity} onChange={e=>setF({...f,entity:e.target.value})}/></Field>
          </div>
          <p className="muted" style={{margin:"10px 0"}}>Días: <b style={{color:"var(--navy)"}}>{dias}</b></p>
          <Field label="Diagnóstico / observaciones"><textarea value={f.diagnosis} onChange={e=>setF({...f,diagnosis:e.target.value})}/></Field>
        </Modal>
      )}
    </div>
  );
}

/* =====================================================================
   ESTADÍSTICAS
   Dos lecturas por mes y año: la salud laboral (incapacidades, accidentes
   y licencias) y el movimiento de personal (ingresos y retiros).

   Sobre el color: las series usan un orden FIJO —azul, ámbar, verde azulado,
   rojo— tomado de la paleta corporativa y verificado para daltonismo en
   barras agrupadas (peor par adyacente ΔE 13.4 protan/deutan; visión normal
   20.6). No se recicla ni se reordena: cada serie conserva su color aunque
   se filtre el año. Dos de esos tonos quedan por debajo de 3:1 contra el
   vidrio claro, así que la vista de TABLA no es opcional: es la que
   garantiza que ningún dato dependa del color.
   ===================================================================== */
const VIZ_SERIES = ["#2E9FD6","#B0731A","#16A99B","#C0453C"];
const VIZ_INK    = "var(--ink-2)";
const VIZ_MUTED  = "var(--muted)";
const VIZ_GRID   = "rgba(15,32,53,.12)";
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

/* Barras agrupadas en SVG. `series` = [{key,label,color,values:[12]}]. */
function BarChart({series, labels, titulo, subtitulo, unidad="registros"}){
  const [hover,setHover] = useState(null);   // {i, s} celda señalada
  const max = Math.max(1, ...series.flatMap(s=>s.values));
  // Escala redondeada a un número limpio (1/2/5 × 10ⁿ).
  const paso = (()=>{ const bruto=max/4, exp=Math.pow(10,Math.floor(Math.log10(bruto)||0));
    const n=bruto/exp; return (n<=1?1:n<=2?2:n<=5?5:10)*exp; })();
  const techo = Math.max(paso, Math.ceil(max/paso)*paso);
  const ticks = []; for(let v=0; v<=techo+0.001; v+=paso) ticks.push(Math.round(v*100)/100);

  const W=760, H=250, ML=42, MR=10, MT=12, MB=34;
  const plotW = W-ML-MR, plotH = H-MT-MB;
  const banda = plotW/labels.length;
  const y = (v)=> MT + plotH - (v/techo)*plotH;
  // Marca fina: como mucho 24px de ancho y 2px de aire entre barras vecinas.
  const anchoGrupo = Math.min(banda*0.72, 24*series.length + 2*(series.length-1));
  const anchoBarra = Math.max(3, (anchoGrupo - 2*(series.length-1))/series.length);

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:12,flexWrap:"wrap"}}>
        <h3 className="section-title" style={{fontSize:14,marginBottom:4}}>{titulo}</h3>
        {subtitulo && <span className="muted" style={{fontSize:12}}>{subtitulo}</span>}
      </div>
      {/* Leyenda: la identidad nunca depende solo del color. */}
      <div style={{display:"flex",gap:16,flexWrap:"wrap",margin:"8px 0 10px"}}>
        {series.map(s=>(
          <span key={s.key} style={{display:"inline-flex",alignItems:"center",gap:7,fontSize:12,color:VIZ_INK,fontWeight:600}}>
            <span style={{width:11,height:11,borderRadius:3,background:s.color,flexShrink:0}}/>{s.label}
          </span>
        ))}
      </div>
      <div style={{position:"relative"}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block",overflow:"visible"}}
          role="img" aria-label={titulo}>
          {ticks.map(t=>(
            <g key={t}>
              <line x1={ML} x2={W-MR} y1={y(t)} y2={y(t)} stroke={VIZ_GRID} strokeWidth="1"/>
              <text x={ML-8} y={y(t)+4} textAnchor="end" fontSize="10.5" fill={VIZ_MUTED}
                style={{fontVariantNumeric:"tabular-nums"}}>{t}</text>
            </g>
          ))}
          {labels.map((lb,i)=>{
            const x0 = ML + i*banda + (banda-anchoGrupo)/2;
            return (
              <g key={lb}>
                <text x={ML+i*banda+banda/2} y={H-MB+18} textAnchor="middle" fontSize="10.5" fill={VIZ_MUTED}>{lb}</text>
                {series.map((s,j)=>{
                  const v = s.values[i]||0;
                  const x = x0 + j*(anchoBarra+2);
                  const alto = v===0 ? 0 : Math.max(2, (v/techo)*plotH);
                  const activo = hover && hover.i===i && hover.s===j;
                  return (
                    <g key={s.key}>
                      {/* Zona de contacto más grande que la barra. */}
                      <rect x={x-1} y={MT} width={anchoBarra+2} height={plotH} fill="transparent"
                        onMouseEnter={()=>setHover({i,s:j})} onMouseLeave={()=>setHover(null)}/>
                      {v>0 && (
                        <rect x={x} y={MT+plotH-alto} width={anchoBarra} height={alto}
                          rx="4" ry="4" fill={s.color} opacity={hover && !activo ? .55 : 1}
                          style={{pointerEvents:"none"}}>
                          <title>{`${s.label} · ${lb}: ${v} ${unidad}`}</title>
                        </rect>
                      )}
                    </g>
                  );
                })}
              </g>
            );
          })}
          <line x1={ML} x2={W-MR} y1={MT+plotH} y2={MT+plotH} stroke="rgba(15,32,53,.25)" strokeWidth="1"/>
        </svg>
        {hover && (
          /* Se sujeta al centro de la columna señalada, sin salirse por los
             bordes (de ahí el recorte al 14-86 % del ancho). */
          <div className="viz-tip" style={{left:`${Math.min(86,Math.max(14,((ML+hover.i*banda+banda/2)/W)*100))}%`}}>
            <b>{labels[hover.i]}</b>
            <span style={{display:"inline-flex",alignItems:"center",gap:6,marginLeft:8}}>
              <span style={{width:9,height:9,borderRadius:3,background:series[hover.s].color}}/>
              {series[hover.s].label}: <b>{series[hover.s].values[hover.i]||0}</b>
            </span>
          </div>
        )}
      </div>
    </div>
  );
}

/* Tabla equivalente al gráfico: es la vía de acceso que no depende del color. */
function SeriesTable({series, labels, cabecera="Mes"}){
  return (
    <div className="table-wrap" style={{marginTop:12}}>
      <table>
        <thead><tr><th>{cabecera}</th>{series.map(s=><th key={s.key}>{s.label}</th>)}<th>Total</th></tr></thead>
        <tbody>
          {labels.map((lb,i)=>{
            const total = series.reduce((a,s)=>a+(s.values[i]||0),0);
            return (
              <tr key={lb} style={{cursor:"default"}}>
                <td><b>{lb}</b></td>
                {series.map(s=><td key={s.key} style={{fontVariantNumeric:"tabular-nums"}}>{s.values[i]||0}</td>)}
                <td style={{fontVariantNumeric:"tabular-nums"}}><b>{total}</b></td>
              </tr>
            );
          })}
          <tr style={{cursor:"default"}}>
            <td><b>Total</b></td>
            {series.map(s=><td key={s.key} style={{fontVariantNumeric:"tabular-nums"}}><b>{s.values.reduce((a,b)=>a+b,0)}</b></td>)}
            <td style={{fontVariantNumeric:"tabular-nums"}}><b>{series.reduce((a,s)=>a+s.values.reduce((x,y)=>x+y,0),0)}</b></td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

/* Un bloque = gráfico + su tabla, con el mismo conmutador. */
function ChartBlock({series, labels, titulo, subtitulo, unidad, cabeceraTabla}){
  const [tabla,setTabla] = useState(false);
  const vacio = series.every(s=>s.values.every(v=>!v));
  return (
    <div className="card" style={{marginBottom:18}}>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:-6}}>
        <button className="btn ghost sm" onClick={()=>setTabla(t=>!t)}>
          <Icon name={tabla?"dashboard":"clipboard"}/>{tabla?"Ver gráfico":"Ver tabla"}
        </button>
      </div>
      {vacio
        ? <div><h3 className="section-title" style={{fontSize:14}}>{titulo}</h3><Empty text="Sin registros en este periodo."/></div>
        : tabla
          ? <div><h3 className="section-title" style={{fontSize:14}}>{titulo}</h3>
              {subtitulo && <p className="muted" style={{fontSize:12,margin:"0 0 4px"}}>{subtitulo}</p>}
              <SeriesTable series={series} labels={labels} cabecera={cabeceraTabla}/></div>
          : <BarChart series={series} labels={labels} titulo={titulo} subtitulo={subtitulo} unidad={unidad}/>}
    </div>
  );
}

/* =====================================================================
   CALENDARIO COLOMBIANO
   Cualquier mes de cualquier año (los festivos se calculan, no están en
   una tabla), con las vacaciones que se cruzan con el mes y una
   calculadora que aplica la misma regla que el registro de vacaciones:
   los festivos y días de descanso no consumen días, pasan al siguiente.
   ===================================================================== */
/* ---- Eventos y recordatorios (tabla calendar_events, migracion_v12.sql) ---- */
const EVENT_COLORS = {
  sky:    { label:"Azul",    bg:"#E3F2FB", fg:"#175F84", dot:"#2E9FD6" },
  green:  { label:"Verde",   bg:"#E3F5EC", fg:"#1E6B47", dot:"#2E9E6A" },
  amber:  { label:"Ámbar",   bg:"#FBF0DC", fg:"#8A5A12", dot:"#D08A1F" },
  red:    { label:"Rojo",    bg:"#FBE5E3", fg:"#9B342C", dot:"#C0453C" },
  violet: { label:"Morado",  bg:"#EFE8FB", fg:"#5B3C99", dot:"#7C5CC4" },
  navy:   { label:"Oscuro",  bg:"#E2E8F1", fg:"#0B2545", dot:"#1E4C7A" },
};
const colorDe = (c)=> EVENT_COLORS[c] || EVENT_COLORS.sky;
const EVENT_REPEAT = { none:"No se repite", weekly:"Cada semana", monthly:"Cada mes", yearly:"Cada año" };
const EVENT_REMIND = [[0,"El mismo día"],[1,"1 día antes"],[2,"2 días antes"],[3,"3 días antes"],
                      [7,"1 semana antes"],[15,"15 días antes"],[30,"1 mes antes"]];

/* Eventos hasta `hasta`. Con `desde`, los que no se repiten y son
   anteriores a esa fecha no se piden. Sin la tabla: { missing:true }. */
async function fetchEventos(hasta, desde){
  let q = sb.from("calendar_events").select("*").lte("event_date", hasta).order("event_date").limit(2000);
  if(desde) q = q.or(`repeat.neq.none,event_date.gte.${desde}`);
  const { data, error } = await q;
  if(error){ if(isMissingTable(error)) return { missing:true, rows:[] }; throw error; }
  return { missing:false, rows:data||[] };
}

/* Fechas en que ocurre el evento dentro de [a, b], ambas incluidas. */
function ocurrencias(ev, a, b){
  const base = ev.event_date, out = [];
  if(!ev.repeat || ev.repeat==="none"){ if(base>=a && base<=b) out.push(base); return out; }
  if(base>b) return out;
  const yA=Number(a.slice(0,4)), mA=Number(a.slice(5,7)), yB=Number(base.slice(0,4)), mB=Number(base.slice(5,7));
  let k = ev.repeat==="weekly"  ? Math.max(0, Math.floor(diffDays(base,a)/7))
        : ev.repeat==="monthly" ? Math.max(0, (yA-yB)*12 + (mA-mB) - 1)
        :                         Math.max(0, yA-yB-1);
  for(let guard=0; guard<400; guard++, k++){
    const d = ev.repeat==="weekly" ? addDaysISO(base, 7*k)
            : addMonthsISO(base, ev.repeat==="monthly" ? k : 12*k);
    if(d>b) break;
    if(d>=a) out.push(d);
  }
  return out;
}

/* Avisos que deben verse hoy: la primera ocurrencia sin atender que ya
   entró en su anticipación. Las vencidas se muestran hasta 30 días (7 si
   el evento se repite, para no acumular semanas). */
function avisosPendientes(rows, hoy){
  const out = [];
  rows.forEach(ev=>{
    let desde = addDaysISO(hoy, ev.repeat && ev.repeat!=="none" ? -7 : -30);
    if(ev.done_through && ev.done_through>=desde) desde = addDaysISO(ev.done_through, 1);
    const occ = ocurrencias(ev, desde, addDaysISO(hoy, ev.remind_days||0));
    if(occ.length) out.push({ ev, fecha:occ[0], restantes:diffDays(hoy, occ[0]) });
  });
  return out.sort((a,b)=> a.restantes-b.restantes || String(a.ev.event_time||"").localeCompare(String(b.ev.event_time||"")));
}

/* Marca atendida una ocurrencia. Si era una vencida, también se dan por
   atendidas las demás vencidas hasta ayer. */
async function marcarAtendido(ev, fecha){
  const hoy = todayISO();
  const hasta = fecha>=hoy ? fecha : addDaysISO(hoy,-1);
  const { error } = await sb.from("calendar_events").update({ done_through:hasta }).eq("id", ev.id);
  if(error) throw error;
  window.dispatchEvent(new Event("th-eventos"));
}
const horaDe = (t)=> t ? String(t).slice(0,5) : "";
const textoAviso = (r)=> r<0 ? `Pasó hace ${-r} día(s)` : r===0 ? "Hoy" : r===1 ? "Mañana" : `En ${r} días`;

const MESES_LARGOS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS_SEMANA  = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];

/* Crear / editar un evento. `initial` sin id = nuevo. */
function EventoModal({initial, profile, onClose, onSaved}){
  const toast = useToast();
  const isEdit = !!initial.id;
  const [f,setF] = useState({
    title:initial.title||"", description:initial.description||"", event_date:initial.event_date||todayISO(),
    all_day: !initial.event_time, event_time: horaDe(initial.event_time) || "08:00",
    color:initial.color||"sky", repeat:initial.repeat||"none",
    remind_days: initial.remind_days!=null ? initial.remind_days : 1,
    shared: initial.shared!=null ? !!initial.shared : true,
  });
  const [busy,setBusy] = useState(false);
  const set = (k)=>(e)=>setF({...f,[k]:e.target.value});
  const listo = (msg)=>{ toast(msg,"ok"); window.dispatchEvent(new Event("th-eventos")); onSaved(); onClose(); };

  const guardar = async ()=>{
    if(!f.title.trim()){ toast("Escribe un título para el evento.","err"); return; }
    if(!f.event_date){ toast("Indica la fecha.","err"); return; }
    setBusy(true);
    try{
      const p = { title:f.title.trim(), description:f.description.trim()||null, event_date:f.event_date,
        event_time: f.all_day ? null : (f.event_time||null), color:f.color, repeat:f.repeat,
        remind_days:Number(f.remind_days)||0, shared:f.shared };
      // Si se cambia la fecha de un evento ya atendido, vuelve a quedar pendiente.
      if(isEdit && f.event_date!==initial.event_date) p.done_through = null;
      const r = isEdit ? await sb.from("calendar_events").update(p).eq("id",initial.id)
                       : await sb.from("calendar_events").insert({...p, created_by:profile.id});
      if(r.error) throw r.error;
      listo(isEdit ? "Evento actualizado." : "Evento creado.");
    }catch(e){ toast(isMissingTable(e) ? "Falta la tabla de eventos: ejecuta migracion_v12.sql en Supabase." : friendlyError(e),"err"); }
    finally{ setBusy(false); }
  };
  const eliminar = async ()=>{
    if(!confirm("¿Eliminar «"+initial.title+"»"+(initial.repeat&&initial.repeat!=="none"?" y todas sus repeticiones":"")+"?")) return;
    setBusy(true);
    const { error } = await sb.from("calendar_events").delete().eq("id",initial.id);
    setBusy(false);
    if(error){ toast(friendlyError(error),"err"); return; }
    listo("Evento eliminado.");
  };

  return (
    <Modal title={isEdit?"Editar evento":"Nuevo evento"} onClose={onClose} footer={<React.Fragment>
        <button className="btn accent" disabled={busy} onClick={guardar}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
        {isEdit && <button className="btn danger" disabled={busy} onClick={eliminar}><Icon name="trash"/>Eliminar</button>}
        <button className="btn ghost" onClick={onClose}>Cancelar</button>
      </React.Fragment>}>
      <div className="grid" style={{gap:12}}>
        <Field label="Título"><input autoFocus value={f.title} onChange={set("title")} placeholder="Ej.: Renovar contrato de Ana, reunión de comité…"/></Field>
        <div className="grid form-grid">
          <Field label="Fecha"><input type="date" value={f.event_date} onChange={set("event_date")}/></Field>
          <FieldBox label="Hora">
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <label className={"check"+(f.all_day?" on":"")} style={{flex:"0 0 auto"}}>
                <input type="checkbox" checked={f.all_day} onChange={e=>setF({...f,all_day:e.target.checked})}/>Todo el día
              </label>
              {!f.all_day && <input type="time" value={f.event_time} onChange={set("event_time")} style={{flex:1}}/>}
            </div>
          </FieldBox>
          <Field label="Repetir"><select value={f.repeat} onChange={set("repeat")}>{opts(EVENT_REPEAT)}</select></Field>
          <Field label="Avisarme en la web">
            <select value={f.remind_days} onChange={set("remind_days")}>
              {EVENT_REMIND.map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
          </Field>
        </div>
        <FieldBox label="Color">
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {Object.entries(EVENT_COLORS).map(([k,c])=>(
              <button key={k} type="button" title={c.label} aria-label={c.label} aria-pressed={f.color===k}
                onClick={()=>setF({...f,color:k})}
                style={{width:28,height:28,borderRadius:28,background:c.dot,cursor:"pointer",
                  border: f.color===k ? "3px solid var(--navy)" : "3px solid #fff", boxShadow:"0 0 0 1px rgba(15,32,53,.15)"}}/>
            ))}
          </div>
        </FieldBox>
        <Field label="Descripción (opcional)"><textarea value={f.description} onChange={set("description")}/></Field>
        <label className={"check"+(f.shared?" on":"")}>
          <input type="checkbox" checked={f.shared} onChange={e=>setF({...f,shared:e.target.checked})}/>
          {f.shared ? "Compartido con el equipo de Talento Humano" : "Privado (solo yo lo veo)"}
        </label>
      </div>
    </Modal>
  );
}

function Calendario({profile}){
  const hoy = todayISO();
  const [ym,setYm] = useState({ y:Number(hoy.slice(0,4)), m:Number(hoy.slice(5,7))-1 });
  const [calc,setCalc] = useState({ start:hoy, dias:"15", tipo:"administrativo" });
  const [editando,setEditando] = useState(null);   // evento abierto en el modal
  const mover = (n)=> setYm(({y,m})=>{ const d=new Date(y,m+n,1); return { y:d.getFullYear(), m:d.getMonth() }; });

  const primero = isoOf(new Date(ym.y, ym.m, 1));
  const ultimo  = isoOf(new Date(ym.y, ym.m+1, 0));

  const vac = useAsync(async ()=>{
    const [conPago, conTipo] = await Promise.all([hasVacV11(), hasEmployeeType()]);
    const r = await sb.from("vacations")
      .select("id,start_date,end_date,status" + (conPago ? ",paid_in_money" : "")
        + ",employees(first_name,last_name" + (conTipo ? ",employee_type" : "") + ")")
      .lte("start_date", ultimo).gte("end_date", primero).limit(500);
    if(r.error) throw r.error;
    return (r.data||[]).filter(v=>v.status!=="rechazada" && !v.paid_in_money);
  }, [primero, ultimo]);

  /* Eventos: los del mes visible (con margen para los días de los meses
     vecinos que asoman en la cuadrícula) y los próximos 60 días. */
  const desdeEv = addDaysISO(primero < hoy ? primero : hoy, -7);
  const hastaEv = addDaysISO(ultimo > hoy ? ultimo : hoy, 60);
  const ev = useAsync(()=>fetchEventos(hastaEv, desdeEv), [desdeEv, hastaEv]);
  const eventos = ev.data ? ev.data.rows : [];
  const porDia = {};
  eventos.forEach(e=>ocurrencias(e, desdeEv, hastaEv).forEach(d=>{ (porDia[d] = porDia[d] || []).push(e); }));
  Object.values(porDia).forEach(l=>l.sort((a,b)=>String(a.event_time||"").localeCompare(String(b.event_time||""))));
  const proximos = [];
  for(let i=0; i<=30 && proximos.length<12; i++){
    const d = addDaysISO(hoy, i);
    (porDia[d]||[]).forEach(e=>{ if(proximos.length<12) proximos.push({ e, d }); });
  }
  const atendido = (e,d)=> !!e.done_through && d<=e.done_through;
  const nuevo = (fecha)=> setEditando({ event_date:fecha });

  /* Cuadrícula de lunes a domingo que cubre el mes completo. */
  const celdas = [];
  const ini = new Date(ym.y, ym.m, 1);
  ini.setDate(ini.getDate() - ((ini.getDay()+6)%7));
  for(const d=new Date(ini); celdas.length<42; d.setDate(d.getDate()+1)){
    if(celdas.length>=35 && d.getMonth()!==ym.m) break;
    celdas.push(new Date(d));
  }

  const festAnio = Object.entries(holidaysOf(ym.y)).sort(([a],[b])=>a.localeCompare(b));
  const festMes  = festAnio.filter(([iso])=>iso.slice(0,7)===primero.slice(0,7));
  const habilesMes = (tipo)=> businessDays(primero, ultimo, tipo);

  const n = parseInt(calc.dias,10);
  const fin = calc.start && n>0 ? addBusinessDays(calc.start, n, calc.tipo) : "";
  const festRango = fin ? holidaysBetween(calc.start, fin) : [];

  return (
    <div>
      <div className="page-head">
        <h1 className="page-title" style={{margin:0}}>Calendario colombiano</h1>
        <button className="btn accent" onClick={()=>nuevo(hoy)}><Icon name="plus"/>Nuevo evento</button>
      </div>
      {ev.data && ev.data.missing && (
        <Notice kind="amber" icon="alert">
          Para crear eventos y recordatorios ejecuta <code>migracion_v12.sql</code> en Supabase.
          Mientras tanto el calendario muestra festivos y vacaciones.
        </Notice>
      )}
      {editando && <EventoModal initial={editando} profile={profile} onClose={()=>setEditando(null)} onSaved={ev.reload}/>}
      <div className="cal-layout" style={{marginTop:14}}>
        <div className="card">
          <div className="cal-head">
            <button className="btn ghost sm" onClick={()=>mover(-12)} title="Año anterior">«</button>
            <button className="btn ghost sm" onClick={()=>mover(-1)} title="Mes anterior">‹</button>
            <h3>{MESES_LARGOS[ym.m]} {ym.y}</h3>
            <button className="btn ghost sm" onClick={()=>setYm({ y:Number(hoy.slice(0,4)), m:Number(hoy.slice(5,7))-1 })}>Hoy</button>
            <button className="btn ghost sm" onClick={()=>mover(1)} title="Mes siguiente">›</button>
            <button className="btn ghost sm" onClick={()=>mover(12)} title="Año siguiente">»</button>
          </div>
          <div className="cal-grid">
            {DIAS_SEMANA.map(d=><div key={d} className="cal-dow">{d}</div>)}
            {celdas.map(d=>{
              const iso = isoOf(d), dow = d.getDay(), fest = holidayName(d);
              const enVac = vac.data ? vac.data.filter(v=>v.start_date<=iso && v.end_date>=iso
                && isWorkday(d, v.employees && v.employees.employee_type)) : [];
              const cls = ["cal-day", d.getMonth()!==ym.m && "out", (dow===0||dow===6) && "wknd",
                dow===6 && "sat", dow===0 && "sun", fest && "fest", iso===hoy && "today"].filter(Boolean).join(" ");
              return (
                <div key={iso} className={cls} title={fest || "Clic para crear un evento"} onClick={()=>nuevo(iso)}>
                  <span className="num">{d.getDate()}</span>
                  {fest && <span className="fname">{fest}</span>}
                  {(porDia[iso]||[]).map(e=>{ const c = colorDe(e.color); return (
                    <span key={e.id} className={"ev"+(atendido(e,iso)?" done":"")} style={{background:c.bg,color:c.fg,borderColor:c.dot}}
                      title={[horaDe(e.event_time), e.title, e.description].filter(Boolean).join(" · ")}
                      onClick={(x)=>{ x.stopPropagation(); setEditando(e); }}>
                      {e.event_time && <b>{horaDe(e.event_time)} </b>}{e.title}
                    </span>
                  ); })}
                  {enVac.slice(0,2).map(v=>(
                    <span key={v.id} className="vac" title={"Vacaciones: "+(v.employees? v.employees.first_name+" "+v.employees.last_name:"")}>
                      {v.employees ? v.employees.first_name : "—"}
                    </span>
                  ))}
                  {enVac.length>2 && <span className="muted" title={enVac.slice(2).map(v=>v.employees? v.employees.first_name+" "+v.employees.last_name:"").join(", ")}>+{enVac.length-2} más</span>}
                </div>
              );
            })}
          </div>
          <div className="cal-legend">
            <span><i style={{background:"var(--red-bg)"}}/>Festivo</span>
            <span><i style={{background:"rgba(15,32,53,.06)"}}/>Fin de semana</span>
            <span><i style={{background:"var(--sky-soft)"}}/>De vacaciones (solo días que se descuentan)</span>
            {vac.loading && <span>Cargando vacaciones…</span>}
            {vac.error && <span style={{color:"var(--red)"}}>No se pudieron cargar las vacaciones.</span>}
          </div>
          <p className="muted" style={{fontSize:12.5,margin:"12px 0 0"}}>
            {MESES_LARGOS[ym.m]} {ym.y}: <b>{habilesMes("administrativo")}</b> días hábiles de lunes a viernes ·{" "}
            <b>{habilesMes("asistencial")}</b> de lunes a sábado · {festMes.length} festivo(s).
          </p>
        </div>

        <div className="grid" style={{gap:16}}>
          <div className="card">
            <h3 style={{margin:"0 0 10px",fontSize:15,color:"var(--navy)"}}>Próximos 30 días</h3>
            {ev.loading ? <p className="muted" style={{fontSize:12.5,margin:0}}>Cargando…</p> :
             proximos.length===0 ? <p className="muted" style={{fontSize:12.5,margin:0}}>Sin eventos. Toca un día del calendario para crear uno.</p> :
             <div className="fest-list">
              {proximos.map(({e,d})=>{ const c = colorDe(e.color); return (
                <div key={e.id+d} style={{cursor:"pointer",background:c.bg,color:c.fg,opacity:atendido(e,d)?.5:1}} onClick={()=>setEditando(e)}>
                  <span style={{minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {e.title}{e.repeat&&e.repeat!=="none" ? " ↻" : ""}
                  </span>
                  <b style={{flexShrink:0}}>{d===hoy ? "Hoy" : fmt(d).slice(0,5)}{e.event_time ? " "+horaDe(e.event_time) : ""}</b>
                </div>
              ); })}
             </div>}
          </div>

          <div className="card">
            <h3 style={{margin:"0 0 10px",fontSize:15,color:"var(--navy)"}}>Calcular vacaciones</h3>
            <div className="grid" style={{gap:10}}>
              <Field label="Primer día"><input type="date" value={calc.start} onChange={e=>setCalc({...calc,start:e.target.value})}/></Field>
              <Field label="Días hábiles"><input type="number" min="1" max="400" value={calc.dias} onChange={e=>setCalc({...calc,dias:e.target.value})}/></Field>
              <Field label="Clasificación">
                <select value={calc.tipo} onChange={e=>setCalc({...calc,tipo:e.target.value})}>
                  <option value="administrativo">Administrativo (lunes a viernes)</option>
                  <option value="asistencial">Asistencial (lunes a sábado)</option>
                </select>
              </Field>
            </div>
            {fin && (
              <div style={{fontSize:13,marginTop:12,lineHeight:1.6}}>
                Último día: <b>{fmt(fin)}</b><br/>
                Reintegro: <b>{fmt(nextWorkday(fin, calc.tipo))}</b><br/>
                <span className="muted">{daysBetween(calc.start, fin)} días de calendario.</span>
                {festRango.length>0 && (
                  <div className="muted" style={{fontSize:12,marginTop:6}}>
                    Festivos que no se cuentan: {festRango.map((h,i)=><span key={h.iso}>{i>0?", ":""}<b>{fmt(h.iso)}</b> {h.name}</span>)}
                  </div>
                )}
              </div>
            )}
          </div>

          <div className="card">
            <h3 style={{margin:"0 0 10px",fontSize:15,color:"var(--navy)"}}>Festivos {ym.y} ({festAnio.length})</h3>
            <div className="fest-list">
              {festAnio.map(([iso,name])=>(
                <div key={iso} className={iso<hoy ? "past" : iso.slice(0,7)===primero.slice(0,7) ? "cur" : ""}
                  style={{cursor:"pointer"}} onClick={()=>setYm({ y:ym.y, m:Number(iso.slice(5,7))-1 })}>
                  <span>{name}</span><b>{fmt(iso).slice(0,5)}</b>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Estadisticas(){
  const [anio,setAnio] = useState(String(new Date().getFullYear()));

  const data = useAsync(async ()=>{
    const [dis, emps, vacs] = await Promise.all([
      sb.from("disabilities").select("id,type,start_date,days").order("start_date",{ascending:false}).limit(3000),
      sb.from("employees").select("id,hire_date,termination_date").limit(3000),
      sb.from("vacations").select("start_date,days,status").gte("start_date", addDaysISO(todayISO(),-400)).limit(3000),
    ]);
    if(dis.error) throw dis.error; if(emps.error) throw emps.error; if(vacs.error) throw vacs.error;
    return { dis:dis.data||[], emps:emps.data||[], vacs:vacs.data||[] };
  }, []);

  if(data.loading) return <div><h2 className="section-title">Gráficas y estadísticas</h2><SkeletonRows cols={5} rows={6}/></div>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const { dis, emps, vacs } = data.data;

  /* Últimos 12 meses (incluido el actual): personal activo y vacaciones. */
  const hoy = todayISO();
  const meses12 = Array.from({length:12}, (_,i)=>{
    const d = new Date(Number(hoy.slice(0,4)), Number(hoy.slice(5,7))-1-(11-i), 1);
    const fin = i===11 ? hoy : isoOf(new Date(d.getFullYear(), d.getMonth()+1, 0));
    return { key:isoOf(d).slice(0,7), fin,
             label: MESES[d.getMonth()] + (i===0 || d.getMonth()===0 ? " "+String(d.getFullYear()).slice(2) : "") };
  });
  const plantilla = meses12.map(m=> emps.filter(e=> e.hire_date && e.hire_date<=m.fin
    && (!e.termination_date || e.termination_date>m.fin)).length);
  const diasVacMes = meses12.map(m=> vacs.filter(v=>v.status!=="rechazada" && v.start_date.slice(0,7)===m.key)
    .reduce((s,v)=>s+(v.days||0),0));
  const etiquetas = meses12.map(m=>m.label);

  /* Años con algún movimiento, de más reciente a más antiguo. */
  const anios = Array.from(new Set([
    ...dis.map(d=>d.start_date.slice(0,4)),
    ...emps.filter(e=>e.hire_date).map(e=>e.hire_date.slice(0,4)),
    ...emps.filter(e=>e.termination_date).map(e=>e.termination_date.slice(0,4)),
    String(new Date().getFullYear()),
  ])).sort((a,b)=>b.localeCompare(a));
  const anioSel = anios.includes(anio) ? anio : anios[0];

  /* Agrupaciones de incapacidad: el orden de las series es el orden fijo de
     la paleta (azul, ámbar, verde azulado, rojo). */
  const GRUPOS_DIS = [
    { key:"general",   label:"Enfermedad general", tipos:["enfermedad_general"] },
    { key:"accidente", label:"Accidentes de trabajo", tipos:["accidente_laboral"] },
    { key:"licencia",  label:"Licencias", tipos:["licencia_maternidad","licencia_paternidad"] },
    { key:"laboral",   label:"Enfermedad laboral", tipos:["enfermedad_laboral"] },
  ];
  const contarMes = (filas, campo, anioX) => {
    const v = new Array(12).fill(0);
    filas.forEach(r=>{ const f=r[campo]; if(f && f.slice(0,4)===anioX) v[parseInt(f.slice(5,7),10)-1]++; });
    return v;
  };
  const contarAnio = (filas, campo, listaAnios) =>
    listaAnios.map(a => filas.filter(r=>r[campo] && r[campo].slice(0,4)===a).length);

  const aniosAsc = [...anios].sort();
  const seriesDisMes = GRUPOS_DIS.map((g,i)=>({
    key:g.key, label:g.label, color:VIZ_SERIES[i],
    values: contarMes(dis.filter(d=>g.tipos.includes(d.type)), "start_date", anioSel),
  }));

function Usuarios({profile, departments}){
  const toast = useToast();
  const data = useAsync(async ()=>{
    const { data, error } = await sb.from("profiles").select("*,employees(first_name,last_name)").order("created_at",{ascending:false});
    if(error) throw error; return data;
  }, []);
  const [emps,setEmps] = useState([]);
  useEffect(()=>{ sb.from("employees").select("id,first_name,last_name").order("first_name").then(r=>setEmps(r.data||[])); },[]);

  const patch = async (id, changes)=>{
    const { error } = await sb.from("profiles").update(changes).eq("id",id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Usuario actualizado.","ok"); data.reload();
  };

  if(data.loading) return <SkeletonRows cols={5} rows={5}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;

  return (
    <div>
      <h2 className="section-title">Usuarios y roles</h2>
      <Notice icon="info">
        Los usuarios se crean en Supabase → Authentication. Aquí asignas su <b>rol</b>, área y el empleado vinculado.
        El rol es lo que determina qué permite el servidor: si alguien recibe «El servidor rechazó la acción por
        permisos», normalmente su rol es <b>Empleado</b> (el valor por defecto) y debe subirse a
        <b> Talento Humano</b> o <b>Administrador</b>.
      </Notice>
      <div className="table-wrap"><table>
        <thead><tr><th>Usuario</th><th>Correo</th><th>Rol</th><th>Área</th><th>Empleado vinculado</th><th>Activo</th></tr></thead>
        <tbody>{data.data.map(u=>(
          <tr key={u.id} style={{cursor:"default"}}>
            <td>{u.full_name||"—"}</td>
            <td>{u.email||"—"}</td>
            <td>
              <select value={u.role} disabled={u.id===profile.id} onChange={e=>patch(u.id,{role:e.target.value})}>{opts(ROLE_LABELS)}</select>
            </td>
            <td><select value={u.department_id||""} onChange={e=>patch(u.id,{department_id:e.target.value||null})}><option value="">—</option>{departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></td>
            <td><select value={u.employee_id||""} onChange={e=>patch(u.id,{employee_id:e.target.value||null})}><option value="">—</option>{emps.map(x=><option key={x.id} value={x.id}>{x.first_name} {x.last_name}</option>)}</select></td>
            <td><input type="checkbox" style={{width:"auto"}} checked={u.active} onChange={e=>patch(u.id,{active:e.target.checked})}/></td>
          </tr>
        ))}</tbody>
      </table></div>
    </div>
  );
}

          </tbody>

      </div>

      <div className="card">
        <h3 className="section-title" style={{fontSize:14}}>¿Falta un permiso?</h3>
        <ol className="muted" style={{fontSize:12.5,lineHeight:1.75,margin:0,paddingLeft:20}}>
          <li>La autoridad es el servidor: las políticas RLS de <code>supabase_talento_humano.sql</code> (sección 8).
              Esta tabla solo refleja esas reglas para no ofrecer botones que serían rechazados.</li>
          <li>Para cambiar permisos de verdad, un administrador ajusta el <b>rol</b> del usuario en
              «Usuarios y roles». Los usuarios nuevos nacen con rol <b>Empleado</b>.</li>
          <li>Si ningún usuario es administrador todavía, ejecuta en Supabase → SQL Editor el archivo
              <code> crear_perfiles_faltantes.sql</code>, que crea los perfiles que falten y eleva tu correo a administrador.</li>
          {DEV_CONFIG.isLocal && !DEV_ACTIVE && (
            <li>Solo para desarrollo local: puedes mostrar todas las acciones de la UI (sin ganar acceso real)
                con <code>?ui_permissions=all</code> en la URL.
                <div className="rowbtns" style={{marginTop:10}}>
                  <button className="btn ghost sm" onClick={()=>setFlag("ui_permissions","all")}>
                    <Icon name="key"/>Desbloquear UI (solo local)
                  </button>
                </div>
            </li>
          )}
        </ol>
      </div>
    </div>
  );
}

/* =====================================================================
   BARRA DE DESPLAZAMIENTO SUPERIOR
   A cada .table-wrap que se desborda a lo ancho se le pone encima una
   barra gemela sincronizada: así se mueve a la derecha sin bajar hasta el
   final de la tabla. Es global (vigila el DOM), de modo que cubre todas
   las tablas, también las de ventanas emergentes y las que se agreguen.
   ===================================================================== */
function useTopScrollbars(){
  useEffect(()=>{
    const enlazar = (wrap)=>{
      const bar = document.createElement("div");
      bar.className = "top-scroll"; bar.setAttribute("aria-hidden","true");
      const inner = document.createElement("div");
      bar.appendChild(inner);
      wrap.parentNode.insertBefore(bar, wrap);
      wrap.__topBar = bar; bar.__wrap = wrap;
      bar.addEventListener("scroll", ()=>{ if(wrap.scrollLeft!==bar.scrollLeft) wrap.scrollLeft = bar.scrollLeft; });
      const deWrap = ()=>{ if(bar.scrollLeft!==wrap.scrollLeft) bar.scrollLeft = wrap.scrollLeft; };
      wrap.addEventListener("scroll", deWrap);
      const medir = ()=>{
        inner.style.width = wrap.scrollWidth+"px";
        bar.style.display = wrap.scrollWidth > wrap.clientWidth+1 ? "" : "none";
        deWrap();
      };
      const ro = new ResizeObserver(medir);
      ro.observe(wrap);
      if(wrap.firstElementChild) ro.observe(wrap.firstElementChild);
      bar.__ro = ro;
      medir();
    };
    const revisar = ()=>{
      // Barras huérfanas: su tabla desapareció o ya no está justo debajo.
      document.querySelectorAll(".top-scroll").forEach(b=>{
        if(!b.__wrap || !b.__wrap.isConnected || b.nextElementSibling!==b.__wrap){
          if(b.__ro) b.__ro.disconnect();
          if(b.__wrap) b.__wrap.__topBar = null;
          b.remove();
        }
      });
      document.querySelectorAll(".table-wrap").forEach(w=>{
        if(!w.__topBar && w.parentNode) enlazar(w);
        else if(w.__topBar && w.firstElementChild) w.__topBar.__ro.observe(w.firstElementChild);
      });
    };
    let pendiente = 0;
    const mo = new MutationObserver(()=>{ if(!pendiente) pendiente = requestAnimationFrame(()=>{ pendiente=0; revisar(); }); });
    mo.observe(document.body, { childList:true, subtree:true });
    revisar();
    return ()=>{
      mo.disconnect(); cancelAnimationFrame(pendiente);
      document.querySelectorAll(".top-scroll").forEach(b=>{ if(b.__ro) b.__ro.disconnect(); if(b.__wrap) b.__wrap.__topBar=null; b.remove(); });
    };
  }, []);
}

/* =====================================================================
   APP PRINCIPAL (post-login)
   ===================================================================== */
function Workspace({session, profile, onSignOut}){
  const [view,setView] = useState("dashboard"); // dashboard | empleados | medicos | aprendices | …
  const [empId,setEmpId] = useState(null);
  const [departments,setDepartments] = useState([]);
  const [ssEntities,setSsEntities] = useState([]);
  const [menuOpen,setMenuOpen] = useState(false);
  useTopScrollbars();

  /* Los catálogos se recargan cuando un formulario crea un área nueva. */
  const loadCatalogs = useCallback(async ()=>{
    const [d,s] = await Promise.all([
      sb.from("departments").select("id,name").order("name"),
      sb.from("social_security_entities").select("id,kind,name").eq("active",true).order("name"),
    ]);
    setDepartments(d.data||[]); setSsEntities(s.data||[]);
  }, []);

  useEffect(()=>{
    loadCatalogs();
    // Comprueba una sola vez qué columnas nuevas tiene la base.
    hasEmployeeType(); hasStaffGroup();
  }, [loadCatalogs]);

  const catalogs = useMemo(()=>({ departments, ssEntities, reloadCatalogs:loadCatalogs }),
                           [departments, ssEntities, loadCatalogs]);

  /* Recordatorios del calendario: contador en el menú y aviso al entrar.
     Se recalcula cada 5 minutos y cuando se crea/edita/atiende un evento. */
  const toast = useToast();
  const [nAvisos,setNAvisos] = useState(0);
  const avisoInicial = useRef(false);
  useEffect(()=>{
    let vivo = true;
    const cargar = async ()=>{
      try{
        const hoy = todayISO();
        const r = await fetchEventos(addDaysISO(hoy,366), addDaysISO(hoy,-31));
        if(!vivo || r.missing) return;
        const av = avisosPendientes(r.rows, hoy);
        setNAvisos(av.length);
        if(!avisoInicial.current && av.length){
          avisoInicial.current = true;
          const hoyN = av.filter(x=>x.restantes<=0).length;
          toast(`Tienes ${av.length} recordatorio(s) del calendario`+(hoyN?` (${hoyN} para hoy o vencidos)`:"")+". Míralos en Resumen o Calendario.","info");
        }
      }catch(_){ /* sin red: se reintenta en el siguiente ciclo */ }
    };
    cargar();
    const t = setInterval(cargar, 5*60*1000);
    window.addEventListener("th-eventos", cargar);
    return ()=>{ vivo=false; clearInterval(t); window.removeEventListener("th-eventos", cargar); };
  }, []); // eslint-disable-line

  // Al abrir un expediente se va a la pantalla de su grupo, para que el
  // botón «Volver» devuelva a la lista correcta.
  const openEmployee = (id, grupo)=>{
    setEmpId(id);
    setView(grupo && STAFF_GROUPS[grupo] ? STAFF_GROUPS[grupo].view : "empleados");
    setMenuOpen(false);
  };
  const go = (v)=>{ setView(v); setEmpId(null); setMenuOpen(false); };

  /* Navegación. `group` solo agrupa visualmente; `show` decide visibilidad. */
  const isAdmin = can(profile,"users","write");
  const NAV = [
    {id:"dashboard",     label:"Resumen",          ico:"dashboard", group:"General",        show:true},
    {id:"empleados",     label:"Empleados",        ico:"users",     group:"Personal",       show:true},
    {id:"medicos",       label:"Médicos",          ico:"health",    group:"Personal",       show:true},
    {id:"aprendices",    label:"Aprendices",       ico:"clipboard", group:"Personal",       show:true},
    {id:"vacaciones",    label:"Vacaciones",       ico:"beach",     group:"Operación",      show:true},
    {id:"incapacidades", label:"Incapacidades",    ico:"health",    group:"Operación",      show:true},
    {id:"calendario",    label:"Calendario",       ico:"calendar",  group:"Operación",      show:true},
    {id:"estadisticas",  label:"Gráficas",         ico:"trend",     group:"Operación",      show:true},
    {id:"usuarios",      label:"Usuarios y roles", ico:"settings",  group:"Administración", show:isAdmin},
    {id:"permisos",      label:"Permisos",         ico:"shield",    group:"Administración", show:true},
  ].filter(n=>n.show);

  const grupoDeVista = GROUP_BY_VIEW[view] || null;
  const TITLES = {
    dashboard:"Resumen",
    empleados:  empId ? "Expediente del empleado" : "Empleados",
    medicos:    empId ? "Expediente del médico"   : "Médicos",
    aprendices: empId ? "Expediente del aprendiz" : "Aprendices",
    vacaciones:"Vacaciones", incapacidades:"Incapacidades", calendario:"Calendario", estadisticas:"Gráficas y estadísticas",
    usuarios:"Usuarios y roles", permisos:"Permisos",
  };
  const current = NAV.find(n=>n.id===view);
  const initials = (profile.full_name || session.user.email || "?")
    .split(/[\s@.]+/).filter(Boolean).slice(0,2).map(s=>s[0]).join("").toUpperCase();

  /* Cabeceras de grupo del menú, sin repetir la etiqueta */
  let lastGroup = null;

  return (
    <CatalogCtx.Provider value={catalogs}>
    <div className="shell">
      {/* Sugerencias de área para todos los campos «Área» de la aplicación.
          Va una sola vez aquí para no repetir el mismo id en cada formulario. */}
      <datalist id="th-areas">{departments.map(d=><option key={d.id} value={d.name}/>)}</datalist>
      {menuOpen && <div className="backdrop" onClick={()=>setMenuOpen(false)}/>}
      <aside className={"sidebar"+(menuOpen?" open":"")}>
        <div className="brand">
          <Logo/>
          <span className="tagline">Talento Humano</span>
        </div>
        <nav className="nav" aria-label="Navegación principal">
          {NAV.map(n=>{
            const head = n.group!==lastGroup ? (lastGroup=n.group) : null;
            const active = view===n.id;
            return (
              <React.Fragment key={n.id}>
                {head && <div className="nav-label">{head}</div>}
                <button className={active?"active":""} onClick={()=>go(n.id)} aria-current={active?"page":undefined}>
                  <span className="ico"><Icon name={n.ico}/></span>{n.label}
                  {n.id==="calendario" && nAvisos>0 && <span className="nav-badge" title="Recordatorios pendientes">{nAvisos}</span>}
                </button>
              </React.Fragment>
            );
          })}
        </nav>
        <div className="foot">
          <div style={{display:"flex",gap:10,alignItems:"center",minWidth:0}}>
            <div className="avatar">{initials}</div>
            <div style={{minWidth:0}}>
              <div className="u" style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {profile.full_name||session.user.email}
              </div>
              <div>{ROLE_LABELS[profile.role]}</div>
            </div>
          </div>
          <button onClick={onSignOut}><Icon name="logout"/>Cerrar sesión</button>
          <div style={{marginTop:10,fontSize:10,textAlign:"center",opacity:.7}}>{APP_VERSION}</div>
        </div>
      </aside>

      <div className="main">
        <div className="topbar">
          <button className="hamburger" onClick={()=>setMenuOpen(true)} aria-label="Abrir menú"><Icon name="menu"/></button>
          {/* Solo visible cuando el menú lateral está oculto (pantallas pequeñas). */}
          <div className="topbar-brand"><Logo/></div>
          <div className="breadcrumb">
            <span className="bc-path">{current ? current.group : "Talento Humano"}</span>
            <span className="bc-title">{TITLES[view]||"Talento Humano"}</span>
          </div>
          <GlobalSearch onOpenEmployee={openEmployee}/>
          <div className="topbar-right">
            <span className="role-chip">{ROLE_LABELS[uiRole(profile)]}</span>
            <div className="avatar" title={profile.full_name||session.user.email}>{initials}</div>
          </div>
        </div>

        {DEV_ACTIVE && (
          <div className="dev-banner">
            <Icon name="alert"/>
            <span>
              Modo desarrollo: permisos de <b>interfaz</b> desbloqueados
              {DEV_CONFIG.roleOverride ? <span> · rol simulado <code>{DEV_CONFIG.roleOverride}</code></span> : null}.
              El servidor sigue validando cada operación.
            </span>
            <button className="linkbtn" style={{marginLeft:"auto",color:"inherit"}} onClick={()=>go("permisos")}>Ver permisos</button>
          </div>
        )}

        <div className="content" key={view+(empId||"")}>
          {view==="dashboard" && <Dashboard profile={profile} onOpenEmployee={openEmployee}/>}
          {/* Empleados, Médicos y Aprendices son la misma pantalla con otro filtro. */}
          {grupoDeVista && !empId &&
            <Staff group={grupoDeVista} profile={profile} onOpenEmployee={openEmployee}/>}
          {grupoDeVista && empId &&
            <EmployeeProfile employeeId={empId} profile={profile} departments={departments}
              ssEntities={ssEntities} group={grupoDeVista} onBack={()=>setEmpId(null)}/>}
          {view==="vacaciones" && <VacacionesGlobal profile={profile}/>}
          {view==="incapacidades" && <IncapacidadesGlobal profile={profile}/>}
          {view==="calendario" && <Calendario profile={profile}/>}
          {view==="estadisticas" && <Estadisticas/>}
          {view==="usuarios" && <Usuarios profile={profile} departments={departments}/>}
          {view==="permisos" && <Permisos session={session} profile={profile}/>}
        </div>
      </div>
    </div>
    </CatalogCtx.Provider>
  );
}

/* =====================================================================
   RAÍZ: maneja sesión, perfil y toasts
   ===================================================================== */
function Root(){
  const [ready,setReady] = useState(false);
  const [session,setSession] = useState(null);
  const [profile,setProfile] = useState(null);
  const [profileError,setProfileError] = useState(null);
  const [toasts,setToasts] = useState([]);

  const pushToast = useCallback((msg, kind="info")=>{
    const id = Math.random().toString(36).slice(2);
    setToasts(t=>[...t,{id,msg,kind}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 4200);
  }, []);

  const loadProfile = useCallback(async (uid)=>{
    setProfileError(null);
    const { data, error } = await sb.from("profiles").select("*").eq("id",uid).maybeSingle();
    if(error){ CURRENT_ROLE=null; setProfileError(friendlyError(error)); setProfile(null); return; }
    if(!data){
      CURRENT_ROLE = null;
      setProfileError("Tu usuario aún no tiene un perfil en la base de datos. Ejecuta en Supabase el script para crear perfiles faltantes (o pide al administrador que te asigne un rol) y vuelve a entrar.");
      setProfile(null); return;
    }
    // El rol vigente alimenta los mensajes de permisos (friendlyError) y la UI.
    CURRENT_ROLE = data.role;
    if(DEV_CONFIG.debug) console.debug("[permisos] perfil cargado:", data.email, "rol:", data.role);
    setProfile(data);
  }, []);

  useEffect(()=>{
    let mounted = true;
    sb.auth.getSession().then(async ({data})=>{
      if(!mounted) return;
      setSession(data.session);
      if(data.session){ await loadProfile(data.session.user.id); }
      setReady(true);
    });
    const { data:sub } = sb.auth.onAuthStateChange(async (event, sess)=>{
      setSession(sess);
      if(sess){ await loadProfile(sess.user.id); }
      else { CURRENT_ROLE=null; setProfile(null); }
    });
    return ()=>{ mounted=false; sub.subscription.unsubscribe(); };
  }, [loadProfile]);

  const signOut = async ()=>{
    try{ await sb.from("audit_logs").insert({ profile_id:session.user.id, action:"LOGOUT", description:"Cierre de sesión" }); }catch(e){}
    await sb.auth.signOut();
  };

  const Splash = ({text}) => (
    <div style={{minHeight:"100vh",display:"grid",placeItems:"center",padding:24}}>
      <div className="card" style={{display:"flex",gap:12,alignItems:"center",color:"var(--muted)",fontSize:13.5,fontWeight:600}}>
        <span className="spinner dark"/> {text}
      </div>
    </div>
  );

  if(!ready) return <Splash text="Cargando…"/>;

  let body;
  if(!session){ body = <Auth/>; }
  else if(profileError){
    body = <div className="auth"><div className="box">
      <div style={{display:"flex",justifyContent:"center",color:"var(--amber)",marginBottom:10}}><Icon name="alert" size={34}/></div>
      <h1>Perfil no disponible</h1>
      <p className="sub">{profileError}</p>
      <button className="btn ghost block" onClick={signOut}><Icon name="logout"/>Cerrar sesión</button></div></div>;
  }
  else if(!profile){ body = <Splash text="Cargando tu perfil…"/>; }
  else if(profile.active===false){
    body = <div className="auth"><div className="box">
      <div style={{display:"flex",justifyContent:"center",color:"var(--red)",marginBottom:10}}><Icon name="lock" size={34}/></div>
      <h1>Cuenta inactiva</h1>
      <p className="sub">Tu usuario está desactivado. Contacta al administrador.</p>
      <button className="btn ghost block" onClick={signOut}><Icon name="logout"/>Cerrar sesión</button></div></div>;
  }
  else { body = <Workspace session={session} profile={profile} onSignOut={signOut}/>; }

  return (
    <ToastCtx.Provider value={pushToast}>
      {body}
      <Toasts items={toasts}/>
    </ToastCtx.Provider>
  );
}

/* Error boundary: evita la pantalla en blanco si un componente falla al dibujar */
class ErrorBoundary extends React.Component{
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err,info){ console.error("Render error:", err, info); }
  render(){
    if(this.state.err){
      return (
        <div style={{maxWidth:720,margin:"48px auto",fontFamily:"Inter,Arial,sans-serif",
          background:"rgba(251,235,233,.88)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",
          border:"1px solid rgba(192,69,60,.35)",borderRadius:22,padding:26,color:"#9B342C",
          boxShadow:"0 30px 70px rgba(11,37,69,.22), inset 0 1px 0 rgba(255,255,255,.8)"}}>
          <h2 style={{margin:"0 0 10px",fontFamily:"'Inter',sans-serif",fontSize:19}}>⚠️ Ocurrió un error en la interfaz</h2>
          <pre style={{whiteSpace:"pre-wrap",fontSize:13,margin:0,lineHeight:1.6}}>{String(this.state.err && this.state.err.message || this.state.err)}</pre>
          <p style={{marginTop:14,fontSize:12.5,color:"#66788D"}}>Recarga la página. Si persiste, comparte este mensaje.</p>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><Root/></ErrorBoundary>);
</script>
</body>
</html>
