<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Talento Humano · Centro Especializado de Urología</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===================================================================
     LIQUID GLASS · Sistema de diseño
     Tokens → Fondo → Layout → Navegación → Superficies → Datos
              → Formularios → Botones → Feedback → Responsive
     =================================================================== */
  :root{
    /* --- Marca corporativa --- */
    --navy:#0B2545;   --navy-2:#14375F;  --navy-3:#1E4C7A;  --navy-soft:#233C5C;
    --sky:#2E9FD6;    --sky-2:#5BC0E8;   --teal:#16A99B;
    --ink:#0F2035;    --ink-2:#33465E;   --muted:#66788D;

    /* --- Semánticos --- */
    --green:#158A5B;  --green-2:#28B476;
    --red:#C0453C;    --red-2:#E0685E;
    --amber:#B0731A;  --amber-2:#E0A537;

    /* --- Vidrio líquido --- */
    --g-1:rgba(255,255,255,.74);
    --g-2:rgba(255,255,255,.55);
    --g-3:rgba(255,255,255,.34);
    --g-brd:rgba(255,255,255,.65);
    --g-hi:inset 0 1px 0 rgba(255,255,255,.8);
    --blur:20px;

    /* --- Sombras --- */
    --sh-1:0 1px 2px rgba(11,37,69,.05), 0 4px 14px rgba(11,37,69,.06);
    --sh-2:0 2px 6px rgba(11,37,69,.06), 0 14px 34px rgba(11,37,69,.10);
    --sh-3:0 30px 70px rgba(11,37,69,.24);
    --ring:0 0 0 4px rgba(46,159,214,.22);

    /* --- Forma y ritmo --- */
    --r-s:10px; --r-m:16px; --r-l:22px; --r-pill:999px;
    --ease:cubic-bezier(.22,.61,.36,1); --fast:.16s; --mid:.28s;

    /* --- Alias de compatibilidad (usados en estilos en línea del JSX) --- */
    --paper:#EDF2F9; --card:var(--g-1);
    --border:rgba(15,32,53,.09); --border-input:rgba(15,32,53,.13);
    --sky-soft:rgba(46,159,214,.12); --green-bg:rgba(21,138,91,.11);
    --red-bg:rgba(192,69,60,.11);    --amber-bg:rgba(176,115,26,.13);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  /* Reserva siempre el canal de la barra de desplazamiento: así, al abrir un
     diálogo (que bloquea el scroll del fondo), el contenido no da un salto
     lateral del ancho de la barra. */
  html{scrollbar-gutter:stable}
  body{
    font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1100px 620px at 6% -8%,  rgba(46,159,214,.26), transparent 62%),
      radial-gradient(900px 520px at 98% 2%,   rgba(22,169,155,.20), transparent 58%),
      radial-gradient(1000px 700px at 48% 112%,rgba(20,55,95,.22),   transparent 62%),
      linear-gradient(158deg,#E7EFF8 0%,#F4F8FC 46%,#E6EEF7 100%);
    background-attachment:fixed;
  }
  /* Burbujas de luz en movimiento muy lento (decorativas) */
  body::before,body::after{
    content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none;
    filter:blur(70px);opacity:.5;
  }
  body::before{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;
    background:radial-gradient(circle at 30% 30%,rgba(91,192,232,.55),transparent 68%);
    animation:float1 26s var(--ease) infinite alternate}
  body::after{width:40vmax;height:40vmax;right:-12vmax;bottom:-14vmax;
    background:radial-gradient(circle at 70% 70%,rgba(22,169,155,.42),transparent 68%);
    animation:float2 32s var(--ease) infinite alternate}
  @keyframes float1{to{transform:translate3d(6vmax,4vmax,0) scale(1.12)}}
  @keyframes float2{to{transform:translate3d(-5vmax,-4vmax,0) scale(1.08)}}

  h1,h2,h3{font-family:'Inter',sans-serif;margin:0;letter-spacing:-.01em}
  a{color:var(--sky)}
  #root{min-height:100vh;position:relative;z-index:1}
  ::selection{background:rgba(46,159,214,.25)}

  /* Scrollbars discretas */
  *{scrollbar-width:thin;scrollbar-color:rgba(15,32,53,.22) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(15,32,53,.18);border-radius:99px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(15,32,53,.3);background-clip:content-box}

  /* Utilidad base de vidrio */
  .glass{
    background:linear-gradient(158deg,var(--g-1),var(--g-2));
    -webkit-backdrop-filter:blur(var(--blur)) saturate(165%);
    backdrop-filter:blur(var(--blur)) saturate(165%);
    border:1px solid var(--g-brd);
    box-shadow:var(--sh-2),var(--g-hi);
  }

  /* ---- Layout ---- */
  .shell{display:flex;min-height:100vh;gap:0}
  .sidebar{
    width:256px;flex-shrink:0;position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;padding:14px 12px;gap:12px;color:var(--ink-2);
    background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.5));
    -webkit-backdrop-filter:blur(24px) saturate(170%);
    backdrop-filter:blur(24px) saturate(170%);
    border-right:1px solid var(--g-brd);
    box-shadow:1px 0 0 rgba(255,255,255,.5) inset, var(--sh-1);
  }
  /* ---- Marca (logotipo corporativo) ----
     El archivo oficial es un PNG blanco sobre fondo transparente, así que
     siempre va sobre una placa azul: sobre el vidrio claro sería invisible.
     La relación de aspecto está fijada (1536×308) para que el contenedor
     reserve su altura antes de que la imagen llegue y la barra no salte. */
  .brand{
    display:block;padding:15px 14px 12px;margin:2px 2px 8px;border-radius:18px;
    background:linear-gradient(150deg,var(--navy) 0%,var(--navy-2) 55%,var(--navy-3) 100%);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 10px 26px rgba(11,37,69,.28),inset 0 1px 0 rgba(255,255,255,.22);
  }
  .brand .logo{
    display:block;width:100%;max-width:190px;height:auto;margin:0 auto;
    aspect-ratio:1536/308;object-fit:contain
  }
  .brand .wordmark{
    display:block;max-width:190px;margin:0 auto;text-align:center;
    font-family:'Inter',sans-serif;font-size:14px;font-weight:700;line-height:1.2;color:#fff
  }
  .brand .tagline{
    display:block;margin-top:10px;text-align:center;font-size:9.5px;font-weight:800;
    letter-spacing:.17em;text-transform:uppercase;color:rgba(255,255,255,.72)
  }
  /* Marca compacta de la barra superior: solo aparece cuando el menú lateral
     se oculta (≤860px), para que el logotipo nunca desaparezca del todo. */
  .topbar-brand{
    display:none;align-items:center;flex-shrink:0;height:34px;padding:0 12px;border-radius:12px;
    background:linear-gradient(150deg,var(--navy),var(--navy-3));
    box-shadow:0 5px 14px rgba(11,37,69,.26),inset 0 1px 0 rgba(255,255,255,.22)
  }
  .topbar-brand .logo{display:block;height:16px;width:auto;max-width:118px;object-fit:contain}
  .topbar-brand .wordmark{font-size:11px;font-weight:800;color:#fff;letter-spacing:.06em;white-space:nowrap}

  .nav{flex:1;overflow-y:auto;padding:4px 2px;display:flex;flex-direction:column;gap:3px}
  .nav .nav-label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);padding:14px 12px 6px;opacity:.75}
  .nav button{
    position:relative;width:100%;text-align:left;background:transparent;border:1px solid transparent;
    color:var(--ink-2);font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;
    padding:9px 12px;border-radius:13px;cursor:pointer;display:flex;gap:11px;align-items:center;
    transition:background var(--fast),color var(--fast),transform var(--fast) var(--ease),box-shadow var(--fast),border-color var(--fast);
  }
  .nav button::before{
    content:"";position:absolute;left:5px;top:50%;width:3px;height:0;border-radius:99px;
    background:linear-gradient(180deg,var(--sky),var(--teal));transform:translateY(-50%);
    transition:height var(--mid) var(--ease);
  }
  .nav button:hover{background:rgba(255,255,255,.7);color:var(--navy);transform:translateX(2px);box-shadow:var(--sh-1)}
  .nav button:focus-visible{outline:none;box-shadow:var(--ring)}
  .nav button.active{
    background:linear-gradient(135deg,rgba(46,159,214,.18),rgba(22,169,155,.13));
    color:var(--navy);border-color:rgba(46,159,214,.3);box-shadow:var(--sh-1),var(--g-hi);
  }
  .nav button.active::before{height:18px}
  .nav button.active .ico{background:linear-gradient(145deg,var(--sky),var(--teal));color:#fff;box-shadow:0 5px 14px rgba(46,159,214,.4)}
  .nav button:disabled{opacity:.42;cursor:not-allowed;transform:none;background:transparent;box-shadow:none}
  .nav .ico{
    width:30px;height:30px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;
    background:rgba(255,255,255,.72);color:var(--navy-3);box-shadow:var(--sh-1),var(--g-hi);
    transition:background var(--fast),color var(--fast),box-shadow var(--fast);
  }
  .nav .ico svg{width:16px;height:16px}

  .sidebar .foot{padding:12px;border-radius:var(--r-m);font-size:11.5px;color:var(--muted);
    background:rgba(255,255,255,.55);border:1px solid var(--g-brd);box-shadow:var(--g-hi)}
  .sidebar .foot .u{color:var(--navy);font-weight:700;font-size:12.5px}
  .sidebar .foot button{
    margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
    background:rgba(255,255,255,.7);border:1px solid var(--border-input);color:var(--ink-2);
    border-radius:11px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;
    font-family:'Inter',sans-serif;transition:all var(--fast) var(--ease);
  }
  .sidebar .foot button:hover{background:#fff;color:var(--red);border-color:rgba(192,69,60,.35);transform:translateY(-1px);box-shadow:var(--sh-1)}
  .sidebar .foot button:active{transform:translateY(0) scale(.99)}
  .sidebar .foot button:focus-visible{outline:none;box-shadow:var(--ring)}
  .sidebar .foot button svg{width:14px;height:14px}

  .avatar{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;
    background:linear-gradient(145deg,var(--navy-3),var(--navy));color:#fff;
    font-weight:800;font-size:12.5px;box-shadow:0 5px 14px rgba(11,37,69,.28),var(--g-hi)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    padding:11px 22px;display:flex;gap:14px;align-items:center;position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.46));
    -webkit-backdrop-filter:blur(22px) saturate(170%);
    backdrop-filter:blur(22px) saturate(170%);
    border-bottom:1px solid var(--g-brd);
  }
  .topbar .search{flex:1;max-width:520px;position:relative;display:flex;align-items:center}
  .topbar .search input{width:100%;padding-left:38px}
  .search .s-ico{position:absolute;left:13px;width:16px;height:16px;color:var(--muted);pointer-events:none;z-index:1}
  .breadcrumb{display:flex;flex-direction:column;gap:1px;min-width:0}
  .breadcrumb .bc-path{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .breadcrumb .bc-title{font-family:'Inter',sans-serif;font-size:15px;font-weight:700;color:var(--navy);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto}
  .topbar .role-chip{
    font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--navy-3);
    background:linear-gradient(135deg,rgba(46,159,214,.16),rgba(22,169,155,.12));
    padding:6px 12px;border-radius:var(--r-pill);border:1px solid rgba(46,159,214,.26);
    white-space:nowrap;box-shadow:var(--g-hi)
  }
  .hamburger{
    display:none;background:rgba(255,255,255,.7);border:1px solid var(--g-brd);border-radius:12px;
    padding:8px;cursor:pointer;color:var(--navy);box-shadow:var(--sh-1);transition:all var(--fast) var(--ease)
  }
  .hamburger:hover{background:#fff;transform:translateY(-1px)}
  .hamburger:active{transform:scale(.96)}
  .hamburger:focus-visible{outline:none;box-shadow:var(--ring)}
  .hamburger svg{width:18px;height:18px;display:block}
  /* OJO con el fill-mode: con `both`, Chrome mantiene a .content como bloque
     contenedor de los descendientes `position:fixed` incluso después de que la
     animación termina (porque anima `transform`). Eso recortaba los diálogos al
     alto de esta caja. Con `backwards` la animación se ve igual y el elemento
     deja de ser bloque contenedor al acabar. Los diálogos, además, se dibujan
     con un portal en <body> (ver Modal). */
  .content{padding:24px 22px 40px;max-width:1240px;width:100%;margin:0 auto;animation:fadeUp .4s var(--ease) backwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* Aviso de modo desarrollo (permisos de UI desbloqueados) */
  .dev-banner{
    display:flex;align-items:center;gap:10px;padding:9px 22px;font-size:12px;font-weight:600;
    color:#7A4E0E;background:linear-gradient(135deg,rgba(224,165,55,.28),rgba(224,165,55,.14));
    border-bottom:1px solid rgba(176,115,26,.3);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)
  }
  .dev-banner svg{width:16px;height:16px;flex-shrink:0}
  .dev-banner code{background:rgba(255,255,255,.6);padding:1px 6px;border-radius:6px;font-size:11.5px}

  /* ---- Superficies ---- */
  .card{
    background:linear-gradient(158deg,var(--g-1),var(--g-2));
    -webkit-backdrop-filter:blur(var(--blur)) saturate(165%);
    backdrop-filter:blur(var(--blur)) saturate(165%);
    border:1px solid var(--g-brd);border-radius:var(--r-m);padding:18px 20px;
    box-shadow:var(--sh-2),var(--g-hi);
    transition:transform var(--mid) var(--ease),box-shadow var(--mid),border-color var(--mid);
  }
  /* Tarjeta interactiva: elevación sutil al pasar el mouse */
  .card.int{cursor:pointer}
  .card.int:hover{transform:translateY(-3px);box-shadow:var(--sh-3),var(--g-hi);border-color:rgba(46,159,214,.32)}
  .card.int:active{transform:translateY(-1px) scale(.995)}
  .grid{display:grid;gap:14px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
  .form-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

  /* KPI estilo Argon: etiqueta + cifra + icono en mosaico */
  .stat{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;inset:auto -30% -60% auto;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.5),transparent 70%);pointer-events:none}
  .stat:hover{transform:translateY(-3px);box-shadow:var(--sh-3),var(--g-hi)}
  .stat .l{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;line-height:1.35}
  .stat .n{font-family:'Inter',sans-serif;font-size:30px;font-weight:700;margin:6px 0 0;line-height:1.05}
  .stat .kpi-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;color:#fff;
    box-shadow:0 8px 20px rgba(11,37,69,.22),var(--g-hi)}
  .stat .kpi-ico svg{width:20px;height:20px}
  /* Las tarjetas del resumen son botones (abren la lista del indicador):
     se les quita el aspecto nativo de <button> y se les da el de tarjeta. */
  .statbtn{width:100%;font-family:'Inter',sans-serif;cursor:pointer;text-align:left;
    -webkit-tap-highlight-color:transparent}
  .statbtn:focus-visible{outline:none;box-shadow:var(--ring),var(--sh-2)}
  .statbtn:active{transform:translateY(-1px) scale(.995)}
  .ico-navy{background:linear-gradient(145deg,var(--navy-3),var(--navy))}
  .ico-sky{background:linear-gradient(145deg,var(--sky-2),var(--sky))}
  .ico-green{background:linear-gradient(145deg,var(--green-2),var(--green))}
  .ico-red{background:linear-gradient(145deg,var(--red-2),var(--red))}
  .ico-amber{background:linear-gradient(145deg,var(--amber-2),var(--amber))}
  .ico-teal{background:linear-gradient(145deg,#3FD0C0,var(--teal))}

  .page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .section-title{font-size:16px;margin-bottom:14px;color:var(--navy)}

  /* ---- Formularios ---- */
  label.f{display:flex;flex-direction:column;gap:6px;font-size:13px}
  label.f>span{color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.02em}
  /* Igual que label.f pero en un <div>: para controles que NO son un campo de
     formulario nativo (un <label> alrededor de varios botones reenviaría el
     clic al primero de ellos). */
  .fieldbox{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .fieldbox>span{color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.02em}
  input,select,textarea{
    border:1px solid var(--border-input);border-radius:12px;padding:10px 12px;font-size:13.5px;
    font-family:'Inter',sans-serif;color:var(--ink);outline:none;width:100%;
    background:rgba(255,255,255,.62);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:var(--g-hi);
    transition:border-color var(--fast),box-shadow var(--fast),background var(--fast);
  }
  input::placeholder,textarea::placeholder{color:rgba(102,120,141,.75)}
  input:hover,select:hover,textarea:hover{background:rgba(255,255,255,.78)}
  input:focus,select:focus,textarea:focus{background:rgba(255,255,255,.92);border-color:var(--sky);box-shadow:var(--ring),var(--g-hi)}
  input:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:not-allowed;background:rgba(255,255,255,.4)}
  textarea{min-height:70px;resize:vertical;line-height:1.5}
  select{appearance:none;-webkit-appearance:none;padding-right:34px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2366788D' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 11px center;background-size:15px}
  input[type=checkbox]{width:auto;accent-color:var(--sky);cursor:pointer;box-shadow:none;padding:0}
  input[type=date]{min-height:41px}
  input[type=file]{padding:8px}

  /* ---- Botones ---- */
  .btn{
    position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid transparent;border-radius:13px;padding:11px 18px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.01em;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    transition:transform var(--fast) var(--ease),box-shadow var(--mid),background var(--mid),
               border-color var(--mid),color var(--mid),filter var(--mid);
  }
  .btn svg{width:15px;height:15px;flex-shrink:0}
  /* destello de vidrio al pasar el mouse */
  .btn::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 28%,rgba(255,255,255,.38) 50%,transparent 72%);
    transform:translateX(-130%);transition:transform .65s var(--ease);
  }
  .btn:hover::after{transform:translateX(130%)}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0) scale(.982)}
  .btn:focus-visible{outline:none;box-shadow:var(--ring),var(--sh-2)}
  /* Deshabilitado: se distingue por opacidad, desaturación y sin elevación.
     No se usa pointer-events:none para que el `title` explicativo siga visible. */
  .btn:disabled{
    opacity:.5;cursor:not-allowed;transform:none;filter:grayscale(.35);box-shadow:none;
  }
  .btn:disabled:hover{transform:none;box-shadow:none}
  .btn:disabled::after{display:none}
  .btn.primary{background:linear-gradient(135deg,var(--navy-3),var(--navy));color:#F2F8FF;
    box-shadow:0 6px 18px rgba(11,37,69,.26),var(--g-hi)}
  .btn.primary:hover{box-shadow:0 14px 30px rgba(11,37,69,.32),var(--g-hi)}
  .btn.accent{background:linear-gradient(135deg,var(--sky-2),var(--sky) 55%,var(--teal));color:#fff;
    box-shadow:0 6px 18px rgba(46,159,214,.34),var(--g-hi)}
  .btn.accent:hover{box-shadow:0 14px 30px rgba(46,159,214,.4),var(--g-hi)}
  .btn.ghost{
    background:rgba(255,255,255,.6);color:var(--navy);border-color:var(--g-brd);font-weight:700;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--sh-1),var(--g-hi)
  }
  .btn.ghost:hover{background:rgba(255,255,255,.92);border-color:rgba(46,159,214,.4);color:var(--navy-3);box-shadow:var(--sh-2),var(--g-hi)}
  .btn.danger{background:linear-gradient(135deg,var(--red-2),var(--red));color:#fff;
    box-shadow:0 6px 18px rgba(192,69,60,.3),var(--g-hi)}
  .btn.excel{background:linear-gradient(135deg,#21A366,#107C41);color:#fff;border-color:transparent;
    box-shadow:0 8px 20px rgba(16,124,65,.28),var(--g-hi)}
  .btn.excel:hover:not(:disabled){box-shadow:0 12px 26px rgba(16,124,65,.38),var(--g-hi);transform:translateY(-1px)}
  .btn.excel .spinner.dark{border-color:rgba(255,255,255,.35);border-top-color:#fff}

  /* ---- Barra de desplazamiento horizontal superior ----
     Copia de la barra inferior de cada .table-wrap, puesta arriba de la
     tabla para moverse a la derecha sin bajar hasta el final. */
  .top-scroll{overflow-x:auto;overflow-y:hidden;height:14px;margin:0 0 6px;border-radius:8px;
    background:rgba(15,32,53,.04)}
  .top-scroll>div{height:1px}
  .top-scroll::-webkit-scrollbar,.table-wrap::-webkit-scrollbar{height:11px}
  .top-scroll::-webkit-scrollbar-thumb,.table-wrap::-webkit-scrollbar-thumb{background:rgba(30,76,122,.35);border-radius:10px}
  .top-scroll::-webkit-scrollbar-thumb:hover,.table-wrap::-webkit-scrollbar-thumb:hover{background:rgba(30,76,122,.55)}
  .top-scroll::-webkit-scrollbar-track,.table-wrap::-webkit-scrollbar-track{background:transparent}
  .btn.danger:hover{box-shadow:0 14px 30px rgba(192,69,60,.36),var(--g-hi)}
  .btn.sm{padding:7px 13px;font-size:12px;border-radius:11px;gap:6px}
  .btn.sm svg{width:13px;height:13px}
  .btn.block{width:100%}
  .linkbtn{
    background:none;border:none;cursor:pointer;font-weight:700;font-size:12.5px;font-family:'Inter',sans-serif;
    padding:2px 0;border-radius:6px;transition:opacity var(--fast),transform var(--fast) var(--ease);
    border-bottom:1.5px solid transparent
  }
  .linkbtn:hover{opacity:.78;border-bottom-color:currentColor}
  .linkbtn:active{transform:scale(.97)}
  .linkbtn:focus-visible{outline:none;box-shadow:var(--ring)}
  .linkbtn:disabled{opacity:.45;cursor:not-allowed;border-bottom-color:transparent}

  /* ---- Selector segmentado (clasificación administrativo / asistencial) ---- */
  /* Los botones NO se encogen por debajo de su texto: si la columna es
     estrecha, el grupo pasa a dos filas en vez de recortar la etiqueta. */
  .seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:13px;width:100%;
    background:rgba(255,255,255,.55);border:1px solid var(--border-input);box-shadow:var(--g-hi)}
  .seg button{
    flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;
    font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;
    white-space:nowrap;transition:all var(--fast) var(--ease)
  }
  .seg button svg{width:14px;height:14px;flex-shrink:0}
  .seg button:hover:not(:disabled){background:rgba(255,255,255,.85);color:var(--navy)}
  .seg button:focus-visible{outline:none;box-shadow:var(--ring)}
  .seg button.on{
    background:linear-gradient(135deg,var(--sky-2),var(--sky) 58%,var(--teal));color:#fff;
    box-shadow:0 5px 14px rgba(46,159,214,.32),var(--g-hi)
  }
  .seg button:disabled{opacity:.5;cursor:not-allowed}

  /* ---- Accesos de documentos (hoja de vida / contrato) ---- */
  .doc-links{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .doc-link{
    display:flex;align-items:center;gap:14px;text-align:left;width:100%;cursor:pointer;
    background:linear-gradient(158deg,var(--g-1),var(--g-2));
    -webkit-backdrop-filter:blur(var(--blur)) saturate(165%);backdrop-filter:blur(var(--blur)) saturate(165%);
    border:1px solid var(--g-brd);border-radius:var(--r-m);padding:18px 20px;
    font-family:'Inter',sans-serif;box-shadow:var(--sh-2),var(--g-hi);
    transition:transform var(--mid) var(--ease),box-shadow var(--mid),border-color var(--mid)
  }
  .doc-link:hover{transform:translateY(-3px);box-shadow:var(--sh-3),var(--g-hi);border-color:rgba(46,159,214,.32)}
  .doc-link:active{transform:translateY(-1px) scale(.995)}
  .doc-link:focus-visible{outline:none;box-shadow:var(--ring),var(--sh-2)}
  .doc-link .ico{width:46px;height:46px;flex-shrink:0;border-radius:15px;display:grid;place-items:center;color:#fff;
    box-shadow:0 8px 20px rgba(11,37,69,.22),var(--g-hi)}
  .doc-link .ico svg{width:21px;height:21px}
  .doc-link .t{font-family:'Inter',sans-serif;font-size:15px;font-weight:700;color:var(--navy)}
  .doc-link .s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}

  /* ---- Badges ---- */
  .badge{
    display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;font-weight:800;padding:5px 11px;border-radius:var(--r-pill);
    border:1px solid;white-space:nowrap;box-shadow:var(--g-hi);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 3px currentColor;opacity:.95}
  .b-green{color:#12734D;background:var(--green-bg);border-color:rgba(21,138,91,.34)}
  .b-green .dot{background:var(--green);box-shadow:0 0 0 3px rgba(21,138,91,.18)}
  .b-red{color:#9B342C;background:var(--red-bg);border-color:rgba(192,69,60,.34)}
  .b-red .dot{background:var(--red);box-shadow:0 0 0 3px rgba(192,69,60,.18)}
  .b-amber{color:#8A5A12;background:var(--amber-bg);border-color:rgba(176,115,26,.34)}
  .b-amber .dot{background:var(--amber);box-shadow:0 0 0 3px rgba(176,115,26,.18)}
  .b-sky{color:#175F84;background:var(--sky-soft);border-color:rgba(46,159,214,.34)}
  .b-sky .dot{background:var(--sky);box-shadow:0 0 0 3px rgba(46,159,214,.18)}

  /* ---- Tablas ---- */
  .table-wrap{
    overflow-x:auto;border:1px solid var(--g-brd);border-radius:var(--r-m);
    background:linear-gradient(158deg,var(--g-1),var(--g-2));
    -webkit-backdrop-filter:blur(var(--blur)) saturate(165%);
    backdrop-filter:blur(var(--blur)) saturate(165%);
    box-shadow:var(--sh-2),var(--g-hi);
  }
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid rgba(15,32,53,.07);white-space:nowrap}
  th{background:rgba(255,255,255,.42);color:var(--muted);font-weight:800;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.08em}
  td{color:var(--ink-2)}
  td b{color:var(--navy)}
  tbody tr{transition:background var(--fast),box-shadow var(--fast)}
  tbody tr:hover{background:linear-gradient(90deg,rgba(46,159,214,.10),rgba(22,169,155,.05));cursor:pointer}
  tbody tr:last-child td{border-bottom:none}

  /* ---- Alertas ---- */
  .alert{
    position:relative;border-radius:var(--r-m);padding:14px 18px 14px 22px;border:1px solid;
    display:flex;justify-content:space-between;gap:14px;align-items:center;overflow:hidden;
    -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
    box-shadow:var(--sh-1),var(--g-hi);
    transition:transform var(--fast) var(--ease),box-shadow var(--mid)
  }
  .alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:currentColor;opacity:.85}
  .alert:hover{transform:translateX(3px);box-shadow:var(--sh-2),var(--g-hi)}
  .alert .t{font-weight:700;font-size:13.5px}
  .alert .s{font-size:12.5px;margin-top:3px;opacity:.85}
  .a-red{background:var(--red-bg);border-color:rgba(192,69,60,.3);color:#9B342C}
  .a-amber{background:var(--amber-bg);border-color:rgba(176,115,26,.3);color:#8A5A12}
  .a-sky{background:var(--sky-soft);border-color:rgba(46,159,214,.3);color:#175F84}

  /* ---- Centro de alertas desplegable ----
     Una sección por tema (vacaciones, contratos, incapacidades, dotación),
     cerrada por defecto: el resumen solo muestra el título y el conteo. */
  .acc{
    border-radius:var(--r-m);border:1px solid var(--g-brd);overflow:hidden;
    background:linear-gradient(158deg,var(--g-1),var(--g-2));
    -webkit-backdrop-filter:blur(var(--blur)) saturate(165%);backdrop-filter:blur(var(--blur)) saturate(165%);
    box-shadow:var(--sh-1),var(--g-hi);transition:box-shadow var(--mid)
  }
  .acc[open]{box-shadow:var(--sh-2),var(--g-hi)}
  .acc>summary{
    list-style:none;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;
    font-weight:700;font-size:14px;color:var(--navy);user-select:none;transition:background var(--fast)
  }
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary:hover{background:rgba(255,255,255,.55)}
  .acc>summary:focus-visible{outline:none;box-shadow:inset var(--ring)}
  .acc>summary .kpi-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;flex-shrink:0;
    box-shadow:0 6px 14px rgba(11,37,69,.18),var(--g-hi)}
  .acc>summary .kpi-ico svg{width:16px;height:16px}
  .acc .acc-sub{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
  .acc .chev{margin-left:auto;display:grid;place-items:center;color:var(--muted);transition:transform var(--mid) var(--ease)}
  .acc[open] .chev{transform:rotate(180deg)}
  .acc .acc-body{padding:4px 14px 14px;display:grid;gap:8px}
  .count{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:var(--r-pill);
    font-size:11.5px;font-weight:800;border:1px solid}
  .count.c-red{color:#9B342C;background:var(--red-bg);border-color:rgba(192,69,60,.34)}
  .count.c-amber{color:#8A5A12;background:var(--amber-bg);border-color:rgba(176,115,26,.34)}
  .count.c-sky{color:#175F84;background:var(--sky-soft);border-color:rgba(46,159,214,.34)}
  .count.c-none{color:var(--muted);background:rgba(15,32,53,.05);border-color:rgba(15,32,53,.1)}

  /* ---- Calendario colombiano ---- */
  .cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
  @media (max-width:980px){.cal-layout{grid-template-columns:1fr}}
  .cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .cal-head h3{margin:0 auto 0 4px;font-size:17px;color:var(--navy);text-transform:capitalize}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .cal-dow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
  .cal-day{min-height:86px;border-radius:12px;border:1px solid var(--g-brd);background:rgba(255,255,255,.62);
    padding:6px 7px;display:flex;flex-direction:column;gap:3px;font-size:11.5px;overflow:hidden}
  .cal-day .num{font-weight:800;font-size:13px;color:var(--navy)}
  .cal-day.out{opacity:.35}
  .cal-day.wknd{background:rgba(15,32,53,.04)}
  .cal-day.sat .num{color:var(--muted)}
  .cal-day.sun .num{color:#9B342C}
  .cal-day.fest{background:var(--red-bg);border-color:rgba(192,69,60,.35)}
  .cal-day.fest .num{color:#9B342C}
  .cal-day.today{box-shadow:0 0 0 2px var(--sky)}
  .cal-day .fname{font-weight:700;color:#9B342C;line-height:1.2}
  .cal-day .vac{color:#175F84;background:var(--sky-soft);border-radius:6px;padding:1px 5px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-day{cursor:pointer;transition:box-shadow var(--fast)}
  .cal-day:hover{box-shadow:0 0 0 2px rgba(46,159,214,.35)}
  .cal-day .ev{border-left:3px solid;border-radius:6px;padding:1px 5px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .cal-day .ev:hover{filter:brightness(.96)}
  .cal-day .ev.done{opacity:.5;text-decoration:line-through}
  .nav .nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:20px;display:inline-grid;place-items:center;
    background:#C0453C;color:#fff;font-size:11px;font-weight:800}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
  .cal-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1px solid var(--g-brd)}
  .fest-list{display:grid;gap:4px;font-size:12.5px}
  .fest-list div{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:8px}
  .fest-list div.past{opacity:.5}
  .fest-list div.cur{background:var(--sky-soft)}
  @media (max-width:640px){.cal-day{min-height:58px;font-size:10px}.cal-day .vac{display:none}.cal-day .ev{padding:0 3px}}

  /* ---- Línea de tiempo (historial de cargos) ---- */
  .tl{position:relative;display:grid;gap:12px;padding-left:24px}
  .tl::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;border-radius:2px;
    background:linear-gradient(180deg,var(--sky),var(--teal));opacity:.35}
  .tl-item{position:relative}
  .tl-item::before{content:"";position:absolute;left:-22px;top:21px;width:12px;height:12px;border-radius:50%;
    background:#fff;border:3px solid var(--sky);box-shadow:0 0 0 3px rgba(46,159,214,.15)}
  .tl-item.now::before{background:var(--teal);border-color:#fff;box-shadow:0 0 0 3px rgba(22,169,155,.3)}

  /* Casilla de verificación con aspecto de campo (pagadas en dinero, carné…) */
  label.check{
    display:flex;align-items:center;gap:10px;min-height:41px;padding:9px 12px;cursor:pointer;
    border:1px solid var(--border-input);border-radius:12px;background:rgba(255,255,255,.62);
    font-size:13px;font-weight:600;color:var(--ink-2);box-shadow:var(--g-hi);transition:background var(--fast),border-color var(--fast)
  }
  label.check:hover{background:rgba(255,255,255,.85)}
  label.check input{width:17px;height:17px;flex-shrink:0}
  label.check.on{border-color:rgba(21,138,91,.4);background:var(--green-bg);color:#12734D}

  /* Dato de solo lectura. min-width:0 deja que la columna de la rejilla se
     encoja y overflow-wrap parte los valores largos sin espacios (correos),
     que antes se salían de su columna y se montaban sobre la siguiente. */
  .info{min-width:0}
  .info .v{margin-top:2px;font-weight:600;overflow-wrap:anywhere;word-break:break-word}
  .kv>span{min-width:0;overflow-wrap:anywhere}

  /* ---- Modal ----
     El diálogo NUNCA crece más que la ventana: la caja se limita con
     max-height y el que desplaza es su cuerpo interno (.modal-body), no la
     capa de fondo. Así el formulario no queda cortado cuando tiene más
     campos que altura disponible, y la cabecera con el botón de cerrar
     siempre permanece visible. */
  .overlay{
    position:fixed;inset:0;z-index:60;background:rgba(11,37,69,.44);
    display:flex;align-items:center;justify-content:center;
    padding:clamp(10px,3vh,30px) clamp(10px,3vw,24px);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    overscroll-behavior:contain;animation:ovIn .22s var(--ease) both
  }
  @keyframes ovIn{from{opacity:0}to{opacity:1}}
  /* Bloquea el desplazamiento del fondo mientras hay un diálogo abierto. */
  body.modal-open{overflow:hidden}
  .modal{
    display:flex;flex-direction:column;width:100%;max-width:780px;max-height:100%;min-height:0;
    background:linear-gradient(158deg,rgba(255,255,255,.92),rgba(255,255,255,.8));
    -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
    border:1px solid var(--g-brd);border-radius:var(--r-l);overflow:hidden;
    box-shadow:var(--sh-3),var(--g-hi);animation:mdIn .3s var(--ease) both
  }
  @keyframes mdIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  .modal-head{
    flex:0 0 auto;display:flex;align-items:flex-start;gap:14px;padding:22px 24px 15px;
    border-bottom:1px solid rgba(15,32,53,.08);background:rgba(255,255,255,.5)
  }
  .modal-head h2{flex:1;min-width:0;font-size:18px;margin:0;color:var(--navy);line-height:1.3}
  .modal-body{
    flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    padding:18px 24px 22px;-webkit-overflow-scrolling:touch
  }
  .modal .x{
    flex-shrink:0;background:rgba(255,255,255,.65);border:1px solid var(--g-brd);width:32px;height:32px;
    border-radius:11px;font-size:18px;line-height:1;cursor:pointer;color:var(--muted);display:grid;
    place-items:center;transition:all var(--fast) var(--ease);box-shadow:var(--g-hi)
  }
  .modal .x:hover{background:#fff;color:var(--red);transform:rotate(90deg)}
  .modal .x:focus-visible{outline:none;box-shadow:var(--ring)}
  /* Barra de acciones fija al pie del diálogo, siempre alcanzable. */
  .modal-foot{
    flex:0 0 auto;display:flex;gap:10px;flex-wrap:wrap;padding:14px 24px;
    border-top:1px solid rgba(15,32,53,.08);background:rgba(255,255,255,.55)
  }

  /* ---- Pestañas ---- */
  .tabs{
    display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;padding:5px;border-radius:var(--r-m);
    background:rgba(255,255,255,.45);border:1px solid var(--g-brd);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--g-hi)
  }
  .tabs button{
    background:none;border:1px solid transparent;padding:9px 15px;font-size:12.5px;font-weight:700;
    cursor:pointer;color:var(--muted);border-radius:11px;font-family:'Inter',sans-serif;
    transition:all var(--fast) var(--ease)
  }
  .tabs button:hover{background:rgba(255,255,255,.75);color:var(--navy)}
  .tabs button:focus-visible{outline:none;box-shadow:var(--ring)}
  .tabs button.active{
    background:linear-gradient(135deg,#fff,rgba(255,255,255,.82));color:var(--navy);
    border-color:var(--g-brd);box-shadow:var(--sh-1),var(--g-hi)
  }

  .empty{
    border:1px dashed rgba(15,32,53,.18);border-radius:var(--r-m);padding:30px 22px;text-align:center;
    color:var(--muted);font-size:13px;background:rgba(255,255,255,.35);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)
  }
  .muted{color:var(--muted)}
  .rowbtns{display:flex;gap:10px;flex-wrap:wrap}
  .kv{display:flex;flex-wrap:wrap;gap:7px 22px;font-size:12.5px;color:var(--muted)}
  .kv b{color:var(--navy)}

  /* ---- Gráficos ----
     Etiqueta flotante del gráfico de barras. Va anclada al centro de la
     columna señalada y se centra sobre ella; `pointer-events:none` evita
     que se interponga entre el cursor y la barra. */
  .viz-tip{
    position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
    background:rgba(255,255,255,.96);border:1px solid var(--g-brd);border-radius:11px;
    padding:7px 11px;font-size:12px;color:var(--ink-2);box-shadow:var(--sh-2),var(--g-hi);z-index:5
  }
  .viz-tip b{color:var(--navy)}

  /* Panel de permisos */
  .perm-table td:first-child{font-weight:700;color:var(--navy)}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 9px;
    border-radius:var(--r-pill);border:1px solid}
  .tag-yes{color:#12734D;background:var(--green-bg);border-color:rgba(21,138,91,.32)}
  .tag-no{color:var(--muted);background:rgba(15,32,53,.05);border-color:rgba(15,32,53,.1)}

  /* ---- Toasts ---- */
  .toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:100;max-width:380px}
  .toast{
    position:relative;padding:13px 16px 13px 20px;border-radius:var(--r-m);font-size:13px;font-weight:600;
    border:1px solid;overflow:hidden;box-shadow:var(--sh-2),var(--g-hi);
    -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
    animation:tIn .3s var(--ease) both
  }
  .toast::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:currentColor;opacity:.9}
  @keyframes tIn{from{opacity:0;transform:translateX(24px) scale(.96)}to{opacity:1;transform:none}}
  .toast.ok{background:rgba(226,246,236,.88);border-color:rgba(21,138,91,.3);color:#12734D}
  .toast.err{background:rgba(251,235,233,.9);border-color:rgba(192,69,60,.3);color:#9B342C}
  .toast.info{background:rgba(229,243,250,.9);border-color:rgba(46,159,214,.3);color:#175F84}

  /* ---- Autenticación ---- */
  .auth{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;position:relative;overflow:hidden;
    background:

<!-- Diagnóstico: si algo falla, se muestra en pantalla en vez de quedar en blanco -->
<script>
  function __showFatal(title, detail){
    var r = document.getElementById("root");
    if(!r) return;
    r.innerHTML =
      '<div style="max-width:720px;margin:48px auto;font-family:Inter,Arial,sans-serif;'+
      'background:rgba(251,235,233,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);'+

      '<h2 style="margin:0 0 10px;font-family:Georgia,serif;font-size:19px">⚠️ '+title+'</h2>'+
      '<pre style="white-space:pre-wrap;font-size:13px;margin:0;line-height:1.6">'+String(detail||"").replace(/</g,"&lt;")+'</pre>'+
      '<p style="margin:14px 0 0;font-size:12.5px;color:#66788D">Revisa esta información o compártela para diagnosticar. '+
      'Verifica también tu conexión y que SUPABASE_URL/anon key sean correctas.</p></div>';
  }
  window.addEventListener("error", function(e){
    __showFatal("Error al cargar la aplicación", (e && e.message) ? e.message : e);
  });
  window.addEventListener("unhandledrejection", function(e){
    var r = e && e.reason; __showFatal("Error de conexión o de datos", (r && r.message) ? r.message : r);
  });
  // Si tras 6s no se montó nada (p. ej. un CDN bloqueado), avisar.
  setTimeout(function(){
    var r = document.getElementById("root");
    if(r && r.childElementCount === 0 && r.textContent.trim() === ""){
      __showFatal("La aplicación no terminó de cargar",
        "No se cargaron las librerías (React/Babel/Supabase) desde Internet, o hubo un error de compilación. "+
        "Verifica tu conexión. Si estás sin Internet, la app no puede funcionar porque usa Supabase en la nube.");
    }
  }, 6000);
</script>

const holidayName = (date) => holidaysOf(date.getFullYear())[isoOf(date)] || null;
/* Festivos que caen dentro de un rango (ambas fechas incluidas). */
function holidaysBetween(a,b){
  if(!a||!b||b<a) return [];
  const out=[];
  for(const d=new Date(a+"T00:00:00"), e=new Date(b+"T00:00:00"); d<=e && out.length<60; d.setDate(d.getDate()+1)){
    const n = holidayName(d); if(n) out.push({ iso:isoOf(d), name:n });
  }
  return out;
}

const isWorkday = (date,tipo) => { const d=date.getDay(); return d>=1 && d<=lastWorkDay(tipo) && !holidayName(date); };
/* Días hábiles entre dos fechas, ambas incluidas. */
const businessDays = (a,b,tipo) => {
  if(!a||!b) return 0;
  const s=new Date(a+"T00:00:00"), e=new Date(b+"T00:00:00");
  if(isNaN(s)||isNaN(e)||e<s) return 0;
  if((e-s)/86400000 > 3660) return 0;      // rango absurdo: no se cuenta
  let n=0;
  for(const d=new Date(s); d<=e; d.setDate(d.getDate()+1)) if(isWorkday(d,tipo)) n++;
  return n;
};
/* Último día de un disfrute de `n` días hábiles que empieza en `start`. */
const addBusinessDays = (start,n,tipo) => {
  if(!start || !(n>0) || n>400) return start;
  const d=new Date(start+"T00:00:00"); let k=0;
  for(let guard=0; guard<1200; guard++){
    if(isWorkday(d,tipo) && ++k>=n) break;
    d.setDate(d.getDate()+1);
  }
  return isoOf(d);
};
/* Fecha de reintegro: primer día hábil después del último día de vacaciones. */
const nextWorkday = (iso,tipo) => {
  if(!iso) return "";
  const d=new Date(iso+"T00:00:00");
  for(let guard=0; guard<30; guard++){ d.setDate(d.getDate()+1); if(isWorkday(d,tipo)) break; }
  return isoOf(d);
};

/* Suma meses sin desbordar: 31/01 + 1 mes = 28 o 29/02, no 03/03. */
const addMonthsISO = (iso,n) => {
  const [y,m,d] = iso.slice(0,10).split("-").map(Number);
  const ultimo = new Date(y, m-1+n+1, 0).getDate();
  return isoOf(new Date(y, m-1+n, Math.min(d, ultimo)));
};

/* =====================================================================
   PERIODO DE PRUEBA (CST arts. 77 y 78)
   Máximo dos meses. En contratos a término fijo de menos de un año no
   puede pasar de la quinta parte de la duración pactada. Prestación de
   servicios y aprendizaje no son contratos laborales con periodo de
   prueba. Devuelve el último día del periodo o null si no aplica.
   ===================================================================== */
const SIN_PERIODO_PRUEBA = { prestacion_servicios:true, aprendizaje:true };
function periodoPruebaFin(type, start, end){
  if(!start || SIN_PERIODO_PRUEBA[type]) return null;
  const maximo = addDaysISO(addMonthsISO(start,2), -1);
  if(type==="termino_fijo" && end){
    const duracion = daysBetween(start, end);
    if(duracion>0 && duracion<365){
      const quinta = Math.floor(duracion/5);
      if(quinta<1) return null;
      const fin = addDaysISO(start, quinta-1);
      return fin<maximo ? fin : maximo;
    }
  }
  return maximo;
}

/* =====================================================================
   APRENDICES SENA
   Cada etapa dura `sena_months` meses (6 por defecto) desde su inicio.
   Si ingresó en lectiva y ya tiene fecha de productiva, la lectiva quedó
   cerrada ese día y el conteo corre desde la productiva.
   Devuelve { etapa, inicio, fin, meses } o null si no hay fechas.
   ===================================================================== */
function senaEtapa(e){
  if(!e) return null;
  const meses = Number(e.sena_months) > 0 ? Number(e.sena_months) : 6;
  const etapa = e.sena_productiva_start ? "productiva" : e.sena_lectiva_start ? "lectiva" : null;
  if(!etapa) return null;
  const inicio = etapa==="productiva" ? e.sena_productiva_start : e.sena_lectiva_start;
  return { etapa, inicio, fin: addDaysISO(addMonthsISO(inicio, meses), -1), meses };
}

/* =====================================================================
   PERIODOS ANUALES DE VACACIONES
   Cada periodo va del aniversario de ingreso al día anterior al siguiente
   aniversario: quien ingresó el 01/03/2023 tiene 2023-2024 (01/03/2023 →
   29/02/2024), 2024-2025, 2025-2026… Por cada año cumplido se causan 15
   días hábiles (CST art. 186) y el empleador tiene el año siguiente al
   cierre del periodo para concederlas: ese es el plazo de vencimiento.
   ===================================================================== */
const DIAS_POR_PERIODO = 15;
/* Devuelve los periodos del más reciente al más antiguo. */
function vacationPeriods(hireDate, terminationDate){
  if(!hireDate) return [];
  const hoy  = todayISO();
  // Tras el retiro no se causan periodos nuevos.
  const tope = (terminationDate && terminationDate < hoy) ? terminationDate : hoy;
  if(hireDate > tope) return [];
  const out = [];
  for(let i=0;i<80;i++){
    const start = addYears(hireDate,i);
    if(start > tope) break;                        // aún no ha empezado
    const end = addDaysISO(addYears(hireDate,i+1),-1);
    const cumplido = end <= tope;
    out.push({
      index:i, start, end,
      label: start.slice(0,4)+"-"+end.slice(0,4),
      cumplido,
      // En el periodo en curso se causan 1,25 días por mes trabajado.
      causados: cumplido ? DIAS_POR_PERIODO
                         : Math.min(DIAS_POR_PERIODO, Math.round(monthsBetween(start,tope)*1.25*10)/10),
      deadline: addYears(end,1),                   // plazo legal para concederlas
    });
  }
  return out.reverse();
}
/* Días causados en total: 15 por cada periodo cumplido más el prorrateo del
   periodo en curso. Es la ÚNICA definición de "causados" en la aplicación,
   para que el resumen, el listado de vacaciones y el expediente coincidan. */
const diasCausados = (hireDate, terminationDate) =>
  Math.round(vacationPeriods(hireDate,terminationDate).reduce((s,p)=>s+p.causados,0)*10)/10;

/* Estado de un periodo según los días ya tomados en él (disfrutados o
   pagados en dinero). Un periodo CUMPLIDO que aún tiene saldo son
   vacaciones vencidas: ya se causaron y se le deben al colaborador. El plazo
   legal para concederlas se sigue mostrando aparte, como dato. */
function periodStatus(p, tomados, pagados=0){
  if(!p.cumplido)                return { key:"en_curso",   label:"En curso",          cls:"b-sky"   };
  if(tomados >= p.causados-0.01){
    if(pagados >= tomados-0.01)  return { key:"pagado",     label:"Pagado en dinero",  cls:"b-green" };
    return                              { key:"disfrutado", label:"Disfrutado",        cls:"b-green" };
  }
  return { key:"vencido", label:"Vencido", cls:"b-red" };
}
/* A qué periodo pertenece un registro de vacaciones. Los guardados desde
   v10 traen `period_start`; los anteriores se ubican por su fecha de inicio. */
function periodOf(v, periods){
  if(v.period_start){
    const p = periods.find(x=>x.start===v.period_start);
    if(p) return p;
  }
  return periods.find(x => v.start_date>=x.start && v.start_date<=x.end) || null;
}
const money = (v) => (v===null||v===undefined||v==="")?"—":new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(v);

const cityKey = (s) => String(s||"").trim().replace(/\s+/g," ").toLocaleLowerCase("es");
/* Ciudades distintas de una lista de empleados, para un <select>. `keep` es
   la opción ya elegida: se conserva aunque los demás filtros la dejen fuera. */
function cityOptions(emps, keep){

  return [...m].map(([key,label])=>({key,label})).sort((a,b)=>a.label.localeCompare(b.label,"es"));
}

/* =====================================================================
   DOTACIÓN
   Tres entregas al año. Tienen derecho quienes devengan hasta 2 salarios
   mínimos y llevan al menos 3 meses en la empresa en la fecha de entrega
   (CST art. 230). Al cambiar el salario mínimo basta con actualizar SMMLV.
   ===================================================================== */
const SMMLV = 1750905;                 // salario mínimo mensual 2026
const DOTACION_TOPE = 2*SMMLV;
const DOTACION_ENTREGAS = [
  { no:1, label:"Abril",     mes:4,  dia:30 },

/* ¿Le corresponde esta entrega? Devuelve { ok, motivo }. */
function dotacionAplica(emp, fecha){
  if((emp.staff_group||"empleado") !== "empleado") return { ok:false, motivo:"Solo aplica al grupo Empleados." };
  if(emp.salary===null || emp.salary===undefined || emp.salary==="") return { ok:false, motivo:"Sin salario registrado." };
  if(Number(emp.salary) > DOTACION_TOPE) return { ok:false, motivo:"Devenga más de 2 salarios mínimos." };
  if(!emp.hire_date || monthsBetween(emp.hire_date, fecha) < 3) return { ok:false, motivo:"Menos de 3 meses de antigüedad a la fecha." };
  if(emp.termination_date && emp.termination_date < fecha) return { ok:false, motivo:"Retirado antes de la fecha." };
  return { ok:true, motivo:"Devenga hasta 2 salarios mínimos." };
}

/* ---------------------------------------------------------------------
   Compatibilidad con bases a las que aún les falta alguna columna nueva
   (`employee_type`, `staff_group`, los campos de periodo en `vacations`).
   Si la columna no existe, PostgREST responde 42703 y ANULARÍA la consulta
   entera, así que se comprueba antes de pedirla en un `select`.

   Importante: un fallo de red o de permisos NO se memoriza como "la
   columna no existe". Antes se cacheaba cualquier error y, a partir de
   ahí, la clasificación se descartaba en silencio durante toda la sesión
   — era la causa de que «administrativo/asistencial» no se guardara.
   --------------------------------------------------------------------- */
const __colCache   = {};   // "tabla.columna" → true | false (solo resultados fiables)
const __colPending = {};
const isMissingColumn = (error, col) =>
  !!error && (error.code === "42703" ||
              (/column .* does not exist|does not exist/i.test(error.message||"") &&
               new RegExp(col,"i").test(error.message||"")));

function hasColumn(table, col){
  const k = table+"."+col;
  if(k in __colCache) return Promise.resolve(__colCache[k]);
  if(!__colPending[k]){
    __colPending[k] = (async ()=>{
      try{
        const r = await sb.from(table).select(col).limit(1);
        if(!r.error){ __colCache[k] = true; return true; }
        if(isMissingColumn(r.error, col)){ __colCache[k] = false; return false; }
      }catch(_){ /* error de red: se reintenta en la siguiente llamada */ }
      return true;   // ante la duda se asume presente y manda el servidor
    })();
    __colPending[k].then(()=>{ delete __colPending[k]; }, ()=>{ delete __colPending[k]; });
  }
  return __colPending[k];
}

/* Inserta o actualiza en `employees` tolerando columnas nuevas ausentes.
   Devuelve { data, dropped:[columnas que la base no aceptó] }. */
async function saveEmployee(payload, id){
  let body = {...payload};
  const dropped = [];
  for(let intento=0; intento<=OPTIONAL_EMP_COLS.length; intento++){
    // En UPDATE no se pide `.select()`: devolver la fila exige permiso de
    // lectura además del de escritura y haría fallar un guardado correcto.
    const r = id
      ? await sb.from("employees").update(body).eq("id",id)
      : await sb.from("employees").insert(body).select("id").single();
    if(!r.error) return { data: id ? {id} : r.data, dropped };
    const falta = OPTIONAL_EMP_COLS.find(c => c in body && isMissingColumn(r.error,c));
    if(!falta) throw r.error;
    __colCache["employees."+falta] = false;
    delete body[falta];
    dropped.push(falta);
  }
  throw new Error("No fue posible guardar el registro del personal.");
}

    roleOverride: isLocal && ROLE_LABELS[roleRaw] ? roleRaw : null,

const ACTION_LABELS = { read:"consultar", write:"crear o editar", delete:"eliminar" };
const AREA_LABELS = {
  employees:"empleados", contracts:"contratos", social_security:"seguridad social",
  vacations:"vacaciones", disabilities:"incapacidades", documents:"documentos",
  users:"usuarios y roles", audit:"auditoría", salary:"información salarial",
};

/* Rol con el que se EVALÚA la interfaz (puede venir del override de desarrollo) */
const uiRole = (roleOrProfile) => {
  const role = (roleOrProfile && roleOrProfile.role) || roleOrProfile || null;
  return DEV_CONFIG.roleOverride || role;
};

/* ¿Puede el rol hacer `action` sobre `area`? action: read | write | delete */
function can(roleOrProfile, area, action = "write"){
  const role = uiRole(roleOrProfile);
  const entry = PERMISSION_MATRIX[role];
  let allowed;
  if(!entry){
    // Rol desconocido (enum nuevo en la BD sin reflejar aquí): se niega, pero se avisa.
    console.warn("[permisos] Rol sin matriz de UI definida:", role, "— revisa PERMISSION_MATRIX.");
    allowed = false;
  }else if(!AREAS.includes(area)){
    // Antes esto devolvía false en silencio y "apagaba" botones sin explicación.
    console.warn("[permisos] Área desconocida:", area, "— revisa la constante AREAS.");
    allowed = false;
  }else{
    const list = entry[action];
    allowed = list === "*" ? true : Array.isArray(list) && list.includes(area);
  }
  if(DEV_CONFIG.debug) console.debug("[permisos]", role, action, area, "→", allowed, DEV_CONFIG.unlockUI ? "(UI desbloqueada)" : "");
  // El desbloqueo de desarrollo solo abre la UI; el servidor sigue decidiendo.
  return allowed || DEV_CONFIG.unlockUI;
}

/* Texto explicativo para mostrar en pantalla cuando algo está restringido */
const whyNot = (roleOrProfile, area, action = "write") =>
  `Tu rol (${ROLE_LABELS[uiRole(roleOrProfile)] || "sin rol"}) no puede ${ACTION_LABELS[action]} ${AREA_LABELS[area] || area}.`;

/* Rol vigente, disponible para los mensajes de error (lo fija Root al cargar el perfil) */
let CURRENT_ROLE = null;

/* ------------------------- Mensaje de error amigable ------------------------- */
function friendlyError(e){
  const msg = (e && (e.message||e.error_description||e.msg)) || "";
  const code = (e && e.code) || "";
  if(/Invalid login/i.test(msg)) return "Correo o contraseña incorrectos.";
  if(/Email not confirmed/i.test(msg)) return "Debes confirmar tu correo antes de ingresar.";
  // Rechazo del servidor por RLS: se explica el estado real del permiso en vez
  // de un mensaje genérico, para poder corregir la causa (el rol) y no ocultarla.
  if(/row-level security|violates row-level|not authorized|permission denied/i.test(msg) || code==="42501"){
    const rol = CURRENT_ROLE ? `«${ROLE_LABELS[CURRENT_ROLE] || CURRENT_ROLE}»` : "sin rol asignado";
    return "El servidor rechazó la acción por permisos (RLS). Tu rol actual es " + rol +
           ". Pide a un administrador que ajuste tu rol en «Usuarios y roles», o revisa «Permisos» en el menú.";
  }
  if(/duplicate key|unique/i.test(msg)) return "Ya existe un registro con ese valor único (ej. cédula o número de contrato).";
  if(/Failed to fetch|NetworkError|network/i.test(msg)) return "No fue posible conectar. Verifica tu conexión a Internet.";
  if(/JWT expired|token/i.test(msg)) return "Tu sesión expiró. Vuelve a iniciar sesión.";
  return msg || "Ocurrió un error inesperado. Inténtalo nuevamente.";
}

/* El área se ESCRIBE. Antes era un <select> cerrado al catálogo, así que no
   se podía registrar un área nueva sin tocar la base de datos. Ahora es un
   campo de texto con sugerencias (<datalist>, que Workspace dibuja una sola
   vez) y al guardar se resuelve contra `departments`: se reutiliza la que ya
   exista o se crea. La columna sigue siendo una FK, de modo que el filtro
   por área y los reportes no cambian. */
function AreaInput({value, onChange, placeholder="Escribe el área…"}){
  return <input list="th-areas" value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}/>;
}

/* Nombre de área escrito a mano → id en `departments`. */
async function resolveDepartmentId(nombre, departments){
  const n = (nombre||"").trim();
  if(!n) return { id:null, creada:false };
  const norm = (s)=> String(s||"").trim().toLowerCase();
  const ya = (departments||[]).find(d=> norm(d.name)===norm(n));
  if(ya) return { id:ya.id, creada:false };
  const { data, error } = await sb.from("departments").insert({ name:n }).select("id").single();
  if(error){
    // Puede fallar porque otro usuario acabó de crear la misma área
    // (name es único): en ese caso se usa la existente.
    const r = await sb.from("departments").select("id").ilike("name",n).limit(1);
    if(r.data && r.data.length) return { id:r.data[0].id, creada:false };
    throw error;
  }
  return { id:data.id, creada:true };
}

/* Cuántos diálogos hay abiertos a la vez: el bloqueo del fondo solo se
   levanta cuando se cierra el último. */
let __openModals = 0;

/* Diálogo con cabecera fija, cuerpo desplazable y pie opcional (`footer`).
   El desplazamiento vive DENTRO de la caja, así que el contenido nunca se
   corta aunque el formulario sea más alto que la ventana. */
function Modal({title, onClose, children, footer, wide}){
  // Se guarda en un ref porque casi todos los llamadores pasan una función
  // nueva en cada render; así el efecto se monta una sola vez.
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(()=>{
    __openModals += 1;
    document.body.classList.add("modal-open");
    const onKey = (ev)=>{ if(ev.key === "Escape") closeRef.current(); };
    document.addEventListener("keydown", onKey);
    return ()=>{
      document.removeEventListener("keydown", onKey);
      __openModals = Math.max(0, __openModals - 1);
      if(__openModals === 0) document.body.classList.remove("modal-open");
    };
  }, []);

  // El diálogo se dibuja en <body> mediante un portal. Si se quedara dentro de
  // .content, cualquier ancestro con transform/filter/animación lo convertiría
  // en su bloque contenedor y el `position:fixed` del fondo se recortaría a esa
  // caja — que es exactamente lo que cortaba estos formularios.
  return ReactDOM.createPortal(
    <div className="overlay" onMouseDown={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={wide?{maxWidth:920}:null} role="dialog" aria-modal="true" aria-label={title}>
        <div className="modal-head">
          <h2>{title}</h2>
          <button className="x" onClick={onClose} aria-label="Cerrar">×</button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>,
    document.body
  );
}
function SkeletonRows({cols=4, rows=4}){

/* =====================================================================
   Hook de carga de datos con manejo de error
   ===================================================================== */
function useAsync(fn, deps){
  const [state,setState] = useState({loading:true, error:null, data:null});
  const toast = useToast();
  const run = useCallback(async ()=>{
    setState(s=>({...s, loading:true, error:null}));
    try{
      const data = await fn();
      setState({loading:false, error:null, data});
    }catch(e){
      setState({loading:false, error:friendlyError(e), data:null});
      if(toast) toast(friendlyError(e), "err");
    }
  }, deps); // eslint-disable-line
  useEffect(()=>{ run(); }, [run]);
  return {...state, reload:run};
}

/* =====================================================================
   PANTALLA DE LOGIN
   ===================================================================== */
function Auth(){
  const [mode,setMode] = useState("login"); // login | reset
  const [email,setEmail] = useState("");
  const [pass,setPass] = useState("");
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState(null);
  const [err,setErr] = useState(null);

  const submit = async (e)=>{
    e.preventDefault(); setErr(null); setMsg(null); setBusy(true);
    try{
      if(mode==="login"){
        const { data, error } = await sb.auth.signInWithPassword({ email:email.trim(), password:pass });
        if(error) throw error;
        // auditoría de inicio de sesión (no bloqueante)
        if(data && data.user) sb.from("audit_logs").insert({ profile_id:data.user.id, action:"LOGIN", description:"Inicio de sesión" }).then(()=>{}).catch(()=>{});
        // el listener global cambia de pantalla
      }else{
        const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href });
        if(error) throw error;
        setMsg("Te enviamos un correo para restablecer la contraseña (si el correo existe).");
      }
    }catch(e2){ setErr(friendlyError(e2)); }
    finally{ setBusy(false); }
  };

  return (
    <div className="auth">
      <form className="box" onSubmit={submit}>
        <div className="plate"><Logo/></div>
        <h1>Talento Humano</h1>
        <p className="sub">Gestión y Control del Talento Humano</p>

        <div className="field">
          <Field label="Correo electrónico">
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required autoComplete="username" placeholder="usuario@dominio.com"/>
          </Field>
        </div>
        {mode==="login" && (
          <div className="field">
            <Field label="Contraseña">
              <input type="password" value={pass} onChange={e=>setPass(e.target.value)} required autoComplete="current-password" placeholder="••••••••"/>
            </Field>
          </div>
        )}

        {err && <div className="toast err" style={{marginBottom:12}}>{err}</div>}
        {msg && <div className="toast ok" style={{marginBottom:12}}>{msg}</div>}

        <button className="btn accent block" disabled={busy}>
          {busy ? <span className="spinner"/> : <Icon name={mode==="login"?"lock":"key"}/>}
          {mode==="login" ? "Ingresar" : "Enviar enlace de recuperación"}
        </button>

        <p style={{textAlign:"center",marginTop:14,fontSize:12.5}}>
          {mode==="login"
            ? <button type="button" className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>{setMode("reset");setErr(null);}}>¿Olvidaste tu contraseña?</button>
            : <button type="button" className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>{setMode("login");setErr(null);setMsg(null);}}>Volver a iniciar sesión</button>}
        </p>
      </form>
    </div>
  );
}

/* =====================================================================
   BÚSQUEDA GLOBAL
   ===================================================================== */
function GlobalSearch({onOpenEmployee}){
  const [q,setQ] = useState("");
  const [res,setRes] = useState([]);
  const [open,setOpen] = useState(false);
  const tmr = useRef(null);

  useEffect(()=>{
    if(tmr.current) clearTimeout(tmr.current);
    if(!q.trim()){ setRes([]); return; }
    tmr.current = setTimeout(async ()=>{
      const term = q.trim().replace(/[,()*%]/g," ");
      if(!term){ setRes([]); return; }
      const { data, error } = await sb.from("employees")
        .select("id,first_name,last_name,document_number,position_title,city,status")
        .or(`first_name.ilike.%${term}%,last_name.ilike.%${term}%,document_number.ilike.%${term}%,position_title.ilike.%${term}%,city.ilike.%${term}%`)
        .limit(8);
      if(!error){ setRes(data||[]); setOpen(true); }
    }, 300);
  }, [q]);

  return (
    <div className="search" onBlur={()=>setTimeout(()=>setOpen(false),150)}>
      <span className="s-ico"><Icon name="search"/></span>
      <input placeholder="Buscar empleado por nombre, cédula, cargo o ciudad…" value={q}
        onChange={e=>setQ(e.target.value)} onFocus={()=>res.length&&setOpen(true)}/>
      {open && res.length>0 && (
        <div className="card" style={{position:"absolute",top:"calc(100% + 8px)",left:0,right:0,zIndex:30,padding:6,maxHeight:340,overflow:"auto"}}>
          {res.map(e=>(
            <div key={e.id} style={{padding:"9px 11px",borderRadius:10,cursor:"pointer",transition:"background .16s"}}
              onMouseDown={()=>{ onOpenEmployee(e.id); setOpen(false); setQ(""); }}
              onMouseOver={ev=>ev.currentTarget.style.background="rgba(46,159,214,.12)"}
              onMouseOut={ev=>ev.currentTarget.style.background="transparent"}>
              <b>{e.first_name} {e.last_name}</b>
              <span className="muted" style={{fontSize:12}}> · {e.document_number} · {e.position_title||"—"} · {EMP_STATUS[e.status]}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

            <tr key={r.key||i} style={r.employeeId?null:{cursor:"default"}}
              onClick={r.employeeId ? ()=>{ onOpenEmployee(r.employeeId, r.group); onClose(); } : undefined}>
              {r.cells.map((c,j)=><td key={j}>{c}</td>)}
            </tr>
          ))}</tbody>
        </table></div>}
      {kpi.rows.length>0 && (
        <p className="muted" style={{fontSize:12,marginTop:12}}>Toca una fila para abrir el expediente.</p>
      )}
    </Modal>
  );
}
