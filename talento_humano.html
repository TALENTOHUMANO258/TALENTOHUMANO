<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Talento Humano · Centro Especializado de Urología</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===================================================================
     LIQUID GLASS · Sistema de diseño
     Tokens → Fondo → Layout → Navegación → Superficies → Datos
              → Formularios → Botones → Feedback → Responsive
     =================================================================== */
  :root{
    /* --- Marca corporativa --- */
    --navy:#0B2545;   --navy-2:#14375F;  --navy-3:#1E4C7A;  --navy-soft:#233C5C;
    --sky:#2E9FD6;    --sky-2:#5BC0E8;   --teal:#16A99B;
    --ink:#0F2035;    --ink-2:#33465E;   --muted:#66788D;

    /* --- Semánticos --- */
    --green:#158A5B;  --green-2:#28B476;
    --red:#C0453C;    --red-2:#E0685E;
    --amber:#B0731A;  --amber-2:#E0A537;

    /* --- Vidrio líquido --- */
    --g-1:rgba(255,255,255,.74);
    --g-2:rgba(255,255,255,.55);
    --g-3:rgba(255,255,255,.34);
    --g-brd:rgba(255,255,255,.65);
    --g-hi:inset 0 1px 0 rgba(255,255,255,.8);
    --blur:20px;

    /* --- Sombras --- */
    --sh-1:0 1px 2px rgba(11,37,69,.05), 0 4px 14px rgba(11,37,69,.06);
    --sh-2:0 2px 6px rgba(11,37,69,.06), 0 14px 34px rgba(11,37,69,.10);
    --sh-3:0 30px 70px rgba(11,37,69,.24);
    --ring:0 0 0 4px rgba(46,159,214,.22);

    /* --- Forma y ritmo --- */
    --r-s:10px; --r-m:16px; --r-l:22px; --r-pill:999px;
    --ease:cubic-bezier(.22,.61,.36,1); --fast:.16s; --mid:.28s;

    /* --- Alias de compatibilidad (usados en estilos en línea del JSX) --- */
    --paper:#EDF2F9; --card:var(--g-1);
    --border:rgba(15,32,53,.09); --border-input:rgba(15,32,53,.13);
    --sky-soft:rgba(46,159,214,.12); --green-bg:rgba(21,138,91,.11);
    --red-bg:rgba(192,69,60,.11);    --amber-bg:rgba(176,115,26,.13);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  /* Reserva siempre el canal de la barra de desplazamiento: así, al abrir un
     diálogo (que bloquea el scroll del fondo), el contenido no da un salto
     lateral del ancho de la barra. */
  html{scrollbar-gutter:stable}
  body{
    font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1100px 620px at 6% -8%,  rgba(46,159,214,.26), transparent 62%),
      radial-gradient(900px 520px at 98% 2%,   rgba(22,169,155,.20), transparent 58%),
      radial-gradient(1000px 700px at 48% 112%,rgba(20,55,95,.22),   transparent 62%),
      linear-gradient(158deg,#E7EFF8 0%,#F4F8FC 46%,#E6EEF7 100%);
    background-attachment:fixed;
  }
  /* Burbujas de luz en movimiento muy lento (decorativas) */
  body::before,body::after{
    content:"";position:fixed;z-index:-1;border-radius:50%;pointer-events:none;
    filter:blur(70px);opacity:.5;
  }
  body::before{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;
    background:radial-gradient(circle at 30% 30%,rgba(91,192,232,.55),transparent 68%);
    animation:float1 26s var(--ease) infinite alternate}
  body::after{width:40vmax;height:40vmax;right:-12vmax;bottom:-14vmax;
    background:radial-gradient(circle at 70% 70%,rgba(22,169,155,.42),transparent 68%);
    animation:float2 32s var(--ease) infinite alternate}
  @keyframes float1{to{transform:translate3d(6vmax,4vmax,0) scale(1.12)}}
  @keyframes float2{to{transform:translate3d(-5vmax,-4vmax,0) scale(1.08)}}

  h1,h2,h3{font-family:'Roboto Slab',serif;margin:0;letter-spacing:-.01em}
  a{color:var(--sky)}
  #root{min-height:100vh;position:relative;z-index:1}
  ::selection{background:rgba(46,159,214,.25)}

  /* Scrollbars discretas */
  *{scrollbar-width:thin;scrollbar-color:rgba(15,32,53,.22) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(15,32,53,.18);border-radius:99px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(15,32,53,.3);background-clip:content-box}

  /* Utilidad base de vidrio */
  .glass{
    background:linear-gradient(158deg,var(--g-1),var(--g-2));
    -webkit-backdrop-filter:blur(var(--blur)) saturate(165%);
    backdrop-filter:blur(var(--blur)) saturate(165%);
    border:1px solid var(--g-brd);
    box-shadow:var(--sh-2),var(--g-hi);
  }

  /* ---- Layout ---- */
  .shell{display:flex;min-height:100vh;gap:0}
  .sidebar{
    width:256px;flex-shrink:0;position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;padding:14px 12px;gap:12px;color:var(--ink-2);
    background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.5));
    -webkit-backdrop-filter:blur(24px) saturate(170%);
    backdrop-filter:blur(24px) saturate(170%);
    border-right:1px solid var(--g-brd);
    box-shadow:1px 0 0 rgba(255,255,255,.5) inset, var(--sh-1);
  }
  /* ---- Marca (logotipo corporativo) ----
     El archivo oficial es un PNG blanco sobre fondo transparente, así que
     siempre va sobre una placa azul: sobre el vidrio claro sería invisible.
     La relación de aspecto está fijada (1536×308) para que el contenedor
     reserve su altura antes de que la imagen llegue y la barra no salte. */
  .brand{
    display:block;padding:15px 14px 12px;margin:2px 2px 8px;border-radius:18px;
    background:linear-gradient(150deg,var(--navy) 0%,var(--navy-2) 55%,var(--navy-3) 100%);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 10px 26px rgba(11,37,69,.28),inset 0 1px 0 rgba(255,255,255,.22);
  }
  .brand .logo{
    display:block;width:100%;max-width:190px;height:auto;margin:0 auto;
    aspect-ratio:1536/308;object-fit:contain
  }
  .brand .wordmark{
    display:block;max-width:190px;margin:0 auto;text-align:center;
    font-family:'Roboto Slab',serif;font-size:14px;font-weight:700;line-height:1.2;color:#fff
  }
  .brand .tagline{
    display:block;margin-top:10px;text-align:center;font-size:9.5px;font-weight:800;
    letter-spacing:.17em;text-transform:uppercase;color:rgba(255,255,255,.72)
  }
  /* Marca compacta de la barra superior: solo aparece cuando el menú lateral
     se oculta (≤860px), para que el logotipo nunca desaparezca del todo. */
  .topbar-brand{
    display:none;align-items:center;flex-shrink:0;height:34px;padding:0 12px;border-radius:12px;
    background:linear-gradient(150deg,var(--navy),var(--navy-3));
    box-shadow:0 5px 14px rgba(11,37,69,.26),inset 0 1px 0 rgba(255,255,255,.22)
  }
  .topbar-brand .logo{display:block;height:16px;width:auto;max-width:118px;object-fit:contain}
  .topbar-brand .wordmark{font-size:11px;font-weight:800;color:#fff;letter-spacing:.06em;white-space:nowrap}

  .nav{flex:1;overflow-y:auto;padding:4px 2px;display:flex;flex-direction:column;gap:3px}
  .nav .nav-label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);padding:14px 12px 6px;opacity:.75}
  .nav button{
    position:relative;width:100%;text-align:left;background:transparent;border:1px solid transparent;
    color:var(--ink-2);font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;
    padding:9px 12px;border-radius:13px;cursor:pointer;display:flex;gap:11px;align-items:center;
    transition:background var(--fast),color var(--fast),transform var(--fast) var(--ease),box-shadow var(--fast),border-color var(--fast);
  }
  .nav button::before{
    content:"";position:absolute;left:5px;top:50%;width:3px;height:0;border-radius:99px;
    background:linear-gradient(180deg,var(--sky),var(--teal));transform:translateY(-50%);
    transition:height var(--mid) var(--ease);
  }
  .nav button:hover{background:rgba(255,255,255,.7);color:var(--navy);transform:translateX(2px);box-shadow:var(--sh-1)}
  .nav button:focus-visible{outline:none;box-shadow:var(--ring)}
  .nav button.active{
    background:linear-gradient(135deg,rgba(46,159,214,.18),rgba(22,169,155,.13));
    color:var(--navy);border-color:rgba(46,159,214,.3);box-shadow:var(--sh-1),var(--g-hi);
  }
  .nav button.active::before{height:18px}
  .nav button.active .ico{background:linear-gradient(145deg,var(--sky),var(--teal));color:#fff;box-shadow:0 5px 14px rgba(46,159,214,.4)}
  .nav button:disabled{opacity:.42;cursor:not-allowed;transform:none;background:transparent;box-shadow:none}
  .nav .ico{
    width:30px;height:30px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;
    background:rgba(255,255,255,.72);color:var(--navy-3);box-shadow:var(--sh-1),var(--g-hi);
    transition:background var(--fast),color var(--fast),box-shadow var(--fast);
  }
  .nav .ico svg{width:16px;height:16px}

  .sidebar .foot{padding:12px;border-radius:var(--r-m);font-size:11.5px;color:var(--muted);
    background:rgba(255,255,255,.55);border:1px solid var(--g-brd);box-shadow:var(--g-hi)}
  .sidebar .foot .u{color:var(--navy);font-weight:700;font-size:12.5px}
  .sidebar .foot button{
    margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
    background:rgba(255,255,255,.7);border:1px solid var(--border-input);color:var(--ink-2);
    border-radius:11px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;
    font-family:'Inter',sans-serif;transition:all var(--fast) var(--ease);
  }
  .sidebar .foot button:hover{background:#fff;color:var(--red);border-color:rgba(192,69,60,.35);transform:translateY(-1px);box-shadow:var(--sh-1)}
  .sidebar .foot button:active{transform:translateY(0) scale(.99)}
  .sidebar .foot button:focus-visible{outline:none;box-shadow:var(--ring)}
  .sidebar .foot button svg{width:14px;height:14px}

  .avatar{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;
    background:linear-gradient(145deg,var(--navy-3),var(--navy));color:#fff;
    font-weight:800;font-size:12.5px;box-shadow:0 5px 14px rgba(11,37,69,.28),var(--g-hi)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    padding:11px 22px;display:flex;gap:14px;align-items:center;position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.46));
    -webkit-backdrop-filter:blur(22px) saturate(170%);
    backdrop-filter:blur(22px) saturate(170%);
    border-bottom:1px solid var(--g-brd);
  }
  .topbar .search{flex:1;max-width:520px;position:relative;display:flex;align-items:center}
  .topbar .search input{width:100%;padding-left:38px}
  .search .s-ico{position:absolute;left:13px;width:16px;height:16px;color:var(--muted);pointer-events:none;z-index:1}
  .breadcrumb{display:flex;flex-direction:column;gap:1px;min-width:0}
  .breadcrumb .bc-path{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .breadcrumb .bc-title{font-family:'Roboto Slab',serif;font-size:15px;font-weight:700;color:var(--navy);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto}
  .topbar .role-chip{
    font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--navy-3);
    background:linear-gradient(135deg,rgba(46,159,214,.16),rgba(22,169,155,.12));
    padding:6px 12px;border-radius:var(--r-pill);border:1px solid rgba(46,159,214,.26);
    white-space:nowrap;box-shadow:var(--g-hi)
  }
  .hamburger{
    display:none;background:rgba(255,255,255,.7);border:1px solid var(--g-brd);border-radius:12px;
    padding:8px;cursor:pointer;color:var(--navy);box-shadow:var(--sh-1);transition:all var(--fast) var(--ease)
  }
  .hamburger:hover{background:#fff;transform:translateY(-1px)}
  .hamburger:active{transform:scale(.96)}
  .hamburger:focus-visible{outline:none;box-shadow:var(--ring)}
  .hamburger svg{width:18px;height:18px;display:block}
  /* OJO con el fill-mode: con `both`, Chrome mantiene a .content como bloque
     contenedor de los descendientes `position:fixed` incluso después de que la
     animación termina (porque anima `transform`). Eso recortaba los diálogos al
     alto de esta caja. Con `backwards` la animación se ve igual y el elemento
     deja de ser bloque contenedor al acabar. Los diálogos, además, se dibujan
     con un portal en <body> (ver Modal). */
  .content{padding:24px 22px 40px;max-width:1240px;width:100%;margin:0 auto;animation:fadeUp .4s var(--ease) backwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* Aviso de modo desarrollo (permisos de UI desbloqueados) */
  .dev-banner{
    display:flex;align-items:center;gap:10px;padding:9px 22px;font-size:12px;font-weight:600;
    color:#7A4E0E;background:linear-gradient(135deg,rgba(224,165,55,.28),rgba(224,165,55,.14));
    border-bottom:1px solid rgba(176,115,26,.3);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)
  }
  .dev-banner svg{width:16px;height:16px;flex-shrink:0}
  .dev-banner code{background:rgba(255,255,255,.6);padding:1px 6px;border-radius:6px;font-size:11.5px}

  /* ---- Superficies ---- */
  .card{
    background:linear-gradient(158deg,var(--g-1),var(--g-2));
    -webkit-backdrop-filter:blur(var(--blur)) saturate(165%);
    backdrop-filter:blur(var(--blur)) saturate(165%);
    border:1px solid var(--g-brd);border-radius:var(--r-m);padding:18px 20px;
    box-shadow:var(--sh-2),var(--g-hi);
    transition:transform var(--mid) var(--ease),box-shadow var(--mid),border-color var(--mid);
  }
  /* Tarjeta interactiva: elevación sutil al pasar el mouse */
  .card.int{cursor:pointer}
  .card.int:hover{transform:translateY(-3px);box-shadow:var(--sh-3),var(--g-hi);border-color:rgba(46,159,214,.32)}
  .card.int:active{transform:translateY(-1px) scale(.995)}
  .grid{display:grid;gap:14px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
  .form-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

  /* KPI estilo Argon: etiqueta + cifra + icono en mosaico */
  .stat{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;inset:auto -30% -60% auto;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.5),transparent 70%);pointer-events:none}
  .stat:hover{transform:translateY(-3px);box-shadow:var(--sh-3),var(--g-hi)}
  .stat .l{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;line-height:1.35}
  .stat .n{font-family:'Roboto Slab',serif;font-size:30px;font-weight:700;margin:6px 0 0;line-height:1.05}
  .stat .kpi-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;color:#fff;
    box-shadow:0 8px 20px rgba(11,37,69,.22),var(--g-hi)}
  .stat .kpi-ico svg{width:20px;height:20px}
  .ico-navy{background:linear-gradient(145deg,var(--navy-3),var(--navy))}
  .ico-sky{background:linear-gradient(145deg,var(--sky-2),var(--sky))}
  .ico-green{background:linear-gradient(145deg,var(--green-2),var(--green))}
  .ico-red{background:linear-gradient(145deg,var(--red-2),var(--red))}
  .ico-amber{background:linear-gradient(145deg,var(--amber-2),var(--amber))}
  .ico-teal{background:linear-gradient(145deg,#3FD0C0,var(--teal))}

  .page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .section-title{font-size:16px;margin-bottom:14px;color:var(--navy)}

  /* ---- Formularios ---- */
  label.f{display:flex;flex-direction:column;gap:6px;font-size:13px}
  label.f>span{color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.02em}
  /* Igual que label.f pero en un <div>: para controles que NO son un campo de
     formulario nativo (un <label> alrededor de varios botones reenviaría el
     clic al primero de ellos). */
  .fieldbox{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .fieldbox>span{color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.02em}
  input,select,textarea{
    border:1px solid var(--border-input);border-radius:12px;padding:10px 12px;font-size:13.5px;
    font-family:'Inter',sans-serif;color:var(--ink);outline:none;width:100%;
    background:rgba(255,255,255,.62);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:var(--g-hi);
    transition:border-color var(--fast),box-shadow var(--fast),background var(--fast);
  }
  input::placeholder,textarea::placeholder{color:rgba(102,120,141,.75)}
  input:hover,select:hover,textarea:hover{background:rgba(255,255,255,.78)}
  input:focus,select:focus,textarea:focus{background:rgba(255,255,255,.92);border-color:var(--sky);box-shadow:var(--ring),var(--g-hi)}
  input:disabled,select:disabled,textarea:disabled{opacity:.55;cursor:not-allowed;background:rgba(255,255,255,.4)}
  textarea{min-height:70px;resize:vertical;line-height:1.5}
  select{appearance:none;-webkit-appearance:none;padding-right:34px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2366788D' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 11px center;background-size:15px}
  input[type=checkbox]{width:auto;accent-color:var(--sky);cursor:pointer;box-shadow:none;padding:0}
  input[type=date]{min-height:41px}
  input[type=file]{padding:8px}

  /* ---- Botones ---- */
  .btn{
    position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid transparent;border-radius:13px;padding:11px 18px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.01em;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    transition:transform var(--fast) var(--ease),box-shadow var(--mid),background var(--mid),
               border-color var(--mid),color var(--mid),filter var(--mid);
  }
  .btn svg{width:15px;height:15px;flex-shrink:0}
  /* destello de vidrio al pasar el mouse */
  .btn::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 28%,rgba(255,255,255,.38) 50%,transparent 72%);
    transform:translateX(-130%);transition:transform .65s var(--ease);
  }
  .btn:hover::after{transform:translateX(130%)}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0) scale(.982)}
  .btn:focus-visible{outline:none;box-shadow:var(--ring),var(--sh-2)}
  /* Deshabilitado: se distingue por opacidad, desaturación y sin elevación.
     No se usa pointer-events:none para que el `title` explicativo siga visible. */
  .btn:disabled{
    opacity:.5;cursor:not-allowed;transform:none;filter:grayscale(.35);box-shadow:none;
  }
  .btn:disabled:hover{transform:none;box-shadow:none}
  .btn:disabled::after{display:none}
  .btn.primary{background:linear-gradient(135deg,var(--navy-3),var(--navy));color:#F2F8FF;
    box-shadow:0 6px 18px rgba(11,37,69,.26),var(--g-hi)}
  .btn.primary:hover{box-shadow:0 14px 30px rgba(11,37,69,.32),var(--g-hi)}
  .btn.accent{background:linear-gradient(135deg,var(--sky-2),var(--sky) 55%,var(--teal));color:#fff;
    box-shadow:0 6px 18px rgba(46,159,214,.34),var(--g-hi)}
  .btn.accent:hover{box-shadow:0 14px 30px rgba(46,159,214,.4),var(--g-hi)}
  .btn.ghost{
    background:rgba(255,255,255,.6);color:var(--navy);border-color:var(--g-brd);font-weight:700;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--sh-1),var(--g-hi)
  }
  .btn.ghost:hover{background:rgba(255,255,255,.92);border-color:rgba(46,159,214,.4);color:var(--navy-3);box-shadow:var(--sh-2),var(--g-hi)}
  .btn.danger{background:linear-gradient(135deg,var(--red-2),var(--red));color:#fff;
    box-shadow:0 6px 18px rgba(192,69,60,.3),var(--g-hi)}
  .btn.danger:hover{box-shadow:0 14px 30px rgba(192,69,60,.36),var(--g-hi)}
  .btn.sm{padding:7px 13px;font-size:12px;border-radius:11px;gap:6px}
  .btn.sm svg{width:13px;height:13px}
  .btn.block{width:100%}
  .linkbtn{
    background:none;border:none;cursor:pointer;font-weight:700;font-size:12.5px;font-family:'Inter',sans-serif;

  /* ---- Selector segmentado (clasificación administrativo / asistencial) ---- */

  .seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:13px;width:100%;

<!-- Diagnóstico: si algo falla, se muestra en pantalla en vez de quedar en blanco -->
<script>
  function __showFatal(title, detail){
    var r = document.getElementById("root");
    if(!r) return;
    r.innerHTML =
      '<div style="max-width:720px;margin:48px auto;font-family:Inter,Arial,sans-serif;'+
      'background:rgba(251,235,233,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);'+
      'border:1px solid rgba(192,69,60,.35);border-radius:22px;padding:26px;color:#9B342C;'+
      'box-shadow:0 30px 70px rgba(11,37,69,.22),inset 0 1px 0 rgba(255,255,255,.8)">'+
      '<h2 style="margin:0 0 10px;font-family:Georgia,serif;font-size:19px">⚠️ '+title+'</h2>'+
      '<pre style="white-space:pre-wrap;font-size:13px;margin:0;line-height:1.6">'+String(detail||"").replace(/</g,"&lt;")+'</pre>'+
      '<p style="margin:14px 0 0;font-size:12.5px;color:#66788D">Revisa esta información o compártela para diagnosticar. '+
      'Verifica también tu conexión y que SUPABASE_URL/anon key sean correctas.</p></div>';
  }
  window.addEventListener("error", function(e){
    __showFatal("Error al cargar la aplicación", (e && e.message) ? e.message : e);
  });
  window.addEventListener("unhandledrejection", function(e){
    var r = e && e.reason; __showFatal("Error de conexión o de datos", (r && r.message) ? r.message : r);
  });
  // Si tras 6s no se montó nada (p. ej. un CDN bloqueado), avisar.
  setTimeout(function(){
    var r = document.getElementById("root");
    if(r && r.childElementCount === 0 && r.textContent.trim() === ""){
      __showFatal("La aplicación no terminó de cargar",
        "No se cargaron las librerías (React/Babel/Supabase) desde Internet, o hubo un error de compilación. "+
        "Verifica tu conexión. Si estás sin Internet, la app no puede funcionar porque usa Supabase en la nube.");
    }
  }, 6000);
</script>

const daysBetween = (a,b) => { if(!a||!b) return 0; const s=new Date(a+"T00:00:00"),e=new Date(b+"T00:00:00");
  const n=Math.round((e-s)/86400000)+1; return n>0?n:0; };
const diffDays = (a,b) => { const s=new Date(a+"T00:00:00"),e=new Date(b+"T00:00:00"); return Math.round((e-s)/86400000); };
const monthsBetween = (start,end) => { if(!start) return 0; const s=new Date(start+"T00:00:00");
  const e=end?new Date(end+"T00:00:00"):new Date(); let m=(e.getFullYear()-s.getFullYear())*12+(e.getMonth()-s.getMonth());
  if(e.getDate()<s.getDate()) m-=1; return Math.max(0,m); };
const vacacionesCausadas = (ingreso,retiro) => Math.round(monthsBetween(ingreso,retiro)*1.25*10)/10;

  const t=new Date(todayISO()+"T00:00:00"); let n=new Date(t.getFullYear(),ing.getMonth(),ing.getDate());
  if(n<t) n.setFullYear(n.getFullYear()+1); return n.toISOString().slice(0,10); };

   todas las consultas de empleados. Se comprueba una sola vez y la app
   sigue funcionando sin el campo en lugar de romperse.
   --------------------------------------------------------------------- */
let __empTypeProbe = null;
function hasEmployeeType(){
  if(!__empTypeProbe){
    __empTypeProbe = sb.from("employees").select("employee_type").limit(1)
      .then(r => !(r.error && (r.error.code === "42703" || /employee_type/i.test(r.error.message||""))))
      .catch(() => false);
  }
  return __empTypeProbe;
}
/* Quita `employee_type` del payload si la base aún no lo soporta. */
async function stripEmployeeType(payload){
  if(payload.employee_type === undefined || await hasEmployeeType()) return { payload, stripped:false };
  const clean = {...payload}; delete clean.employee_type;
  return { payload:clean, stripped:true };
}

/* =====================================================================
   CONFIGURACIÓN DE DESARROLLO
   Solo afecta a la INTERFAZ. No toca la autenticación ni la seguridad
   del backend: las políticas RLS de Supabase siguen siendo la única
   autoridad y siguen validando cada operación.

   Cómo activarla (solo en localhost / archivo local):
     · ?ui_permissions=all            → muestra todas las acciones de la UI
     · ?role_override=talento_humano  → evalúa la UI como si tuvieras ese rol
     · ?debug=1                       → traza permisos en la consola
   O de forma persistente, en la consola del navegador:
     localStorage.setItem("th_ui_permissions","all")
     localStorage.setItem("th_role_override","talento_humano")
     localStorage.removeItem("th_ui_permissions")   // desactivar
   ===================================================================== */
const DEV_CONFIG = (() => {
  const host = (location.hostname || "").toLowerCase();
  const isLocal = location.protocol === "file:" || host === "localhost" ||
                  host === "127.0.0.1" || host === "[::1]" || host === "";
  const qs = new URLSearchParams(location.search);
  const read = (key) => {
    const fromUrl = qs.get(key);
    if (fromUrl !== null) return fromUrl;
    try { return localStorage.getItem("th_" + key); } catch (_) { return null; }
  };
  const roleRaw = (read("role_override") || "").trim();
  return {
    isLocal,
    // Desbloquea la VISIBILIDAD de acciones en la UI (el servidor sigue validando)
    unlockUI: isLocal && String(read("ui_permissions") || "").toLowerCase() === "all",
    // Evalúa la UI con otro rol, útil para revisar pantallas sin cambiar la BD
    roleOverride: isLocal && ROLE_LABELS[roleRaw] ? roleRaw : null,
    debug: isLocal && String(read("debug") || "") === "1",
  };
})();
const DEV_ACTIVE = DEV_CONFIG.unlockUI || !!DEV_CONFIG.roleOverride;

/* =====================================================================
   PERMISOS DE INTERFAZ
   Esta matriz es un ESPEJO de las políticas RLS declaradas en
   supabase_talento_humano.sql (sección 8). Su único trabajo es no
   ofrecer acciones que el servidor va a rechazar. NO es el control de
   seguridad: si aquí dice "sí" y la política dice "no", manda la política.

   Traducción de las políticas a esta tabla:
     is_hr()            = administrador | talento_humano
     is_sst()           = administrador | sst
     is_admin()         = administrador
     employees_delete   → is_admin()                (¡no basta con ser HR!)
     documentos_read    → is_hr() o is_sst()        (descarga desde Storage)
     disabilities_write → is_hr() o is_sst()
     users              → is_admin()
     audit (select)     → is_admin() o profile_id = auth.uid()
   ===================================================================== */
const AREAS = ["employees","contracts","social_security","vacations","disabilities","documents","users","audit","salary"];

/* Nota sobre `audit`: audit_select permite `is_admin() or profile_id = auth.uid()`,
   así que cualquier rol lee SUS propios eventos (por eso tiene read en todos).
   La tabla es inmutable: no hay políticas de UPDATE/DELETE para nadie. */
const PERMISSION_MATRIX = {
  administrador:  { read:"*",
                    write:["employees","contracts","social_security","vacations","disabilities","documents","users"],
                    delete:["employees","contracts","social_security","vacations","disabilities","documents"] },
  talento_humano: { read:["employees","contracts","social_security","vacations","disabilities","documents","salary","audit"],
                    write:["employees","contracts","social_security","vacations","disabilities","documents"],
                    delete:["contracts","social_security","vacations","disabilities","documents"] },
  sst:            { read:["employees","contracts","social_security","vacations","disabilities","documents","salary","audit"],
                    write:["disabilities"],
                    delete:["disabilities"] },
  jefe_area:      { read:["employees","contracts","social_security","vacations","disabilities","audit"],
                    write:[], delete:[] },
  empleado:       { read:["employees","contracts","social_security","vacations","disabilities","salary","audit"],
                    write:[], delete:[] },
};

/* Motivo legible de por qué una acción no está disponible */
const ACTION_LABELS = { read:"consultar", write:"crear o editar", delete:"eliminar" };
const AREA_LABELS = {
  employees:"empleados", contracts:"contratos", social_security:"seguridad social",
  vacations:"vacaciones", disabilities:"incapacidades", documents:"documentos",
  users:"usuarios y roles", audit:"auditoría", salary:"información salarial",
};

/* Rol con el que se EVALÚA la interfaz (puede venir del override de desarrollo) */
const uiRole = (roleOrProfile) => {
  const role = (roleOrProfile && roleOrProfile.role) || roleOrProfile || null;
  return DEV_CONFIG.roleOverride || role;
};

/* ¿Puede el rol hacer `action` sobre `area`? action: read | write | delete */
function can(roleOrProfile, area, action = "write"){
  const role = uiRole(roleOrProfile);
  const entry = PERMISSION_MATRIX[role];
  let allowed;
  if(!entry){
    // Rol desconocido (enum nuevo en la BD sin reflejar aquí): se niega, pero se avisa.
    console.warn("[permisos] Rol sin matriz de UI definida:", role, "— revisa PERMISSION_MATRIX.");
    allowed = false;
  }else if(!AREAS.includes(area)){
    // Antes esto devolvía false en silencio y "apagaba" botones sin explicación.
    console.warn("[permisos] Área desconocida:", area, "— revisa la constante AREAS.");
    allowed = false;
  }else{
    const list = entry[action];
    allowed = list === "*" ? true : Array.isArray(list) && list.includes(area);
  }
  if(DEV_CONFIG.debug) console.debug("[permisos]", role, action, area, "→", allowed, DEV_CONFIG.unlockUI ? "(UI desbloqueada)" : "");
  // El desbloqueo de desarrollo solo abre la UI; el servidor sigue decidiendo.
  return allowed || DEV_CONFIG.unlockUI;
}

/* Texto explicativo para mostrar en pantalla cuando algo está restringido */
const whyNot = (roleOrProfile, area, action = "write") =>
  `Tu rol (${ROLE_LABELS[uiRole(roleOrProfile)] || "sin rol"}) no puede ${ACTION_LABELS[action]} ${AREA_LABELS[area] || area}.`;

/* Rol vigente, disponible para los mensajes de error (lo fija Root al cargar el perfil) */
let CURRENT_ROLE = null;

/* ------------------------- Mensaje de error amigable ------------------------- */
function friendlyError(e){
  const msg = (e && (e.message||e.error_description||e.msg)) || "";
  const code = (e && e.code) || "";
  if(/Invalid login/i.test(msg)) return "Correo o contraseña incorrectos.";
  if(/Email not confirmed/i.test(msg)) return "Debes confirmar tu correo antes de ingresar.";
  // Rechazo del servidor por RLS: se explica el estado real del permiso en vez
  // de un mensaje genérico, para poder corregir la causa (el rol) y no ocultarla.
  if(/row-level security|violates row-level|not authorized|permission denied/i.test(msg) || code==="42501"){
    const rol = CURRENT_ROLE ? `«${ROLE_LABELS[CURRENT_ROLE] || CURRENT_ROLE}»` : "sin rol asignado";
    return "El servidor rechazó la acción por permisos (RLS). Tu rol actual es " + rol +
           ". Pide a un administrador que ajuste tu rol en «Usuarios y roles», o revisa «Permisos» en el menú.";
  }
  if(/duplicate key|unique/i.test(msg)) return "Ya existe un registro con ese valor único (ej. cédula o número de contrato).";
  if(/Failed to fetch|NetworkError|network/i.test(msg)) return "No fue posible conectar. Verifica tu conexión a Internet.";
  if(/JWT expired|token/i.test(msg)) return "Tu sesión expiró. Vuelve a iniciar sesión.";
  return msg || "Ocurrió un error inesperado. Inténtalo nuevamente.";
}

/* Cuántos diálogos hay abiertos a la vez: el bloqueo del fondo solo se
   levanta cuando se cierra el último. */
let __openModals = 0;

/* Diálogo con cabecera fija, cuerpo desplazable y pie opcional (`footer`).
   El desplazamiento vive DENTRO de la caja, así que el contenido nunca se
   corta aunque el formulario sea más alto que la ventana. */
function Modal({title, onClose, children, footer, wide}){
  // Se guarda en un ref porque casi todos los llamadores pasan una función
  // nueva en cada render; así el efecto se monta una sola vez.
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(()=>{
    __openModals += 1;
    document.body.classList.add("modal-open");
    const onKey = (ev)=>{ if(ev.key === "Escape") closeRef.current(); };
    document.addEventListener("keydown", onKey);
    return ()=>{
      document.removeEventListener("keydown", onKey);
      __openModals = Math.max(0, __openModals - 1);
      if(__openModals === 0) document.body.classList.remove("modal-open");
    };
  }, []);

  // El diálogo se dibuja en <body> mediante un portal. Si se quedara dentro de
  // .content, cualquier ancestro con transform/filter/animación lo convertiría
  // en su bloque contenedor y el `position:fixed` del fondo se recortaría a esa
  // caja — que es exactamente lo que cortaba estos formularios.
  return ReactDOM.createPortal(
    <div className="overlay" onMouseDown={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={wide?{maxWidth:920}:null} role="dialog" aria-modal="true" aria-label={title}>
        <div className="modal-head">
          <h2>{title}</h2>
          <button className="x" onClick={onClose} aria-label="Cerrar">×</button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>,
    document.body
  );
}

/* =====================================================================
   Hook de carga de datos con manejo de error
   ===================================================================== */
function useAsync(fn, deps){
  const [state,setState] = useState({loading:true, error:null, data:null});
  const toast = useToast();
  const run = useCallback(async ()=>{
    setState(s=>({...s, loading:true, error:null}));
    try{
      const data = await fn();
      setState({loading:false, error:null, data});
    }catch(e){
      setState({loading:false, error:friendlyError(e), data:null});
      if(toast) toast(friendlyError(e), "err");
    }
  }, deps); // eslint-disable-line
  useEffect(()=>{ run(); }, [run]);
  return {...state, reload:run};
}

function Auth(){
  const [mode,setMode] = useState("login"); // login | reset
  const [email,setEmail] = useState("");
  const [pass,setPass] = useState("");
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState(null);
  const [err,setErr] = useState(null);

  const submit = async (e)=>{
    e.preventDefault(); setErr(null); setMsg(null); setBusy(true);
    try{
      if(mode==="login"){
        const { data, error } = await sb.auth.signInWithPassword({ email:email.trim(), password:pass });
        if(error) throw error;
        // auditoría de inicio de sesión (no bloqueante)
        if(data && data.user) sb.from("audit_logs").insert({ profile_id:data.user.id, action:"LOGIN", description:"Inicio de sesión" }).then(()=>{}).catch(()=>{});
        // el listener global cambia de pantalla
      }else{
        const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href });
        if(error) throw error;
        setMsg("Te enviamos un correo para restablecer la contraseña (si el correo existe).");
      }
    }catch(e2){ setErr(friendlyError(e2)); }
    finally{ setBusy(false); }
  };

  return (
    <div className="auth">
      <form className="box" onSubmit={submit}>
        <div className="plate"><Logo/></div>
        <h1>Talento Humano</h1>
        <p className="sub">Gestión y Control del Talento Humano</p>

        <div className="field">
          <Field label="Correo electrónico">
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required autoComplete="username" placeholder="usuario@dominio.com"/>
          </Field>
        </div>
        {mode==="login" && (
          <div className="field">
            <Field label="Contraseña">
              <input type="password" value={pass} onChange={e=>setPass(e.target.value)} required autoComplete="current-password" placeholder="••••••••"/>
            </Field>
          </div>
        )}

        {err && <div className="toast err" style={{marginBottom:12}}>{err}</div>}
        {msg && <div className="toast ok" style={{marginBottom:12}}>{msg}</div>}

        <button className="btn accent block" disabled={busy}>
          {busy ? <span className="spinner"/> : <Icon name={mode==="login"?"lock":"key"}/>}
          {mode==="login" ? "Ingresar" : "Enviar enlace de recuperación"}
        </button>

        <p style={{textAlign:"center",marginTop:14,fontSize:12.5}}>
          {mode==="login"
            ? <button type="button" className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>{setMode("reset");setErr(null);}}>¿Olvidaste tu contraseña?</button>
            : <button type="button" className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>{setMode("login");setErr(null);setMsg(null);}}>Volver a iniciar sesión</button>}
        </p>
      </form>
    </div>
  );
}

function GlobalSearch({onOpenEmployee}){

  const [res,setRes] = useState([]);
  const [open,setOpen] = useState(false);
  const tmr = useRef(null);

  useEffect(()=>{
    if(tmr.current) clearTimeout(tmr.current);
    if(!q.trim()){ setRes([]); return; }
    tmr.current = setTimeout(async ()=>{
      const term = q.trim().replace(/[,()*%]/g," ");
      if(!term){ setRes([]); return; }
      const { data, error } = await sb.from("employees")
        .select("id,first_name,last_name,document_number,position_title,city,status")
        .or(`first_name.ilike.%${term}%,last_name.ilike.%${term}%,document_number.ilike.%${term}%,position_title.ilike.%${term}%,city.ilike.%${term}%`)
        .limit(8);
      if(!error){ setRes(data||[]); setOpen(true); }
    }, 300);
  }, [q]);

  return (
    <div className="search" onBlur={()=>setTimeout(()=>setOpen(false),150)}>
      <span className="s-ico"><Icon name="search"/></span>
      <input placeholder="Buscar empleado por nombre, cédula, cargo o ciudad…" value={q}
        onChange={e=>setQ(e.target.value)} onFocus={()=>res.length&&setOpen(true)}/>

          ))}

  );

  const s = useAsync(async ()=>{

      sb.from("v_dashboard_stats").select("*").single(),
      sb.from("contracts").select("id,employee_id,contract_number,end_date,status,employees(first_name,last_name)")

      sb.from("vacations").select("id,employee_id,start_date,end_date,days,status,employees(first_name,last_name)")
        .gte("end_date",todayISO()).order("start_date",{ascending:true}).limit(8),
    ]);
    if(stats.error) throw stats.error;
    return { stats:stats.data, contratos:contratos.data||[], empleados:empleados.data||[],
             vacaciones:vacaciones.data||[], proximas:proximas.data||[] };
  }, []);

  if(s.loading) return <div><h2 className="section-title">Resumen</h2><SkeletonRows cols={4} rows={2}/></div>;

  // Alertas contractuales
  const alertContratos = contratos.map(c=>{
    const r = diffDays(todayISO(), c.end_date);
    return {...c, restantes:r};
  }).filter(c=>c.restantes<=90).sort((a,b)=>a.restantes-b.restantes);

  // Alertas de vacaciones (saldo próximo a vencer)
  const tomadasPorEmp = {};
  vacaciones.forEach(v=>{ tomadasPorEmp[v.employee_id]=(tomadasPorEmp[v.employee_id]||0)+ (v.status!=="rechazada"?v.days:0); });
  const alertVac = empleados.map(e=>{
    const causadas = vacacionesCausadas(e.hire_date, e.termination_date);
    const saldo = Math.round((causadas-(tomadasPorEmp[e.id]||0))*10)/10;
    const aniv = proximoAniversario(e.hire_date);
    const restantes = aniv? diffDays(todayISO(), aniv):999;
    return {e, saldo, aniv, restantes};
  }).filter(x=>x.saldo>0 && x.restantes<=30 && x.restantes>=0).sort((a,b)=>a.restantes-b.restantes);

  const bandFor = (r)=> r<0?"a-red": r<=7?"a-red": r<=30?"a-amber":"a-sky";
  const textFor = (r)=> r<0?`Vencido hace ${-r} día(s)`: r===0?"Vence hoy": r===1?"Vence mañana":`Vence en ${r} día(s)`;

  /* Tarjeta KPI: etiqueta, cifra y mosaico de icono (estilo Argon en vidrio) */
  const Stat = ({l,n,color,tone,ico})=>(
    <div className="card stat">
      <div style={{minWidth:0}}>
        <div className="l">{l}</div>
        <div className="n" style={{color}}>{n}</div>
      </div>
      <div className={"kpi-ico ico-"+tone}><Icon name={ico}/></div>
    </div>
  );

  return (
    <div>
      <h2 className="section-title">Resumen</h2>
      <div className="grid stats" style={{marginBottom:24}}>
        <Stat l="Empleados activos"          n={st.empleados_activos}     color="var(--green)" tone="green" ico="users"/>
        <Stat l="Retirados"                  n={st.empleados_retirados}   color="var(--red)"   tone="red"   ico="logout"/>
        <Stat l="Contratos vigentes"         n={st.contratos_vigentes}    color="var(--navy)"  tone="navy"  ico="contract"/>

        <Stat l="Contratos vencidos"         n={st.contratos_vencidos}    color="var(--red)"   tone="red"   ico="alert"/>
        <Stat l="Vacaciones vigentes"        n={st.vacaciones_vigentes}   color="var(--sky)"   tone="sky"   ico="beach"/>
        <Stat l="Incapacidades del mes"      n={st.incapacidades_mes}     color="var(--navy)"  tone="teal"  ico="health"/>
        <Stat l="Novedades pendientes"       n={st.novedades_pendientes}  color="var(--amber)" tone="amber" ico="clipboard"/>
      </div>

      <h2 className="section-title">Centro de alertas</h2>
      {(alertContratos.length===0 && alertVac.length===0)
        ? <Empty text="Sin alertas contractuales ni de vacaciones por ahora."/>
        : <div className="grid" style={{gap:8}}>
            {alertContratos.map(c=>(
              <div key={"c"+c.id} className={"alert "+bandFor(c.restantes)} onClick={()=>onOpenEmployee(c.employee_id)} style={{cursor:"pointer"}}>
                <div>
                  <div className="t">Contrato {c.contract_number} · {c.employees? c.employees.first_name+" "+c.employees.last_name : ""}</div>
                  <div className="s">{textFor(c.restantes)} · vence el {fmt(c.end_date)}</div>

                <div className="muted" style={{fontSize:12.5}}>{fmt(v.start_date)} — {fmt(v.end_date)} · {v.days} días</div>
                </div>

  );
}

function EmployeeFormModal({initial, departments, profile, onClose, onSaved}){
  const [form,setForm] = useState(initial);
  const [busy,setBusy] = useState(false);
  const toast = useToast();
  const isEdit = !!initial.id;
  const set = (k)=>(e)=>setForm({...form,[k]:e.target.value});

  const save = async ()=>{
    if(!form.first_name.trim()||!form.last_name.trim()||!form.document_number.trim()){ toast("Nombre, apellido y cédula son obligatorios.","err"); return; }
    setBusy(true);
    try{
      let payload = {...form};
      ["department_id","birth_date","termination_date","salary","employee_type"].forEach(k=>{ if(payload[k]==="") payload[k]=null; });
      payload.status = payload.termination_date ? "retirado" : "activo";
      const clean = await stripEmployeeType(payload);
      payload = clean.payload;
      let error;
      if(isEdit){
        const id = payload.id; delete payload.id;
        ({ error } = await sb.from("employees").update(payload).eq("id",id));
      }else{
        payload.created_by = profile.id;
        ({ error } = await sb.from("employees").insert(payload));
      }
      if(error) throw error;
      toast(isEdit?"Empleado actualizado.":"Empleado registrado correctamente.","ok");
      if(clean.stripped && form.employee_type) toast(MIGRATION_HINT,"info");
      onSaved && onSaved(); onClose();
    }catch(e){ toast(friendlyError(e),"err"); }
    finally{ setBusy(false); }
  };

  return (
    <Modal title={isEdit?"Editar empleado":"Nuevo empleado"} onClose={onClose} wide footer={<React.Fragment>
        <button className="btn accent" disabled={busy} onClick={save}>{busy?<span className="spinner"/>:<Icon name="check"/>}{isEdit?"Guardar cambios":"Registrar empleado"}</button>
        <button className="btn ghost" onClick={onClose}>Cancelar</button>
      </React.Fragment>}>
      <div className="grid form-grid">
        <Field label="Nombres"><input value={form.first_name} onChange={set("first_name")}/></Field>
        <Field label="Apellidos"><input value={form.last_name} onChange={set("last_name")}/></Field>
        <Field label="Tipo doc."><select value={form.document_type} onChange={set("document_type")}>{["CC","CE","TI","PA","PEP"].map(t=><option key={t}>{t}</option>)}</select></Field>
        <Field label="Número de documento"><input value={form.document_number} onChange={set("document_number")}/></Field>
        <Field label="Fecha de nacimiento"><input type="date" value={form.birth_date} onChange={set("birth_date")}/></Field>
        <Field label="Género"><select value={form.gender} onChange={set("gender")}><option value="">—</option><option>Femenino</option><option>Masculino</option><option>Otro</option></select></Field>
        <Field label="Correo"><input type="email" value={form.email} onChange={set("email")}/></Field>
        <Field label="Teléfono"><input value={form.phone} onChange={set("phone")}/></Field>
        <Field label="Dirección"><input value={form.address} onChange={set("address")}/></Field>
        <Field label="Ciudad"><input value={form.city} onChange={set("city")}/></Field>
        <Field label="Área"><select value={form.department_id} onChange={set("department_id")}><option value="">—</option>{departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></Field>

            <Field label="Ciudad"><input value={form.ciudad} onChange={e=>setForm({...form,ciudad:e.target.value})} placeholder="Ciudad donde labora"/></Field>
            <FieldBox label="Clasificación">
              <SegClasificacion value={form.employee_type} onChange={(v)=>setForm({...form,employee_type:v})}/>
            </FieldBox>
            <Field label="Fecha de ingreso"><input type="date" value={form.hire_date} onChange={e=>setForm({...form,hire_date:e.target.value})}/></Field>
            <Field label="Fecha de retiro (opcional)"><input type="date" value={form.termination_date} onChange={e=>setForm({...form,termination_date:e.target.value})}/></Field>
            <Field label="Tipo de contrato"><select value={form.contract_type} onChange={e=>setForm({...form,contract_type:e.target.value})}>{opts(CONTRACT_TYPES)}</select></Field>
            {form.contract_type==="termino_fijo" && <Field label="Fecha fin del contrato"><input type="date" value={form.end_date} onChange={e=>setForm({...form,end_date:e.target.value})}/></Field>}
          </div>
          <div style={{marginTop:16}}>
            <button className="btn accent" disabled={busy} onClick={registrarIngreso}>
              {busy ? <span className="spinner"/> : <Icon name="check"/>}Registrar ingreso
            </button>
          </div>
          <p className="muted" style={{fontSize:12,marginTop:10}}>El nombre se separa en nombres y apellidos automáticamente; puedes ajustarlo luego en el expediente. Se crea también un contrato inicial.</p>
        </div>
      )}

      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
        <input style={{flex:2,minWidth:200}} placeholder="Buscar por nombre o cédula…" value={q} onChange={e=>setQ(e.target.value)}/>
        <select style={{flex:1,minWidth:160}} value={dep} onChange={e=>setDep(e.target.value)}>
          <option value="">Todas las áreas</option>
          {departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
      </div>

      {data.loading ? <SkeletonRows cols={7} rows={5}/> :
       data.error ? <ErrorCard error={data.error} onRetry={data.reload}/> :
       data.data.length===0 ? <Empty text="No hay empleados que coincidan con la búsqueda."/> :
       <div className="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Cédula</th><th>Cargo</th><th>Clasificación</th><th>Área</th><th>Ciudad</th><th>Estado</th></tr></thead>
          <tbody>
            {data.data.map(e=>(
              <tr key={e.id} onClick={()=>onOpenEmployee(e.id)}>
                <td><b>{e.first_name} {e.last_name}</b></td>
                <td>{e.document_number}</td>
                <td>{e.position_title||"—"}</td>
                <td>{EMPLOYEE_TYPES[e.employee_type] ? <TipoBadge value={e.employee_type}/> : "—"}</td>
                <td>{depName(e.department_id)}</td>
                <td>{e.city||"—"}</td>
                <td><Badge status={e.status}/></td>
              </tr>
            ))}
          </tbody>
        </table>
       </div>}

      {showForm && (
        <EmployeeFormModal initial={emptyEmp()} departments={departments} profile={profile}
          onClose={()=>setShowForm(false)} onSaved={()=>data.reload()}/>
      )}
    </div>
  );
}

/* =====================================================================
   EXPEDIENTE DEL EMPLEADO (con pestañas)
   ===================================================================== */
function EmployeeProfile({employeeId, profile, departments, ssEntities, onBack}){
  const [tab,setTab] = useState("personal");
  const [showEdit,setShowEdit] = useState(false);
  const [clasificando,setClasificando] = useState(false);
  const toast = useToast();
  const write = can(profile,"employees","write");
  // employees_delete en RLS exige is_admin(): antes el botón se mostraba a
  // talento_humano y el servidor siempre lo rechazaba.
  const canDelete = can(profile,"employees","delete");
  const showSalary = can(profile,"salary","read");   // jefe_area no ve salarios

  const emp = useAsync(async ()=>{
    const { data, error } = await sb.from("employees").select("*").eq("id",employeeId).single();
    if(error) throw error; return data;
  }, [employeeId]);

  if(emp.loading) return <div><button className="btn ghost sm" onClick={onBack}><Icon name="back"/>Volver</button><div style={{marginTop:16}}><SkeletonRows cols={3} rows={3}/></div></div>;
  if(emp.error) return (
    <div>
      <button className="btn ghost sm" onClick={onBack} style={{marginBottom:14}}><Icon name="back"/>Volver</button>
      <ErrorCard error={emp.error} onRetry={emp.reload}/>
    </div>
  );
  const e = emp.data;
  const depName = (id)=>(departments.find(d=>d.id===id)||{}).name||"—";

  const marcarRetiro = async ()=>{
    if(!confirm("¿Marcar retiro de "+e.first_name+" "+e.last_name+" con fecha de hoy?")) return;
    const { error } = await sb.from("employees").update({termination_date:todayISO(), status:"retirado"}).eq("id",e.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Empleado marcado como retirado.","ok"); emp.reload();
  };
  const reactivar = async ()=>{
    const { error } = await sb.from("employees").update({termination_date:null, status:"activo"}).eq("id",e.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Empleado reactivado.","ok"); emp.reload();
  };
  const eliminar = async ()=>{
    if(!confirm("¿Eliminar definitivamente a "+e.first_name+" "+e.last_name+"? También se borran sus contratos, vacaciones, incapacidades y documentos.")) return;
    const { error } = await sb.from("employees").delete().eq("id",e.id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Empleado eliminado.","ok"); onBack();
  };
  /* Clasificar sin abrir la ficha completa: un toque desde el encabezado. */
  const clasificar = async (v)=>{
    if(clasificando) return;
    setClasificando(true);
    try{
      const clean = await stripEmployeeType({ employee_type: v || null });
      if(clean.stripped){ toast(MIGRATION_HINT,"info"); return; }
      const { error } = await sb.from("employees").update(clean.payload).eq("id",e.id);
      if(error) throw error;
      toast(v ? "Clasificado como "+EMPLOYEE_TYPES[v]+"." : "Clasificación retirada.","ok");
      emp.reload();
    }catch(err){ toast(friendlyError(err),"err"); }
    finally{ setClasificando(false); }
  };

  const TABS = [
    {id:"personal",label:"Personal"},
    {id:"laboral",label:"Laboral"},
    {id:"contratos",label:"Contratos"},
    {id:"seguridad",label:"Seguridad social"},
    {id:"vacaciones",label:"Vacaciones"},
    {id:"incapacidades",label:"Incapacidades"},
    {id:"documentos",label:"Documentos"},
    {id:"auditoria",label:"Auditoría"},
  ];

  return (
    <div>
      <button className="btn ghost sm" onClick={onBack}><Icon name="back"/>Volver a empleados</button>
      <div className="card" style={{margin:"14px 0 18px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:14,flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:14,alignItems:"flex-start",minWidth:0}}>
          <div className="avatar" style={{width:48,height:48,borderRadius:16,fontSize:16}}>
            {[e.first_name,e.last_name].filter(Boolean).map(s=>s[0]).join("").toUpperCase() || "?"}
          </div>
          <div style={{minWidth:0}}>
          <h2 style={{fontSize:20}}>{e.first_name} {e.last_name}</h2>
          <div className="kv" style={{marginTop:8}}>
            <span>{e.document_type} <b>{e.document_number}</b></span>
            <span>Cargo: <b>{e.position_title||"—"}</b></span>
            <span>Área: <b>{depName(e.department_id)}</b></span>
            <span>Ingreso: <b>{fmt(e.hire_date)}</b></span>
          </div>
          {write && (
            <div style={{marginTop:14,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
              <span className="muted" style={{fontSize:11.5,fontWeight:700,letterSpacing:".02em"}}>Clasificación:</span>
              <div style={{width:"auto",minWidth:250,maxWidth:320,flex:"0 1 auto"}}>
                <SegClasificacion value={e.employee_type||""} onChange={clasificar} disabled={clasificando}/>
              </div>
            </div>
          )}
          {write && (
            <div className="rowbtns" style={{marginTop:14}}>
              <button className="btn ghost sm" onClick={()=>setShowEdit(true)}><Icon name="edit"/>Editar</button>
              {e.status==="activo"
                ? <button className="btn ghost sm" onClick={marcarRetiro}><Icon name="logout"/>Marcar retiro</button>
                : <button className="btn ghost sm" onClick={reactivar}><Icon name="refresh"/>Reactivar</button>}
              {canDelete
                ? <button className="btn danger sm" onClick={eliminar}><Icon name="trash"/>Eliminar</button>
                : <button className="btn danger sm" disabled title={whyNot(profile,"employees","delete")+" Solo un administrador puede eliminar."}>
                    <Icon name="lock"/>Eliminar
                  </button>}
            </div>
          )}
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <TipoBadge value={e.employee_type}/>
          <Badge status={e.status}/>
        </div>
      </div>

      <div className="tabs">
        {TABS.map(t=><button key={t.id} className={tab===t.id?"active":""} onClick={()=>setTab(t.id)}>{t.label}</button>)}
      </div>

      {tab==="personal" && <TabPersonal e={e} showSalary={showSalary}/>}
      {tab==="laboral" && <TabLaboral e={e} depName={depName} showSalary={showSalary}/>}
      {tab==="contratos" && <TabContratos employeeId={e.id} profile={profile} departments={departments}/>}
      {tab==="seguridad" && <TabSeguridad employeeId={e.id} profile={profile} ssEntities={ssEntities}/>}
      {tab==="vacaciones" && <TabVacaciones emp={e} profile={profile}/>}
      {tab==="incapacidades" && <TabIncapacidades employeeId={e.id} profile={profile}/>}
      {tab==="documentos" && <TabDocumentos employeeId={e.id} profile={profile}/>}
      {tab==="auditoria" && <TabAuditoria recordId={e.id}/>}

      {showEdit && (
        <EmployeeFormModal initial={empToForm(e)} departments={departments} profile={profile}
          onClose={()=>setShowEdit(false)} onSaved={()=>emp.reload()}/>
      )}
    </div>
  );
}

/* ---------- Contratos + Otrosí ---------- */
function TabContratos({employeeId, profile, departments}){
  const write = can(profile,"contracts","write");
  const showSalary = can(profile,"salary","read");
  const [showC,setShowC] = useState(false);
  const [addFor,setAddFor] = useState(null); // contract id para nuevo otrosí
  const toast = useToast();

  const data = useAsync(async ()=>{
    const { data:contracts, error } = await sb.from("contracts").select("*").eq("employee_id",employeeId).order("start_date",{ascending:false});
    if(error) throw error;
    const ids = (contracts||[]).map(c=>c.id);
    let adds = [];
    if(ids.length){ const r = await sb.from("contract_addendums").select("*").in("contract_id",ids).order("date",{ascending:false}); adds = r.data||[]; }
    return { contracts:contracts||[], adds };
  }, [employeeId]);

  const emptyC = ()=>({ contract_number:"", type:"termino_indefinido", start_date:todayISO(), end_date:"", salary:"",
    position_title:"", department_id:"", immediate_boss:"", schedule:"tiempo_completo", status:"vigente",
    observations:"", signature_date:"", renewal_date:"", termination_reason:"" });
  const [cf,setCf] = useState(emptyC());
  const [busy,setBusy] = useState(false);

  const saveContract = async ()=>{
    if(!cf.contract_number.trim()){ toast("El número de contrato es obligatorio.","err"); return; }
    setBusy(true);
    try{
      const p = {...cf, employee_id:employeeId, created_by:profile.id};
      ["end_date","salary","department_id","signature_date","renewal_date"].forEach(k=>{ if(p[k]==="") p[k]=null; });
      const { error } = await sb.from("contracts").insert(p);
      if(error) throw error;
      toast("Contrato registrado.","ok"); setShowC(false); setCf(emptyC()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };

  const emptyA = ()=>({ addendum_number:"", type:"prorroga", date:todayISO(), description:"", change_detail:"", application_date:"" });
  const [af,setAf] = useState(emptyA());
  const saveAddendum = async ()=>{
    if(!af.addendum_number.trim()){ toast("El número de otrosí es obligatorio.","err"); return; }
    setBusy(true);
    try{
      const p = {...af, contract_id:addFor, created_by:profile.id};
      if(p.application_date==="") p.application_date=null;
      const { error } = await sb.from("contract_addendums").insert(p);
      if(error) throw error;
      toast("Otrosí registrado.","ok"); setAddFor(null); setAf(emptyA()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const { contracts, adds:allAdds } = data.data;

  return (
    <div>
      {write
        ? <div style={{marginBottom:14}}><button className="btn accent sm" onClick={()=>{setCf(emptyC());setShowC(true);}}><Icon name="plus"/>Nuevo contrato</button></div>
        : <Notice icon="lock">{whyNot(profile,"contracts","write")} Esta pestaña queda en modo consulta.</Notice>}
      {contracts.length===0 ? <Empty text="Este empleado no tiene contratos registrados."/> :
        <div className="grid" style={{gap:14}}>
          {contracts.map(c=>{
            const adds = allAdds.filter(a=>a.contract_id===c.id);
            return (
              <div key={c.id} className="card">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                  <div>
                    <b>Contrato {c.contract_number}</b> · {CONTRACT_TYPES[c.type]}
                    <div className="kv" style={{marginTop:6}}>
                      <span>Inicio: <b>{fmt(c.start_date)}</b></span>
                      <span>Fin: <b>{fmt(c.end_date)}</b></span>
                      <span>Cargo: <b>{c.position_title||"—"}</b></span>
                      <span>Jornada: <b>{SCHEDULES[c.schedule]||"—"}</b></span>
                      <span>Jefe: <b>{c.immediate_boss||"—"}</b></span>
                      {showSalary && <span>Salario: <b>{money(c.salary)}</b></span>}
                      <span>Firma: <b>{fmt(c.signature_date)}</b></span>
                      <span>Renovación: <b>{fmt(c.renewal_date)}</b></span>
                    </div>
                    {c.observations && <p className="muted" style={{margin:"8px 0 0",fontSize:12.5}}>{c.observations}</p>}
                    {c.termination_reason && <p className="muted" style={{margin:"4px 0 0",fontSize:12.5}}>Motivo terminación: <b>{c.termination_reason}</b></p>}
                  </div>
                  <Badge status={c.status}/>
                </div>

                <div style={{marginTop:14,borderTop:"1px solid var(--border)",paddingTop:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                    <b style={{fontSize:13,color:"var(--navy)"}}>Otrosí / adendas ({adds.length})</b>
                    {write && <button className="linkbtn" style={{color:"var(--sky)"}} onClick={()=>{setAf(emptyA());setAddFor(c.id);}}>+ Añadir otrosí</button>}
                  </div>
                  {adds.length===0 ? <p className="muted" style={{fontSize:12.5,margin:"8px 0 0"}}>Sin adendas.</p> :
                    <div style={{marginTop:10,display:"grid",gap:7}}>
                      {adds.map(a=>(
                        <div key={a.id} style={{fontSize:12.5,padding:"10px 12px",background:"rgba(255,255,255,.5)",
                          border:"1px solid var(--border)",borderRadius:11}}>
                          <b>Otrosí {a.addendum_number}</b> · {ADDENDUM_TYPES[a.type]} · {fmt(a.date)}
                          {a.description && <span> — {a.description}</span>}
                          {a.change_detail && <div className="muted">Cambio: {a.change_detail}{a.application_date?` (aplica ${fmt(a.application_date)})`:""}</div>}
                        </div>
                      ))}
                    </div>}
                </div>
              </div>
            );
          })}
        </div>}

      {showC && (
        <Modal title="Nuevo contrato" onClose={()=>setShowC(false)} wide footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={saveContract}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar contrato</button>
            <button className="btn ghost" onClick={()=>setShowC(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Número de contrato"><input value={cf.contract_number} onChange={e=>setCf({...cf,contract_number:e.target.value})}/></Field>
            <Field label="Tipo"><select value={cf.type} onChange={e=>setCf({...cf,type:e.target.value})}>{opts(CONTRACT_TYPES)}</select></Field>
            <Field label="Fecha inicio"><input type="date" value={cf.start_date} onChange={e=>setCf({...cf,start_date:e.target.value})}/></Field>
            <Field label="Fecha terminación"><input type="date" value={cf.end_date} onChange={e=>setCf({...cf,end_date:e.target.value})}/></Field>
            <Field label="Salario"><input type="number" value={cf.salary} onChange={e=>setCf({...cf,salary:e.target.value})}/></Field>
            <Field label="Cargo"><input value={cf.position_title} onChange={e=>setCf({...cf,position_title:e.target.value})}/></Field>
            <Field label="Área"><select value={cf.department_id} onChange={e=>setCf({...cf,department_id:e.target.value})}><option value="">—</option>{departments.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></Field>
            <Field label="Jefe inmediato"><input value={cf.immediate_boss} onChange={e=>setCf({...cf,immediate_boss:e.target.value})}/></Field>
            <Field label="Jornada"><select value={cf.schedule} onChange={e=>setCf({...cf,schedule:e.target.value})}>{opts(SCHEDULES)}</select></Field>
            <Field label="Estado"><select value={cf.status} onChange={e=>setCf({...cf,status:e.target.value})}>{opts(CONTRACT_STATUS)}</select></Field>
            <Field label="Fecha de firma"><input type="date" value={cf.signature_date} onChange={e=>setCf({...cf,signature_date:e.target.value})}/></Field>
            <Field label="Fecha de renovación"><input type="date" value={cf.renewal_date} onChange={e=>setCf({...cf,renewal_date:e.target.value})}/></Field>
          </div>
          <Field label="Motivo de terminación (si aplica)"><input value={cf.termination_reason} onChange={e=>setCf({...cf,termination_reason:e.target.value})}/></Field>
          <Field label="Observaciones"><textarea value={cf.observations} onChange={e=>setCf({...cf,observations:e.target.value})}/></Field>
        </Modal>
      )}

      {addFor && (
        <Modal title="Nuevo otrosí" onClose={()=>setAddFor(null)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={saveAddendum}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar otrosí</button>
            <button className="btn ghost" onClick={()=>setAddFor(null)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Número de otrosí"><input value={af.addendum_number} onChange={e=>setAf({...af,addendum_number:e.target.value})}/></Field>
            <Field label="Tipo"><select value={af.type} onChange={e=>setAf({...af,type:e.target.value})}>{opts(ADDENDUM_TYPES)}</select></Field>
            <Field label="Fecha"><input type="date" value={af.date} onChange={e=>setAf({...af,date:e.target.value})}/></Field>
            <Field label="Fecha de aplicación"><input type="date" value={af.application_date} onChange={e=>setAf({...af,application_date:e.target.value})}/></Field>
          </div>
          <Field label="Descripción"><textarea value={af.description} onChange={e=>setAf({...af,description:e.target.value})}/></Field>
          <Field label="Cambio realizado"><textarea value={af.change_detail} onChange={e=>setAf({...af,change_detail:e.target.value})}/></Field>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Seguridad social + Novedades ---------- */
function TabSeguridad({employeeId, profile, ssEntities}){
  const write = can(profile,"social_security");
  const [showF,setShowF] = useState(false);
  const [showN,setShowN] = useState(false);
  const toast = useToast();

  const data = useAsync(async ()=>{
    const [aff, nov] = await Promise.all([
      sb.from("employee_social_security").select("*").eq("employee_id",employeeId),
      sb.from("social_security_novelties").select("*").eq("employee_id",employeeId).order("date",{ascending:false}),
    ]);
    if(aff.error) throw aff.error;
    return { aff:aff.data||[], nov:nov.data||[] };
  }, [employeeId]);

  const emptyF = ()=>({ kind:"eps", entity_id:"", affiliation_number:"", affiliation_date:"", status:"activa", withdrawal_date:"", risk_class:"", risk_level:"", observations:"" });
  const [f,setF] = useState(emptyF());
  const [busy,setBusy] = useState(false);
  const saveAff = async ()=>{
    setBusy(true);
    try{
      const ent = ssEntities.find(x=>x.id===f.entity_id);
      const p = {...f, employee_id:employeeId, entity_name: ent?ent.name:null, created_by:profile.id};
      ["entity_id","affiliation_date","withdrawal_date"].forEach(k=>{ if(p[k]==="") p[k]=null; });
      // upsert por (employee_id, kind)
      const { error } = await sb.from("employee_social_security").upsert(p, { onConflict:"employee_id,kind" });
      if(error) throw error;
      toast("Afiliación guardada.","ok"); setShowF(false); setF(emptyF()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };

  const emptyN = ()=>({ type:"ingreso", date:todayISO(), application_date:"", description:"", status:"pendiente" });
  const [n,setN] = useState(emptyN());
  const saveNov = async ()=>{
    setBusy(true);
    try{
      const p = {...n, employee_id:employeeId, created_by:profile.id};
      if(p.application_date==="") p.application_date=null;
      const { error } = await sb.from("social_security_novelties").insert(p);
      if(error) throw error;
      toast("Novedad registrada.","ok"); setShowN(false); setN(emptyN()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;
  const { aff, nov } = data.data;

  const byKind = (k)=> aff.find(a=>a.kind===k);
  const entName = (a)=> a ? (a.entity_name || (ssEntities.find(x=>x.id===a.entity_id)||{}).name || "—") : "—";

  return (
    <div>
      {write
        ? <div style={{marginBottom:14,display:"flex",gap:10,flexWrap:"wrap"}}>
            <button className="btn accent sm" onClick={()=>{setF(emptyF());setShowF(true);}}><Icon name="plus"/>Afiliación</button>
            <button className="btn ghost sm" onClick={()=>{setN(emptyN());setShowN(true);}}><Icon name="plus"/>Novedad</button>
          </div>
        : <Notice icon="lock">{whyNot(profile,"social_security","write")} Esta pestaña queda en modo consulta.</Notice>}

      <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,marginBottom:16}}>
        {Object.keys(SS_KINDS).map(k=>{
          const a = byKind(k);
          return (
            <div key={k} className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <b>{SS_KINDS[k]}</b>{a && <Badge status={a.status}/>}
              </div>
              {a ? <div className="kv" style={{marginTop:8,flexDirection:"column",gap:4}}>
                    <span>Entidad: <b>{entName(a)}</b></span>
                    <span>N° afiliación: <b>{a.affiliation_number||"—"}</b></span>
                    <span>Afiliación: <b>{fmt(a.affiliation_date)}</b></span>
                    {k==="arl" && <span>Riesgo: <b>{a.risk_class||"—"} / {a.risk_level||"—"}</b></span>}
                    {a.withdrawal_date && <span>Retiro: <b>{fmt(a.withdrawal_date)}</b></span>}
                  </div>
                : <p className="muted" style={{fontSize:12.5,margin:"8px 0 0"}}>Sin información.</p>}
            </div>
          );
        })}
      </div>

      <h3 className="section-title" style={{fontSize:14}}>Novedades de seguridad social</h3>
      {nov.length===0 ? <Empty text="No hay novedades registradas."/> :
        <div className="table-wrap"><table>
          <thead><tr><th>Tipo</th><th>Fecha</th><th>Aplicación</th><th>Descripción</th><th>Estado</th></tr></thead>
          <tbody>{nov.map(x=>(
            <tr key={x.id} style={{cursor:"default"}}>
              <td>{NOVELTY_TYPES[x.type]}</td><td>{fmt(x.date)}</td><td>{fmt(x.application_date)}</td>
              <td style={{whiteSpace:"normal"}}>{x.description||"—"}</td><td><Badge status={x.status}/></td>
            </tr>
          ))}</tbody>
        </table></div>}

      {showF && (
        <Modal title="Afiliación de seguridad social" onClose={()=>setShowF(false)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={saveAff}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setShowF(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Tipo"><select value={f.kind} onChange={e=>setF({...f,kind:e.target.value,entity_id:""})}>{opts(SS_KINDS)}</select></Field>
            <Field label="Entidad"><select value={f.entity_id} onChange={e=>setF({...f,entity_id:e.target.value})}><option value="">—</option>{ssEntities.filter(x=>x.kind===f.kind).map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select></Field>
            <Field label="N° de afiliación"><input value={f.affiliation_number} onChange={e=>setF({...f,affiliation_number:e.target.value})}/></Field>
            <Field label="Fecha de afiliación"><input type="date" value={f.affiliation_date} onChange={e=>setF({...f,affiliation_date:e.target.value})}/></Field>
            <Field label="Estado"><select value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{opts(SS_STATUS)}</select></Field>
            <Field label="Fecha de retiro"><input type="date" value={f.withdrawal_date} onChange={e=>setF({...f,withdrawal_date:e.target.value})}/></Field>
            {f.kind==="arl" && <Field label="Clase de riesgo"><input value={f.risk_class} onChange={e=>setF({...f,risk_class:e.target.value})} placeholder="I - V"/></Field>}
            {f.kind==="arl" && <Field label="Nivel de riesgo"><input value={f.risk_level} onChange={e=>setF({...f,risk_level:e.target.value})}/></Field>}
          </div>
          <Field label="Observaciones"><textarea value={f.observations} onChange={e=>setF({...f,observations:e.target.value})}/></Field>
          <p className="muted" style={{fontSize:12,margin:"8px 0 0"}}>Nota: guardar reemplaza la afiliación vigente de ese tipo (una activa por tipo).</p>
        </Modal>
      )}

      {showN && (
        <Modal title="Nueva novedad" onClose={()=>setShowN(false)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={saveNov}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar novedad</button>
            <button className="btn ghost" onClick={()=>setShowN(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Tipo"><select value={n.type} onChange={e=>setN({...n,type:e.target.value})}>{opts(NOVELTY_TYPES)}</select></Field>
            <Field label="Fecha"><input type="date" value={n.date} onChange={e=>setN({...n,date:e.target.value})}/></Field>
            <Field label="Fecha de aplicación"><input type="date" value={n.application_date} onChange={e=>setN({...n,application_date:e.target.value})}/></Field>
            <Field label="Estado"><select value={n.status} onChange={e=>setN({...n,status:e.target.value})}>{opts(NOVELTY_STATUS)}</select></Field>
          </div>
          <Field label="Descripción"><textarea value={n.description} onChange={e=>setN({...n,description:e.target.value})}/></Field>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Vacaciones (por empleado) ---------- */
function TabVacaciones({emp, profile}){
  const write = can(profile,"vacations");
  const [show,setShow] = useState(false);
  const toast = useToast();
  const data = useAsync(async ()=>{
    const { data, error } = await sb.from("vacations").select("*").eq("employee_id",emp.id).order("start_date",{ascending:false});
    if(error) throw error; return data;
  }, [emp.id]);

  const empty = ()=>({ start_date:todayISO(), end_date:todayISO(), status:"aprobada", observations:"" });
  const [f,setF] = useState(empty());
  const [busy,setBusy] = useState(false);
  const dias = daysBetween(f.start_date, f.end_date);

  const save = async ()=>{
    if(dias<=0){ toast("Rango de fechas inválido.","err"); return; }
    setBusy(true);
    try{
      const p = { employee_id:emp.id, start_date:f.start_date, end_date:f.end_date, days:dias, status:f.status,
        observations:f.observations||null, created_by:profile.id, approved_by: f.status==="aprobada"?profile.id:null };
      const { error } = await sb.from("vacations").insert(p);
      if(error) throw error;
      toast("Vacaciones registradas.","ok"); setShow(false); setF(empty()); data.reload();
    }catch(e){ toast(friendlyError(e),"err"); } finally{ setBusy(false); }
  };
  const del = async (id)=>{
    if(!confirm("¿Eliminar este periodo de vacaciones?")) return;
    const { error } = await sb.from("vacations").delete().eq("id",id);
    if(error){ toast(friendlyError(error),"err"); return; }
    toast("Registro eliminado.","ok"); data.reload();
  };

  if(data.loading) return <SkeletonRows cols={4} rows={3}/>;
  if(data.error) return <ErrorCard error={data.error} onRetry={data.reload}/>;

  const tomadas = data.data.filter(v=>v.status!=="rechazada").reduce((s,v)=>s+v.days,0);
  const causadas = vacacionesCausadas(emp.hire_date, emp.termination_date);
  const saldo = Math.round((causadas-tomadas)*10)/10;

  return (
    <div>
      <div className="card" style={{marginBottom:12,display:"flex",gap:24,flexWrap:"wrap"}}>
        <Info label="Días causados" value={causadas}/>
        <Info label="Días tomados" value={tomadas}/>
        <Info label="Saldo pendiente" value={saldo}/>
      </div>
      {write && <div style={{marginBottom:12}}><button className="btn accent sm" onClick={()=>{setF(empty());setShow(true);}}><Icon name="plus"/>Registrar vacaciones</button></div>}
      {data.data.length===0 ? <Empty text="Sin periodos de vacaciones."/> :
        <div className="table-wrap"><table>
          <thead><tr><th>Inicio</th><th>Fin</th><th>Días</th><th>Estado</th><th></th></tr></thead>
          <tbody>{data.data.map(v=>(
            <tr key={v.id} style={{cursor:"default"}}>
              <td>{fmt(v.start_date)}</td><td>{fmt(v.end_date)}</td><td>{v.days}</td><td><Badge status={v.status}/></td>
              <td>{write && <button className="linkbtn" style={{color:"var(--red)"}} onClick={()=>del(v.id)}>Eliminar</button>}</td>
            </tr>
          ))}</tbody>
        </table></div>}

      {show && (
        <Modal title="Registrar vacaciones" onClose={()=>setShow(false)} footer={<React.Fragment>
            <button className="btn accent" disabled={busy} onClick={save}>{busy?<span className="spinner"/>:<Icon name="check"/>}Guardar</button>
            <button className="btn ghost" onClick={()=>setShow(false)}>Cancelar</button>
          </React.Fragment>}>
          <div className="grid form-grid">
            <Field label="Inicio"><input type="date" value={f.start_date} onChange={e=>setF({...f,start_date:e.target.value})}/></Field>
            <Field label="Fin"><input type="date" value={f.end_date} onChange={e=>setF({...f,end_date:e.target.value})}/></Field>
            <Field label="Estado"><select value={f.status} onChange={e=>setF({...f,status:e.target.value})}>{opts(VAC_STATUS)}</select></Field>
          </div>
          <p className="muted" style={{margin:"10px 0"}}>Días: <b style={{color:"var(--navy)"}}>{dias}</b></p>
          <Field label="Observaciones"><textarea value={f.observations} onChange={e=>setF({...f,observations:e.target.value})}/></Field>
        </Modal>
      )}
    </div>
  );
}
